# 로컬 통합 실행: cp .env.example .env (값 채우기) → docker compose up --build
name: sagomungchi

x-spring-env: &spring-env
  DB_USERNAME: ${POSTGRES_USER:?.env 설정 필요}
  DB_PASSWORD: ${POSTGRES_PASSWORD:?.env 설정 필요}
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_USERNAME: ${RABBITMQ_USER:?.env 설정 필요}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?.env 설정 필요}
  INTERNAL_TOKEN: ${INTERNAL_TOKEN:?.env 설정 필요}

x-python-env: &python-env
  RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
  INTERNAL_TOKEN: ${INTERNAL_TOKEN:?.env 설정 필요}

x-python-healthcheck: &python-healthcheck
  interval: 10s
  timeout: 5s
  retries: 12

services:
  # ---------- 인프라 ----------
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?.env 설정 필요}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env 설정 필요}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/gitops/charts/platform-data/files/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.3.7-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?.env 설정 필요}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?.env 설정 필요}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 20

  # definitions.json(exchange·queue·DLX)을 관리 API로 반영. 계정 정보는 파일에 두지 않음
  rabbitmq-init:
    image: curlimages/curl:8.17.0
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./infrastructure/gitops/charts/platform-data/files/rabbitmq/definitions.json:/definitions/definitions.json:ro
      - ./infrastructure/gitops/charts/platform-data/files/rabbitmq/import-definitions.sh:/definitions/import-definitions.sh:ro
    environment:
      RABBITMQ_USER: ${RABBITMQ_USER:?.env 설정 필요}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?.env 설정 필요}
    entrypoint: [/bin/sh, /definitions/import-definitions.sh]

  redis:
    image: redis:8.2.10-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-data-init:
    image: curlimages/curl:8.17.0
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    volumes:
      - minio-data:/data
    entrypoint: [/bin/sh, -ec, 'chown 65532:65532 /data']

  minio:
    image: cgr.dev/chainguard/minio@sha256:98c819b873cbd455860c1fb5a9171a62b2f48d86554a4b2c6847e60a14a9ef30
    depends_on:
      minio-data-init:
        condition: service_completed_successfully
    cpus: 0.5
    mem_limit: 1g
    command: ["--certs-dir", "/tmp/certs", "server", "--address", ":9000", "--console-address", ":9001", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?.env 설정 필요}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?.env 설정 필요}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:${MINIO_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"

  minio-init:
    image: curlimages/curl:8.17.0
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?.env 설정 필요}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?.env 설정 필요}
    volumes:
      - ./infrastructure/gitops/charts/platform-data/files/minio/create-buckets.sh:/create-buckets.sh:ro
    entrypoint: [/bin/sh, /create-buckets.sh]
    command: [sagomungchi-local-missions, sagomungchi-local-reports, sagomungchi-local-models]

  # ---------- DB 마이그레이션 (일회성) ----------
  core-migrate:
    image: flyway/flyway:13.11.1-alpine
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/core-service/src/main/resources/db/migration:/flyway/sql:ro
    command: >-
      -url=jdbc:postgresql://postgres:5432/core_db
      -user=${POSTGRES_USER} -password=${POSTGRES_PASSWORD}
      -locations=filesystem:/flyway/sql migrate

  learning-migrate:
    image: flyway/flyway:13.11.1-alpine
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/learning-service/src/main/resources/db/migration:/flyway/sql:ro
    command: >-
      -url=jdbc:postgresql://postgres:5432/learning_db
      -user=${POSTGRES_USER} -password=${POSTGRES_PASSWORD}
      -locations=filesystem:/flyway/sql migrate

  report-migrate:
    build: ./backend/report-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: &report-db-url postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/report_db
    command: ["alembic", "upgrade", "head"]

  # ---------- 애플리케이션 ----------
  core-service:
    build: ./backend/core-service
    depends_on:
      rabbitmq-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      core-migrate:
        condition: service_completed_successfully
    environment:
      <<: *spring-env
      DB_URL: jdbc:postgresql://postgres:5432/core_db
      LEARNING_URL: http://learning-service:8081
      AI_URL: http://ai-service:8000
      REPORT_URL: http://report-api:8002
    ports:
      - "${CORE_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 18

  learning-service:
    build: ./backend/learning-service
    depends_on:
      rabbitmq-init:
        condition: service_completed_successfully
      learning-migrate:
        condition: service_completed_successfully
    environment:
      <<: *spring-env
      DB_URL: jdbc:postgresql://postgres:5432/learning_db
      AI_URL: http://ai-service:8000
    ports:
      - "${LEARNING_HOST_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 18

  ai-service:
    build: ./backend/ai-service
    depends_on:
      rabbitmq-init:
        condition: service_completed_successfully
    environment:
      <<: *python-env
      LEARNING_URL: http://learning-service:8081
      SCORING_URL: http://scoring-service:8001
      CORE_URL: http://core-service:8080
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "${AI_HOST_PORT:-8000}:8000"
    healthcheck:
      <<: *python-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]

  scoring-service:
    build: ./backend/scoring-service
    depends_on:
      rabbitmq-init:
        condition: service_completed_successfully
    environment:
      <<: *python-env
      CORE_URL: http://core-service:8080
    ports:
      - "${SCORING_HOST_PORT:-8001}:8001"
    healthcheck:
      <<: *python-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/ready')"]

  report-api:
    build: ./backend/report-service
    depends_on: &report-deps
      rabbitmq-init:
        condition: service_completed_successfully
      report-migrate:
        condition: service_completed_successfully
    environment: &report-env
      <<: *python-env
      DATABASE_URL: *report-db-url
      LEARNING_URL: http://learning-service:8081
      AI_URL: http://ai-service:8000
    ports:
      - "${REPORT_HOST_PORT:-8002}:8002"
    healthcheck:
      <<: *python-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health/ready')"]

  report-worker:
    build: ./backend/report-service
    depends_on: *report-deps
    environment: *report-env
    command: ["python", "-m", "app.worker"]

volumes:
  postgres-data:
  rabbitmq-data:
  minio-data:
