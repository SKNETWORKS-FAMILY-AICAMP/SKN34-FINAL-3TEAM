# 로컬 통합 실행: cp .env.example .env (값 채우기) → docker compose up --build
name: sagomungchi

x-spring-env: &spring-env
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_USERNAME: ${RABBITMQ_USER:?.env 설정 필요}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?.env 설정 필요}
  INTERNAL_TOKEN: ${INTERNAL_TOKEN:?.env 설정 필요}

x-python-env: &python-env
  RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
  INTERNAL_TOKEN: ${INTERNAL_TOKEN:?.env 설정 필요}

x-python-healthcheck: &python-healthcheck
  interval: 10s
  timeout: 5s
  retries: 12

services:
  # ---------- 인프라 ----------
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-trixie
    # #466: pgvector 포함 PostgreSQL 17.11(Debian). 기존 alpine(musl) 볼륨은 text 정렬이 달라 한 번 REINDEX DATABASE 필요
    # (image는 postgres: 바로 다음 줄에 둔다. scripts/check_db_migrations.py가 이 위치로 읽음)
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?.env 설정 필요}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env 설정 필요}
      # #230: 서비스별 migrate(DDL)·app(DML) 계정. 최초 볼륨 초기화 때만 rds-bootstrap.sql이 생성
      CORE_MIGRATE_USER: core_migrate
      CORE_MIGRATE_PASSWORD: ${CORE_MIGRATE_PASSWORD:?.env 설정 필요}
      CORE_APP_USER: core_app
      CORE_APP_PASSWORD: ${CORE_APP_PASSWORD:?.env 설정 필요}
      LEARNING_MIGRATE_USER: learning_migrate
      LEARNING_MIGRATE_PASSWORD: ${LEARNING_MIGRATE_PASSWORD:?.env 설정 필요}
      LEARNING_APP_USER: learning_app
      LEARNING_APP_PASSWORD: ${LEARNING_APP_PASSWORD:?.env 설정 필요}
      REPORT_MIGRATE_USER: report_migrate
      REPORT_MIGRATE_PASSWORD: ${REPORT_MIGRATE_PASSWORD:?.env 설정 필요}
      REPORT_APP_USER: report_app
      REPORT_APP_PASSWORD: ${REPORT_APP_PASSWORD:?.env 설정 필요}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/gitops/charts/platform-data/files/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      # 하위 디렉터리라 entrypoint가 단독 실행하지 않고 init.sql이 포함
      - ./infrastructure/gitops/charts/platform-data/files/postgres/rds-bootstrap.sql:/docker-entrypoint-initdb.d/bootstrap/rds-bootstrap.sql:ro
      - ./infrastructure/gitops/charts/platform-data/files/postgres/rds-bootstrap-db.sql:/docker-entrypoint-initdb.d/bootstrap/rds-bootstrap-db.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.3.7-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?.env 설정 필요}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?.env 설정 필요}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 20

  # definitions.json(exchange·queue·DLX)을 관리 API로 반영. 계정 정보는 파일에 두지 않음
  rabbitmq-init:
    image: curlimages/curl:8.17.0
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./infrastructure/gitops/charts/platform-data/files/rabbitmq/definitions.json:/definitions/definitions.json:ro
      - ./infrastructure/gitops/charts/platform-data/files/rabbitmq/import-definitions.sh:/definitions/import-definitions.sh:ro
    environment:
      RABBITMQ_USER: ${RABBITMQ_USER:?.env 설정 필요}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?.env 설정 필요}
    entrypoint: [/bin/sh, /definitions/import-definitions.sh]

  redis:
    image: redis:8.2.10-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------- DB 마이그레이션 (일회성) ----------
  core-migrate:
    image: flyway/flyway:13.11.1-alpine
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/core-service/src/main/resources/db/migration:/flyway/sql:ro
    command: >-
      -url=jdbc:postgresql://postgres:5432/core_db
      -user=core_migrate -password=${CORE_MIGRATE_PASSWORD}
      -locations=filesystem:/flyway/sql migrate

  learning-migrate:
    image: flyway/flyway:13.11.1-alpine
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/learning-service/src/main/resources/db/migration:/flyway/sql:ro
    command: >-
      -url=jdbc:postgresql://postgres:5432/learning_db
      -user=learning_migrate -password=${LEARNING_MIGRATE_PASSWORD}
      -locations=filesystem:/flyway/sql migrate

  report-migrate:
    build: ./backend/report-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://report_migrate:${REPORT_MIGRATE_PASSWORD}@postgres:5432/report_db
    command: ["alembic", "upgrade", "head"]

  # ---------- 애플리케이션 ----------
  core-service:
    build: ./backend/core-service
    depends_on:
      rabbitmq-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      core-migrate:
        condition: service_completed_successfully
    environment:
      <<: *spring-env
      DB_URL: jdbc:postgresql://postgres:5432/core_db
      DB_USERNAME: core_app
      DB_PASSWORD: ${CORE_APP_PASSWORD}
      LEARNING_URL: http://learning-service:8081
      AI_URL: http://ai-service:8000
      REPORT_URL: http://report-api:8002
      SCORING_URL: http://scoring-service:8001
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?base64 JWT 서명 키 설정 필요}
      AUTH_WEB_ORIGIN: ${AUTH_WEB_ORIGIN:-http://localhost:5173}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_ACCESS_TTL: ${AUTH_ACCESS_TTL:-15m}
      AUTH_STUDENT_ACCESS_TTL: ${AUTH_STUDENT_ACCESS_TTL:-15m}
      AUTH_REAUTH_TTL: ${AUTH_REAUTH_TTL:-5m}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      STUDENT_DEVICE_TTL: ${STUDENT_DEVICE_TTL:-90d}
      STUDENT_DEVICE_ATTEMPT_LIMIT: ${STUDENT_DEVICE_ATTEMPT_LIMIT:-20}
      AUTH_REFRESH_TTL: ${AUTH_REFRESH_TTL:-7d}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      PAYMENT_FREE_PRODUCT_ID: ${PAYMENT_FREE_PRODUCT_ID:-}
      TOSS_TEST_SECRET_KEY: ${TOSS_TEST_SECRET_KEY:-}
      TOSSPAYMENTS_SECRET_KEY: ${TOSSPAYMENTS_SECRET_KEY:-}
      TOSS_TEST_BILLING_SECRET_KEY: ${TOSS_TEST_BILLING_SECRET_KEY:-}
      TOSS_TEST_MID: ${TOSS_TEST_MID:-}
      TOSS_TEST_BILLING_MID: ${TOSS_TEST_BILLING_MID:-}
      TOSS_TEST_WEBHOOK_SECURITY_KEY: ${TOSS_TEST_WEBHOOK_SECURITY_KEY:-}
      TOSS_TEST_BILLING_WEBHOOK_SECURITY_KEY: ${TOSS_TEST_BILLING_WEBHOOK_SECURITY_KEY:-}
      PAYMENT_BILLING_ENCRYPTION_KEY: ${PAYMENT_BILLING_ENCRYPTION_KEY:-}
      APP_GUARDIAN_TRANSFER_ENABLED: "${APP_GUARDIAN_TRANSFER_ENABLED:-false}"
      # 관리자 큐 현황(GET /admin/queues): RabbitMQ 관리 API, 로컬은 기존 브로커 계정 재사용
      ADMIN_RABBIT_MANAGEMENT_URL: http://rabbitmq:15672
      ADMIN_RABBIT_MANAGEMENT_USERNAME: ${RABBITMQ_USER}
      ADMIN_RABBIT_MANAGEMENT_PASSWORD: ${RABBITMQ_PASSWORD}
    ports:
      - "${CORE_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 18

  learning-service:
    build: ./backend/learning-service
    depends_on:
      rabbitmq-init:
        condition: service_completed_successfully
      learning-migrate:
        condition: service_completed_successfully
    environment:
      <<: *spring-env
      DB_URL: jdbc:postgresql://postgres:5432/learning_db
      DB_USERNAME: learning_app
      DB_PASSWORD: ${LEARNING_APP_PASSWORD}
      CORE_URL: http://core-service:8080
      AI_URL: http://ai-service:8000
    ports:
      - "${LEARNING_HOST_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 18

  ai-service:
    build: ./backend/ai-service
    depends_on:
      rabbitmq-init:
        condition: service_completed_successfully
    environment:
      <<: *python-env
      LEARNING_URL: http://learning-service:8081
      SCORING_URL: http://scoring-service:8001
      CORE_URL: http://core-service:8080
      # #69: false여도 M2 점수는 기록한다. 시간·경계 기본값은 ai Settings와 동일.
      JUDGE_DEADLINE: "${JUDGE_DEADLINE:-33.0}"
      SCORING_TIMEOUT: "${SCORING_TIMEOUT:-10.0}"
      SCORING_RESERVE: "${SCORING_RESERVE:-3.0}"
      M2_CROSS_CHECK_ENABLED: "${M2_CROSS_CHECK_ENABLED:-false}"
      M2_NARRATIVE_LOW: "${M2_NARRATIVE_LOW:-2.0}"
      M2_NARRATIVE_HIGH: "${M2_NARRATIVE_HIGH:-4.0}"
      M2_ESSAY_LOW: "${M2_ESSAY_LOW:-1.0}"
      M2_ESSAY_HIGH: "${M2_ESSAY_HIGH:-2.0}"
      M1_CHECK_ENABLED: "${M1_CHECK_ENABLED:-false}"
      M1_MIN_CONFIDENCE: "${M1_MIN_CONFIDENCE:-0.8}"
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
      ANTHROPIC_EFFORT: ${ANTHROPIC_EFFORT:-medium}
      ANTHROPIC_FALLBACK: ${ANTHROPIC_FALLBACK:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_JSON_MODE: ${OPENAI_JSON_MODE:-json_schema}
      EXPLANATION_BASE_URL: ${EXPLANATION_BASE_URL:-}
      EXPLANATION_MODEL: ${EXPLANATION_MODEL:-report-explanation}
    ports:
      - "${AI_HOST_PORT:-8000}:8000"
    healthcheck:
      <<: *python-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]

  scoring-service:
    build: ./backend/scoring-service
    depends_on:
      rabbitmq-init:
        condition: service_completed_successfully
    environment:
      <<: *python-env
      CORE_URL: http://core-service:8080
      S3_BUCKET: ${SCORING_S3_BUCKET:-sagomungchi-local-models}
      S3_REGION: ${SCORING_S3_REGION:-ap-northeast-2}
      M2_CONTENT3_RULE_ENABLED: "${M2_CONTENT3_RULE_ENABLED:-false}"
      MODEL_CACHE_DIR: /tmp/scoring-models
    ports:
      - "${SCORING_HOST_PORT:-8001}:8001"
    healthcheck:
      <<: *python-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/ready')"]

  report-api:
    build: ./backend/report-service
    depends_on: &report-deps
      rabbitmq-init:
        condition: service_completed_successfully
      report-migrate:
        condition: service_completed_successfully
    environment: &report-env
      <<: *python-env
      DATABASE_URL: postgresql+psycopg://report_app:${REPORT_APP_PASSWORD}@postgres:5432/report_db
      LEARNING_URL: http://learning-service:8081
      AI_URL: http://ai-service:8000
      CORE_URL: http://core-service:8080
      S3_BUCKET: ${REPORT_S3_BUCKET:-sagomungchi-local-reports}
      S3_REGION: ${REPORT_S3_REGION:-ap-northeast-2}
      REPORT_THEME_SUMMARY_ENABLED: ${REPORT_THEME_SUMMARY_ENABLED:-true}
      REPORT_EXPLANATION_TIMEOUT_SECONDS: ${REPORT_EXPLANATION_TIMEOUT_SECONDS:-130}
      REPORT_EXPLANATION_BUDGET_SECONDS: ${REPORT_EXPLANATION_BUDGET_SECONDS:-400}
      REPORT_DOWNLOAD_TTL_SECONDS: ${REPORT_DOWNLOAD_TTL_SECONDS:-300}
    ports:
      - "${REPORT_HOST_PORT:-8002}:8002"
    healthcheck:
      <<: *python-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health/ready')"]

  report-worker:
    build: ./backend/report-service
    depends_on: *report-deps
    environment: *report-env
    command: ["python", "-m", "app.worker"]

volumes:
  postgres-data:
  rabbitmq-data:
