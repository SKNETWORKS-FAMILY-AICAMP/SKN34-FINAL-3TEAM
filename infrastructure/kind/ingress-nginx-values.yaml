# Install only with ingress-nginx chart 4.15.1 (controller v1.15.1).
controller:
  replicaCount: 1
  ingressClass: nginx
  ingressClassResource:
    name: nginx
    enabled: true
    default: false
  watchIngressWithoutClass: false
  allowSnippetAnnotations: false
  hostPort:
    enabled: true
    ports:
      http: 80
      https: 443
  nodeSelector:
    kubernetes.io/os: linux
    ingress-ready: "true"
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  service:
    type: ClusterIP
  publishService:
    enabled: false
  extraArgs:
    publish-status-address: "127.0.0.1"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
