# Dedicated verification cluster for #171. Never apply to sagomungchi-local.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: sagomungchi-issue171
featureGates:
  MutatingAdmissionPolicy: true
runtimeConfig:
  admissionregistration.k8s.io/v1beta1: "true"
networking:
  ipFamily: ipv4
  apiServerAddress: "127.0.0.1"
  apiServerPort: 16443
  disableDefaultCNI: true
  kubeProxyMode: iptables
  podSubnet: "10.245.0.0/16"
  serviceSubnet: "10.112.0.0/12"
nodes:
  - role: control-plane
    image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
    labels:
      ingress-ready: "true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 18080
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 443
        hostPort: 18443
        listenAddress: "127.0.0.1"
        protocol: TCP
