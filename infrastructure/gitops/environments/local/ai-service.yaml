nameOverride: ai-service
image:
  repository: sagomungchi/ai-service
  tag: local
replicaCount: 1
service:
  port: 8000
  targetPort: 8000
probes:
  startup: {enabled: true, path: /health/live, periodSeconds: 10, failureThreshold: 30}
  liveness: {enabled: true, path: /health/live, periodSeconds: 10, timeoutSeconds: 5}
  readiness: {enabled: true, path: /health/ready, periodSeconds: 10, timeoutSeconds: 5}
resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {cpu: 500m, memory: 512Mi}
env:
  - {name: INTERNAL_TOKEN, valueFrom: {secretKeyRef: {name: app-service-credentials, key: INTERNAL_TOKEN}}}
  - {name: RABBITMQ_URL, valueFrom: {secretKeyRef: {name: app-service-credentials, key: RABBITMQ_URL}}}
  - {name: LEARNING_URL, value: "http://learning-service.app.svc.cluster.local:8081"}
  - {name: SCORING_URL, value: "http://scoring-service.app.svc.cluster.local:8001"}
  - {name: CORE_URL, value: "http://core-service.app.svc.cluster.local:8080"}
  - {name: OPENAI_API_KEY, valueFrom: {secretKeyRef: {name: app-service-credentials, key: OPENAI_API_KEY, optional: true}}}
hpa:
  enabled: false
pdb:
  enabled: false
networkPolicy:
  enabled: true
  ingressFromApps: [core-service, learning-service, report-worker]
  egressToApps:
    - {name: core-service, port: 8080}
    - {name: learning-service, port: 8081}
    - {name: scoring-service, port: 8001}
  egressToPlatform:
    - {name: rabbitmq, port: 5672}
