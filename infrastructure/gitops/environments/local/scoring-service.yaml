nameOverride: scoring-service
image:
  repository: sagomungchi/scoring-service
  tag: local
replicaCount: 1
service:
  port: 8001
  targetPort: 8001
probes:
  startup: {enabled: true, path: /health/live, periodSeconds: 10, failureThreshold: 30}
  liveness: {enabled: true, path: /health/live, periodSeconds: 10, timeoutSeconds: 5}
  readiness: {enabled: true, path: /health/ready, periodSeconds: 10, timeoutSeconds: 5}
resources:
  requests: {cpu: 150m, memory: 512Mi}
  limits: {cpu: "1", memory: 2Gi}
env:
  - {name: INTERNAL_TOKEN, valueFrom: {secretKeyRef: {name: app-service-credentials, key: INTERNAL_TOKEN}}}
  - {name: RABBITMQ_URL, valueFrom: {secretKeyRef: {name: app-service-credentials, key: RABBITMQ_URL}}}
  - {name: CORE_URL, value: "http://core-service.app.svc.cluster.local:8080"}
  - {name: S3_ENDPOINT_URL, value: "http://minio.platform.svc.cluster.local:9000"}
  - {name: S3_BUCKET, value: sagomungchi-local-models}
  - {name: S3_REGION, value: ap-northeast-2}
  - {name: MODEL_CACHE_DIR, value: /tmp/scoring-models}
  - {name: M2_CONTENT3_RULE_ENABLED, value: "false"}
  - {name: AWS_ACCESS_KEY_ID, valueFrom: {secretKeyRef: {name: app-service-credentials, key: MINIO_ROOT_USER}}}
  - {name: AWS_SECRET_ACCESS_KEY, valueFrom: {secretKeyRef: {name: app-service-credentials, key: MINIO_ROOT_PASSWORD}}}
hpa:
  enabled: false
pdb:
  enabled: false
networkPolicy:
  enabled: true
  ingressFromApps: [ai-service, core-service]
  egressToApps:
    - {name: core-service, port: 8080}
  egressToPlatform:
    - {name: rabbitmq, port: 5672}
    - {name: minio, port: 9000}
