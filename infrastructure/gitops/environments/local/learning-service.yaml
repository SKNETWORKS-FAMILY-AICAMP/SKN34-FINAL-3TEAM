nameOverride: learning-service
image:
  repository: sagomungchi/learning-service
  tag: local
javaAgent:
  enabled: true
replicaCount: 1
service:
  port: 8081
  targetPort: 8081
probes:
  startup: {enabled: true, path: /actuator/health/liveness, periodSeconds: 10, failureThreshold: 30}
  liveness: {enabled: true, path: /actuator/health/liveness, periodSeconds: 10, timeoutSeconds: 5}
  readiness: {enabled: true, path: /actuator/health/readiness, periodSeconds: 10, timeoutSeconds: 5}
resources:
  requests: {cpu: 150m, memory: 384Mi}
  limits: {cpu: "1", memory: 768Mi}
env:
  - {name: DB_URL, value: "jdbc:postgresql://postgres.platform.svc.cluster.local:5432/learning_db"}
  - {name: DB_USERNAME, valueFrom: {secretKeyRef: {name: app-service-credentials, key: LEARNING_DB_USERNAME}}}
  - {name: DB_PASSWORD, valueFrom: {secretKeyRef: {name: app-service-credentials, key: LEARNING_DB_PASSWORD}}}
  - {name: RABBITMQ_HOST, value: rabbitmq.platform.svc.cluster.local}
  - {name: RABBITMQ_USERNAME, valueFrom: {secretKeyRef: {name: app-service-credentials, key: RABBITMQ_USERNAME}}}
  - {name: RABBITMQ_PASSWORD, valueFrom: {secretKeyRef: {name: app-service-credentials, key: RABBITMQ_PASSWORD}}}
  - {name: INTERNAL_TOKEN, valueFrom: {secretKeyRef: {name: app-service-credentials, key: INTERNAL_TOKEN}}}
  - {name: CORE_URL, value: "http://core-service.app.svc.cluster.local:8080"}
  - {name: AI_URL, value: "http://ai-service.app.svc.cluster.local:8000"}
hpa:
  enabled: false
pdb:
  enabled: false
networkPolicy:
  enabled: true
  ingressFromApps: [core-service, ai-service, report-worker]
  egressToApps:
    - {name: core-service, port: 8080}
    - {name: ai-service, port: 8000}
  egressToPlatform:
    - {name: postgres, port: 5432}
    - {name: rabbitmq, port: 5672}
  egressToCollector: true
  migrationEgress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: platform}
          podSelector:
            matchLabels: {app.kubernetes.io/name: postgres, app.kubernetes.io/instance: platform-data}
      ports: [{protocol: TCP, port: 5432}]
migration:
  enabled: true
  revision: v10
  image:
    repository: sagomungchi/learning-migrate
    tag: local
  env:
    - {name: FLYWAY_URL, value: "jdbc:postgresql://postgres.platform.svc.cluster.local:5432/learning_db"}
    - {name: FLYWAY_USER, valueFrom: {secretKeyRef: {name: app-service-credentials, key: LEARNING_MIGRATE_USERNAME}}}
    - {name: FLYWAY_PASSWORD, valueFrom: {secretKeyRef: {name: app-service-credentials, key: LEARNING_MIGRATE_PASSWORD}}}
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 250m, memory: 256Mi}
