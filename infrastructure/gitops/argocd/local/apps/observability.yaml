apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: local-observability
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/SKNETWORKS-FAMILY-AICAMP/SKN34-FINAL-3TEAM.git
      targetRevision: develop
      path: infrastructure/gitops/charts/observability
      helm:
        releaseName: observability
        valueFiles:
          - $values/infrastructure/gitops/environments/local/observability.yaml
    - repoURL: https://github.com/SKNETWORKS-FAMILY-AICAMP/SKN34-FINAL-3TEAM.git
      targetRevision: develop
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
