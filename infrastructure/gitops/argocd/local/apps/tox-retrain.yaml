apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: local-tox-retrain
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/SKNETWORKS-FAMILY-AICAMP/SKN34-FINAL-3TEAM.git
      targetRevision: develop
      path: infrastructure/gitops/charts/tox-retrain
      helm:
        releaseName: tox-retrain
        valueFiles:
          - '$values/infrastructure/gitops/environments/local/tox-retrain.yaml'
    - repoURL: https://github.com/SKNETWORKS-FAMILY-AICAMP/SKN34-FINAL-3TEAM.git
      targetRevision: develop
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: app
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
