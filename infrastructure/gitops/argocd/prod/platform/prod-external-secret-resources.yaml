# wave 2: SecretStore 2개·ExternalSecret 14개(app·platform). ESO CRD가 wave 1에서 생긴 뒤 적용, ExternalSecret Ready(Secrets Manager 값 필요)까지 기다린다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-external-secret-resources
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: sagomungchi-prod
  source:
    repoURL: https://github.com/SKNETWORKS-FAMILY-AICAMP/SKN34-FINAL-3TEAM.git
    targetRevision: main
    path: infrastructure/gitops/environments/prod
    directory:
      include: 'external-secret-resources.json'
  destination:
    server: https://kubernetes.default.svc
    namespace: app
  # 플랫폼은 prune 끔(상태 저장 자원·CRD·NodePool 보호), selfHeal 켬. finalizer가 없어 Application을 지워도 자원은 남는다.
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - SkipDryRunOnMissingResource=true
