# wave 1: External Secrets Operator 2.14.0. 값은 environments/prod/external-secrets.json(installCRDs=true).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: sagomungchi-prod
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.14.0
      helm:
        releaseName: external-secrets
        valueFiles:
          - $values/infrastructure/gitops/environments/prod/external-secrets.json
    - repoURL: https://github.com/SKNETWORKS-FAMILY-AICAMP/SKN34-FINAL-3TEAM.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  # cert-controller가 webhook caBundle을 실행 중에 채우므로 비교·동기화에서 뺀다
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
  # 플랫폼은 prune 끔(상태 저장 자원·CRD·NodePool 보호), selfHeal 켬. finalizer가 없어 Application을 지워도 자원은 남는다.
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      # CRD(secretstores 등)가 740KB라 client-side apply의 last-applied 주석 한도(256KB)를 넘는다
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
