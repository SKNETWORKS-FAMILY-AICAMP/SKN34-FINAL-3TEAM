# wave 4: platform namespace 정책. 기본 ingress 거부·RabbitMQ·Redis 클라이언트 허용과 관측 Prometheus의 RabbitMQ 수집 허용.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-platform-network
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: sagomungchi-prod
  source:
    repoURL: https://github.com/SKNETWORKS-FAMILY-AICAMP/SKN34-FINAL-3TEAM.git
    targetRevision: main
    path: infrastructure/gitops/environments/prod
    directory:
      include: '{platform-network.json,observability-platform-network.json}'
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  # 플랫폼은 prune 끔(상태 저장 자원·CRD·NodePool 보호), selfHeal 켬. finalizer가 없어 Application을 지워도 자원은 남는다.
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
