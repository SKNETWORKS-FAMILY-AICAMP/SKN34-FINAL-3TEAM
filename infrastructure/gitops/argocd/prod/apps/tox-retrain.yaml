# #730 표현 분류 재학습 CronJob. app-service chart가 아니라 ApplicationSet 목록에 넣지 않고 따로 둔다.
# 값 = environments/prod/tox-retrain.json(suspend: true, S3·Pod Identity·burst 노드) + images/tox-retrain.json(cd-release digest PR, jobImageFiles).
# A는 야간 정지(01:00~07:15)와 기본 일요일 03:00이 겹쳐 예약을 끄고 손 실행만 한다(kubectl create job --from=cronjob/tox-retrain).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-tox-retrain
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: sagomungchi-prod
  sources:
    - repoURL: https://github.com/SKNETWORKS-FAMILY-AICAMP/SKN34-FINAL-3TEAM.git
      targetRevision: main
      path: infrastructure/gitops/charts/tox-retrain
      helm:
        releaseName: tox-retrain
        valueFiles:
          - $values/infrastructure/gitops/environments/prod/tox-retrain.json
          - $values/infrastructure/gitops/environments/prod/images/tox-retrain.json
    - repoURL: https://github.com/SKNETWORKS-FAMILY-AICAMP/SKN34-FINAL-3TEAM.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: app
  # 앱과 같게 자동 동기화(prune·selfHeal). 손으로 만든 Job은 CronJob ownerReference가 있어 prune 대상이 아니다
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
