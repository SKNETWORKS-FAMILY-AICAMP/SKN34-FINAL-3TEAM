# #857 prod 앱 6개(sllm-server 제외). root app(#855)이 이 파일을 읽는다. 플랫폼 Application(#856)보다 늦게(wave 10).
# 값 = 설정 파일 environments/prod/<svc>.json + 이미지 파일 images/<svc>.json(digest·migration revision, #858 digest PR이 main에서 갱신).
# core·learning·report-api는 설정 파일의 migration.enabled=true라 PreSync migration Job(wave -1)과 그 NetworkPolicy(wave -2)가 앱보다 먼저 돈다.
# 비상용 Helm 경로(redeploy-app.ps1)를 쓸 때는 먼저 해당 Application의 자동 동기화를 끈다(prod README 3절).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: sagomungchi-prod-apps
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  generators:
    - list:
        elements:
          - {name: core-service}
          - {name: learning-service}
          - {name: ai-service}
          - {name: scoring-service}
          - {name: report-api}
          - {name: report-worker}
  syncPolicy:
    # ApplicationSet을 지워도 생성된 Application과 앱 리소스는 남긴다
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: 'prod-{{name}}'
      namespace: argocd
    spec:
      project: sagomungchi-prod
      sources:
        - repoURL: https://github.com/SKNETWORKS-FAMILY-AICAMP/SKN34-FINAL-3TEAM.git
          targetRevision: main
          path: infrastructure/gitops/charts/app-service
          helm:
            releaseName: '{{name}}'
            valueFiles:
              - '$values/infrastructure/gitops/environments/prod/{{name}}.json'
              - '$values/infrastructure/gitops/environments/prod/images/{{name}}.json'
        - repoURL: https://github.com/SKNETWORKS-FAMILY-AICAMP/SKN34-FINAL-3TEAM.git
          targetRevision: main
          ref: values
      destination:
        server: https://kubernetes.default.svc
        # app namespace는 플랫폼 쪽(라벨·ExternalSecret 포함)에서 먼저 준비한다
        namespace: app
      # retry는 두지 않는다: 실패한 migration Job(HookFailed로 지워짐)이 자동으로 다시 돌지 않게,
      # 같은 커밋의 자동 동기화는 한 번만 시도된다. 원인을 고친 뒤 새 커밋이나 손 동기화로 다시 돈다
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
