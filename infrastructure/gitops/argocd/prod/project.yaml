# prod(EKS) Argo CD 범위(#855). Argo CD 설치 뒤 root-app.yaml보다 먼저 손으로 1회 적용한다.
# 출처는 이 저장소와 #856 플랫폼 Application이 쓰는 외부 chart 저장소만, 대상은 이 클러스터의 아래 namespace만 허용한다.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: sagomungchi-prod
  namespace: argocd
spec:
  description: 사고뭉치 운영(EKS) 앱·플랫폼
  sourceRepos:
    - https://github.com/SKNETWORKS-FAMILY-AICAMP/SKN34-FINAL-3TEAM.git
    - https://charts.external-secrets.io
    - https://aws.github.io/eks-charts
    # Karpenter OCI chart. Application repoURL 표기(oci:// 유무)에 따라 둘 중 하나가 맞는다.
    - public.ecr.aws/karpenter
    - oci://public.ecr.aws/karpenter
  destinations:
    # root app이 만드는 하위 Application·ApplicationSet
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: app
    - server: https://kubernetes.default.svc
      namespace: platform
    - server: https://kubernetes.default.svc
      namespace: observability
    - server: https://kubernetes.default.svc
      namespace: external-secrets
    # LB Controller·Karpenter
    - server: https://kubernetes.default.svc
      namespace: kube-system
  # namespace·gp3·외부 chart CRD·RBAC·webhook·IngressClass, Karpenter NodePool·EC2NodeClass
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: storage.k8s.io
      kind: StorageClass
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: networking.k8s.io
      kind: IngressClass
    - group: elbv2.k8s.aws
      kind: IngressClassParams
    - group: karpenter.sh
      kind: NodePool
    - group: karpenter.k8s.aws
      kind: EC2NodeClass
  # AppProject는 이 파일로만 바꾼다(하위 Application이 프로젝트 범위를 넓히지 못하게).
  namespaceResourceBlacklist:
    - group: argoproj.io
      kind: AppProject
  orphanedResources:
    warn: false
