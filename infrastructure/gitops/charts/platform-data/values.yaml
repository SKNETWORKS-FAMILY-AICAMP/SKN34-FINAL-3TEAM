# Supply the existing Secret name and resources through an environment values file.
# The Helm release namespace owns all chart resources; local uses namespace platform.
existingSecret: ""

# null: use the cluster default StorageClass; "": request no StorageClass.
storageClassName: null

# Node placement for the long-running workloads (e.g. a dedicated node group).
# The one-shot init Jobs stay unpinned: a Job pod template cannot change in place.
scheduling:
  nodeSelector: {}
  tolerations: []

postgres:
  enabled: false
  # #466: pgvector included, PostgreSQL 17.11 (Debian). Runs as uid 70 like the old alpine image.
  # An existing alpine (musl) data directory needs REINDEX DATABASE once: glibc sorts text differently.
  image: "pgvector/pgvector:0.8.7-pg17-trixie"
  usernameKey: "POSTGRES_USER"
  passwordKey: "POSTGRES_PASSWORD"
  # rds-bootstrap.sql env prefix -> role name (#230). Each password comes from existingSecret
  # key <prefix>_PASSWORD. Roles are created only when the data directory is first initialized.
  serviceRoles:
    CORE_MIGRATE: core_migrate
    CORE_APP: core_app
    LEARNING_MIGRATE: learning_migrate
    LEARNING_APP: learning_app
    REPORT_MIGRATE: report_migrate
    REPORT_APP: report_app
  servicePort: 5432
  persistence:
    size: "2Gi"
  settings:
    sharedBuffers: "128MB"
    maxConnections: 100
    workMem: "4MB"
    maintenanceWorkMem: "64MB"
  resources: {}

rabbitmq:
  enabled: true
  image: "rabbitmq:4.3.7-management-alpine"
  usernameKey: "RABBITMQ_USER"
  passwordKey: "RABBITMQ_PASSWORD"
  servicePort: 5672
  managementPort: 15672
  prometheusPort: 15692
  persistence:
    size: "2Gi"
  # Set an absolute byte count in the environment values file.
  memoryHighWatermark: ""
  resources: {}
  initialization:
    image: "curlimages/curl:8.17.0"
    backoffLimit: 3
    activeDeadlineSeconds: 300
    waitTimeoutSeconds: 120
    resources: {}

redis:
  enabled: true
  image: "redis:8.2.10-alpine"
  servicePort: 6379
  persistence:
    size: "512Mi"
  # Set maxMemory below the container limit in the environment values file.
  maxMemory: ""
  maxMemoryPolicy: "noeviction"
  appendOnly: true
  resources: {}

minio:
  enabled: false
  # FINAL independently selected linux/amd64 images, pinned without a mutable tag.
  image: "cgr.dev/chainguard/minio@sha256:98c819b873cbd455860c1fb5a9171a62b2f48d86554a4b2c6847e60a14a9ef30"
  usernameKey: "MINIO_ROOT_USER"
  passwordKey: "MINIO_ROOT_PASSWORD"
  servicePort: 9000
  consolePort: 9001
  persistence:
    size: "2Gi"
  buckets: {}
  # 초기화 Job이 없을 때만 만드는 자리 객체(#509). [{bucket, key}], bucket은 buckets 값 중 하나.
  # 내용은 고정 문구이며, 파일 내용을 읽지 않는 local 대역(예: sllm-server의 llm-stub)용이다.
  placeholderObjects: []
  resources: {}
  initialization:
    image: "curlimages/curl:8.17.0"
    backoffLimit: 3
    activeDeadlineSeconds: 300
    waitTimeoutSeconds: 120
    resources: {}
