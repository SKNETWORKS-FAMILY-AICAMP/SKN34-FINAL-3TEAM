{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "app-service.name" . }}
  labels:
    {{- include "app-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "app-service.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  {{- if or .Values.networkPolicy.ingressFromApps .Values.networkPolicy.ingressFromIngressController .Values.networkPolicy.ingressFromPrometheus .Values.networkPolicy.ingress }}
  ingress:
    {{- range .Values.networkPolicy.ingressFromApps }}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ . | quote }}
      ports:
        - protocol: TCP
          port: {{ $.Values.service.targetPort }}
    {{- end }}
    {{- if .Values.networkPolicy.ingressFromIngressController }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
              app.kubernetes.io/component: controller
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
    {{- end }}
    {{- if .Values.networkPolicy.ingressFromPrometheus }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
    {{- end }}
    {{- with .Values.networkPolicy.ingress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- else }}
  ingress: []
  {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- range .Values.networkPolicy.egressToApps }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .name | quote }}
      ports:
        - protocol: TCP
          port: {{ .port }}
    {{- end }}
    {{- range .Values.networkPolicy.egressToPlatform }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform
          podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .name | quote }}
              app.kubernetes.io/instance: platform-data
      ports:
        - protocol: TCP
          port: {{ .port }}
    {{- end }}
    {{- if .Values.networkPolicy.egressToCollector }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-collector
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
    {{- end }}
    {{- if .Values.networkPolicy.egressToLangfuse }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: langfuse
              app.kubernetes.io/component: web
      ports:
        - protocol: TCP
          port: 3000
    {{- end }}
    {{- with .Values.networkPolicy.egress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
