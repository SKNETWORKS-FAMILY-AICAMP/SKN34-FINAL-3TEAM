{{- if .Values.keda.enabled }}
{{- if .Values.hpa.enabled }}{{ fail "HPA and KEDA cannot both own one Deployment" }}{{- end }}
{{- if not (or .Values.keda.queues .Values.keda.cron) }}{{ fail "keda.queues or keda.cron must define at least one trigger" }}{{- end }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "app-service.name" . }}
  labels:
    {{- include "app-service.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    name: {{ include "app-service.name" . }}
  minReplicaCount: {{ .Values.keda.minReplicaCount }}
  maxReplicaCount: {{ .Values.keda.maxReplicaCount }}
  pollingInterval: {{ .Values.keda.pollingInterval }}
  cooldownPeriod: {{ .Values.keda.cooldownPeriod }}
  triggers:
    {{- range .Values.keda.queues }}
    - type: rabbitmq
      metadata:
        protocol: amqp
        mode: QueueLength
        queueName: {{ . | quote }}
        value: {{ $.Values.keda.queueLength | quote }}
      authenticationRef:
        name: {{ include "app-service.name" $ }}-rabbitmq
    {{- end }}
    {{- range .Values.keda.cron }}
    - type: cron
      metadata:
        timezone: {{ required "keda.cron[].timezone is required" .timezone | quote }}
        start: {{ required "keda.cron[].start is required" .start | quote }}
        end: {{ required "keda.cron[].end is required" .end | quote }}
        desiredReplicas: {{ default 1 .desiredReplicas | quote }}
    {{- end }}
{{- end }}
