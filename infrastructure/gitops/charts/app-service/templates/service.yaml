{{- if .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "app-service.name" . }}
  labels:
    {{- include "app-service.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "app-service.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ required "service.port is required" .Values.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
