apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app-service.name" . }}
  labels:
    {{- include "app-service.labels" . | nindent 4 }}
spec:
  {{- if not (or .Values.hpa.enabled .Values.keda.enabled) }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "app-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "app-service.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "app-service.name" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.javaAgent.enabled }}
      initContainers:
        - name: otel-javaagent
          image: {{ .Values.javaAgent.image | quote }}
          command: [cp, /javaagent.jar, /otel/javaagent.jar]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          volumeMounts:
            - name: otel-agent
              mountPath: /otel
      {{- end }}
      containers:
        - name: {{ include "app-service.name" . }}
          image: {{ include "app-service.image" .Values.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.service.enabled }}
          ports:
            - name: http
              containerPort: {{ required "service.targetPort is required" .Values.service.targetPort }}
              protocol: TCP
          {{- end }}
          env:
            - name: HOME
              value: /tmp
            {{- if .Values.javaAgent.enabled }}
            {{- /* Merge a JAVA_TOOL_OPTIONS from env so a later duplicate cannot drop the agent. */}}
            {{- $toolOptions := list "-javaagent:/otel/javaagent.jar" }}
            {{- range .Values.env }}
            {{- if eq .name "JAVA_TOOL_OPTIONS" }}{{ $toolOptions = append $toolOptions .value }}{{ end }}
            {{- end }}
            - name: JAVA_TOOL_OPTIONS
              value: {{ join " " $toolOptions }}
            - name: OTEL_SERVICE_NAME
              value: {{ include "app-service.name" . | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.javaAgent.collectorEndpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_METRICS_EXPORTER
              value: otlp
            - name: OTEL_TRACES_EXPORTER
              value: none
            - name: OTEL_LOGS_EXPORTER
              value: none
            {{- end }}
            {{- range .Values.env }}
            {{- if not (and $.Values.javaAgent.enabled (eq .name "JAVA_TOOL_OPTIONS")) }}
            - {{- toYaml . | nindent 14 }}
            {{- end }}
            {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.probes.startup.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: http
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
          {{- end }}
          {{- with .Values.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.javaAgent.enabled }}
            - name: otel-agent
              mountPath: /otel
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.javaAgent.enabled }}
        - name: otel-agent
          emptyDir: {}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
