{{- if .Values.grafana.alerting.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerting
data:
  alerting.yaml: |
    apiVersion: 1
    contactPoints:
      - orgId: 1
        name: discord-aws-alerts
        receivers:
          - uid: discord-aws-alerts
            type: discord
            disableResolveMessage: false
            settings:
              url: $DISCORD_WEBHOOK_URL
              use_discord_username: true
    policies:
      - orgId: 1
        receiver: discord-aws-alerts
        group_by: [grafana_folder, alertname]
        group_wait: {{ .Values.grafana.alerting.groupWait }}
        group_interval: {{ .Values.grafana.alerting.groupInterval }}
        repeat_interval: {{ .Values.grafana.alerting.repeatInterval }}
    groups:
      - orgId: 1
        name: demo-platform
        folder: AWS Demo
        interval: {{ .Values.grafana.alerting.interval }}
        rules:
        {{- range .Values.grafana.alerting.rules }}
        {{- if and (contains "job=\"rabbitmq-dlq\"" .expr) (not $.Values.prometheus.rabbitmqDlqMetrics.enabled) }}
        {{- fail "DLQ alert rule requires prometheus.rabbitmqDlqMetrics.enabled" }}
        {{- end }}
          - uid: {{ .uid }}
            title: {{ .title | quote }}
            condition: C
            for: {{ .for | quote }}
            {{- /* Traffic-ratio rules may set OK: no requests is not an outage. */}}
            noDataState: {{ .noDataState | default "NoData" }}
            execErrState: Error
            annotations:
              summary: {{ .summary | quote }}
            labels:
              environment: demo
              severity: warning
            data:
              - refId: A
                relativeTimeRange: {from: 300, to: 0}
                datasourceUid: prometheus
                model:
                  refId: A
                  expr: {{ .expr | quote }}
                  instant: true
                  range: false
                  intervalMs: 15000
                  maxDataPoints: 43200
              - refId: C
                relativeTimeRange: {from: 0, to: 0}
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator: {type: {{ .operator }}, params: [{{ .threshold }}]}
                      operator: {type: and}
                      reducer: {type: last}
                      type: query
                      query: {params: [C]}
        {{- end }}
{{- end }}
