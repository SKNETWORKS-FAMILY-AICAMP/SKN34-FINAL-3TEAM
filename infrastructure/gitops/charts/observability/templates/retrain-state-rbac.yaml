{{- if .Values.prometheus.retrainJobMetrics.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tox-retrain-state
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tox-retrain-state
  namespace: app
rules:
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tox-retrain-state
  namespace: app
subjects:
  - {kind: ServiceAccount, name: tox-retrain-state, namespace: {{ .Release.Namespace }}}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tox-retrain-state
{{- end }}
