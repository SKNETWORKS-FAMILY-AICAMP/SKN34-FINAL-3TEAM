apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  labels: {app.kubernetes.io/name: otel-collector}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: otel-collector}
  template:
    metadata:
      labels: {app.kubernetes.io/name: otel-collector}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.scheduling.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.scheduling.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: collector
          image: {{ .Values.collector.image | quote }}
          args: ["--config=/conf/config.yaml"]
          {{- if .Values.collector.traces.enabled }}
          env:
            - name: LANGFUSE_OTLP_ENDPOINT
              value: {{ required "collector.traces.endpoint is required when traces are enabled" .Values.collector.traces.endpoint | quote }}
            - name: LANGFUSE_AUTHORIZATION
              valueFrom:
                secretKeyRef:
                  name: {{ required "collector.traces.authSecretName is required when traces are enabled" .Values.collector.traces.authSecretName }}
                  key: {{ .Values.collector.traces.authSecretKey }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          ports:
            - {name: otlp-grpc, containerPort: 4317}
            - {name: otlp-http, containerPort: 4318}
            - {name: prometheus, containerPort: 8889}
            - {name: health, containerPort: 13133}
          startupProbe:
            httpGet: {path: /, port: health}
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet: {path: /, port: health}
          readinessProbe:
            httpGet: {path: /, port: health}
          resources:
            {{- toYaml .Values.collector.resources | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /conf, readOnly: true}
      volumes:
        - name: config
          configMap: {name: otel-collector-config}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels: {app.kubernetes.io/name: prometheus}
spec:
  replicas: 1
  {{- if .Values.prometheus.persistence.enabled }}
  strategy: {type: Recreate}
  {{- end }}
  selector:
    matchLabels: {app.kubernetes.io/name: prometheus}
  template:
    metadata:
      labels: {app.kubernetes.io/name: prometheus}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.scheduling.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.scheduling.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: prometheus
          image: {{ .Values.prometheus.image | quote }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ .Values.prometheus.retention }}
            {{- if .Values.prometheus.retentionSize }}
            - --storage.tsdb.retention.size={{ .Values.prometheus.retentionSize }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          ports:
            - {name: http, containerPort: 9090}
          startupProbe:
            httpGet: {path: /-/ready, port: http}
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet: {path: /-/healthy, port: http}
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
          resources:
            {{- toYaml .Values.prometheus.resources | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus, readOnly: true}
            - {name: data, mountPath: /prometheus}
      volumes:
        - name: config
          configMap: {name: prometheus-config}
        - name: data
          {{- if .Values.prometheus.persistence.enabled }}
          persistentVolumeClaim: {claimName: prometheus-data}
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels: {app.kubernetes.io/name: grafana}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: grafana}
  template:
    metadata:
      labels: {app.kubernetes.io/name: grafana}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.scheduling.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.scheduling.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: grafana
          image: {{ .Values.grafana.image | quote }}
          env:
            - {name: GF_SECURITY_ADMIN_USER, valueFrom: {secretKeyRef: {name: {{ .Values.grafana.adminSecret.name }}, key: {{ .Values.grafana.adminSecret.userKey }}}}}
            - {name: GF_SECURITY_ADMIN_PASSWORD, valueFrom: {secretKeyRef: {name: {{ .Values.grafana.adminSecret.name }}, key: {{ .Values.grafana.adminSecret.passwordKey }}}}}
            - {name: GF_PATHS_DATA, value: /var/lib/grafana}
            - {name: GF_PATHS_LOGS, value: /tmp}
            - {name: GF_PATHS_PLUGINS, value: /var/lib/grafana/plugins}
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false"}
            {{- if .Values.grafana.alerting.enabled }}
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.grafana.alerting.discordSecretName }}
                  key: {{ .Values.grafana.alerting.discordSecretKey }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          ports:
            - {name: http, containerPort: 3000}
          startupProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: {path: /api/health, port: http}
          readinessProbe:
            httpGet: {path: /api/health, port: http}
          resources:
            {{- toYaml .Values.grafana.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /var/lib/grafana}
            - {name: tmp, mountPath: /tmp}
            - {name: datasources, mountPath: /etc/grafana/provisioning/datasources, readOnly: true}
            {{- if .Values.grafana.alerting.enabled }}
            - {name: alerting, mountPath: /etc/grafana/provisioning/alerting, readOnly: true}
            {{- end }}
      volumes:
        - name: data
          {{- if .Values.grafana.persistence.enabled }}
          persistentVolumeClaim: {claimName: grafana-data}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
        - name: datasources
          configMap: {name: grafana-datasources}
        {{- if .Values.grafana.alerting.enabled }}
        - name: alerting
          configMap: {name: grafana-alerting}
        {{- end }}
