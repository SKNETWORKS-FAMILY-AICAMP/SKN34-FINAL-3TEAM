apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  labels: {app.kubernetes.io/name: otel-collector}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: otel-collector}
  template:
    metadata:
      labels: {app.kubernetes.io/name: otel-collector}
      {{- if or .Values.tempo.enabled .Values.collector.traces.enabled }}
      # The Collector does not reload its ConfigMap; toggling the Tempo pipeline or
      # changing trace limits (#784) or URL redaction (#900) must roll the Pod.
      annotations:
        {{- if .Values.tempo.enabled }}
        ops187/tempo-traces: enabled
        {{- end }}
        ops900/trace-redaction: enabled
        ops784/trace-limits: {{ toJson .Values.collector.traceLimits | sha256sum | trunc 16 | quote }}
        ops900/trace-url-redaction: enabled
      {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.scheduling.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.scheduling.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: collector
          image: {{ .Values.collector.image | quote }}
          args: ["--config=/conf/config.yaml"]
          {{- if .Values.collector.traces.enabled }}
          env:
            - name: LANGFUSE_OTLP_ENDPOINT
              value: {{ required "collector.traces.endpoint is required when traces are enabled" .Values.collector.traces.endpoint | quote }}
            - name: LANGFUSE_AUTHORIZATION
              valueFrom:
                secretKeyRef:
                  name: {{ required "collector.traces.authSecretName is required when traces are enabled" .Values.collector.traces.authSecretName }}
                  key: {{ .Values.collector.traces.authSecretKey }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          ports:
            - {name: otlp-grpc, containerPort: 4317}
            - {name: otlp-http, containerPort: 4318}
            - {name: prometheus, containerPort: 8889}
            - {name: health, containerPort: 13133}
          startupProbe:
            httpGet: {path: /, port: health}
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet: {path: /, port: health}
          readinessProbe:
            httpGet: {path: /, port: health}
          resources:
            {{- toYaml .Values.collector.resources | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /conf, readOnly: true}
      volumes:
        - name: config
          configMap: {name: otel-collector-config}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels: {app.kubernetes.io/name: prometheus}
spec:
  replicas: 1
  {{- if .Values.prometheus.persistence.enabled }}
  strategy: {type: Recreate}
  {{- end }}
  selector:
    matchLabels: {app.kubernetes.io/name: prometheus}
  template:
    metadata:
      labels: {app.kubernetes.io/name: prometheus}
      {{- if .Values.prometheus.rabbitmqDlqMetrics.enabled }}
      # Prometheus does not reload its ConfigMap; toggling the DLQ job must roll the Pod.
      annotations: {ops187/rabbitmq-dlq-scrape: enabled}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.scheduling.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.scheduling.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      {{- if .Values.prometheus.retrainJobMetrics.enabled }}
      serviceAccountName: tox-retrain-state
      {{- end }}
      containers:
        {{- if .Values.prometheus.retrainJobMetrics.enabled }}
        - name: kube-state-metrics
          image: {{ required "retrainJobMetrics.image is required" .Values.prometheus.retrainJobMetrics.image | quote }}
          args:
            - --resources=jobs,cronjobs
            - --namespaces=app
            - --host=127.0.0.1
            - --telemetry-host=127.0.0.1
            - --metric-allowlist=kube_job_failed,kube_job_created,kube_job_owner,kube_cronjob_next_schedule_time,kube_cronjob_spec_suspend,kube_cronjob_status_last_schedule_time,kube_cronjob_status_last_successful_time
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 100m, memory: 96Mi}
          volumeMounts:
            - {name: kube-api, mountPath: /var/run/secrets/kubernetes.io/serviceaccount, readOnly: true}
        {{- end }}
        - name: prometheus
          image: {{ .Values.prometheus.image | quote }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ .Values.prometheus.retention }}
            {{- if .Values.prometheus.retentionSize }}
            - --storage.tsdb.retention.size={{ .Values.prometheus.retentionSize }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          ports:
            - {name: http, containerPort: 9090}
          startupProbe:
            httpGet: {path: /-/ready, port: http}
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet: {path: /-/healthy, port: http}
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
          resources:
            {{- toYaml .Values.prometheus.resources | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus, readOnly: true}
            - {name: data, mountPath: /prometheus}
      volumes:
        {{- if .Values.prometheus.retrainJobMetrics.enabled }}
        - name: kube-api
          projected:
            sources:
              - serviceAccountToken: {path: token, expirationSeconds: 3600}
              - configMap:
                  name: kube-root-ca.crt
                  items: [{key: ca.crt, path: ca.crt}]
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef: {fieldPath: metadata.namespace}
        {{- end }}
        - name: config
          configMap: {name: prometheus-config}
        - name: data
          {{- if .Values.prometheus.persistence.enabled }}
          persistentVolumeClaim: {claimName: prometheus-data}
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels: {app.kubernetes.io/name: grafana}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: grafana}
  template:
    metadata:
      labels: {app.kubernetes.io/name: grafana}
      {{- if or .Values.tempo.enabled .Values.prometheus.retrainJobMetrics.enabled }}
      annotations:
        {{- if .Values.tempo.enabled }}
        ops187/tempo-datasource: enabled
        {{- end }}
        {{- if .Values.prometheus.retrainJobMetrics.enabled }}
        checksum/retrain-alerts: {{ include (print $.Template.BasePath "/alerting.yaml") . | sha256sum }}
        {{- end }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.scheduling.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.scheduling.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: grafana
          image: {{ .Values.grafana.image | quote }}
          env:
            - {name: GF_SECURITY_ADMIN_USER, valueFrom: {secretKeyRef: {name: {{ .Values.grafana.adminSecret.name }}, key: {{ .Values.grafana.adminSecret.userKey }}}}}
            - {name: GF_SECURITY_ADMIN_PASSWORD, valueFrom: {secretKeyRef: {name: {{ .Values.grafana.adminSecret.name }}, key: {{ .Values.grafana.adminSecret.passwordKey }}}}}
            - {name: GF_PATHS_DATA, value: /var/lib/grafana}
            - {name: GF_PATHS_LOGS, value: /tmp}
            - {name: GF_PATHS_PLUGINS, value: /var/lib/grafana/plugins}
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false"}
            {{- if and .Values.grafana.alerting.enabled .Values.grafana.alerting.discordEnabled }}
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.grafana.alerting.discordSecretName }}
                  key: {{ .Values.grafana.alerting.discordSecretKey }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          ports:
            - {name: http, containerPort: 3000}
          startupProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: {path: /api/health, port: http}
          readinessProbe:
            httpGet: {path: /api/health, port: http}
          resources:
            {{- toYaml .Values.grafana.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /var/lib/grafana}
            - {name: tmp, mountPath: /tmp}
            - {name: datasources, mountPath: /etc/grafana/provisioning/datasources, readOnly: true}
            {{- if .Values.grafana.alerting.enabled }}
            - {name: alerting, mountPath: /etc/grafana/provisioning/alerting, readOnly: true}
            {{- end }}
            {{- if .Values.grafana.dashboards.enabled }}
            - {name: dashboard-provider, mountPath: /etc/grafana/provisioning/dashboards, readOnly: true}
            - {name: dashboards, mountPath: /etc/grafana/dashboards, readOnly: true}
            {{- end }}
      volumes:
        - name: data
          {{- if .Values.grafana.persistence.enabled }}
          persistentVolumeClaim: {claimName: grafana-data}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
        - name: datasources
          configMap: {name: grafana-datasources}
        {{- if .Values.grafana.alerting.enabled }}
        - name: alerting
          configMap: {name: grafana-alerting}
        {{- end }}
        {{- if .Values.grafana.dashboards.enabled }}
        # One ConfigMap split by key: the provider file and the dashboard JSON files.
        - name: dashboard-provider
          configMap:
            name: grafana-dashboards
            items: [{key: provider.yaml, path: provider.yaml}]
        - name: dashboards
          configMap:
            name: grafana-dashboards
            items:
              {{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
              - {key: {{ base $path }}, path: {{ base $path }}}
              {{- end }}
        {{- end }}
