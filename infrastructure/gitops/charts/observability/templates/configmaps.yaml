apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 192
      batch: {}
    exporters:
      prometheus:
        endpoint: 0.0.0.0:8889
    {{ if .Values.collector.traces.enabled }}
      otlp_http/langfuse:
        endpoint: ${env:LANGFUSE_OTLP_ENDPOINT}
        headers:
          Authorization: ${env:LANGFUSE_AUTHORIZATION}
          x-langfuse-ingestion-version: "4"
        retry_on_failure:
          enabled: true
        sending_queue:
          enabled: true
          queue_size: 500
    {{ end }}
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    service:
      extensions: [health_check]
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [prometheus]
    {{ if .Values.collector.traces.enabled }}
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp_http/langfuse]
    {{ end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: otel-collector
        static_configs:
          - targets: [otel-collector.observability.svc.cluster.local:8889]
      - job_name: rabbitmq
        static_configs:
          - targets: [rabbitmq.platform.svc.cluster.local:15692]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.observability.svc.cluster.local:9090
        isDefault: true
