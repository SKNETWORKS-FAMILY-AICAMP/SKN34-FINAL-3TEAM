apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 192
    {{- if or .Values.tempo.enabled .Values.collector.traces.enabled }}
      # #784: traces hit their own, lower limit first, so a dead trace backend
      # cannot push the process into the metrics limiter (192 MiB).
      memory_limiter/traces:
        check_interval: 1s
        limit_mib: {{ .Values.collector.traceLimits.memoryLimitMiB }}
        spike_limit_mib: {{ .Values.collector.traceLimits.memorySpikeMiB }}
      transform/trace_urls:
        # Fail closed if a transform fails. Do not export the original trace.
        error_mode: propagate
        trace_statements:
          - context: span
            conditions:
              - IsMatch(attributes["url.path"], "/auth/google/(reauth/)?callback([/?#]|$$)")
              - IsMatch(attributes["http.route"], "/auth/google/(reauth/)?callback([/?#]|$$)")
              - IsMatch(attributes["url.full"], "/auth/google/(reauth/)?callback([/?#]|$$)")
              - IsMatch(attributes["http.url"], "/auth/google/(reauth/)?callback([/?#]|$$)")
              - IsMatch(attributes["http.target"], "/auth/google/(reauth/)?callback([/?#]|$$)")
              - IsMatch(name, "/auth/google/(reauth/)?callback([/?#]|$$)")
            statements:
              - delete_key(attributes, "url.query")
          - context: span
            statements:
              - replace_all_patterns(attributes, "value", "(/auth/google/(reauth/)?callback/?)[?].*", "$$1")
              - replace_all_patterns(attributes, "value", "/v1/billing/[^/?#]+/?([?#].*)?$$", "/v1/billing/{billingKey}")
              - replace_all_patterns(attributes, "value", "/v1/payments/[^/?#]+/cancel/?([?#].*)?$$", "/v1/payments/{paymentKey}/cancel")
              - replace_pattern(name, "(/auth/google/(reauth/)?callback/?)[?].*", "$$1")
              - replace_pattern(name, "/v1/billing/[^/?#]+/?([?#].*)?$$", "/v1/billing/{billingKey}")
              - replace_pattern(name, "/v1/payments/[^/?#]+/cancel/?([?#].*)?$$", "/v1/payments/{paymentKey}/cancel")
    {{- end }}
      batch: {}
    exporters:
      prometheus:
        endpoint: 0.0.0.0:8889
    {{- if .Values.tempo.enabled }}
      otlp/tempo:
        endpoint: tempo.observability.svc.cluster.local:4317
        tls:
          insecure: true
        timeout: 5s
        # Bounded retry and an in-memory queue capped in bytes: when Tempo is down,
        # spans are dropped after the cap instead of filling the Collector heap.
        retry_on_failure:
          enabled: true
          max_elapsed_time: {{ .Values.collector.traceLimits.retryMaxElapsed }}
        sending_queue:
          enabled: true
          sizer: bytes
          queue_size: {{ mul .Values.collector.traceLimits.queueMiB 1048576 }}
    {{- end }}
    {{ if .Values.collector.traces.enabled }}
      otlp_http/langfuse:
        endpoint: ${env:LANGFUSE_OTLP_ENDPOINT}
        headers:
          Authorization: ${env:LANGFUSE_AUTHORIZATION}
          x-langfuse-ingestion-version: "4"
        retry_on_failure:
          enabled: true
          max_elapsed_time: {{ .Values.collector.traceLimits.retryMaxElapsed }}
        sending_queue:
          enabled: true
          sizer: bytes
          queue_size: {{ mul .Values.collector.traceLimits.queueMiB 1048576 }}
    {{ end }}
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    service:
      extensions: [health_check]
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [prometheus]
    {{- $traceExporters := list }}
    {{- if .Values.tempo.enabled }}{{ $traceExporters = append $traceExporters "otlp/tempo" }}{{ end }}
    {{- if .Values.collector.traces.enabled }}{{ $traceExporters = append $traceExporters "otlp_http/langfuse" }}{{ end }}
    {{ if $traceExporters }}
        traces:
          receivers: [otlp]
          processors: [memory_limiter/traces, transform/trace_urls, batch]
          exporters: [{{ join ", " $traceExporters }}]
    {{ end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      {{- if .Values.prometheus.retrainJobMetrics.enabled }}
      - job_name: tox-retrain-state
        static_configs:
          - targets: [127.0.0.1:8080]
      {{- end }}
      - job_name: otel-collector
        static_configs:
          - targets: [otel-collector.observability.svc.cluster.local:8889]
      - job_name: rabbitmq
        static_configs:
          - targets: [rabbitmq.platform.svc.cluster.local:15692]
      {{- if .Values.prometheus.rabbitmqDlqMetrics.enabled }}
      # Only the queue_coarse_metrics family, then only total messages of <queue>.dlq.
      - job_name: rabbitmq-dlq
        metrics_path: /metrics/detailed
        params:
          family: [queue_coarse_metrics]
        static_configs:
          - targets: [rabbitmq.platform.svc.cluster.local:15692]
        metric_relabel_configs:
          - source_labels: [__name__, queue]
            regex: 'rabbitmq_detailed_queue_messages;.+\.dlq'
            action: keep
      {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.observability.svc.cluster.local:9090
        isDefault: true
      {{- if .Values.tempo.enabled }}
      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://tempo.observability.svc.cluster.local:3200
      {{- end }}
{{- if .Values.grafana.dashboards.enabled }}
---
# #984: file-provisioned dashboards. Grafana rereads the folder, so no Pod roll is needed on change.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: repository
        type: file
        disableDeletion: true
        allowUiUpdates: false
        updateIntervalSeconds: 60
        options:
          path: /etc/grafana/dashboards
  {{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
  {{ base $path }}: |
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
{{- end }}
