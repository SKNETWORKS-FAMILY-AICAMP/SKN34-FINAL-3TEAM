apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 192
    {{- if or .Values.tempo.enabled .Values.collector.traces.enabled }}
      # #784: traces hit their own, lower limit first, so a dead trace backend
      # cannot push the process into the metrics limiter (192 MiB).
      memory_limiter/traces:
        check_interval: 1s
        limit_mib: {{ .Values.collector.traceLimits.memoryLimitMiB }}
        spike_limit_mib: {{ .Values.collector.traceLimits.memorySpikeMiB }}
      # #900: the Java agent records full URLs. PG keys in Toss paths and OAuth codes
      # in Google callback queries are removed before any trace backend sees them.
      transform/redact:
        error_mode: ignore
        trace_statements:
          - context: span
            statements:
              - replace_pattern(span.attributes["url.full"], "/v1/billing/[^/?#]+", "/v1/billing/{billingKey}")
              - replace_pattern(span.attributes["url.full"], "/v1/payments/[^/?#]+/cancel", "/v1/payments/{paymentKey}/cancel")
              - delete_key(span.attributes, "url.query") where span.attributes["url.path"] != nil and IsMatch(span.attributes["url.path"], "^/api/v1/auth/google/(reauth/)?callback$")
    {{- end }}
      batch: {}
    exporters:
      prometheus:
        endpoint: 0.0.0.0:8889
    {{- if .Values.tempo.enabled }}
      otlp/tempo:
        endpoint: tempo.observability.svc.cluster.local:4317
        tls:
          insecure: true
        timeout: 5s
        # Bounded retry and an in-memory queue capped in bytes: when Tempo is down,
        # spans are dropped after the cap instead of filling the Collector heap.
        retry_on_failure:
          enabled: true
          max_elapsed_time: {{ .Values.collector.traceLimits.retryMaxElapsed }}
        sending_queue:
          enabled: true
          sizer: bytes
          queue_size: {{ mul .Values.collector.traceLimits.queueMiB 1048576 }}
    {{- end }}
    {{ if .Values.collector.traces.enabled }}
      otlp_http/langfuse:
        endpoint: ${env:LANGFUSE_OTLP_ENDPOINT}
        headers:
          Authorization: ${env:LANGFUSE_AUTHORIZATION}
          x-langfuse-ingestion-version: "4"
        retry_on_failure:
          enabled: true
          max_elapsed_time: {{ .Values.collector.traceLimits.retryMaxElapsed }}
        sending_queue:
          enabled: true
          sizer: bytes
          queue_size: {{ mul .Values.collector.traceLimits.queueMiB 1048576 }}
    {{ end }}
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    service:
      extensions: [health_check]
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [prometheus]
    {{- $traceExporters := list }}
    {{- if .Values.tempo.enabled }}{{ $traceExporters = append $traceExporters "otlp/tempo" }}{{ end }}
    {{- if .Values.collector.traces.enabled }}{{ $traceExporters = append $traceExporters "otlp_http/langfuse" }}{{ end }}
    {{ if $traceExporters }}
        traces:
          receivers: [otlp]
          processors: [memory_limiter/traces, transform/redact, batch]
          exporters: [{{ join ", " $traceExporters }}]
    {{ end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: otel-collector
        static_configs:
          - targets: [otel-collector.observability.svc.cluster.local:8889]
      - job_name: rabbitmq
        static_configs:
          - targets: [rabbitmq.platform.svc.cluster.local:15692]
      {{- if .Values.prometheus.rabbitmqDlqMetrics.enabled }}
      # Only the queue_coarse_metrics family, then only total messages of <queue>.dlq.
      - job_name: rabbitmq-dlq
        metrics_path: /metrics/detailed
        params:
          family: [queue_coarse_metrics]
        static_configs:
          - targets: [rabbitmq.platform.svc.cluster.local:15692]
        metric_relabel_configs:
          - source_labels: [__name__, queue]
            regex: 'rabbitmq_detailed_queue_messages;.+\.dlq'
            action: keep
      {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.observability.svc.cluster.local:9090
        isDefault: true
      {{- if .Values.tempo.enabled }}
      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://tempo.observability.svc.cluster.local:3200
      {{- end }}
