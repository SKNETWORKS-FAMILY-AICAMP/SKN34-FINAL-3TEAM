# Node placement for every workload in this chart (e.g. a dedicated node group).
scheduling:
  nodeSelector: {}
  tolerations: []

collector:
  image: otel/opentelemetry-collector-contrib:0.164.0
  traces:
    enabled: false
    # EKS values supply the internal Langfuse web endpoint and an existing
    # observability namespace Secret with a precomputed Basic auth header.
    endpoint: ""
    authSecretName: ""
    authSecretKey: AUTHORIZATION
    langfusePodLabels:
      app.kubernetes.io/instance: langfuse
      app.kubernetes.io/component: web
    langfusePort: 3000
  # Trace-path limits (#784). Used only when Tempo or Langfuse export is on. Metrics keep
  # the process-wide 192 MiB limiter; traces are refused earlier, and each trace exporter
  # holds at most queueMiB of spans and gives up after retryMaxElapsed.
  traceLimits:
    memoryLimitMiB: 144
    memorySpikeMiB: 32
    queueMiB: 16
    retryMaxElapsed: 30s
  resources:
    requests: {cpu: 50m, memory: 96Mi}
    limits: {cpu: 250m, memory: 256Mi}
prometheus:
  image: prom/prometheus:v3.15.1
  retention: 1d
  retentionSize: ""
  persistence: {enabled: false, storageClassName: gp3, size: 4Gi}
  # Opt-in per-queue depth for <queue>.dlq only, from RabbitMQ /metrics/detailed (#187).
  rabbitmqDlqMetrics:
    enabled: false
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}
# Opt-in trace storage (#187). Collector sends OTLP traces here; Grafana gets a Tempo datasource.
tempo:
  enabled: false
  image: grafana/tempo:2.10.10
  retention: 24h
  persistence: {enabled: false, storageClassName: gp3, size: 2Gi}
  # #784: 512Mi was OOMKilled while completing blocks under load; GOMEMLIMIT sits below the limit.
  resources:
    requests: {cpu: 50m, memory: 256Mi}
    limits: {cpu: 500m, memory: 1Gi}
  goMemLimit: 800MiB
  ingester:
    maxBlockBytes: 67108864     # 64 MiB (Tempo default 500 MB)
    maxBlockDuration: 5m        # default 30m
    traceIdlePeriod: 5s
  limits:
    rateLimitBytes: 8388608     # 8 MiB/s
    burstSizeBytes: 12582912    # 12 MiB
    maxLiveTraces: 5000
    maxBytesPerTrace: 2097152   # 2 MiB
grafana:
  image: grafana/grafana:13.3.0
  persistence: {enabled: false, storageClassName: gp3, size: 1Gi}
  alerting:
    enabled: false
    discordSecretName: observability-credentials
    discordSecretKey: DISCORD_WEBHOOK_URL
    # Evaluation and notification timing; defaults keep the #185 operating values.
    interval: 1m
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
    rules: []
  # #984: provision dashboards/*.json (expression toxicity verdict ratios). Off keeps the existing render.
  dashboards:
    enabled: false
  adminSecret:
    name: observability-credentials
    userKey: GRAFANA_ADMIN_USER
    passwordKey: GRAFANA_ADMIN_PASSWORD
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 250m, memory: 384Mi}
