# Node placement for every workload in this chart (e.g. a dedicated node group).
scheduling:
  nodeSelector: {}
  tolerations: []

collector:
  image: otel/opentelemetry-collector-contrib:0.164.0
  traces:
    enabled: false
    # EKS values supply the internal Langfuse web endpoint and an existing
    # observability namespace Secret with a precomputed Basic auth header.
    endpoint: ""
    authSecretName: ""
    authSecretKey: AUTHORIZATION
    langfusePodLabels:
      app.kubernetes.io/instance: langfuse
      app.kubernetes.io/component: web
    langfusePort: 3000
  resources:
    requests: {cpu: 50m, memory: 96Mi}
    limits: {cpu: 250m, memory: 256Mi}
prometheus:
  image: prom/prometheus:v3.15.1
  retention: 1d
  retentionSize: ""
  persistence: {enabled: false, storageClassName: gp3, size: 4Gi}
  # Opt-in per-queue depth for <queue>.dlq only, from RabbitMQ /metrics/detailed (#187).
  rabbitmqDlqMetrics:
    enabled: false
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}
grafana:
  image: grafana/grafana:13.3.0
  persistence: {enabled: false, storageClassName: gp3, size: 1Gi}
  alerting:
    enabled: false
    discordSecretName: observability-credentials
    discordSecretKey: DISCORD_WEBHOOK_URL
    # Evaluation and notification timing; defaults keep the #185 operating values.
    interval: 1m
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
    rules: []
  adminSecret:
    name: observability-credentials
    userKey: GRAFANA_ADMIN_USER
    passwordKey: GRAFANA_ADMIN_PASSWORD
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 250m, memory: 384Mi}
