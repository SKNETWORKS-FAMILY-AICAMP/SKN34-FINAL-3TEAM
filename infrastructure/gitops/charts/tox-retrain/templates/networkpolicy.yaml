apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: tox-retrain}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: core-service}
      ports: [{protocol: TCP, port: 8080}]
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: learning-service}
      ports: [{protocol: TCP, port: 8081}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: platform}
          podSelector:
            matchLabels: {app.kubernetes.io/name: minio, app.kubernetes.io/instance: platform-data}
      ports: [{protocol: TCP, port: 9000}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
