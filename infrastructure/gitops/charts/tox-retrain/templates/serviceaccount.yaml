{{- if .Values.serviceAccount.create }}
# 운영 Pod Identity 연결 대상(app/tox-retrain). 토큰은 Pod Identity agent가 projected volume으로 따로 넣는다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels:
    app.kubernetes.io/name: tox-retrain
automountServiceAccountToken: false
{{- end }}
