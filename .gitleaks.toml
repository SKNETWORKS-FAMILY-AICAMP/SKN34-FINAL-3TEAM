title = "Reviewed #185 secret scan exceptions"
[extend]
useDefault = true

[[allowlists]]
targetRules = ["generic-api-key"]
description = "Empty example variable; multiline detector captured the next variable name"
condition = "AND"
regexTarget = "secret"
paths = ['''\.env\.example$''']
regexes = ['''^TOSS_TEST_BILLING_SECRET_KEY=$''']

