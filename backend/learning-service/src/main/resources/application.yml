# 비밀 값은 환경 변수로만 주입, 그 외 기본값은 compose 인프라(localhost) 기준
server:
  port: 8081

spring:
  # Schema changes belong to migration-job; never initialize from application startup.
  flyway:
    enabled: false
  sql:
    init:
      mode: never
  application:
    name: learning-service
  threads:
    virtual:
      # JDK 21: concurrent Kotlin/Jackson cold serialization can pin every carrier.
      # Use Tomcat's bounded platform pool; see docs/report/learning.md 19장.
      enabled: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/learning_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: simple # 재시도 재발행에서 confirm 대기 (core와 같음)
    listener:
      simple:
        acknowledge-mode: manual # RetryingConsumer가 ACK·재발행·reject 결정 (아키텍처 1.6)
        missing-queues-fatal: false # 큐 선언은 definitions.json 담당, 없으면 경고 로그 후 재확인
  mvc:
    problemdetails:
      enabled: true
  task:
    scheduling:
      pool:
        # @Scheduled 작업마다 스레드 하나(고착 판정 탐지·처리 이벤트 정리·미션 초안 생성, #353).
        # 기본값 1이면 초안 생성(ai 대기 최대 70초) 동안 고착 판정 탐지(P12 1분)가 밀림
        size: 3

mybatis:
  mapper-locations: classpath:mybatis/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,rabbit # student.deleted 소비 (#128)

app:
  internal:
    token: ${INTERNAL_TOKEN}
    connect-timeout: 2s
    read-timeout: 35s # [P12] learning→ai 각 35초 (architecture 1.3). core 호출(결제 사용·삭제 완료 보고)도 같은 값
  services:
    core: ${CORE_URL:http://localhost:8080}
    ai: ${AI_URL:http://localhost:8000}
  messaging:
    max-retries: 3 # P12: 1·5·15분 3회. definitions.json의 <큐>.retry.1~3 개수와 일치
    event-retention-days: 90 # processed_event 보존 (#208)
    event-retention-cleanup-interval: 3600000
  judgment:
    stuck-detection-enabled: true # 고착 RUNNING 판정 탐지 (#241)
    stuck-detection-interval: PT1M # [P12] 판정 리스 90초·고착 탐지 1분
  mission-draft:
    enabled: true # LLM 미션 초안 주기 생성 (#353). GENERATING 초안이 없으면 ai를 부르지 않음
    interval: PT10S # 기준안 (learning.md 21절)
    max-attempts: 3 # 기준안, 첫 생성 포함 (P19 확인)
    ai-read-timeout: 70s # 초안 ai 호출만 (P12 예외): ai LLM 60초 1회·마감 63초, 생성 리스 90초 안
  assets:
    # 테마 그림·영상·테마 미션 장면의 S3 키 → 단기 presigned URL (#438). 버킷이 비면 키 값은 URL로 바꾸지 않고 null.
    # ai가 theme-drafts/에 쓰는 버킷과 같아야 함. 자격 증명은 AWS 기본 체인(로컬 AWS_ACCESS_KEY_ID·AWS_SECRET_ACCESS_KEY, EKS Pod Identity)
    bucket: ${ASSET_S3_BUCKET:}
    region: ${S3_REGION:ap-northeast-2}
    public-endpoint: ${S3_PUBLIC_ENDPOINT_URL:} # 로컬 MinIO처럼 브라우저가 여는 주소로 서명할 때만(경로 방식), 비면 AWS S3
    url-ttl: PT1H # 기준안. 학생이 테마 화면·영상을 보는 동안 열려 있어야 함(1초~1시간)
