# 비밀 값은 환경 변수로만 주입, 그 외 기본값은 compose 인프라(localhost) 기준
server:
  port: 8081

spring:
  # Schema changes belong to migration-job; never initialize from application startup.
  flyway:
    enabled: false
  sql:
    init:
      mode: never
  application:
    name: learning-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/learning_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: simple # 재시도 재발행에서 confirm 대기 (core와 같음)
    listener:
      simple:
        acknowledge-mode: manual # RetryingConsumer가 ACK·재발행·reject 결정 (아키텍처 1.6)
        missing-queues-fatal: false # 큐 선언은 definitions.json 담당, 없으면 경고 로그 후 재확인
  mvc:
    problemdetails:
      enabled: true

mybatis:
  mapper-locations: classpath:mybatis/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,rabbit # student.deleted 소비 (#128)

app:
  internal:
    token: ${INTERNAL_TOKEN}
    connect-timeout: 2s
    read-timeout: 35s # [P12] learning→ai 각 35초 (architecture 1.3). core 호출(결제 사용·삭제 완료 보고)도 같은 값
  services:
    core: ${CORE_URL:http://localhost:8080}
    ai: ${AI_URL:http://localhost:8000}
  messaging:
    max-retries: 3 # P12: 1·5·15분 3회. definitions.json의 <큐>.retry.1~3 개수와 일치
