# Tests drive retry workers explicitly; cached Spring contexts must not consume other test fixtures.
app.conversation.retry.enabled=false
# Tests send app.internal.token for every caller; the path allowlist is still InternalCallerPolicy.
app.internal.callers.ai=${app.internal.token}
app.internal.callers.scoring=${app.internal.token}
app.internal.callers.learning=${app.internal.token}
app.internal.callers.report-worker=${app.internal.token}
app.internal.callers.ops=${app.internal.token}
