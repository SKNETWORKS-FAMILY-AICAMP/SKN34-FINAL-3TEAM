# 비밀 값은 환경 변수로만 주입, 그 외 기본값은 compose 인프라(localhost) 기준
server:
  port: 8080
  # 직전 연결이 사설 대역(ALB·ingress)일 때만 X-Forwarded-For를 오른쪽부터 해석 (Tomcat RemoteIpValve, architecture 4.3)
  forward-headers-strategy: native

spring:
  # Schema changes belong to migration-job; never initialize from application startup.
  flyway:
    enabled: false
  sql:
    init:
      mode: never
  application:
    name: core-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/core_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 2s
      timeout: 2s
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: simple # OutboxRelay·재시도 재발행에서 confirm 대기
    listener:
      simple:
        acknowledge-mode: manual # RetryingConsumer가 ACK·재발행·reject 결정
        missing-queues-fatal: false # 큐 선언은 definitions.json 담당, 없으면 경고 로그 후 재확인
  mvc:
    problemdetails:
      enabled: true

mybatis:
  mapper-locations: classpath:mybatis/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,rabbit

app:
  report:
    recovery:
      interval: ${REPORT_RECOVERY_INTERVAL:PT1M}
      stale-after: ${REPORT_RECOVERY_STALE_AFTER:PT4H}
  payment:
    free-product-id: ${PAYMENT_FREE_PRODUCT_ID:}
    toss-secret: ${TOSS_TEST_SECRET_KEY:}
    toss-widget-secret: ${TOSSPAYMENTS_SECRET_KEY:}
    toss-billing-secret: ${TOSS_TEST_BILLING_SECRET_KEY:}
    toss-mid: ${TOSS_TEST_MID:}
    toss-billing-mid: ${TOSS_TEST_BILLING_MID:}
    toss-base-url: ${TOSS_API_BASE_URL:https://api.tosspayments.com}
    webhook-security-key: ${TOSS_TEST_WEBHOOK_SECURITY_KEY:}
    billing-webhook-security-key: ${TOSS_TEST_BILLING_WEBHOOK_SECURITY_KEY:}
    billing-encryption-key: ${PAYMENT_BILLING_ENCRYPTION_KEY:}
  student-device:
    ttl: ${STUDENT_DEVICE_TTL:90d}
    attempt-limit: ${STUDENT_DEVICE_ATTEMPT_LIMIT:20}
  auth:
    jwt-secret: ${AUTH_JWT_SECRET:}
    web-origin: ${AUTH_WEB_ORIGIN:http://localhost:5173}
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
    access-ttl: ${AUTH_ACCESS_TTL:15m}
    student-access-ttl: ${AUTH_STUDENT_ACCESS_TTL:15m}
    reauth-ttl: ${AUTH_REAUTH_TTL:5m}
    refresh-ttl: ${AUTH_REFRESH_TTL:7d}
    google-client-id: ${GOOGLE_CLIENT_ID:}
    google-client-secret: ${GOOGLE_CLIENT_SECRET:}
    new-account-demo: ${AUTH_NEW_ACCOUNT_DEMO:false}
    signup-limit-per-ip: ${AUTH_SIGNUP_LIMIT_PER_IP:5}
    signup-limit-window: ${AUTH_SIGNUP_LIMIT_WINDOW:10m}
  internal:
    token: ${INTERNAL_TOKEN} # 자기 토큰 (보내는 쪽)
    callers: # 받는 쪽 허용 호출자 토큰, 경로 허용 목록은 InternalCallerPolicy (architecture 2.2)
      ai: ${INTERNAL_TOKEN_AI:}
      scoring: ${INTERNAL_TOKEN_SCORING:}
      learning: ${INTERNAL_TOKEN_LEARNING:}
      report-worker: ${INTERNAL_TOKEN_REPORT_WORKER:}
    connect-timeout: 2s
    read-timeout: 30s # 내부 호출 기본값 (P12 목록 밖). 용도별 값은 호출 측 지정 (architecture 1.3)
  services:
    scoring: ${SCORING_URL:http://localhost:8001}
    learning: ${LEARNING_URL:http://localhost:8081}
    ai: ${AI_URL:http://localhost:8000}
    report: ${REPORT_URL:http://localhost:8002}
  messaging:
    max-retries: 3 # P12: 1·5·15분 3회. definitions.json의 <큐>.retry.1~3 개수와 일치
    outbox-relay-interval: 1s
    event-retention-days: 90 # 발행 완료 outbox_event·processed_event·event_log 보존 (#208)
    event-retention-cleanup-interval: 3600000
  # 모델별 100만 토큰당 USD 단가 (기획서 3.9, #651). 미등록 모델은 cost_usd NULL(unpricedCalls로 셈)
  # 출처 OpenAI API pricing Standard 등급·입력 272K 이하, 2026-11-16 확인(core-gateway 29절)
  # 키는 "[모델명]" 형태로 작성('.'·'-'가 있어도 키 한 개로 읽힘). 환경 변수 이름으로는 이 키를
  # 표현할 수 없어 덮어쓰기는 SPRING_APPLICATION_JSON(모델 키 단위로 합쳐짐)으로 함
  # 캐시 입력 단가는 사용량 기록에 캐시 토큰 칸이 없어 넣지 않음. Veo는 초 단위 과금이라 미등록
  llm-pricing:
    "[gpt-6-luna]": {input: 0.10, output: 0.50} # 기본 모델(판정·되묻기·분석·리포트 서술·미션 초안·테마 생성)
    "[gpt-6.1-terra]": {input: 1.00, output: 5.00} # 테마 초안 검토 모델(#437)
    "[text-embedding-3-small]": {input: 0.02, output: 0} # 출력 없음
    "[gpt-image-2.6-sunburst]": {input: 8.00, output: 30.00} # 이미지 토큰 단가. 글·이미지 토큰 구분이 없어 근사치
