# 비밀 값은 환경 변수로만 주입, 그 외 기본값은 compose 인프라(localhost) 기준
server:
  port: 8080

spring:
  # Schema changes belong to migration-job; never initialize from application startup.
  flyway:
    enabled: false
  sql:
    init:
      mode: never
  application:
    name: core-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/core_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: simple # OutboxRelay·재시도 재발행에서 confirm 대기
    listener:
      simple:
        acknowledge-mode: manual # RetryingConsumer가 ACK·재발행·reject 결정
        missing-queues-fatal: false # 큐 선언은 definitions.json 담당, 없으면 경고 로그 후 재확인
  mvc:
    problemdetails:
      enabled: true

mybatis:
  mapper-locations: classpath:mybatis/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,rabbit

app:
  auth:
    jwt-secret: ${AUTH_JWT_SECRET:}
    web-origin: ${AUTH_WEB_ORIGIN:http://localhost:5173}
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
    access-ttl: ${AUTH_ACCESS_TTL:15m}
    student-access-ttl: ${AUTH_STUDENT_ACCESS_TTL:15m}
    refresh-ttl: ${AUTH_REFRESH_TTL:7d}
    google-client-id: ${GOOGLE_CLIENT_ID:}
    google-client-secret: ${GOOGLE_CLIENT_SECRET:}
  internal:
    token: ${INTERNAL_TOKEN}
    connect-timeout: 2s
    read-timeout: 30s # [P12] 확정 전 임시값
  services:
    learning: ${LEARNING_URL:http://localhost:8081}
    ai: ${AI_URL:http://localhost:8000}
    report: ${REPORT_URL:http://localhost:8002}
  messaging:
    max-retries: 3 # P12: 1·5·15분 3회. definitions.json의 <큐>.retry.1~3 개수와 일치
    outbox-relay-interval: 1s
  # 모델별 100만 토큰당 USD 단가 (기획서 3.9). 미등록 모델은 cost_usd NULL
  # 모델명에 '.'이 있으면 키를 "[모델명]" 형태로 작성
  llm-pricing: {}
