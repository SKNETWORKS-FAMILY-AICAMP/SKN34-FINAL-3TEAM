[project]
name = "ai-service"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aio-pika>=10.2.0",
    "anthropic>=2.3.0",
    "boto3>=1.40",
    "fastapi>=0.162.0",
    "google-auth[requests]>=2.40",
    "httpx>=0.28.1",
    "imageio-ffmpeg>=0.6",
    "langfuse>=4.18.0,<5",
    "langgraph>=1.0",
    "openai>=3.37.0",
    "opentelemetry-exporter-otlp-proto-http>=1.38.0,<2",
    "pydantic-settings>=2.16.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
