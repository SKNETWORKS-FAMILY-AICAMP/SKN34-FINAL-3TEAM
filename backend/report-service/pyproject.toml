[project]
name = "report-service"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aio-pika>=10.2.0",
    "alembic>=1.20.1",
    "boto3>=1.43.119",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "playwright>=1.64.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "moto[s3]>=5.2.4",
    "pypdf>=6.21.2",
    "jsonschema==4.26.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "testcontainers>=4.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
