openapi: 3.1.0
info:
  title: ai 내부 API
  version: 1.0.0
  description: learning·core·report가 호출하는 ai-service 내부 API (api-spec 4.2). 구현된 경로만 담는다. 단 x-implementation-status가 붙은 경로·칸은 계약만 먼저 정한 구현 전 항목이다(#464). 스키마는 FastAPI(pydantic) 생성 결과에서 옮겼고 필드 이름은
    camelCase 별칭이다. 헬스 체크(/health/*)는 제외한다.
servers:
- url: /internal
security:
- InternalToken: []
paths:
  /analysis/report-template:
    post:
      operationId: proposeReportTemplate
      summary: 학부모 리포트 설정 변경안 제안
      description: 내부 토큰과 PARENT 역할·사용자 ID 필요. core가 연결·동의·이용권·한도 검사. 공개 설정 변경 불가.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateProposalRequest'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateProposal'
        '400':
          description: VALIDATION_FAILED (`errors[]`에 필드별 사유)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: UNAUTHENTICATED (내부 토큰 불일치)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: FORBIDDEN (PARENT 컨텍스트 아님)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: AI_UNAVAILABLE (LLM 미설정·호출 실패) 또는 AI_PROMPT_VERSION_UNAVAILABLE (미보유 활성 본문). `retryable` 포함
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - type: object
                  required:
                  - retryable
                  properties:
                    retryable:
                      type: boolean
  /judgments:
    post:
      summary: 판정 근거 추출·원문 대조·요소 판정 (api-spec 4.2)
      operationId: judge
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JudgmentRequest'
        required: true
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JudgmentResponse'
        '400':
          description: VALIDATION_FAILED (`errors[]`에 필드별 사유)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: UNAUTHENTICATED (내부 토큰 불일치)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: AI_UNAVAILABLE (LLM 미설정·호출 실패) 또는 AI_PROMPT_VERSION_UNAVAILABLE (미보유 활성 본문). `retryable` 포함. scoring 실패는 503이 아니라 200 `modelScores.skipped` (#305)
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - type: object
                  required:
                  - retryable
                  properties:
                    retryable:
                      type: boolean
  /followups:
    post:
      summary: 되묻기 생성·유출 검사 (api-spec 4.2). 재생성 실패 시 question 없이 leakCheck.passed=false
      operationId: create_followup
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FollowupRequest'
        required: true
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowupResponse'
        '400':
          description: VALIDATION_FAILED (`errors[]`에 필드별 사유)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: UNAUTHENTICATED (내부 토큰 불일치)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: AI_UNAVAILABLE (LLM 미설정·호출 실패) 또는 AI_PROMPT_VERSION_UNAVAILABLE (미보유 활성 본문). `retryable` 포함
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - type: object
                  required:
                  - retryable
                  properties:
                    retryable:
                      type: boolean
  /analysis/stream:
    post:
      summary: 분석 대화 (api-spec 3.3·4.2). 질문 분류·범위 확인 → learning 기록 조회 → 코드 계산 → 답변 → 숫자·인용 대조, 실패 시 규칙 응답(TEMPLATE)
      operationId: analysis_stream
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalysisRequest'
      responses:
        '200':
          description: text/event-stream. `status`(진행 상황, 여러 번) 뒤에 셋 중 하나로 끝난다. `result`(AnalysisResult) 다음 `done`({}), `clarification`(AnalysisClarification, 범위 확인 후 종료), `error`(AnalysisStreamError, 기록 조회 실패 등). 답변을 만들 때는 그 사이에 `delta`({text}, LLM 답변 조각, 대조 전 임시 표시)를 보낸다. 대조 실패·LLM 장애면 delta를 폐기하고 result는 TEMPLATE이다. result의 messageId·scope.changed는 core가 붙인다.
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          description: VALIDATION_FAILED (`errors[]`에 필드별 사유)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: UNAUTHENTICATED (내부 토큰 불일치)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: FORBIDDEN (scope.studentId가 X-Student-Scope 밖, 스트림 시작 전)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: AI_PROMPT_VERSION_UNAVAILABLE (미보유 활성 본문, 스트림 시작 전). `retryable` 포함
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /report-narratives:
    post:
      summary: 리포트 서술·저녁 질문 생성 (api-spec 4.2·4.2.1). citedQuotes는 입력 quotes 원문의 부분 구절만, 숫자·인용 대조와 템플릿 전환은 report
      operationId: create_report_narrative
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NarrativeRequest'
        required: true
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NarrativeResponse'
        '400':
          description: VALIDATION_FAILED (`errors[]`에 필드별 사유)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: UNAUTHENTICATED (내부 토큰 불일치)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: AI_UNAVAILABLE (LLM 미설정·호출 실패·빈 응답) 또는 AI_PROMPT_VERSION_UNAVAILABLE (미보유 활성 본문). `retryable` 포함
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - type: object
                  required:
                  - retryable
                  properties:
                    retryable:
                      type: boolean
  /report-explanations:
    post:
      summary: >-
        리포트 설명 생성 (api-spec 4.2.3, FN-RPT-09, #477). 설명 모델(레지스트리 MODEL report-explanation)이
        explanation/grade-{grade}/{narrative|essay}에 활성이 아니면 {active:false}. 활성이면 가장 높은 항목(잘한 점)·가장 낮은 항목(함께 이야기해 볼 점)
        최대 2개를 설명 전용 sLLM으로 1회씩 생성(사용량 callType REPORT_EXPLANATION)하고, 숫자·금지어 문장을 버린 뒤 학부모 문장 틀로 묶음
      operationId: create_report_explanation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExplanationRequest'
        required: true
      responses:
        '200':
          description: 성공 (활성 설명 또는 {active:false})
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExplanationResponse'
        '400':
          description: VALIDATION_FAILED (학년 3~6 밖, 빈 글, 입력 유형과 맞지 않는 scores 키·범위)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: UNAUTHENTICATED (내부 토큰 불일치)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: AI_EXPLANATION_REJECTED (후처리 뒤 남는 문장이 없거나 검사 실패). `retryable` false. report는 그 설명만 빼고 설명 미포함
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - type: object
                  required:
                  - retryable
                  properties:
                    retryable:
                      type: boolean
        '503':
          description: AI_UNAVAILABLE (설명 sLLM 주소 미설정·호출 실패·마감 초과) 또는 AI_PROMPT_VERSION_UNAVAILABLE. `retryable` 포함
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - type: object
                  required:
                  - retryable
                  properties:
                    retryable:
                      type: boolean
  /versions:
    get:
      summary: '현재 실제 호출에 사용하는 프롬프트 버전 (#68 활성 버전 수신)'
      operationId: versions
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - prompts
                properties:
                  prompts:
                    type: object
                    additionalProperties: false
                    required:
                    - judgment
                    - followup
                    - analysis
                    - reportNarrative
                    - reportTemplate
                    - missionDraft
                    - reportExplanation
                    - themeDraft
                    properties:
                      judgment:
                        type: string
                      followup:
                        type: string
                      analysis:
                        type: string
                      reportNarrative:
                        type: string
                      reportTemplate:
                        type: string
                      missionDraft:
                        type: string
                      reportExplanation:
                        type: string
                      themeDraft:
                        type: string
        '401':
          description: UNAUTHENTICATED (내부 토큰 불일치)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: AI_PROMPT_VERSION_UNAVAILABLE (미보유 활성 본문). `retryable` 포함
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /mission-drafts:
    post:
      summary: '미션 초안 1회 생성·자동 검사 (api-spec 4.2, #354). 검사 실패도 200(checks.passed=false), 반복은 learning'
      operationId: createMissionDraft
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MissionDraftRequest'
        required: true
      responses:
        '200':
          description: 성공 (검사 통과 여부는 checks)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionDraftResponse'
        '400':
          description: VALIDATION_FAILED (`errors[]`에 필드별 사유)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: UNAUTHENTICATED (내부 토큰 불일치)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: AI_BAD_RESPONSE (LLM이 형식에 맞는 초안을 끝내 만들지 못함). `retryable` 포함
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - type: object
                  required:
                  - retryable
                  properties:
                    retryable:
                      type: boolean
        '503':
          description: AI_UNAVAILABLE (LLM 미설정·호출 실패·시간 초과) 또는 AI_PROMPT_VERSION_UNAVAILABLE (미보유 활성 본문). `retryable` 포함
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - type: object
                  required:
                  - retryable
                  properties:
                    retryable:
                      type: boolean
  /theme-drafts:
    post:
      summary: '주간 테마 초안 1회 생성 (api-spec 4.2, #437). 그래프 안에서 실패한 부분만 다시 만들고, 끝내 실패하면 200 + failure. 다시 부르기는 learning'
      operationId: createThemeDraft
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThemeDraftRequest'
        required: true
      responses:
        '200':
          description: 성공 또는 끝내 실패(failure)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThemeDraftResponse'
        '400':
          description: VALIDATION_FAILED (`errors[]`에 필드별 사유)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: UNAUTHENTICATED (내부 토큰 불일치)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: AI_BAD_RESPONSE (LLM이 형식에 맞는 응답을 끝내 만들지 못함). `retryable` 포함
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - type: object
                  required:
                  - retryable
                  properties:
                    retryable:
                      type: boolean
        '503':
          description: AI_UNAVAILABLE (LLM 미설정·호출 실패·마감 15분 초과, 그래프 준비 전에는 retryable false) 또는 AI_PROMPT_VERSION_UNAVAILABLE. `retryable` 포함
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - type: object
                  required:
                  - retryable
                  properties:
                    retryable:
                      type: boolean
  /embeddings:
    post:
      summary: '지식 본문·질의 임베딩 (api-spec 4.2.4, #464 계약 C6, 구현 #467). 순서 보존, 사용량 callType KNOWLEDGE_EMBEDDING(기준안)'
      description: >-
        learning 지식 적재(#466)·관계 후보 스크립트(#468)·ai 검색 클라이언트(#470)가 부른다. 교육과정 지식과 질의 문장만 받고
        학생 정보·학생 답은 받지 않는다. 기준안: 모델 text-embedding-3-small, 1536차원, 한 요청 texts 1~64개, 본문당 1~8,000자.
        모델·차원은 설정값이며 응답에 함께 돌려줘 learning이 다른 차원을 넣지 않게 한다.
      operationId: createEmbeddings
      x-implementation-status: planned-issue-467
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbeddingRequest'
        required: true
      responses:
        '200':
          description: 성공 (vectors는 texts와 같은 순서·같은 개수)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddingResponse'
        '400':
          description: VALIDATION_FAILED (texts 0개·65개 이상, 빈 글·공백만, 8,000자 초과)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: UNAUTHENTICATED (내부 토큰 불일치)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: AI_BAD_RESPONSE (제공자 응답의 벡터 개수·차원이 맞지 않음). `retryable` 포함
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - type: object
                  required:
                  - retryable
                  properties:
                    retryable:
                      type: boolean
        '503':
          description: AI_UNAVAILABLE (임베딩 제공자 미설정·호출 실패·시간 초과). `retryable` 포함
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - type: object
                  required:
                  - retryable
                  properties:
                    retryable:
                      type: boolean
components:
  securitySchemes:
    InternalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
  schemas:
    MissionDraftElementCode:
      description: '초안 요소에 쓸 수 있는 code.


        learning이 FN 1.5 표에서 유형 코드와 입력 방식의 정답 코드를 채움.'
      properties:
        code:
          minLength: 1
          type: string
        label:
          minLength: 1
          type: string
        description:
          default: ''
          type: string
      required:
      - code
      - label
      type: object
    MissionDraftFailure:
      properties:
        check:
          minLength: 1
          type: string
        reason:
          minLength: 1
          type: string
      required:
      - check
      - reason
      type: object
    MissionDraftStandard:
      properties:
        code:
          minLength: 1
          type: string
        statement:
          minLength: 1
          type: string
        level:
          anyOf:
          - $ref: '#/components/schemas/MissionDraftStandardLevel'
          - type: 'null'
          default: null
      required:
      - code
      - statement
      type: object
    MissionDraftStandardLevel:
      description: 성취수준 문장. 평가원 자료 이용 조건 확인 전에는 learning이 보내지 않음 (FN 1.5).
      properties:
        grade:
          minLength: 1
          type: string
        text:
          minLength: 1
          type: string
      required:
      - grade
      - text
      type: object
    MissionDraftRequest:
      properties:
        standards:
          items:
            $ref: '#/components/schemas/MissionDraftStandard'
          minItems: 1
          type: array
        thinkingType:
          enum:
          - ANALYZE
          - EVALUATE
          - CREATE
          - SOLVE
          - REFLECT
          type: string
        elementCodes:
          items:
            $ref: '#/components/schemas/MissionDraftElementCode'
          minItems: 1
          type: array
        gradeMin:
          maximum: 6
          minimum: 3
          type: integer
        gradeMax:
          maximum: 6
          minimum: 3
          type: integer
        inputType:
          enum:
          - CHOICE
          - ORDERING
          - CLASSIFICATION
          - NARRATIVE
          - SOLUTION_STEPS
          - ESSAY
          type: string
        previousFailures:
          items:
            $ref: '#/components/schemas/MissionDraftFailure'
          type: array
        knowledge:
          description: '#464 계약 C7(기준안, 팀 확인 전). learning이 GET /internal/knowledge/standards?codes&grade&thinkingType
            응답을 그대로 넣는다. 조회 실패·근거 없음이면 생략 또는 null이고 ai는 지금과 같은 방식으로 생성한다. 구현 #470'
          x-implementation-status: planned-issue-470
          anyOf:
          - $ref: '#/components/schemas/KnowledgeBundle'
          - type: 'null'
          default: null
      required:
      - standards
      - thinkingType
      - elementCodes
      - gradeMin
      - gradeMax
      - inputType
      type: object
    MissionDraftAnswerKey:
      description: 'learning 관리자 기준표 정답 키와 같은 모양.


