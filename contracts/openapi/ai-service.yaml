openapi: 3.1.0
info:
  title: ai 내부 API
  version: 1.0.0
  description: learning·core가 호출하는 ai-service 내부 API (api-spec 4.2). 구현된 경로만 담는다. 스키마는 FastAPI(pydantic) 생성 결과에서 옮겼고 필드 이름은
    camelCase 별칭이다. 리포트 서술은 구현 시 추가한다. 헬스 체크(/health/*)는 제외한다.
servers:
- url: /internal
security:
- InternalToken: []
paths:
  /judgments:
    post:
      summary: 판정 근거 추출·원문 대조·요소 판정 (api-spec 4.2)
      operationId: judge
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JudgmentRequest'
        required: true
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JudgmentResponse'
        '400':
          description: VALIDATION_FAILED (`errors[]`에 필드별 사유)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: UNAUTHENTICATED (내부 토큰 불일치)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: AI_UNAVAILABLE (`retryable` 포함). LLM 미설정·호출 실패
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - type: object
                  required:
                  - retryable
                  properties:
                    retryable:
                      type: boolean
  /followups:
    post:
      summary: 되묻기 생성·유출 검사 (api-spec 4.2). 재생성 실패 시 question 없이 leakCheck.passed=false
      operationId: create_followup
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FollowupRequest'
        required: true
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowupResponse'
        '400':
          description: VALIDATION_FAILED (`errors[]`에 필드별 사유)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: UNAUTHENTICATED (내부 토큰 불일치)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: AI_UNAVAILABLE (`retryable` 포함). LLM 미설정·호출 실패
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - type: object
                  required:
                  - retryable
                  properties:
                    retryable:
                      type: boolean
  /analysis/stream:
    post:
      summary: 분석 대화 (api-spec 3.3·4.2). 질문 분류·범위 확인 → learning 기록 조회 → 코드 계산 → 답변 → 숫자·인용 대조, 실패 시 규칙 응답(TEMPLATE)
      operationId: analysis_stream
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalysisRequest'
      responses:
        '200':
          description: text/event-stream. `status`(진행 상황, 여러 번) 뒤에 셋 중 하나로 끝난다. `result`(AnalysisResult) 다음 `done`({}), `clarification`(AnalysisClarification, 범위 확인 후 종료), `error`(AnalysisStreamError, 기록 조회 실패 등). `delta`는 보내지 않는다(대조 통과 전 임시 텍스트 미노출). result의 messageId·scope.changed는 core가 붙인다.
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          description: VALIDATION_FAILED (`errors[]`에 필드별 사유)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: UNAUTHENTICATED (내부 토큰 불일치)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: FORBIDDEN (scope.studentId가 X-Student-Scope 밖, 스트림 시작 전)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /versions:
    get:
      summary: '현재 프롬프트 버전 (코드 상수, model.version.activated 수신 교체는 #68)'
      operationId: versions
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - prompts
                properties:
                  prompts:
                    type: object
                    additionalProperties: false
                    required:
                    - judgment
                    - followup
                    properties:
                      judgment:
                        type: string
                      followup:
                        type: string
        '401':
          description: UNAUTHENTICATED (내부 토큰 불일치)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    InternalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
  schemas:
    ElementResult:
      properties:
        elementId:
          type: string
        satisfied:
          type: boolean
      type: object
      required:
      - elementId
      - satisfied
    FollowupRequest:
      properties:
        timeline:
          items:
            $ref: '#/components/schemas/TimelineItem'
          type: array
          minItems: 1
        judgment:
          $ref: '#/components/schemas/JudgmentSummary'
        rubric:
          $ref: '#/components/schemas/FollowupRubric'
        mission:
          $ref: '#/components/schemas/Mission'
        grade:
          type: integer
          maximum: 6.0
          minimum: 3.0
      type: object
      required:
      - timeline
      - judgment
      - rubric
      - mission
      - grade
    FollowupResponse:
      properties:
        type:
          type: string
          enum:
          - ONE_STEP_MORE
          - TELL_MORE
          - LOOK_AGAIN
        question:
          anyOf:
          - type: string
          - type: 'null'
        source:
          type: string
          enum:
          - LLM
          - LLM_RETRY
        leakCheck:
          $ref: '#/components/schemas/LeakCheck'
        versions:
          $ref: '#/components/schemas/LlmVersions'
      type: object
      required:
      - type
      - question
      - source
      - leakCheck
      - versions
    FollowupRubric:
      properties:
        elements:
          items:
            $ref: '#/components/schemas/FollowupRubricElement'
          type: array
          minItems: 1
        answerKey:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
        forbiddenTerms:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
        exampleAnswer:
          anyOf:
          - type: string
          - type: 'null'
      type: object
      required:
      - elements
    FollowupRubricElement:
      properties:
        elementId:
          type: string
        label:
          type: string
        description:
          anyOf:
          - type: string
          - type: 'null'
        goodThought:
          type: boolean
          default: false
      type: object
      required:
      - elementId
      - label
    JudgmentElement:
      properties:
        elementId:
          type: string
        quote:
          anyOf:
          - type: string
          - type: 'null'
        verified:
          type: boolean
        satisfied:
          type: boolean
      type: object
      required:
      - elementId
      - quote
      - verified
      - satisfied
    JudgmentRequest:
      properties:
        answerText:
          type: string
        inputType:
          type: string
          enum:
          - NARRATIVE
          - ESSAY
          - SOLUTION_STEPS
        grade:
          type: integer
          maximum: 6.0
          minimum: 3.0
        rubric:
          $ref: '#/components/schemas/Rubric'
        versions:
          $ref: '#/components/schemas/Versions'
      type: object
      required:
      - answerText
      - inputType
      - grade
      - rubric
    JudgmentResponse:
      properties:
        result:
          type: string
          enum:
          - CORRECT
          - PARTIAL
          - RETHINK
          - HELD
        elements:
          items:
            $ref: '#/components/schemas/JudgmentElement'
          type: array
        heldReason:
          anyOf:
          - type: string
            enum:
            - INSUFFICIENT_EVIDENCE
            - QUOTE_MISMATCH
            - TOO_SHORT
            - UNVERIFIED_SCOPE
          - type: 'null'
        trial:
          type: boolean
        versions:
          $ref: '#/components/schemas/Versions'
      type: object
      required:
      - result
      - elements
      - heldReason
      - trial
      - versions
    JudgmentSummary:
      properties:
        result:
          type: string
          enum:
          - CORRECT
          - PARTIAL
          - RETHINK
          - HELD
        heldReason:
          anyOf:
          - type: string
            enum:
            - INSUFFICIENT_EVIDENCE
            - QUOTE_MISMATCH
            - TOO_SHORT
            - UNVERIFIED_SCOPE
          - type: 'null'
        elements:
          items:
            $ref: '#/components/schemas/ElementResult'
          type: array
      type: object
      required:
      - result
    LeakCheck:
      properties:
        passed:
          type: boolean
      type: object
      required:
      - passed
    LlmVersions:
      properties:
        model:
          type: string
        prompt:
          type: string
      type: object
      required:
      - model
      - prompt
    Mission:
      properties:
        question:
          type: string
        thinkingType:
          type: string
          enum:
          - ANALYZE
          - EVALUATE
          - CREATE
          - SOLVE
          - REFLECT
      type: object
      required:
      - title
      - question
      - thinkingType
    Rubric:
      properties:
        elements:
          items:
            $ref: '#/components/schemas/RubricElement'
          type: array
          minItems: 1
      type: object
      required:
      - elements
    RubricElement:
      properties:
        elementId:
          type: string
        label:
          type: string
        description:
          anyOf:
          - type: string
          - type: 'null'
        points:
          type: integer
          minimum: 0.0
        judgeVerified:
          type: boolean
        goodThought:
          type: boolean
          default: false
        commonErrors:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
      type: object
      required:
      - elementId
      - label
      - points
      - judgeVerified
    TimelineItem:
      properties:
        kind:
          type: string
          enum:
          - ANSWER
          - FOLLOWUP
        text:
          type: string
      type: object
      required:
      - kind
      - text
      description: 현재 학습 시도의 제출 답변·되묻기 질문 (순서대로, 다른 시도 제외).
    Versions:
      properties:
        mission:
          anyOf:
          - type: string
          - type: 'null'
        rubric:
          anyOf:
          - type: string
          - type: 'null'
        model:
          anyOf:
          - type: string
          - type: 'null'
        prompt:
          anyOf:
          - type: string
          - type: 'null'
      type: object
    AnalysisClarification:
      description: 범위 확인 요청. 보낸 뒤 스트림 종료, 사용자 선택을 scope에 담아 다시 질문 (API 3.3).
      properties:
        reason:
          enum:
          - OTHER_CHILD
          - DIFFERENT_PERIOD
          - UNCLEAR
          type: string
        message:
          type: string
        current:
          $ref: '#/components/schemas/AnalysisResultScope'
      required:
      - reason
      - message
      - current
      type: object
    AnalysisEvidence:
      properties:
        attemptId:
          type: string
        missionTitle:
          type: string
        answerId:
          anyOf:
          - type: string
          - type: 'null'
        answerVersion:
          anyOf:
          - type: integer
          - type: 'null'
        submittedAt:
          anyOf:
          - type: string
          - type: 'null'
        quote:
          type: string
        available:
          default: true
          type: boolean
      required:
      - attemptId
      - missionTitle
      - answerId
      - answerVersion
      - submittedAt
      - quote
      type: object
    AnalysisFallback:
      properties:
        reason:
          enum:
          - VERIFICATION_FAILED
          - AI_UNAVAILABLE
          type: string
      required:
      - reason
      type: object
    AnalysisLlmVersions:
      properties:
        model:
          anyOf:
          - type: string
          - type: 'null'
        prompt:
          type: string
      required:
      - model
      - prompt
      type: object
    AnalysisMetric:
      properties:
        label:
          type: string
        value:
          anyOf:
          - type: number
          - type: 'null'
        count:
          type: integer
        numerator:
          anyOf:
          - type: integer
          - type: 'null'
        denominator:
          anyOf:
          - type: integer
          - type: 'null'
        formula:
          type: string
        period:
          $ref: '#/components/schemas/AnalysisPeriod'
        sourceType:
          const: RECORD
          default: RECORD
          type: string
        state:
          enum:
          - OK
          - NO_RECORD
          - INSUFFICIENT_SAMPLE
          - PROCESSING
          - FAILED
          type: string
      required:
      - label
      - value
      - count
      - numerator
      - denominator
      - formula
      - period
      - state
      type: object
    AnalysisPeriod:
      properties:
        from:
          format: date
          type: string
        to:
          format: date
          type: string
      required:
      - from
      - to
      type: object
    AnalysisRequest:
      properties:
        conversationId:
          type: string
        question:
          maxLength: 1000
          minLength: 1
          type: string
        scope:
          $ref: '#/components/schemas/AnalysisScope'
        history:
          items:
            $ref: '#/components/schemas/AnalysisTurn'
          maxItems: 20
          type: array
      required:
      - conversationId
      - question
      - scope
      type: object
    AnalysisResult:
      properties:
        answer:
          type: string
        source:
          enum:
          - LLM
          - TEMPLATE
          type: string
        fallback:
          anyOf:
          - $ref: '#/components/schemas/AnalysisFallback'
          - type: 'null'
        scope:
          $ref: '#/components/schemas/AnalysisResultScope'
        metrics:
          items:
            $ref: '#/components/schemas/AnalysisMetric'
          type: array
        evidence:
          items:
            $ref: '#/components/schemas/AnalysisEvidence'
          type: array
        verification:
          anyOf:
          - $ref: '#/components/schemas/AnalysisVerification'
          - type: 'null'
        recordCount:
          type: integer
        versions:
          $ref: '#/components/schemas/AnalysisLlmVersions'
      required:
      - answer
      - source
      - fallback
      - scope
      - metrics
      - evidence
      - verification
      - recordCount
      - versions
      type: object
    AnalysisResultScope:
      properties:
        childId:
          type: string
        from:
          format: date
          type: string
        to:
          format: date
          type: string
      required:
      - childId
      - from
      - to
      type: object
    AnalysisScope:
      description: core가 권한·범위를 확인해 넘긴 자녀·기간. 그래프는 이 값만 조회에 씀 (FN-AGT-03).
      properties:
        studentId:
          minLength: 1
          type: string
        from:
          format: date
          type: string
        to:
          format: date
          type: string
      required:
      - studentId
      - from
      - to
      type: object
    AnalysisStreamError:
      properties:
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
      required:
      - code
      - message
      - retryable
      type: object
    AnalysisTurn:
      description: 같은 대화의 이전 질문·답변. 맥락 파악에만 쓰고 이전 범위의 기록은 섞지 않음 (FN-AGT-08).
      properties:
        role:
          enum:
          - USER
          - ASSISTANT
          type: string
        text:
          type: string
      required:
      - role
      - text
      type: object
    AnalysisVerification:
      properties:
        numbersMatched:
          type: boolean
        quotesMatched:
          type: boolean
        contentAllowed:
          type: boolean
      required:
      - numbersMatched
      - quotesMatched
      - contentAllowed
      type: object
    Problem:
      type: object
      required:
      - type
      - title
      - status
      - code
      - instance
      - traceId
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        instance:
          type: string
        traceId:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              reason:
                type: string
