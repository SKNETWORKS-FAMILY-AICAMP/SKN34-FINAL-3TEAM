              count: {type: integer, minimum: 1, maximum: 20}
              size: {type: number, minimum: 1, maximum: 6, description: 그림 너비 %}
              direction: {type: integer, minimum: 0, maximum: 359, description: 도}
              speed: {type: number, minimum: 2, maximum: 20, description: 초당 그림 높이 %}
