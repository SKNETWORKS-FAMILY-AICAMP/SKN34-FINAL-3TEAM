    KnowledgeContent:
      type: object
      additionalProperties: false
      required: [id, domainId, category, group, text, ref]
      properties:
        id: {type: string}
        domainId: {type: string}
        category: {type: string, enum: [K, P, V]}
        group: {type: [string, 'null']}
        text: {type: string}
        ref: {$ref: '#/components/schemas/KnowledgeRef'}
    KnowledgeFit:
      type: object
      additionalProperties: false
      required: [thinkingType, reason]
      properties:
        thinkingType: {$ref: '#/components/schemas/KnowledgeThinkingType'}
        reason: {type: string}
    KnowledgeStandardBundle:
      type: object
      additionalProperties: false
      required: [standard, domain, covers, fits, gradeMatch]
      properties:
        standard: {$ref: '#/components/schemas/KnowledgeStandard'}
        domain:
          anyOf:
            - $ref: '#/components/schemas/KnowledgeDomain'
            - type: 'null'
        covers: {type: array, items: {$ref: '#/components/schemas/KnowledgeContent'}}
        fits: {type: array, items: {$ref: '#/components/schemas/KnowledgeFit'}}
        gradeMatch: {type: [boolean, 'null']}
    KnowledgeSubjectGuide:
      type: object
      additionalProperties: false
      required: [subject, teaching, assessment, ref]
      properties:
        subject: {$ref: '#/components/schemas/KnowledgeSubject'}
        teaching: {type: array, items: {type: string}}
        assessment: {type: array, items: {type: string}}
        ref: {$ref: '#/components/schemas/KnowledgeRef'}
    KnowledgeThinkingTypeGuide:
      description: 팀이 우리 말로 쓴 출제 지침과 출처 표기(블룸 원서·VALUE 루브릭 문장 없음)
      type: object
      additionalProperties: false
      required: [type, name, basis, elements, questionMust, questionMustNot, ref]
      properties:
        type: {$ref: '#/components/schemas/KnowledgeThinkingType'}
        name: {type: string}
        basis:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [framework, attribution]
            properties:
              framework: {type: string}
              attribution: {type: string}
        elements:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code, label, description]
            properties:
              code: {type: string}
              label: {type: string}
              description: {type: string}
        questionMust: {type: array, items: {type: string}}
        questionMustNot: {type: array, items: {type: string}}
        ref: {$ref: '#/components/schemas/KnowledgeRef'}
    KnowledgeBundle:
      description: GET /internal/knowledge/standards 응답. C7 미션 초안 요청 knowledge 칸에 그대로 담는다
      type: object
      additionalProperties: false
      required: [datasetVersion, items, missingCodes, subjectGuides, thinkingType, reason]
      properties:
        datasetVersion: {type: [string, 'null']}
        items: {type: array, items: {$ref: '#/components/schemas/KnowledgeStandardBundle'}}
        missingCodes: {type: array, items: {type: string}}
        subjectGuides: {type: array, items: {$ref: '#/components/schemas/KnowledgeSubjectGuide'}}
        thinkingType:
          anyOf:
            - $ref: '#/components/schemas/KnowledgeThinkingTypeGuide'
            - type: 'null'
        reason:
          anyOf:
            - $ref: '#/components/schemas/KnowledgeFallbackReason'
            - type: 'null'
