openapi: 3.1.0
info:
  title: scoring 내부 API
  version: 1.0.0
  description: 실제 로딩된 버전 조회(#85), M2 채점(#87), 미학습 M1 비활성 계약(#88).
servers:
- url: /internal
security:
- InternalToken: []
paths:
  /versions:
    get:
      summary: 실제 로딩 완료한 모델 name·version·revision (name 순 정렬)
      operationId: versions
      responses:
        '200':
          description: 성공. 활성 모델이 없으면 items=[]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionsResponse'
        '401':
          description: UNAUTHENTICATED (내부 토큰 누락·불일치)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /m2/scores:
    post:
      summary: Score
      operationId: score_internal_m2_scores_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/M2Request'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/M2Active'
                - $ref: '#/components/schemas/M2Inactive'
                title: Response Score Internal M2 Scores Post
        '400': &id001
          description: 요청 형식·입력 길이 오류
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401': &id002
          description: 내부 인증 실패
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: 'SCORING_UNAVAILABLE: 추론 장애·처리 용량 초과'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /m1/checks:
    post:
      summary: Check
      operationId: check_internal_m1_checks_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/M1Request'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/M1Inactive'
        '400': *id001
        '401': *id002
components:
  securitySchemes:
    InternalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
  schemas:
    ModelVersionSummary:
      properties:
        name:
          type: string
          title: Name
        version:
          type: string
          title: Version
        revision:
          type: integer
          minimum: 1.0
          title: Revision
      type: object
      required:
      - name
      - version
      - revision
      title: ModelVersionSummary
    VersionsResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/ModelVersionSummary'
          type: array
          title: Items
      type: object
      required:
      - items
      title: VersionsResponse
    Problem:
      type: object
      required:
      - type
      - title
      - status
      - code
      - instance
      - traceId
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        instance:
          type: string
        traceId:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              reason:
                type: string
    M2Active:
      properties:
        active:
          type: boolean
          const: true
          title: Active
          default: true
        inputType:
          type: string
          enum:
          - NARRATIVE
          - ESSAY
          title: Inputtype
        scores:
          $ref: '#/components/schemas/Scores'
        rawScores:
          $ref: '#/components/schemas/RawScores'
        model:
          $ref: '#/components/schemas/ModelIdentity'
      type: object
      required:
      - inputType
      - scores
      - rawScores
      - model
      title: M2Active
    M2Inactive:
      properties:
        active:
          type: boolean
          const: false
          title: Active
          default: false
      type: object
      title: M2Inactive
    M2Request:
      properties:
        prompt:
          type: string
          maxLength: 10000
          minLength: 1
          title: Prompt
        text:
          type: string
          maxLength: 50000
          minLength: 1
          pattern: \S
          title: Text
        grade:
          type: integer
          maximum: 6.0
          minimum: 3.0
          title: Grade
        inputType:
          type: string
          enum:
          - NARRATIVE
          - ESSAY
          title: Inputtype
        keywords:
          items:
            type: string
            maxLength: 200
            minLength: 1
          type: array
          maxItems: 100
          title: Keywords
      additionalProperties: false
      type: object
      required:
      - prompt
      - text
      - grade
      - inputType
      title: M2Request
    ModelIdentity:
      properties:
        name:
          type: string
          title: Name
        version:
          type: string
          title: Version
        revision:
          type: integer
          minimum: 1.0
          title: Revision
      type: object
      required:
      - name
      - version
      - revision
      title: ModelIdentity
    RawScores:
      properties:
        hol:
          type: number
          title: Hol
        task_1:
          type: number
          title: Task 1
        content_1:
          type: number
          title: Content 1
        content_2:
          type: number
          title: Content 2
        content_3:
          type: number
          title: Content 3
        organization_1:
          type: number
          title: Organization 1
        organization_2:
          type: number
          title: Organization 2
        expression_1:
          type: number
          title: Expression 1
        expression_2:
          type: number
          title: Expression 2
      type: object
      required:
      - hol
      - task_1
      - content_1
      - content_2
      - content_3
      - organization_1
      - organization_2
      - expression_1
      - expression_2
      title: RawScores
    Scores:
      properties:
        hol:
          type: integer
          maximum: 4.0
          minimum: 1.0
          title: Hol
        task_1:
          type: integer
          maximum: 5.0
          minimum: 1.0
          title: Task 1
        content_1:
          type: integer
          maximum: 5.0
          minimum: 1.0
          title: Content 1
        content_2:
          type: integer
          maximum: 5.0
          minimum: 1.0
          title: Content 2
        content_3:
          type: integer
          maximum: 5.0
          minimum: 1.0
          title: Content 3
        organization_1:
          type: integer
          maximum: 5.0
          minimum: 1.0
          title: Organization 1
        organization_2:
          type: integer
          maximum: 5.0
          minimum: 1.0
          title: Organization 2
        expression_1:
          type: integer
          maximum: 5.0
          minimum: 1.0
          title: Expression 1
        expression_2:
          type: integer
          maximum: 5.0
          minimum: 1.0
          title: Expression 2
      type: object
      required:
      - hol
      - task_1
      - content_1
      - content_2
      - content_3
      - organization_1
      - organization_2
      - expression_1
      - expression_2
      title: Scores
    M1Request:
      properties:
        problem:
          type: string
          pattern: \S
          title: Problem
        answerKey:
          type: string
          pattern: \S
          title: Answerkey
        solution:
          $ref: '#/components/schemas/StudentSolution'
      additionalProperties: false
      type: object
      required:
      - problem
      - answerKey
      - solution
      title: M1Request
    M1Inactive:
      properties:
        active:
          type: boolean
          const: false
          title: Active
          default: false
      type: object
      title: M1Inactive
    StudentSolution:
      properties:
        steps:
          items:
            type: string
          type: array
          minItems: 1
          title: Steps
        finalAnswer:
          type: string
          pattern: \S
          title: Finalanswer
      additionalProperties: false
      type: object
      required:
      - steps
      - finalAnswer
      title: StudentSolution
