openapi: 3.1.0
info:
  title: scoring 내부 API
  version: 1.0.0
  description: 실제 모델 버전 조회, 서술 3.0·논술 3.1 정수/원점수 채점(#228), M1 비활성 계약.
servers:
- url: /internal
security:
- InternalToken: []
paths:
  /models/preflight:
    post:
      summary: 내부 모델 파일·형식 사전 검사
      description: 등록·품질 승인·활성화를 수행하지 않는다. 가중치 본문은 읽지 않으며 S3 전체 SHA-256이 없거나 COMPOSITE이면
        CHECKSUM_UNAVAILABLE. 작은 JSON 3개만 최대 1MiB씩 읽는다. core 제한 20초, scoring 작업 예산 15초.
        파일 검사 실패도 200의 FAIL이며 core 감사 result=FAILURE로 저장한다.
      operationId: preflightInternalModel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelPreflightRequest'
      responses:
        '200':
          description: 파일·형식 검사 결과. 품질 승인 아님
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelPreflightResult'
        '400':
          description: VALIDATION_FAILED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: UNAUTHENTICATED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /versions:
    get:
      summary: 실제 로딩 완료한 모델 name·version·revision (name 순 정렬)
      operationId: versions
      responses:
        '200':
          description: 성공. 활성 모델이 없으면 items=[]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionsResponse'
        '401':
          description: UNAUTHENTICATED (내부 토큰 누락·불일치)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /m2/scores:
    post:
      summary: Score
      operationId: score_internal_m2_scores_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/M2Request'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/M2Active'
                - $ref: '#/components/schemas/M2Inactive'
                - $ref: '#/components/schemas/M2Skipped'
                title: Response Score Internal M2 Scores Post
        '400': &id001
          description: 요청 형식·입력 길이 오류
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401': &id002
          description: 내부 인증 실패
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: 'SCORING_UNAVAILABLE: 추론 장애·처리 용량 초과'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /m1/checks:
    post:
      summary: Check
      operationId: check_internal_m1_checks_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/M1Request'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/M1Inactive'
        '400': *id001
        '401': *id002
components:
  securitySchemes:
    InternalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
  schemas:
    ModelPreflightArtifact:
      type: object
      additionalProperties: false
      required:
      - file
      - bytes
      - sha256
      properties:
        file:
          type: string
          enum:
          - config.json
          - tokenizer.json
          - tokenizer_config.json
          - train_info.json
          - score_cuts.json
          - model.safetensors
        bytes:
          type: integer
          minimum: 0
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
    ModelPreflightRequest:
      type: object
      additionalProperties: false
      required:
      - name
      - version
      - artifactUri
      - files
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        version:
          type: string
          minLength: 1
          maxLength: 100
        artifactUri:
          type: string
          minLength: 1
          maxLength: 2048
        files:
          type: array
          minItems: 6
          maxItems: 6
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ModelPreflightArtifact'
          description: 여섯 파일명을 각각 한 번씩 포함한다.
    ModelPreflightResult:
      type: object
      additionalProperties: false
      required:
      - status
      - code
      - files
      properties:
        status:
          type: string
          enum:
          - PASS
          - FAIL
        code:
          type: string
          enum:
          - FILES_AND_METADATA_VERIFIED
          - INVALID_ARTIFACT_URI
          - UNSUPPORTED_MODEL
          - PREFLIGHT_TIMEOUT
          - FILE_CHECK_FAILED
          - OUTPUT_MISMATCH
          - INVALID_METADATA
        files:
          type: array
          maxItems: 6
          items:
            type: object
            additionalProperties: false
            required:
            - file
            - status
            - code
            properties:
              file:
                type: string
                enum:
                - config.json
                - tokenizer.json
                - tokenizer_config.json
                - train_info.json
                - score_cuts.json
                - model.safetensors
              status:
                type: string
                enum:
                - PASS
                - FAIL
              code:
                type: string
                enum:
                - OK
                - SIZE_MISMATCH
                - JSON_TOO_LARGE
                - HASH_MISMATCH
                - INVALID_METADATA
                - CHECKSUM_UNAVAILABLE
                - FILE_MISSING
                - ACCESS_DENIED
                - OBJECT_CHANGED
                - STORAGE_UNAVAILABLE
    ModelVersionSummary:
      properties:
        name:
          type: string
          title: Name
        version:
          type: string
          title: Version
        revision:
          type: integer
          minimum: 1.0
          title: Revision
      type: object
      required:
      - name
      - version
      - revision
      title: ModelVersionSummary
    VersionsResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/ModelVersionSummary'
          type: array
          title: Items
      type: object
      required:
      - items
      title: VersionsResponse
    Problem:
      type: object
      required:
      - type
      - title
      - status
      - code
      - instance
      - traceId
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        instance:
          type: string
        traceId:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              reason:
                type: string
    M2Active:
      properties:
        active:
          type: boolean
          const: true
          title: Active
          default: true
        inputType:
          type: string
          enum:
          - NARRATIVE
          - ESSAY
          title: Inputtype
        scores:
          anyOf:
          - $ref: '#/components/schemas/Scores'
          - $ref: '#/components/schemas/EssayScores'
          title: Scores
          description: 기본은 score_cuts 경계 변환. M2_CONTENT3_RULE_ENABLED=true인 서술 3.0 초5·6의 content_3만 결합 점수를
            1~5로 자른 뒤 floor(mixed+0.5) 적용.
        rawScores:
          anyOf:
          - $ref: '#/components/schemas/RawScores'
          - $ref: '#/components/schemas/EssayRawScores'
          title: Rawscores
          description: 기본은 유한 모델 원점수 그대로. 선택 보정 적용 시 서술 content_3만 결합 점수를 1~5로 자르고 소수 4자리로 반올림. 정수는 이 반올림
            전 값으로 계산.
        model:
          $ref: '#/components/schemas/ModelIdentity'
        preparation:
          anyOf:
          - $ref: '#/components/schemas/Preparation'
          - type: 'null'
      type: object
      required:
      - inputType
      - scores
      - rawScores
      - model
      title: M2Active
    M2Inactive:
      properties:
        active:
          type: boolean
          const: false
          title: Active
          default: false
      type: object
      title: M2Inactive
    M2Request:
      allOf:
      - if:
          properties:
            inputType:
              const: ESSAY
          required:
          - inputType
        then:
          properties:
            essayType:
              type: string
          required:
          - essayType
      properties:
        prompt:
          type: string
          maxLength: 10000
          minLength: 1
          title: Prompt
        text:
          type: string
          maxLength: 50000
          minLength: 1
          pattern: \S
          title: Text
        grade:
          type: integer
          maximum: 6.0
          minimum: 3.0
          title: Grade
        inputType:
          type: string
          enum:
          - NARRATIVE
          - ESSAY
          title: Inputtype
        keywords:
          items:
            type: string
            maxLength: 200
            minLength: 1
          type: array
          maxItems: 100
          title: Keywords
        essayType:
          anyOf:
          - type: string
            enum:
            - 설명글
            - 글짓기
            - 주장
            - 찬성반대
            - 대안제시
          - type: 'null'
          title: Essaytype
        essayLabels:
          items:
            type: string
            maxLength: 200
            minLength: 1
          type: array
          maxItems: 4
          title: Essaylabels
      additionalProperties: false
      type: object
      required:
      - prompt
      - text
      - grade
      - inputType
      title: M2Request
    ModelIdentity:
      properties:
        name:
          type: string
          title: Name
        version:
          type: string
          title: Version
        revision:
          type: integer
          minimum: 1.0
          title: Revision
      type: object
      required:
      - name
      - version
      - revision
      title: ModelIdentity
    RawScores:
      properties:
        hol:
          type: number
          title: Hol
        task_1:
          type: number
          title: Task 1
        content_1:
          type: number
          title: Content 1
        content_2:
          type: number
          title: Content 2
        content_3:
          type: number
          title: Content 3
        organization_1:
          type: number
          title: Organization 1
        organization_2:
          type: number
          title: Organization 2
        expression_1:
          type: number
          title: Expression 1
        expression_2:
          type: number
          title: Expression 2
      type: object
      required:
      - hol
      - task_1
      - content_1
      - content_2
      - content_3
      - organization_1
      - organization_2
      - expression_1
      - expression_2
      title: RawScores
    Scores:
      properties:
        hol:
          type: integer
          maximum: 4.0
          minimum: 1.0
          title: Hol
        task_1:
          type: integer
          maximum: 5.0
          minimum: 1.0
          title: Task 1
        content_1:
          type: integer
          maximum: 5.0
          minimum: 1.0
          title: Content 1
        content_2:
          type: integer
          maximum: 5.0
          minimum: 1.0
          title: Content 2
        content_3:
          type: integer
          maximum: 5.0
          minimum: 1.0
          title: Content 3
        organization_1:
          type: integer
          maximum: 5.0
          minimum: 1.0
          title: Organization 1
        organization_2:
          type: integer
          maximum: 5.0
          minimum: 1.0
          title: Organization 2
        expression_1:
          type: integer
          maximum: 5.0
          minimum: 1.0
          title: Expression 1
        expression_2:
          type: integer
          maximum: 5.0
          minimum: 1.0
          title: Expression 2
      type: object
      required:
      - hol
      - task_1
      - content_1
      - content_2
      - content_3
      - organization_1
      - organization_2
      - expression_1
      - expression_2
      title: Scores
    M1Request:
      properties:
        problem:
          type: string
          pattern: \S
          title: Problem
        answerKey:
          type: string
          pattern: \S
          title: Answerkey
        solution:
          $ref: '#/components/schemas/StudentSolution'
      additionalProperties: false
      type: object
      required:
      - problem
      - answerKey
      - solution
      title: M1Request
    M1Inactive:
      properties:
        active:
          type: boolean
          const: false
          title: Active
          default: false
      type: object
      title: M1Inactive
    StudentSolution:
      properties:
        steps:
          items:
            type: string
          type: array
          minItems: 1
          title: Steps
        finalAnswer:
          type: string
          pattern: \S
          title: Finalanswer
      additionalProperties: false
      type: object
      required:
      - steps
      - finalAnswer
      title: StudentSolution
    EssayRawScores:
      properties:
        org:
          type: number
          title: Org
        cont:
          type: number
          title: Cont
        exp:
          type: number
          title: Exp
      additionalProperties: false
      type: object
      required:
      - org
      - cont
      - exp
      title: EssayRawScores
    EssayScores:
      properties:
        org:
          type: integer
          maximum: 3.0
          minimum: 0.0
          title: Org
        cont:
          type: integer
          maximum: 3.0
          minimum: 0.0
          title: Cont
        exp:
          type: integer
          maximum: 3.0
          minimum: 0.0
          title: Exp
      additionalProperties: false
      type: object
      required:
      - org
      - cont
      - exp
      title: EssayScores

    M2Skipped:
      properties:
        active:
          type: boolean
          const: true
          title: Active
          default: true
        scored:
          type: boolean
          const: false
          title: Scored
          default: false
        reason:
          type: string
          const: TEXT_TOO_SHORT
          title: Reason
          default: TEXT_TOO_SHORT
        inputType:
          type: string
          enum:
          - NARRATIVE
          - ESSAY
          title: Inputtype
        model:
          $ref: '#/components/schemas/ModelIdentity'
        preparation:
          $ref: '#/components/schemas/Preparation'
      type: object
      required:
      - inputType
      - model
      - preparation
      title: M2Skipped
    Preparation:
      properties:
        ruleVersion:
          type: string
          const: 1112c
          title: Ruleversion
          default: 1112c
        copied:
          type: integer
          minimum: 0.0
          title: Copied
        repeated:
          type: boolean
          title: Repeated
        chars:
          type: integer
          minimum: 0.0
          title: Chars
        labelsRemoved:
          type: integer
          minimum: 0.0
          title: Labelsremoved
        short:
          type: boolean
          title: Short
        truncated:
          type: boolean
          title: Truncated
          default: false
        notices:
          items:
            type: string
            enum:
            - COPIED_REMOVED
            - REPEATED_REMOVED
            - SHORT_ANSWER
            - EMPTY_AFTER_CLEANING
            - ESSAY_TOO_SHORT
            - ESSAY_ORIGINALLY_SHORT
          type: array
          title: Notices
      type: object
      required:
      - copied
      - repeated
      - chars
      - labelsRemoved
      - short
      title: Preparation
