              description: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuardianTransferView'
        '400':
          description: 입력 또는 동의 문서 오류
        '401':
          description: 로그인 필요
        '403':
          description: 권한·동의·재인증 오류
        '404':
