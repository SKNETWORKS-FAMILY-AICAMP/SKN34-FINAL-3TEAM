  /me/guardian-password:
    get:
      operationId: getGuardianPassword
      tags:
      - Account
      summary: 보호자 비밀번호 상태
      description: 학생 화면에서 학부모 화면으로 돌아올 때 쓰는 보호자 비밀번호의 설정·잠금 여부만 반환한다. 값과 해시는 반환하지 않는다.
      security:
      - BearerAuth: []
      responses:
        '200':
          description: 보호자 비밀번호 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuardianPasswordState'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: 인증 상태 캐시 금지
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      operationId: setGuardianPassword
      tags:
      - Account
      summary: 보호자 비밀번호 설정·변경
      description: 현재 세션/버전·GUARDIAN_PASSWORD에 결합된 5분 재인증 grant를 같은 트랜잭션에서 1회 소비한다. 학부모가 아니면 입력과 관계없이 403 FORBIDDEN(규칙
        검사보다 먼저). 숫자 4~6자리이며 반복·연속 숫자는 422로 grant를 소비하지 않는다. 성공 시 실패 횟수와 잠금을 초기화한다.
      security:
      - BearerAuth: []
      parameters:
      - in: header
        name: X-Reauth-Token
        required: true
        schema:
          type: string
        description: 현재 세션·GUARDIAN_PASSWORD에 결합된 5분·1회용 토큰
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - password
              properties:
                password:
                  type: string
                  pattern: ^[0-9]{4,6}$
      responses:
        '200':
          description: 저장 후 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuardianPasswordState'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: 인증 상태 캐시 금지
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: RFC 9457 오류. FORBIDDEN 또는 REAUTH_REQUIRED.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: RFC 9457 오류. VALIDATION_FAILED(숫자 4~6자리·반복/연속 불가).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
