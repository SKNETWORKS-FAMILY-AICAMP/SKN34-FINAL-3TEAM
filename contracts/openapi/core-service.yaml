openapi: 3.1.0
info:
  title: 사고뭉치 core-service 인증·동의·자녀·관리자 API
  version: 1.0.0
  description: 'core 인증·동의·자녀·리포트·관리자 및 #58 학생 기기/PIN API. access는 메모리, refresh는 부모·관리자 전용 보안 쿠키. 학생 기기 API는 기기 쿠키와 PIN을 검증하고 부모 세션을 변경하지 않는다.'
servers:
- url: /api/v1
  description: web과 동일 origin의 core 공개 API
tags:
- name: Dashboard
- name: Auth
- name: Account
- name: Feedback
- name: Learning
- name: WeeklyTheme
- name: Consent
- name: Children
- name: Admin
- name: ModelRegistry
- name: Support
- name: Community
security:
- BearerAuth: []
paths:
  /admin/models/preflight:
    post:
      summary: SERVICE_OPS 모델 파일·형식 사전 검사
      description: 등록·품질 승인·활성화를 수행하지 않는다. 가중치 본문은 읽지 않으며 S3 전체 SHA-256이 없거나 COMPOSITE이면
        CHECKSUM_UNAVAILABLE. 작은 JSON 3개만 최대 1MiB씩 읽는다. core 제한 20초, scoring 작업 예산 15초.
        파일 검사 실패도 200의 FAIL이며 core 감사 result=FAILURE로 저장한다.
      operationId: preflightModel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelPreflightRequest'
      responses:
        '200':
          description: 파일·형식 검사 결과. 품질 승인 아님
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelPreflightResult'
        '400':
          description: VALIDATION_FAILED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: UNAUTHENTICATED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: FORBIDDEN
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: MODEL_PREFLIGHT_INVALID_RESPONSE
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: MODEL_PREFLIGHT_UNAVAILABLE
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /conversations/{id}/report-template:
    get:
      operationId: getReportTemplate
      tags:
      - ReportTemplates
      description: 대화 소유권·학생 연결·동의 검사. 제안·확정에는 분석 이용권 필요. 제안은 10분 만료, 확인 후 저장.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportTemplateSnapshot'
        '400':
          description: '입력·권한·만료·한도·상위 서비스 오류 (api-spec #209)'
        '401':
          description: '입력·권한·만료·한도·상위 서비스 오류 (api-spec #209)'
        '403':
          description: '입력·권한·만료·한도·상위 서비스 오류 (api-spec #209) · 학생 비공개 STUDENT_RECORDS_PRIVATE(#206)'
        '404':
          description: '입력·권한·만료·한도·상위 서비스 오류 (api-spec #209)'
        '409':
          description: '입력·권한·만료·한도·상위 서비스 오류 (api-spec #209)'
        '429':
          description: '입력·권한·만료·한도·상위 서비스 오류 (api-spec #209)'
        '502':
          description: '입력·권한·만료·한도·상위 서비스 오류 (api-spec #209)'
        '503':
          description: '입력·권한·만료·한도·상위 서비스 오류 (api-spec #209)'
  /conversations/{id}/report-template/proposals:
    post:
      operationId: proposeReportTemplate
      tags:
      - ReportTemplates
      description: 대화 소유권·학생 연결·동의 검사. 제안·확정에는 분석 이용권 필요. 제안은 10분 만료, 확인 후 저장.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportTemplateProposal'
        '400':
          description: '입력·권한·만료·한도·상위 서비스 오류 (api-spec #209)'
        '401':
          description: '입력·권한·만료·한도·상위 서비스 오류 (api-spec #209)'
        '403':
          description: '입력·권한·만료·한도·상위 서비스 오류 (api-spec #209) · 학생 비공개 STUDENT_RECORDS_PRIVATE(#206)'
        '404':
          description: '입력·권한·만료·한도·상위 서비스 오류 (api-spec #209)'
        '409':
          description: '입력·권한·만료·한도·상위 서비스 오류 (api-spec #209)'
        '429':
          description: '입력·권한·만료·한도·상위 서비스 오류 (api-spec #209)'
        '502':
          description: '입력·권한·만료·한도·상위 서비스 오류 (api-spec #209)'
        '503':
          description: '입력·권한·만료·한도·상위 서비스 오류 (api-spec #209)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - question
              properties:
                question:
                  type: string
                  minLength: 1
                  maxLength: 1000
  /conversations/{id}/report-template/confirm:
    post:
      operationId: confirmReportTemplate
      tags:
      - ReportTemplates
      description: 대화 소유권·학생 연결·동의 검사. 제안·확정에는 분석 이용권 필요. 제안은 10분 만료, 확인 후 저장.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportTemplateSnapshot'
        '400':
          description: '입력·권한·만료·한도·상위 서비스 오류 (api-spec #209)'
        '401':
          description: '입력·권한·만료·한도·상위 서비스 오류 (api-spec #209)'
        '403':
          description: '입력·권한·만료·한도·상위 서비스 오류 (api-spec #209) · 학생 비공개 STUDENT_RECORDS_PRIVATE(#206)'
        '404':
          description: '입력·권한·만료·한도·상위 서비스 오류 (api-spec #209)'
        '409':
          description: '입력·권한·만료·한도·상위 서비스 오류 (api-spec #209)'
        '429':
          description: '입력·권한·만료·한도·상위 서비스 오류 (api-spec #209)'
        '502':
          description: '입력·권한·만료·한도·상위 서비스 오류 (api-spec #209)'
        '503':
          description: '입력·권한·만료·한도·상위 서비스 오류 (api-spec #209)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - proposalId
              properties:
                proposalId:
                  type: string
                  format: uuid
  /internal/students/{studentId}/report-template:
    servers:
    - url: /
    get:
      operationId: getInternalReportTemplate
      description: SYSTEM 및 대상 학생 scope 필수. 현재 연결된 활성 학부모 설정 반환.
      security:
      - InternalToken: []
      parameters:
      - name: studentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportTemplateSnapshot'
        '403':
          description: 역할·scope 오류
        '404':
          description: 활성 연결 없음
        '409':
          description: 학생 삭제 진행·비활성(`STUDENT_UNAVAILABLE`)
  /students/me/sharing-preferences:
    get:
      tags: [Students]
      operationId: getStudentSharingPreference
      summary: 학생 본인의 전역 학부모 공개 설정
      responses:
        '200':
          description: 현재 공개 설정 (Cache-Control no-store)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StudentSharingPreference'}
        default: {$ref: '#/components/responses/LearningProblem'}
    put:
      tags: [Students]
      operationId: updateStudentSharingPreference
      summary: 학생 본인만 공개 설정 변경 (기본 비공개)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parentSharingEnabled]
              properties:
                parentSharingEnabled: {type: boolean}
      responses:
        '200':
          description: 저장된 공개 설정 (Cache-Control no-store)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StudentSharingPreference'}
        default: {$ref: '#/components/responses/LearningProblem'}
  /students/me/community-settings:
    get:
      tags: [Community]
      operationId: getCommunitySettings
      summary: 학생 본인 커뮤니티 공개 설정 (P20, FN-RET-01). 기본 끔
      responses:
        '200':
          description: 현재 설정과 보호자 동의 여부 (Cache-Control no-store)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommunitySettings'}
        default: {$ref: '#/components/responses/LearningProblem'}
    put:
      tags: [Community]
      operationId: updateCommunitySettings
      summary: 학생 본인만 변경. 켜기는 현재 보호자 COMMUNITY 동의 필요(없으면 409 COMMUNITY_CONSENT_REQUIRED). 끄면 공유물 HIDDEN_SETTING, 다시 켜면 HIDDEN_SETTING만 복원
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: {type: boolean}
      responses:
        '200':
          description: 저장된 설정 (Cache-Control no-store)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommunitySettings'}
        default: {$ref: '#/components/responses/LearningProblem'}
  /missions/{missionId}/community-posts:
    get:
      tags: [Community]
      operationId: listMissionCommunityPosts
      summary: 같은 미션을 마무리한 학생만 무작위 목록 열람(같은 seed면 같은 순서). 미마무리 403 COMMUNITY_LOCKED, 큰 질문 정답 고르기 문제는 그 주 엔딩 전 403 COMMUNITY_LOCKED_UNTIL_ENDING(#550)
      description: 작성자는 별명·꾸미기로 바꾸고 학생 ID·반응 수를 내보내지 않는다. 지금 공개할 수 없는 작성자(설정 끔·현재 보호자 동의 없음)와 신고 처리 중·계속 숨김 공유물은 core가 다시 거른다
      parameters:
      - {name: missionId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: seed, in: query, required: true, description: '같은 값이면 같은 순서. 없거나 비었거나 100자 초과면 400 VALIDATION_FAILED(#622)', schema: {type: string, minLength: 1, maxLength: 100}}
      - {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}
      - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: 공유물 목록 (Cache-Control no-store)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommunityPostPage'}
        default: {$ref: '#/components/responses/LearningProblem'}
  /students/me/community-posts:
    get:
      tags: [Community]
      operationId: listMyCommunityPosts
      summary: 내 공유물·상태·받은 반응 종류별 수 (FN-RET-02·03)
      responses:
        '200':
          description: 내 공유물 (Cache-Control no-store)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommunityOwnPostList'}
        default: {$ref: '#/components/responses/LearningProblem'}
  /children/{childId}/community-posts:
    get:
      tags: [Community]
      operationId: listChildCommunityPosts
      summary: 연결·동의가 유효한 자녀의 공유물·상태·받은 반응 수. 다른 학생 공유물 경로 없음
      parameters:
      - {name: childId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: 자녀 공유물 (Cache-Control no-store)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommunityOwnPostList'}
        default: {$ref: '#/components/responses/LearningProblem'}
  /community-posts/{postId}/reactions/{reaction}:
    parameters:
    - {name: postId, in: path, required: true, schema: {type: string, format: uuid}}
    - {name: reaction, in: path, required: true, schema: {$ref: '#/components/schemas/CommunityReaction'}}
    put:
      tags: [Community]
      operationId: addCommunityReaction
      summary: 반응 남기기(멱등). 본인 글 409 COMMUNITY_OWN_POST, 열람 권한 없음 403 COMMUNITY_LOCKED·COMMUNITY_LOCKED_UNTIL_ENDING, 숨김·없는 글 404 COMMUNITY_POST_NOT_FOUND, 4종 외 400
      responses:
        '204': {description: 반응 저장}
        default: {$ref: '#/components/responses/LearningProblem'}
    delete:
      tags: [Community]
      operationId: removeCommunityReaction
      summary: 반응 취소(멱등, 적립 포인트 회수 없음)
      responses:
        '204': {description: 반응 취소}
        default: {$ref: '#/components/responses/LearningProblem'}
  /students/me/points:
    get:
      tags: [Students]
      operationId: getStudentPoints
      summary: 학생 본인 포인트 잔액·내역 (#389, P21). 최신순, Cache-Control no-store
      description: 참여로만 적립(판정 무관), 순위·소멸 없음. 다른 학생 잔액 경로는 없다. 학부모·관리자 토큰 403
      parameters:
      - {name: page, in: query, required: false, schema: {type: integer, minimum: 0, default: 0}}
      - {name: size, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: 잔액·내역
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RewardPoints'}
        '400': {description: 'page·size 범위 밖(VALIDATION_FAILED)'}
        default: {$ref: '#/components/responses/LearningProblem'}
  /students/me/look-items:
    get:
      tags: [Students]
      operationId: getStudentLookItems
      summary: 테마 5·캐릭터 5와 판매 중이거나 이미 해금한 캐릭터 아이템 목록 (#389, P22). Cache-Control no-store
      description: 'itemKey는 테마 THEME:<code>·캐릭터 COMPANION:<code>(해금값 코드 상수, lake·mungchi 무료, 나머지 테마 100·캐릭터 150), 아이템은 look_item.code. 판매 중단 아이템은 해금한 학생에게만 onSale false로 보인다.'
      responses:
        '200':
          description: 꾸미기 목록
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LookCatalog'}
        default: {$ref: '#/components/responses/LearningProblem'}
  /students/me/look-items/{itemKey}/unlock:
    post:
      tags: [Students]
      operationId: unlockStudentLookItem
      summary: 포인트로 꾸미기 해금 (#389, P22). 영구 해금, 즉시 차감, 환급 없음
      description: 'Idempotency-Key(UUID) 필수, 없거나 형식 오류면 400 VALIDATION_FAILED. 같은 키 재전송은 처음 응답을 그대로, 같은 키로 다른 항목은 422 IDEMPOTENCY_KEY_REUSED. 잔액 행 잠금으로 동시 해금도 한 번만 차감하고, 이미 해금(무료 포함)이면 차감 없이 200. 잔액 부족 409 INSUFFICIENT_POINTS, 판매 중단 409 LOOK_ITEM_NOT_ON_SALE, 없는 항목 404 LOOK_ITEM_NOT_FOUND, 학생 삭제 진행 409 STUDENT_UNAVAILABLE'
      parameters:
      - {name: itemKey, in: path, required: true, schema: {type: string, maxLength: 64}}
      - {name: Idempotency-Key, in: header, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: 해금 결과와 해금 뒤 잔액
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LookUnlockResult'}
        '400': {description: 'Idempotency-Key 누락·형식 오류(VALIDATION_FAILED)'}
        '404': {description: 'LOOK_ITEM_NOT_FOUND'}
        '409': {description: 'INSUFFICIENT_POINTS · LOOK_ITEM_NOT_ON_SALE · STUDENT_UNAVAILABLE · IDEMPOTENCY_IN_PROGRESS'}
        '422': {description: 'IDEMPOTENCY_KEY_REUSED'}
        default: {$ref: '#/components/responses/LearningProblem'}
  /students/me/preferences:
    get:
      tags: [Students]
      operationId: getStudentLook
      summary: 학생 본인의 생각 지도 테마·동행 캐릭터 (#234). 저장한 적 없으면 기본값과 updatedAt null
      responses:
        '200':
          description: 현재 꾸미기 설정 (Cache-Control no-store)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StudentLook'}
        default: {$ref: '#/components/responses/LearningProblem'}
    put:
      tags: [Students]
      operationId: updateStudentLook
      summary: 학생 본인만 꾸미기 설정 전체 교체. 목록 외 값 422, 해금하지 않은 테마·캐릭터·아이템 409 LOOK_LOCKED(#389), 학부모·관리자 403
      description: 'theme·companion은 전체 교체. equipped는 보낸 슬롯만 교체하고 보내지 않은 슬롯은 유지(생략·null이면 착용 전체 유지, #555). 슬롯은 캐릭터 HAT·OUTFIT·ACCESSORY·BACKGROUND와 생활공간 가구 DESK·WALL·WARDROBE(#555, P22 개정). 값은 그 슬롯의 look_item 코드 또는 null(착용 해제, 가구는 기본 스킨)이며, 모르는 슬롯·코드나 다른 슬롯 아이템은 422 VALIDATION_FAILED, 해금하지 않은 아이템은 409 LOOK_LOCKED. 검사에 하나라도 걸리면 아무 슬롯도 바꾸지 않음. 판매 중단돼도 이미 해금한 아이템은 착용 가능 (api-spec 2.10·3.12, P22)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [theme, companion]
              properties:
                theme: {$ref: '#/components/schemas/StudentLookTheme'}
                companion: {$ref: '#/components/schemas/StudentLookCompanion'}
                equipped:
                  oneOf:
                  - {$ref: '#/components/schemas/LookEquippedUpdate'}
                  - {type: 'null'}
      responses:
        '200':
          description: 저장된 꾸미기 설정 (Cache-Control no-store)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StudentLook'}
        default: {$ref: '#/components/responses/LearningProblem'}
  /students/me/room/frame-slots:
    get:
      tags: [Students]
      operationId: getRoomFrameSlots
      summary: 생활공간 추억의 벽 액자 슬롯 (#555, FN-RET-09, P27). 학생 본인만, 학부모·관리자 403
      description: >-
        저장된 슬롯을 번호순으로 돌려준다(빈 슬롯 없음). 제목·그림은 learning 앨범(4.1.4)에서 매번 읽는다(그림은 presigned URL이라 저장하지 않음).
        걸린 액자가 없으면 learning을 부르지 않는다. learning 응답 실패는 502 LEARNING_UNAVAILABLE·LEARNING_CONTRACT_INVALID, 연결 장애는 503·504.
        방 벽지(BACKGROUND)·가구 스킨(DESK·WALL·WARDROBE)·캐릭터 착용은 /students/me/preferences의 equipped
      responses:
        '200':
          description: 현재 추억의 벽 (Cache-Control no-store)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RoomFrameSlots'}
        default: {$ref: '#/components/responses/LearningProblem'}
    put:
      tags: [Students]
      operationId: replaceRoomFrameSlots
      summary: 추억의 벽 액자 슬롯 전체 교체 (#555). 빈 목록은 모두 내림
      description: >-
        slots 누락·7개 이상·slotNo 1~6 밖·같은 slotNo 두 번·같은 회차 두 번·월요일이 아닌 weekStart·빈 칸은 422 VALIDATION_FAILED(learning 호출 전).
        learning frames/ownership(4.1.4)이 보유로 돌려주지 않은 회차(진행 중인 주 포함)는 404 THEME_FRAME_NOT_FOUND.
        learning 확인이 끝난 뒤 한 트랜잭션에서 학생의 슬롯 전체를 바꾸며, 거절·learning 장애면 아무것도 바꾸지 않는다.
        삭제 확정된 학생은 409 STUDENT_UNAVAILABLE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slots]
              properties:
                slots:
                  type: array
                  maxItems: 6
                  items: {$ref: '#/components/schemas/RoomFrameSlotInput'}
      responses:
        '200':
          description: 저장된 추억의 벽 (Cache-Control no-store)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RoomFrameSlots'}
        '404': {description: 'THEME_FRAME_NOT_FOUND'}
        '409': {description: 'STUDENT_UNAVAILABLE'}
        '422': {description: 'VALIDATION_FAILED'}
        default: {$ref: '#/components/responses/LearningProblem'}
