        schema:
          type: string
          format: uuid
      responses:
        '202':
          description: REPORT 또는 CONVERSATION 재처리 접수. 실제 결과는 Location의 작업 상세에서 조회한다.
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ReportRetryAccepted'
                - $ref: '#/components/schemas/ConversationRetryAccepted'
        '200':
