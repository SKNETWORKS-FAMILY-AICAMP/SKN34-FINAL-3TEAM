          type: integer
          minimum: 0
  requestBodies:
    LearningJson:
      required: true
      description: JSON object 원문을 learning에 전달한다. 입력 방식·필수 필드·업무 검증은 learning 계약(api-spec 2.2·3.1·3.6)을 따른다. 미확정 DTO를 core에서 새로 정의하지 않는다.
      content:
        application/json:
          schema: {type: object, additionalProperties: true}
  responses:
    LearningResult:
      description: learning의 최초 상태·JSON 원문을 보존한다. DTO 완성·실제 API 제공은 learning #22·#23·#24·#26의 후속 연결 조건이다.
      headers:
        ETag: {schema: {type: string}, description: learning의 초안 버전}
        Location: {schema: {type: string}, description: learning이 제공한 리소스 위치}
      content:
        application/json:
          schema: {type: object, additionalProperties: true}
    LearningProblem:
      description: >-
        learning 오류 상태·Problem Details·확장 필드를 보존한다. core 인증 401/403·잘못된 UUID/JSON/필수 헤더 400,
        처리 중 409·키 재사용 422·전송/서킷/저장 장애 503·시간 초과 504를 반환한다. 5xx는 확정 저장하지 않는다.
      headers:
        ETag: {schema: {type: string}, description: 충돌 시 최신 초안 버전}
        Retry-After: {schema: {type: string}, description: '처리 중은 1초, 서킷 차단은 30초'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    ModelStateUnavailable:
      description: 활성 버전의 승인 근거·범위를 확인할 수 없음 (MODEL_VERSION_STATE_INVALID).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    ModelNotFound:
      description: 대상 버전 없음.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    ModelConflict:
      description: 중복 버전 또는 허용되지 않는 활성화·복귀 상태.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    ModelApprovalRejected:
      description: 평가 근거·명시적 사람 승인·범위·사유가 충족되지 않음. 범위 배열의 null 항목도 거부한다.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unauthenticated:
      description: 미인증·만료·서명 오류·세션 변경·refresh 재사용. code로 구분한다.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: 역할·권한·동의·자녀 연결 또는 요청 출처가 허용되지 않음.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unavailable:
      description: Google 또는 인증 저장소를 사용할 수 없음.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InvalidRequest:
      description: UUID·JSON 요청 형식 오류.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
