      - StudentDeviceCookie: []
  /auth/student/login:
    post:
      operationId: loginStudentDevice
      tags:
      - Auth
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentDeviceToken'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: 인증·기기·PIN 상태 캐시 금지
        default:
          $ref: '#/components/responses/LearningProblem'
        '401':
          description: RFC 9457 오류. code와 선택적인 remainingAttempts를 확인한다.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: RFC 9457 오류. code와 선택적인 remainingAttempts를 확인한다.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: RFC 9457 오류. code와 선택적인 remainingAttempts를 확인한다.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '423':
          description: RFC 9457 오류. code와 선택적인 remainingAttempts를 확인한다.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - childId
              - pin
              properties:
                childId:
                  type: string
                  format: uuid
                pin:
                  type: string
                  maxLength: 128
      security:
      - StudentDeviceCookie: []
      parameters:
      - $ref: '#/components/parameters/WebOrigin'
      - $ref: '#/components/parameters/RequestedWith'
      description: 기기 → 기기 자녀 → 보호자/연결/활성/동의 → PIN 설정/잠금/일치. 5회 실패 423, 401 PIN 불일치는 remainingAttempts를 반환한다. 별도 학생
        세션이며 refresh·부모 세션 변경 없음.
  /notifications:
    get:
      operationId: listNotifications
      summary: 본인 알림 목록 (학생 세션 금지)
      parameters:
      - {name: unreadOnly, in: query, schema: {type: boolean, default: false}}
      - {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}
      - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: 최신순 알림. 재연결 ready 후 처음부터 재조회하여 id로 병합한다.
          content:
            application/json:
              schema:
                type: object
                required: [items, page, size, hasNext]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Notification'}}
                  page: {type: integer}
                  size: {type: integer}
                  hasNext: {type: boolean}
        default: {$ref: '#/components/responses/NotificationProblem'}
  /notifications/{notificationId}/read:
    patch:
      operationId: readNotification
      summary: 본인 알림 읽음 (멱등, 학생 세션 금지)
      parameters:
      - {name: notificationId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: 최초 읽음 시각 유지}
        default: {$ref: '#/components/responses/NotificationProblem'}
  /notifications/read-all:
    post:
      operationId: readAllNotifications
      summary: 본인 알림 전체 읽음 (학생 세션 금지)
      responses:
        '204': {description: 최초 읽음 시각 유지}
        default: {$ref: '#/components/responses/NotificationProblem'}
  /notifications/stream:
    get:
      operationId: streamNotifications
      summary: 본인 알림 SSE (학생 세션 금지)
      description: 'ready 후 목록 재조회 필수. notification 이벤트는 Notification, heartbeat는 15초 주석. 최대 5분. 매 전송에 세션/동의 재검사. Last-Event-ID 재생 없음. Pub/Sub 유실에 대비해 주기적으로 목록 동기화. Redis 발행 성공은 브라우저 수신 보장이 아니다.'
      responses:
        '200':
          description: ready·notification 이벤트와 ping 주석
          content:
            text/event-stream:
              schema: {type: string}
        default: {$ref: '#/components/responses/NotificationProblem'}
  /notification-settings:
    get:
      operationId: getNotificationSettings
      summary: 본인 유형별 수신 설정 (학생 세션 금지)
      responses:
        '200':
          description: 미저장 유형은 true, IN_APP 전용
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationSettings'}
        default: {$ref: '#/components/responses/NotificationProblem'}
    put:
      operationId: updateNotificationSettings
      summary: 지정 유형의 수신 설정 갱신 (학생 세션 금지)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NotificationSettings'}
      responses:
        '200':
          description: 갱신 후 전체 유효 설정. 수신 거부는 새 알림 생성을 막고 기존 알림은 보존.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationSettings'}
        default: {$ref: '#/components/responses/NotificationProblem'}
  /missions:
    get:
      operationId: listMissions
      tags: [Learning]
      summary: 학생 공개 미션 목록
      description: STUDENT 전용. 검증된 본인 학생의 grade·demo를 core DB에서 결정해 /internal/missions에 전달한다. 클라이언트 grade·demo query는 사용하지 않는다. page·size만 전달하며 문항 노출 판단은 learning 소유다.
      parameters:
      - {name: page, in: query, schema: {type: integer, minimum: 0}}
      - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        '200': {$ref: '#/components/responses/LearningResult'}
        default: {$ref: '#/components/responses/LearningProblem'}
  /missions/{missionId}:
    parameters:
    - {$ref: '#/components/parameters/MissionId'}
    get:
      operationId: getMission
      tags: [Learning]
      summary: 학생 미션 상세
      description: STUDENT 전용. 검증된 본인 학생의 grade·demo를 core DB에서 결정해 전달하며 클라이언트 query는 사용하지 않는다. learning의 공개 전 정답·예시 답 비공개 계약을 유지한다.
      responses:
        '200': {$ref: '#/components/responses/LearningResult'}
        default: {$ref: '#/components/responses/LearningProblem'}
  /missions/{missionId}/attempts:
    parameters:
    - {$ref: '#/components/parameters/MissionId'}
    post:
      operationId: startAttempt
      tags: [Learning]
      summary: 학생 시도 시작·이어하기
      description: >-
        STUDENT 전용. 검증된 본인 학생의 grade·demo를 core DB에서 결정해 /internal/missions/{missionId}/attempts에 쿼리로,
        본문 {context}를 그대로 전달하며 클라이언트 query는 사용하지 않는다(#387, api-spec 2.2·2.11).
        context 생략(본문 없음·{}·null)은 EXTRA(생각 유형별 미션 고르기). 요일·되돌아보기·일요일 검사는 learning(THEME_DAY_CLOSED·THEME_REVIEW_NOT_ALLOWED 409),
        무료·프리미엄 판정과 사용 기록은 core. learning은 신규 생성 201·기존 진행 시도 반환 200을 구분하며 core는 상태를 그대로 전달한다.
        #485(2026-11-10 결정): THEME_DAY·THEME_REVIEW는 하루 한도에 세지 않는다(무료 테마 문제 주 5개는 learning 누적 공개 규칙).
        EXTRA 허용은 상품 features.extraMissions(값이 없으면 무료는 거부·구독 중은 허용, #506)로 정하며 V43이 무료 상품을 false로 바꿔 무료 403 PREMIUM_REQUIRED(추가 문제 프리미엄 전용),
        프리미엄은 신규 201을 payment_premium_usage(kind EXTRA_MISSION, source_id 시도 ID)로 기록해 환불 판정의 프리미엄 사용에 넣는다.
        무료 상품에서 EXTRA를 다시 켜면 무료 EXTRA만 KST 하루 product.limits.dailyMissions개까지 신규 201을 mission_daily_usage에 기록하고 한도 도달 시 신규만 429
        (같은 미션의 진행 중 시도 이어하기 200은 허용).
        learning 쿼리에 sundayTheme(true|false)를 더한다: KST 일요일이고 상품 features.sundayTheme이 true(값이 없으면 구독 중일 때 true)일 때만 true.
        learning(#484)은 false인 일요일의 신규 시작·다시 풀기를 거부하고 core는 그 오류를 그대로 전달한다.
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AttemptStartRequest'}
      responses:
        '200':
          $ref: '#/components/responses/LearningResult'
          description: 기존 진행 시도 반환(이어하기). 일일 한도 집계 대상 아님.
        '201':
          $ref: '#/components/responses/LearningResult'
          description: 신규 시도 생성. 무료에서 꺼진 동안의 프리미엄 EXTRA는 프리미엄 사용으로 기록(무료 상품에서 EXTRA를 켠 경우 무료 EXTRA는 일일 한도).
        '400':
          description: VALIDATION_FAILED — JSON object가 아니거나 context 외 필드·허용 밖 값
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '403':
          description: PREMIUM_REQUIRED(features.extraMissions가 false인 상품의 EXTRA, V43부터 무료 상품) 또는 core 인증·연결 오류
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '409':
          description: learning THEME_DAY_CLOSED·THEME_REVIEW_NOT_ALLOWED·MISSION_NOT_AVAILABLE 그대로(일요일 sundayTheme=false 거부 포함), 또는 REFUND_IN_PROGRESS(환불 처리 중 프리미엄 EXTRA)
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '429':
          description: USAGE_LIMIT_REACHED — 무료 상품에서 EXTRA를 켠 경우 무료 EXTRA 오늘(KST) 신규 시작 한도 도달. 테마 문제는 해당 없음. detail에 가능 범위·초기화 시점(다음 날 0시 KST)
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '503':
          description: PAYMENT_ENTITLEMENT_CONFIRMING·PAYMENT_PRODUCT_UNAVAILABLE(무료 EXTRA의 limits.dailyMissions 누락·features.extraMissions 형식 오류, 일요일 features.sundayTheme 형식 오류 포함)·PAYMENT_FREE_PRODUCT_UNAVAILABLE 또는 learning 전송 장애
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        default: {$ref: '#/components/responses/LearningProblem'}
  /attempts/{attemptId}:
    parameters:
    - {$ref: '#/components/parameters/AttemptId'}
    get:
      operationId: getAttempt
      tags: [Learning]
      summary: 학생 시도·타임라인·최신 초안
      description: STUDENT 전용. learning의 상태·응답·ETag를 보존한다. 대상 학생의 소유권은 learning이 X-Student-Scope와 대조한다.
      responses:
        '200': {$ref: '#/components/responses/LearningResult'}
        default: {$ref: '#/components/responses/LearningProblem'}
  /attempts/{attemptId}/comparison:
    parameters:
    - {$ref: '#/components/parameters/AttemptId'}
    get:
      operationId: getAttemptComparison
      tags: [Learning]
      summary: 같은 미션의 직전 마무리 시도와 비교
      description: STUDENT 전용. 현재 시도 마무리 이후만 공개. 이전 원문·판정·피드백은 보존하며 기준 버전이 다르면 요소 변화는 비교하지 않는다. Cache-Control no-store.
      responses:
        '200':
          description: 이전 결과 또는 NO_PREVIOUS
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AttemptComparison'}
        default: {$ref: '#/components/responses/LearningProblem'}
  /attempts/{attemptId}/draft:
    parameters:
    - {$ref: '#/components/parameters/AttemptId'}
    put:
      operationId: saveDraft
      tags: [Learning]
      summary: 학생 초안 저장
      description: STUDENT 전용. If-Match를 변경 없이 전달한다. 초안 충돌은 409와 최신 초안·ETag를 보존한다.
      parameters:
      - {name: If-Match, in: header, required: true, schema: {type: string}, example: '"7"'}
      requestBody: {$ref: '#/components/requestBodies/LearningJson'}
      responses:
        '200': {$ref: '#/components/responses/LearningResult'}
        '409': {$ref: '#/components/responses/LearningProblem'}
        default: {$ref: '#/components/responses/LearningProblem'}
  /attempts/{attemptId}/hints:
    parameters:
    - {$ref: '#/components/parameters/AttemptId'}
    post:
      operationId: openHints
      tags: [Learning]
      summary: 학생 생각 열기 질문 열람
      responses:
        '200': {$ref: '#/components/responses/LearningResult'}
        default: {$ref: '#/components/responses/LearningProblem'}
  /attempts/{attemptId}/answers:
    parameters:
    - {$ref: '#/components/parameters/AttemptId'}
    post:
      operationId: submitAnswer
      tags: [Learning]
      summary: 학생 최초·보완 답변 제출
      description: >-
        STUDENT 전용. Idempotency-Key UUID 필수. 같은 계정·키의 메서드·endpoint·검증된 학생·원문 본문을 대조한다.
        원문 공백·필드 순서 변경도 422 IDEMPOTENCY_KEY_REUSED다. 최초 2xx~4xx 상태·원문·헤더를 24시간 재사용한다.
        처리 중은 409 IDEMPOTENCY_IN_PROGRESS와 Retry-After 1. 5xx·시간 초과·core 저장 실패는 미확정이며 같은 키로 재요청한다.
        learning에 동일 키를 전달하며 learning은 답변 UK와 최초 결과 재구성을 보장해야 한다.
      parameters:
      - {name: Idempotency-Key, in: header, required: true, schema: {type: string, format: uuid}}
      requestBody: {$ref: '#/components/requestBodies/LearningJson'}
      responses:
        '201': {$ref: '#/components/responses/LearningResult'}
        '409': {$ref: '#/components/responses/LearningProblem'}
        '422': {$ref: '#/components/responses/LearningProblem'}
        '503': {$ref: '#/components/responses/LearningProblem'}
        '504': {$ref: '#/components/responses/LearningProblem'}
        default: {$ref: '#/components/responses/LearningProblem'}
  /attempts/{attemptId}/finish:
    parameters:
    - {$ref: '#/components/parameters/AttemptId'}
    post:
      operationId: finishAttempt
      tags: [Learning]
      summary: 학생 마무리·정답 공개
      description: STUDENT 전용. 판정 DONE 조건과 공개 응답은 learning 소유. 조건 미충족 409를 보존한다.
      responses:
        '200': {$ref: '#/components/responses/LearningResult'}
        default: {$ref: '#/components/responses/LearningProblem'}
  /attempts/{attemptId}/self-assessment:
    parameters:
    - {$ref: '#/components/parameters/AttemptId'}
    post:
      operationId: saveSelfAssessment
      tags: [Learning]
      summary: 학생 자기 평가
      requestBody: {$ref: '#/components/requestBodies/LearningJson'}
      responses:
        '200': {$ref: '#/components/responses/LearningResult'}
        default: {$ref: '#/components/responses/LearningProblem'}
  /attempts/{attemptId}/reflection:
    parameters:
    - {$ref: '#/components/parameters/AttemptId'}
    post:
      operationId: saveReflection
      tags: [Learning]
      summary: 학생 돌아보기·완료
      requestBody: {$ref: '#/components/requestBodies/LearningJson'}
      responses:
        '200': {$ref: '#/components/responses/LearningResult'}
        default: {$ref: '#/components/responses/LearningProblem'}
  /auth/google/authorize:
    get:
      operationId: startGoogleLogin
      tags:
      - Auth
      summary: Google 로그인·가입 시작
      description: core가 state·nonce·PKCE S256을 생성하고 Google로 이동한다. Google 키가 없으면 503이다.
      security: []
      responses:
        '302':
          description: Google 인가 페이지로 이동. OAuth 상태 쿠키는 HttpOnly·SameSite=Lax, 10분.
          headers:
            Cache-Control:
              description: 인증 응답은 저장하지 않는다.
              schema:
                type: string
                const: no-store
            Set-Cookie:
              description: HttpOnly 쿠키. 성공 콜백은 OAuth 상태 쿠키 삭제와 refresh 설정의 복수 Set-Cookie를 반환한다. 로그아웃은 refresh 쿠키를 만료시킨다. 학생 전환(/auth/student-sessions)은 잠긴 부모 refresh 쿠키를 지우지 않는다(V24).
              schema:
                type: string
            Location:
              description: Google 인가 URL. 서비스 access/refresh는 포함하지 않는다.
              schema:
                type: string
                format: uri
        '503':
          $ref: '#/components/responses/Unavailable'
  /auth/google/callback:
    get:
      operationId: completeGoogleLogin
      tags:
      - Auth
      summary: Google 인가 응답 처리
      description: state 쿠키·nonce·PKCE와 ID 토큰 JWKS 서명·iss·aud·exp를 검증한다. Google 계정은 provider+sub로 식별하며 이메일 자동 연결은 하지 않는다.
        성공하면 refresh 쿠키를 설정하고 /oauth/complete로 이동한다.
      security: []
      parameters:
      - name: code
        in: query
        required: false
        description: Google 일회용 인가 코드. 성공 흐름에 필수.
        schema:
          type: string
      - name: state
        in: query
        required: false
        description: 로그인 시작 시 생성한 state. 성공 흐름에 필수.
        schema:
          type: string
      - name: error
        in: query
        required: false
        description: Google이 반환한 오류(사용자 취소 포함).
        schema:
          type: string
      - name: sagomungchi_oauth
        in: cookie
        required: false
        description: 성공하려면 유효한 로그인 상태 쿠키가 있어야 한다. 없거나 만료되면 실패 화면으로 이동한다.
        schema:
          type: string
      responses:
        '302':
          description: '성공: /oauth/complete. 실패: /login?oauthError=CANCELLED|ACCOUNT_EXISTS|OAUTH_UNAVAILABLE|OAUTH_FAILED.
            상태 쿠키 삭제.'
          headers:
            Cache-Control:
              description: 인증 응답은 저장하지 않는다.
              schema:
                type: string
                const: no-store
            Set-Cookie:
              description: HttpOnly 쿠키. 성공 콜백은 OAuth 상태 쿠키 삭제와 refresh 설정의 복수 Set-Cookie를 반환한다. 로그아웃은 refresh 쿠키를 만료시킨다. 학생 전환(/auth/student-sessions)은 잠긴 부모 refresh 쿠키를 지우지 않는다(V24).
              schema:
                type: string
            Location:
              schema:
                type: string
                format: uri
              description: 설정된 web origin 안의 성공 또는 실패 경로.
  /auth/admin/login:
    post:
      operationId: adminPasswordLogin
      tags:
      - Auth
      summary: 등록된 관리자 ID·비밀번호 로그인 (#369)
      description: 가입 없이 scripts/admin_account_sql.py로 admin_credential에 등록한 ADMIN 계정만 로그인한다. 로그인 ID는 user_account.login_id다.
        없는 ID·틀린 비밀번호·비관리자·비활성 계정은 같은 401 INVALID_CREDENTIALS이다. 연속 5회째 실패부터 15분간 423 ADMIN_LOGIN_LOCKED이며 실패 횟수는 오류 응답 전에 커밋한다.
        성공하면 Google 로그인과 같은 세션(최초 발급부터 7일)과 refresh 쿠키를 발급하고 기존 refresh 쿠키의 세션은 폐기한다.
      parameters:
      - $ref: '#/components/parameters/WebOrigin'
      - $ref: '#/components/parameters/RequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - loginId
              - password
              properties:
                loginId:
                  type: string
                  minLength: 1
                  maxLength: 254
                password:
                  type: string
                  minLength: 1
                  maxLength: 128
      responses:
        '200':
          description: 관리자 access와 refresh 쿠키. 본문은 refresh와 같다(role ADMIN, startPath /admin/home).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParentTokenResponse'
          headers:
            Cache-Control:
              description: 인증 응답은 저장하지 않는다.
              schema:
                type: string
                const: no-store
            Set-Cookie:
              description: HttpOnly refresh 쿠키.
              schema:
                type: string
        '401':
          description: RFC 9457 오류. INVALID_CREDENTIALS.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '423':
          description: RFC 9457 오류. ADMIN_LOGIN_LOCKED(연속 5회 실패, 15분 뒤 자동 해제).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          $ref: '#/components/responses/Unavailable'
  /auth/parent/signup:
    post:
      operationId: parentPasswordSignup
      tags:
      - Auth
      summary: 학부모 ID·비밀번호 가입 (#415)
      description: 누구나 가입할 수 있다. 같은 클라이언트 IP에서 기본 10분에 5회까지(AUTH_SIGNUP_LIMIT_PER_IP·AUTH_SIGNUP_LIMIT_WINDOW)이며
        이미 쓰는 ID로 거절된 요청은 세지 않는다. 비밀번호는 PBKDF2 해시로 parent_credential에 저장하고 user_account.password_hash는 쓰지 않는다.
        성공하면 Google 신규 가입과 같이 PARENT 세션과 refresh 쿠키를 발급하고(기존 refresh 쿠키 세션은 폐기) nextAction은 CONSENT_REQUIRED다.
        AUTH_NEW_ACCOUNT_DEMO=true 환경에서는 is_demo로 저장한다. Google 계정과 자동 연결하지 않는다.
      parameters:
      - $ref: '#/components/parameters/WebOrigin'
      - $ref: '#/components/parameters/RequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - loginId
              - password
              - name
              properties:
                loginId:
                  type: string
                  pattern: '^[A-Za-z0-9]{4,30}$'
                  description: 영문·숫자 4~30자. 서버가 앞뒤 공백을 지우고 소문자로 바꿔 저장·비교한다.
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
      responses:
        '200':
          description: 학부모 access와 refresh 쿠키. 본문은 refresh와 같다(role PARENT, nextAction CONSENT_REQUIRED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParentTokenResponse'
          headers:
            Cache-Control:
              description: 인증 응답은 저장하지 않는다.
              schema:
                type: string
                const: no-store
            Set-Cookie:
              description: HttpOnly refresh 쿠키.
              schema:
                type: string
        '400':
          description: RFC 9457 오류. VALIDATION_FAILED(ID·비밀번호·이름 규칙).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: RFC 9457 오류. LOGIN_ID_TAKEN(대소문자 무관하게 이미 쓰는 ID).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: RFC 9457 오류. SIGNUP_RATE_LIMITED(IP별 가입 요청 한도 초과).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: RFC 9457 오류. SIGNUP_UNAVAILABLE(요청 한도 저장소 Redis 장애).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/parent/login:
    post:
      operationId: parentPasswordLogin
      tags:
      - Auth
      summary: 학부모 ID·비밀번호 로그인 (#415)
      description: ID·비밀번호로 가입한 PARENT·ACTIVE 계정만 로그인한다(Google 계정은 비밀번호가 없다). 없는 ID·틀린 비밀번호·Google·관리자·비활성 계정은
        같은 401 INVALID_CREDENTIALS다. 연속 5회째 실패부터 15분간 423 LOGIN_LOCKED이며 비밀번호 재확인(/me/reauth/password) 실패와 횟수를 함께 센다.
        성공하면 Google 로그인과 같은 세션과 refresh 쿠키를 발급하고 기존 refresh 쿠키의 세션은 폐기한다.
      parameters:
      - $ref: '#/components/parameters/WebOrigin'
      - $ref: '#/components/parameters/RequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - loginId
              - password
              properties:
                loginId:
                  type: string
                  minLength: 1
                  maxLength: 254
                password:
                  type: string
                  minLength: 1
                  maxLength: 128
      responses:
        '200':
          description: 학부모 access와 refresh 쿠키. 본문은 refresh와 같다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParentTokenResponse'
          headers:
            Cache-Control:
              description: 인증 응답은 저장하지 않는다.
              schema:
                type: string
                const: no-store
            Set-Cookie:
              description: HttpOnly refresh 쿠키.
              schema:
                type: string
        '401':
          description: RFC 9457 오류. INVALID_CREDENTIALS.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '423':
          description: RFC 9457 오류. LOGIN_LOCKED(연속 5회 실패, 15분 뒤 자동 해제).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          $ref: '#/components/responses/Unavailable'
  /auth/refresh:
    post:
      operationId: refreshAccessToken
      tags:
      - Auth
      summary: 부모·관리자 access 재발급
      description: 부모·관리자 refresh를 원자적으로 회전한다. 최초 로그인부터 기본 7일 만료는 연장하지 않는다. 재사용은 해당 세션을 폐기한다. 학생 세션은 refresh를 발급하지 않으며 이 경로를
        사용할 수 없다.
      security:
      - RefreshCookie: []
      parameters:
      - $ref: '#/components/parameters/WebOrigin'
      - $ref: '#/components/parameters/RequestedWith'
      responses:
        '200':
          description: 새 access와 회전한 refresh 쿠키.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParentTokenResponse'
          headers:
            Cache-Control:
              description: 인증 응답은 저장하지 않는다.
              schema:
                type: string
                const: no-store
            Set-Cookie:
              description: HttpOnly 쿠키. 성공 콜백은 OAuth 상태 쿠키 삭제와 refresh 설정의 복수 Set-Cookie를 반환한다. 로그아웃은 refresh 쿠키를 만료시킨다. 학생 전환(/auth/student-sessions)은 잠긴 부모 refresh 쿠키를 지우지 않는다(V24).
              schema:
                type: string
        '401':
          description: RFC 9457 오류. UNAUTHENTICATED·REFRESH_REUSED 또는 PARENT_SESSION_LOCKED(동석 학생 화면 사용 중 잠긴 부모 세션. refresh 토큰을 소비하지 않으며 /auth/parent-unlock의 보호자 비밀번호로 복귀한다).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /auth/logout:
    post:
      operationId: logoutSession
      tags:
      - Auth
      summary: 현재 로그인 세션 종료
      description: 현재 refresh 쿠키 또는 Bearer 학생 access로 식별한 서비스 세션을 폐기한다. 다른 기기의 세션과 Google 계정 자체는 로그아웃하지 않는다. 인증 정보가 없어도 올바른
        요청 출처에서는 idempotent 204를 반환한다.
      security:
      - RefreshCookie: []
      - BearerAuth: []
      - {}
      parameters:
      - $ref: '#/components/parameters/WebOrigin'
      - $ref: '#/components/parameters/RequestedWith'
      responses:
        '204':
          description: 서비스 세션 폐기·refresh 쿠키 만료.
          headers:
            Cache-Control:
              description: 인증 응답은 저장하지 않는다.
              schema:
                type: string
                const: no-store
            Set-Cookie:
              description: HttpOnly 쿠키. 성공 콜백은 OAuth 상태 쿠키 삭제와 refresh 설정의 복수 Set-Cookie를 반환한다. 로그아웃은 refresh 쿠키를 만료시킨다. 학생 전환(/auth/student-sessions)은 잠긴 부모 refresh 쿠키를 지우지 않는다(V24).
              schema:
                type: string
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /auth/student/logout:
    post:
      operationId: logoutStudentSession
      tags: [Auth]
      summary: 학생 세션만 종료
      description: 학생 Bearer로 식별한 세션만 폐기한다. 보호자 refresh 쿠키와 등록 기기 쿠키는 읽거나 만료시키지 않는다. 만료·위조·누락 Bearer를 보호자 쿠키로 대체 인증하지 않는다.
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/WebOrigin'
      - $ref: '#/components/parameters/RequestedWith'
      responses:
        '204':
          description: 학생 세션 폐기. Set-Cookie 없음.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /auth/student-sessions:
    post:
      operationId: enterAccompaniedStudentSession
      tags:
      - Auth
      summary: 부모 동석 학생 진입
      description: '부모 Bearer 세션으로 연결·활성 자녀 및 현재 필수/법정대리인 동의를 확인한다. 별도 학생 세션의 access만 발급하고, 부모 세션은 잠가(version 증가)
        기존 부모 access와 refresh를 거부한다(PARENT_SESSION_LOCKED). 부모 refresh 쿠키는 지우지 않으며 /auth/parent-unlock의 보호자 비밀번호로 잠금을 푼다. PIN 단독 진입은 #58 소유다.'
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/WebOrigin'
      - $ref: '#/components/parameters/RequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentSessionRequest'
      responses:
        '200':
          description: 학생 access 전용 응답. Set-Cookie가 없어 잠긴 부모 refresh 쿠키가 남으며 원문 refresh를 응답하지 않는다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentTokenResponse'
          headers:
            Cache-Control:
              description: 인증 응답은 저장하지 않는다.
              schema:
                type: string
                const: no-store
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /auth/parent-unlock:
    post:
      operationId: unlockParentSession
      tags:
      - Auth
      summary: 학생 화면에서 학부모 화면 복귀
      description: refresh 쿠키의 잠긴 부모 세션과 보호자 비밀번호를 확인해 잠금을 풀고, 그 세션에서 들어간 학생 세션을 폐기한 뒤 refresh를 회전한다. 실패 횟수는 오류 응답 전에
        커밋한다. 5회째 실패부터 423 GUARDIAN_PASSWORD_LOCKED, 미설정은 409 GUARDIAN_PASSWORD_NOT_SET이며 Google 로그인으로 돌아온다. 잠기지 않은 세션은 refresh와 같다.
      security:
      - RefreshCookie: []
      parameters:
      - $ref: '#/components/parameters/WebOrigin'
      - $ref: '#/components/parameters/RequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - password
              properties:
                password:
                  type: string
                  maxLength: 128
      responses:
        '200':
          description: 새 부모 access와 회전한 refresh 쿠키. 본문은 refresh와 같다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParentTokenResponse'
          headers:
            Cache-Control:
              description: 인증 응답은 저장하지 않는다.
              schema:
                type: string
                const: no-store
            Set-Cookie:
              description: 회전한 HttpOnly refresh 쿠키.
              schema:
                type: string
        '401':
          description: RFC 9457 오류. UNAUTHENTICATED·REFRESH_REUSED 또는 GUARDIAN_PASSWORD_INVALID(remainingAttempts 포함).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: RFC 9457 오류. GUARDIAN_PASSWORD_NOT_SET.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '423':
          description: RFC 9457 오류. GUARDIAN_PASSWORD_LOCKED(remainingAttempts 0).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          $ref: '#/components/responses/Unavailable'
  /me:
    get:
      operationId: getCurrentIdentity
      tags:
      - Account
      summary: 본인 역할·시작 화면 조회
      description: '학생은 부모 개인정보·관리자 권한을 받지 않는다. 신규 부모는 필수 동의·자녀 등록 단계로 안내한다. 동의 저장·자녀 등록 API는 #37 소유다.'
      responses:
        '200':
          description: 현재 인증 상태에 따라 역할별 최소 정보 반환.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ParentMeResponse'
                - $ref: '#/components/schemas/StudentMeResponse'
          headers:
            Cache-Control:
              description: 인증 응답은 저장하지 않는다.
              schema:
                type: string
                const: no-store
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
    patch:
      operationId: updateAccountName
      tags:
      - Account
      summary: 본인 표시 이름 수정
      responses:
        '200':
          description: 정상 처리
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountName'
        '400':
          description: 유효하지 않은 입력
        '401':
          description: 인증 실패
        '403':
          description: 권한/재인증 실패
        '409':
          description: 정책/상태 충돌
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
              required:
              - name
              additionalProperties: false

  /admin/ai-usage:
    get:
      operationId: getAiUsage
      tags: [Admin]
      summary: SERVICE_OPS AI 사용량 조회
      description: KST 날짜 양 끝 포함 최대 366일이며 연도는 0001~9999만 허용한다. 초과·역전 기간이나 허용 연도 밖의 날짜는 DB 조회 전 400 VALIDATION_FAILED로 거부한다. 성공·실패 전체 평균 지연과 저장된 소비 시점 비용을 집계한다. 미산정 비용이 포함되면 costUsd는 null이다.
      parameters:
      - {name: from, in: query, required: true, schema: {type: string, format: date}}
      - {name: to, in: query, required: true, schema: {type: string, format: date}}
      - name: callType
        in: query
        schema: {$ref: '#/components/schemas/CallType'}
      responses:
        '200':
          description: 기간 내 호출이 있는 종류별 집계. 빈 기간은 items 빈 배열.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AiUsageResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/model-loading:
    get:
      operationId: listModelLoading
      tags: [ModelRegistry]
      summary: SERVICE_OPS scoring Pod별 로딩 보고
      description: 최근 120초 보고 기준. 전체 배포 replica 수나 품질·추론 승인을 의미하지 않는다. 24시간 지난 기록은 제외한다.
      responses:
        '200':
          description: Pod별 상태와 활성 버전별 관측 집계
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModelLoadingStatus'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/model-versions:
    get:
      operationId: listModelVersions
      tags: [ModelRegistry]
      summary: SERVICE_OPS 버전 목록
      parameters:
      - {name: kind, in: query, schema: {$ref: '#/components/schemas/ModelKind'}}
      - {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}
      - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: SERVICE_OPS 버전 목록 결과
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModelVersionPage'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
