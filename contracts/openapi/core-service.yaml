components:
  securitySchemes:
    StudentDeviceCookie: {type: apiKey, in: cookie, name: student_device}
    WithdrawalReceipt:
      type: apiKey
      in: header
      name: X-Withdrawal-Status-Token
    InternalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: core가 발급·검증하는 HS256 access JWT. sid·ver와 최신 서버 세션·권한을 확인한다.
    RefreshCookie:
      type: apiKey
      in: cookie
      name: sagomungchi_refresh
      description: 부모·관리자 전용 HttpOnly·Secure·SameSite=Strict, Path=/api/v1/auth. 원문은 서버 DB에 저장하지 않는다.
  parameters:
    MissionId:
      name: missionId
      in: path
      required: true
      schema: {type: string, format: uuid}
    AttemptId:
      name: attemptId
      in: path
      required: true
      schema: {type: string, format: uuid}
    WebOrigin:
      name: Origin
      in: header
      required: true
      description: AUTH_WEB_ORIGIN과 정확히 일치. 로컬 기본은 아래 예시. 배포에서는 HTTPS origin을 사용한다.
      schema:
        type: string
        format: uri
      example: http://localhost:5173
    RequestedWith:
      name: X-Requested-With
      in: header
      required: true
      schema:
        type: string
        const: XMLHttpRequest
  schemas:
    ModelPreflightArtifact:
      type: object
      additionalProperties: false
      required:
      - file
      - bytes
      - sha256
      properties:
        file:
          type: string
          enum:
          - config.json
          - tokenizer.json
          - tokenizer_config.json
          - train_info.json
          - score_cuts.json
          - model.safetensors
        bytes:
          type: integer
          minimum: 0
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
    ModelPreflightRequest:
      type: object
      additionalProperties: false
      required:
      - name
      - version
      - artifactUri
      - files
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        version:
          type: string
          minLength: 1
          maxLength: 100
        artifactUri:
          type: string
          minLength: 1
          maxLength: 2048
        files:
          type: array
          minItems: 6
          maxItems: 6
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ModelPreflightArtifact'
          description: 여섯 파일명을 각각 한 번씩 포함한다.
    ModelPreflightResult:
      type: object
      additionalProperties: false
      required:
      - status
      - code
      - files
      properties:
        status:
          type: string
          enum:
          - PASS
          - FAIL
        code:
          type: string
          enum:
          - FILES_AND_METADATA_VERIFIED
          - INVALID_ARTIFACT_URI
          - UNSUPPORTED_MODEL
          - PREFLIGHT_TIMEOUT
          - FILE_CHECK_FAILED
          - OUTPUT_MISMATCH
          - INVALID_METADATA
        files:
          type: array
          maxItems: 6
          items:
            type: object
            additionalProperties: false
            required:
            - file
            - status
            - code
            properties:
              file:
                type: string
                enum:
                - config.json
                - tokenizer.json
                - tokenizer_config.json
                - train_info.json
                - score_cuts.json
                - model.safetensors
              status:
                type: string
                enum:
                - PASS
                - FAIL
              code:
                type: string
                enum:
                - OK
                - SIZE_MISMATCH
                - JSON_TOO_LARGE
                - HASH_MISMATCH
                - INVALID_METADATA
                - CHECKSUM_UNAVAILABLE
                - FILE_MISSING
                - ACCESS_DENIED
                - OBJECT_CHANGED
                - STORAGE_UNAVAILABLE

    ModelLoadingStatus:
      type: object
      required: [observedAt, staleAfterSeconds, populationSource, pods, summaries]
      properties:
        observedAt: {type: string, format: date-time}
        staleAfterSeconds: {type: integer, const: 120}
        populationSource: {type: string, const: RECENT_REPORTS}
        pods:
          type: array
          items:
            type: object
            required: [podId, instanceId, reportedAt, stale, models]
            properties:
              podId: {type: string}
              instanceId: {type: string, format: uuid}
              reportedAt: {type: string, format: date-time}
              stale: {type: boolean}
              models:
                type: array
                items:
                  type: object
                  required: [name, version, revision, status, errorType, loadedVersion, loadedRevision, previousModelRetained]
                  properties:
                    name: {type: string}
                    version: {type: string}
                    revision: {type: integer, minimum: 1}
                    status: {type: string, enum: [LOADING, LOADED, FAILED]}
                    errorType: {type: [string, 'null']}
                    loadedVersion: {type: [string, 'null']}
                    loadedRevision: {type: [integer, 'null']}
                    previousModelRetained: {type: boolean}
        summaries:
          type: array
          items:
            type: object
            required: [name, version, revision, observedPods, loadedPods, failedPods]
            properties:
              name: {type: string}
              version: {type: string}
              revision: {type: [integer, 'null']}
              observedPods: {type: integer, minimum: 0}
              loadedPods: {type: integer, minimum: 0}
              failedPods: {type: array, items: {type: string}}
    GuardianTransferView:
      type: object
      required:
      - id
      - childId
      - childName
      - senderName
      - recipientName
      - recipientEmail
      - direction
      - includeConversations
      - status
      - createdAt
      - resolvedAt
      properties:
        id:
          type: string
          format: uuid
        childId:
          type: string
          format: uuid
        childName:
          type: string
          nullable: true
        senderName:
          type: string
          nullable: true
        recipientName:
          type: string
          nullable: true
        recipientEmail:
          type: string
        direction:
          type: string
          enum:
          - INCOMING
          - OUTGOING
        includeConversations:
          type: boolean
        status:
          type: string
          enum:
          - PENDING
          - ACCEPTED
          - REJECTED
          - CANCELLED
        createdAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
          nullable: true
    GuardianTransferRecipient:
      type: object
      required:
      - id
      - name
      - email
      - childCount
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
        email:
          type: string
          format: email
        childCount:
          type: integer
          minimum: 0
          maximum: 3
    ReportTemplateSettings:
      additionalProperties: false
      properties:
        sectionOrder:
          items:
            type: string
          title: Sectionorder
          type: array
        highlightMetrics:
          items:
            enum:
            - ATTEMPTS
            - COMPLETED
            - UNASSISTED
            type: string
          title: Highlightmetrics
          type: array
        tone:
          default: DEFAULT
          enum:
          - DEFAULT
          - EASY
          - CONCISE
          title: Tone
          type: string
      title: TemplateSettings
      type: object
    ReportTemplateSnapshot:
      type: object
      required:
      - settings
      - revision
      properties:
        settings:
          $ref: '#/components/schemas/ReportTemplateSettings'
        revision:
          type: integer
          minimum: 0
    ReportTemplateProposal:
      type: object
      properties:
        proposalId:
          type: string
          format: uuid
        settings:
          $ref: '#/components/schemas/ReportTemplateSettings'
        expiresAt:
          type: string
          format: date-time
        clarification:
          type: string
      oneOf:
      - required:
        - proposalId
        - settings
        - expiresAt
      - required:
        - clarification
    StudentSharingPreference:
      type: object
      additionalProperties: false
      required: [studentId, parentSharingEnabled]
      properties:
        studentId: {type: string, format: uuid}
        parentSharingEnabled: {type: boolean, default: false}
    CommunityReaction: {type: string, enum: [NEW_IDEA, CLEAR_REASON, DIFFERENT_VIEW, WANT_MORE]}
    CommunityPostStatus: {type: string, enum: [VISIBLE, HIDDEN_SETTING, HIDDEN_REPORT, REMOVED]}
    CommunitySettings:
      type: object
      additionalProperties: false
      required: [enabled, consentGranted, updatedAt]
      properties:
        enabled: {type: boolean, description: 학생 본인 공개 설정. 기본 false}
        consentGranted: {type: boolean, description: 현재 연결 보호자의 COMMUNITY 동의 유효 여부}
        updatedAt: {type: ['string', 'null'], format: date-time}
    CommunityAuthor:
      type: object
      additionalProperties: false
      required: [nickname, look]
      properties:
        nickname: {type: string}
        look:
          type: object
          additionalProperties: false
          required: [theme, companion, equipped]
          properties:
            theme: {$ref: '#/components/schemas/StudentLookTheme'}
            companion: {$ref: '#/components/schemas/StudentLookCompanion'}
            equipped: {$ref: '#/components/schemas/CharacterLookEquipped'}
    CommunityPost:
      type: object
      additionalProperties: false
      required: [postId, author, answer, myReactions, createdAt]
      description: 학생 ID·반응 수 없음. answer는 learning 마지막 답변 content 그대로
      properties:
        postId: {type: string, format: uuid}
        author: {$ref: '#/components/schemas/CommunityAuthor'}
        answer: {}
        myReactions: {type: array, items: {$ref: '#/components/schemas/CommunityReaction'}}
        createdAt: {type: ['string', 'null'], format: date-time}
    CommunityPostPage:
      type: object
      additionalProperties: false
      required: [items, page, size]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/CommunityPost'}}
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1, maximum: 100}
    CommunityOwnPost:
      type: object
      additionalProperties: false
      required: [postId, missionId, missionTitle, answer, status, reactions, createdAt]
      properties:
        postId: {type: string, format: uuid}
        missionId: {type: ['string', 'null'], format: uuid}
        missionTitle: {type: ['string', 'null']}
        answer: {}
        status: {$ref: '#/components/schemas/CommunityPostStatus'}
        reactions:
          type: object
          additionalProperties: false
          required: [NEW_IDEA, CLEAR_REASON, DIFFERENT_VIEW, WANT_MORE]
          properties:
            NEW_IDEA: {type: integer, minimum: 0}
            CLEAR_REASON: {type: integer, minimum: 0}
            DIFFERENT_VIEW: {type: integer, minimum: 0}
            WANT_MORE: {type: integer, minimum: 0}
        createdAt: {type: ['string', 'null'], format: date-time}
    CommunityOwnPostList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/CommunityOwnPost'}}
    CommunityLinkedPost:
      type: object
      description: 관리자 신고 상세의 공유물 원문(SERVICE_OPS, 열람마다 SUPPORT_ORIGINAL_VIEW 감사). 파기된 공유물은 available=false만
      required: [postId, available]
      properties:
        postId: {type: string, format: uuid}
        available: {type: boolean}
        missionId: {type: ['string', 'null'], format: uuid}
        status: {$ref: '#/components/schemas/CommunityPostStatus'}
        answer: {}
        authorStudentId: {type: string, format: uuid}
    StudentLookTheme: {type: string, enum: [lake, forest, factory, space, sea]}
    StudentLookCompanion: {type: string, enum: [mungchi, tori, mongdol, kongi, monggeul]}
    StudentLook:
      type: object
      additionalProperties: false
      required: [theme, companion, updatedAt, equipped]
      properties:
        theme: {$ref: '#/components/schemas/StudentLookTheme'}
        companion: {$ref: '#/components/schemas/StudentLookCompanion'}
        updatedAt: {type: [string, 'null'], format: date-time}
        equipped: {$ref: '#/components/schemas/LookEquipped'}
    LookItemSlot:
      type: string
      description: 캐릭터 슬롯 4개와 생활공간 가구 슬롯 DESK(책상)·WALL(추억의 벽)·WARDROBE(옷장)(#555, P22 개정)
      enum: [HAT, OUTFIT, ACCESSORY, BACKGROUND, DESK, WALL, WARDROBE]
    LookItemStatus: {type: string, enum: [ON_SALE, STOPPED]}
    LookEquipped:
      type: object
      description: >-
        슬롯별 착용 look_item 코드 또는 null(#389). 응답은 캐릭터 네 슬롯과 가구 세 슬롯(#555)을 모두 담는다.
        가구 슬롯 null은 그 가구의 기본 스킨(행 없이 항상 해금), BACKGROUND는 생활공간 방 벽지로도 쓰이고 null이면 기본 벽지
      additionalProperties: false
      required: [HAT, OUTFIT, ACCESSORY, BACKGROUND, DESK, WALL, WARDROBE]
      properties:
        HAT: {type: [string, 'null']}
        OUTFIT: {type: [string, 'null']}
        ACCESSORY: {type: [string, 'null']}
        BACKGROUND: {type: [string, 'null']}
        DESK: {type: [string, 'null']}
        WALL: {type: [string, 'null']}
        WARDROBE: {type: [string, 'null']}
    LookEquippedUpdate:
      type: object
      description: 보낸 슬롯만 바꾸는 착용 변경(#555). 값 null은 착용 해제(가구는 기본 스킨), 보내지 않은 슬롯은 유지
      additionalProperties: false
      properties:
