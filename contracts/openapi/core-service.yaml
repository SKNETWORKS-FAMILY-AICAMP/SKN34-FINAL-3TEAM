          description: NOT_FOUND — 대상 계정 없음
        '409':
          description: 계정 상태 충돌
    post:
      operationId: requestGuardianTransfer
      description: 정식 자녀 이관 흐름(#289·#309). 신규 대상 조회·요청·수락은 app.guardian-transfer.enabled=true(기본 false)와 필수 이용 동의가 필요. 본인의 목록 조회·거절·취소는 동의 회복 경로로 설정·동의 상태와 관계없이 제공(#307). 활성 학부모 인증과 소유권 검사는 유지.
      responses:
        '200':
          description: 성공
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuardianTransferView'
        '400':
          description: 입력 또는 동의 문서 오류
        '401':
          description: 로그인 필요
        '403':
          description: 권한·동의·재인증 오류
        '404':
          description: NOT_FOUND — 대상 계정 없음·비활성 또는 기능 비활성
        '409':
          description: TRANSFER_PENDING — 다른 이관 대기 요청. TRANSFER_CHILD_UNAVAILABLE — 삭제 중·비활성 자녀. TRANSFER_PAYMENT_BLOCKED — 자녀 결제·구독 정리 필요. CHILD_LIMIT_REACHED — 수신자 3명 한도. WITHDRAWAL_BLOCKED — 발신자 구독·환불 정리 필요
      parameters:
      - name: X-Reauth-Token
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - childId
              - recipientId
              properties:
                childId:
                  type: string
                  format: uuid
                recipientId:
                  type: string
                  format: uuid
                includeConversations:
                  type: boolean
                  default: false
  /guardian-transfers/{id}/accept:
    post:
      operationId: acceptGuardianTransfer
      description: 정식 자녀 이관 흐름(#289·#309). 신규 대상 조회·요청·수락은 app.guardian-transfer.enabled=true(기본 false)와 필수 이용 동의가 필요. 본인의 목록 조회·거절·취소는 동의 회복 경로로 설정·동의 상태와 관계없이 제공(#307). 활성 학부모 인증과 소유권 검사는 유지.
      responses:
        '200':
          description: 성공
          headers:
            Cache-Control:
              schema:
