      description: SERVICE_OPS. REPORT는 새 ADMIN_RETRY job, CONVERSATION은 영속 대기 요청을 202와 Location으로 접수한다. NOTIFICATION은 기존 실제 처리 결과 200이다. 원작업은 보존한다.
      parameters:
