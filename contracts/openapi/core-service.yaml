          type: array
          items:
            type: object
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/AnalysisEvidence'
        verification:
          type: object
          additionalProperties: false
          required:
          - numbersMatched
          - quotesMatched
          - contentAllowed
          properties:
            numbersMatched:
              type: boolean
              const: true
            quotesMatched:
              type: boolean
              const: true
            contentAllowed:
              type: boolean
              const: true
        recordCount:
          type: integer
          minimum: 0
        fallback:
          anyOf:
          - type: object
            additionalProperties: false
            required:
            - reason
            - draftVerification
            properties:
              reason:
                enum:
                - VERIFICATION_FAILED
                - AI_UNAVAILABLE
              draftVerification:
                anyOf:
                - $ref: '#/components/schemas/AnalysisVerification'
                - type: 'null'
            allOf:
            - if:
                properties:
                  reason:
                    const: VERIFICATION_FAILED
              then:
                properties:
                  draftVerification:
                    type: object
                    anyOf:
                    - properties:
                        numbersMatched:
                          const: false
                    - properties:
                        quotesMatched:
                          const: false
                    - properties:
                        contentAllowed:
                          const: false
              else:
                properties:
                  draftVerification:
                    type: 'null'
          - type: 'null'
        notice:
          anyOf:
          - $ref: '#/components/schemas/AnalysisNotice'
          - type: 'null'
      oneOf:
      - properties:
          source:
            enum:
            - LLM
            - LLM_RETRY
          fallback:
            type: 'null'
          notice:
            type: 'null'
      - required:
        - fallback
        properties:
          source:
            const: TEMPLATE
          fallback:
            type: object
          notice:
            type: 'null'
      - required:
        - notice
        properties:
          source:
            const: TEMPLATE
          fallback:
            type: 'null'
          notice:
            type: object
