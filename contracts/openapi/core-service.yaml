        STUDENT 전용(FN-RET-07·08, 에픽 #436). 본문 {kind}가 INTRO·OUTRO가 아니면 core가 400 VALIDATION_FAILED로 막고, 맞으면 {kind}만 다시 만들어
        learning POST /internal/students/{studentId}/weekly-theme/story-views?grade&date&sundayTheme로 넘긴다. INTRO는 월요일·OUTRO는 토요일만 허용하고
        주 1회 멱등은 learning(#438) 판정이며 응답·오류 코드를 그대로 전달한다. Cache-Control no-store.
