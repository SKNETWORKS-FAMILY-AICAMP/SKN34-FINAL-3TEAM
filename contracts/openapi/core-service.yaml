        '409':
          description: TRANSFER_ALREADY_RESOLVED — 이미 다른 상태로 종료
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /guardian-transfers/{id}/cancel:
