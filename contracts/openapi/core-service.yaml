  /students/me/weekly-theme:
    get:
      operationId: getWeeklyTheme
      tags: [WeeklyTheme]
      summary: 이번 주 학년 테마 (#387·#436)
      description: >-
        STUDENT 전용(FN-RET-07·08, api-spec 2.11). core가 본인 학생 학년으로 테마 학년(G3~G6, 중학생은 G6, 에픽 #436)과 KST 오늘 날짜를 정해
        learning GET /internal/students/{studentId}/weekly-theme?grade&date&sundayTheme로 넘기고 결과를 그대로 전달한다. 클라이언트 query는 쓰지 않는다. Cache-Control no-store.
        sundayTheme(#485)은 KST 일요일이고 상품이 일요일 테마를 허용할 때만 true(상품 확인 실패는 false로 넘김).
        200 응답의 days[].attemptStatus COMPLETED(학습 완료)·days[].completedOnDay(당일 풀이 THEME_ON_TIME, 사건 키 weekStart:day)·
        completed(개근 THEME_COMPLETED, 사건 키 weekStart, learning 기존 칸 이름 #506)·finished(주간 완주 THEME_FINISHED, 사건 키 weekStart)가 true면 포인트를 적립·보충한다(#389·#485).
        칸이 없거나(completedOnDay·finished는 learning #484 전까지 없음) boolean true가 아니면 그 적립만 건너뛰고 응답은 바꾸지 않는다.
      responses:
        '200':
          description: 테마·요일 상태·되돌아보기 목록(learning 소유 모양)
          headers:
            Cache-Control: {schema: {type: string}, description: no-store}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WeeklyThemeDocument'}
        default: {$ref: '#/components/responses/LearningProblem'}
  /students/me/weekly-theme/review-views:
    post:
      operationId: recordWeeklyThemeReviewView
      tags: [WeeklyTheme]
      summary: 토·일 되돌아보기 열람 기록 (#387)
      description: >-
        STUDENT 전용(FN-RET-08). learning POST /internal/students/{studentId}/weekly-theme/review-views?grade&date&sundayTheme로 넘김(멱등·주 1회는 learning).
        응답 {firstViewThisWeek, completed}는 되돌아보기·개근(completed, THEME_COMPLETED) 포인트 근거(#389·#485). Cache-Control no-store.
      responses:
        '200':
          description: 열람 기록 결과(learning 소유 모양)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WeeklyThemeDocument'}
        default: {$ref: '#/components/responses/LearningProblem'}
