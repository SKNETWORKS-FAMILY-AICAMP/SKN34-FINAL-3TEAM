  /internal/students/{studentId}/profile:
    servers:
    - url: /
    get:
      operationId: getInternalStudentProfile
      tags: [Children]
      summary: 리포트 생성용 활성 학생 UUID·별명·학부모 공유 설정 조회
      description: 내부 토큰과 SYSTEM 역할 및 대상 학생 scope 필수. 역할·scope 검사 후 기존 ACTIVE 전용 조회를 사용한다. 공개 Bearer 인증만으로 호출할 수 없다.
      security: [{InternalToken: []}]
      parameters:
      - name: studentId
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: X-User-Role
        in: header
        required: true
        schema: {type: string, enum: [SYSTEM]}
      - name: X-Student-Scope
        in: header
        required: true
        description: 대상 studentId를 포함하는 콤마 구분 UUID 목록
        schema: {type: string}
      responses:
        '200':
          description: 활성 학생의 UUID·별명·학부모 공유 설정(parentSharingEnabled)만 반환
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalStudentProfile'
        '400':
          description: VALIDATION_FAILED — 잘못된 UUID
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '401':
          description: UNAUTHENTICATED — 내부 토큰 누락·불일치
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '403':
          description: FORBIDDEN — SYSTEM 외·역할 누락·scope 누락/불일치
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '404':
          description: NOT_FOUND — 미존재 또는 ACTIVE 외 상태(DELETION_REQUESTED·DELETED 포함)
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '500':
          description: INTERNAL_ERROR — 예상하지 못한 조회 실패
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
