openapi: 3.1.0
info:
  title: 사고뭉치 core-service API
  version: 1.0.0
  description: '#36 인증과 #43 관리자 버전·사용량 API를 정의한다. access는 메모리, refresh는 보안 쿠키. POST 쿠키 API는 정확한 Origin과 X-Requested-With를 요구한다. #58의
    POST /auth/student/devices, GET /auth/student/profiles, POST /auth/student/login은 Bearer만 제외하며 실제 기기/PIN 검증·신규 API 구현은
    이 계약의 범위 밖이다.'
servers:
- url: /api/v1
  description: web과 동일 origin의 core 공개 API
tags:
- name: Auth
- name: Account
security:
- BearerAuth: []
paths:
  /auth/google/authorize:
    get:
      operationId: startGoogleLogin
      tags:
      - Auth
      summary: Google 로그인·가입 시작
      description: core가 state·nonce·PKCE S256을 생성하고 Google로 이동한다. Google 키가 없으면 503이다.
      security: []
      responses:
        '302':
          description: Google 인가 페이지로 이동. OAuth 상태 쿠키는 HttpOnly·SameSite=Lax, 10분.
          headers:
            Cache-Control:
              description: 인증 응답은 저장하지 않는다.
              schema:
                type: string
                const: no-store
            Set-Cookie:
              description: HttpOnly 쿠키. 성공 콜백은 OAuth 상태 쿠키 삭제와 refresh 설정의 복수 Set-Cookie를 반환한다. 학생 전환·로그아웃은 refresh 쿠키를 만료시킨다.
              schema:
                type: string
            Location:
              description: Google 인가 URL. 서비스 access/refresh는 포함하지 않는다.
              schema:
                type: string
                format: uri
        '503':
          $ref: '#/components/responses/Unavailable'
  /auth/google/callback:
    get:
      operationId: completeGoogleLogin
      tags:
      - Auth
      summary: Google 인가 응답 처리
      description: state 쿠키·nonce·PKCE와 ID 토큰 JWKS 서명·iss·aud·exp를 검증한다. Google 계정은 provider+sub로 식별하며 이메일 자동 연결은 하지 않는다.
        성공하면 refresh 쿠키를 설정하고 /oauth/complete로 이동한다.
      security: []
      parameters:
      - name: code
        in: query
        required: false
        description: Google 일회용 인가 코드. 성공 흐름에 필수.
        schema:
          type: string
      - name: state
        in: query
        required: false
        description: 로그인 시작 시 생성한 state. 성공 흐름에 필수.
        schema:
          type: string
      - name: error
        in: query
        required: false
        description: Google이 반환한 오류(사용자 취소 포함).
        schema:
          type: string
      - name: sagomungchi_oauth
        in: cookie
        required: false
        description: 성공하려면 유효한 로그인 상태 쿠키가 있어야 한다. 없거나 만료되면 실패 화면으로 이동한다.
        schema:
          type: string
      responses:
        '302':
          description: '성공: /oauth/complete. 실패: /login?oauthError=CANCELLED|ACCOUNT_EXISTS|OAUTH_UNAVAILABLE|OAUTH_FAILED.
            상태 쿠키 삭제.'
          headers:
            Cache-Control:
              description: 인증 응답은 저장하지 않는다.
              schema:
                type: string
                const: no-store
            Set-Cookie:
              description: HttpOnly 쿠키. 성공 콜백은 OAuth 상태 쿠키 삭제와 refresh 설정의 복수 Set-Cookie를 반환한다. 학생 전환·로그아웃은 refresh 쿠키를 만료시킨다.
              schema:
                type: string
            Location:
              schema:
                type: string
                format: uri
              description: 설정된 web origin 안의 성공 또는 실패 경로.
  /auth/refresh:
    post:
      operationId: refreshAccessToken
      tags:
      - Auth
      summary: 부모·관리자 access 재발급
      description: 부모·관리자 refresh를 원자적으로 회전한다. 최초 로그인부터 기본 7일 만료는 연장하지 않는다. 재사용은 해당 세션을 폐기한다. 학생 세션은 refresh를 발급하지 않으며 이 경로를
        사용할 수 없다.
      security:
      - RefreshCookie: []
      parameters:
      - $ref: '#/components/parameters/WebOrigin'
      - $ref: '#/components/parameters/RequestedWith'
      responses:
        '200':
          description: 새 access와 회전한 refresh 쿠키.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParentTokenResponse'
          headers:
            Cache-Control:
              description: 인증 응답은 저장하지 않는다.
              schema:
                type: string
                const: no-store
            Set-Cookie:
              description: HttpOnly 쿠키. 성공 콜백은 OAuth 상태 쿠키 삭제와 refresh 설정의 복수 Set-Cookie를 반환한다. 학생 전환·로그아웃은 refresh 쿠키를 만료시킨다.
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /auth/logout:
    post:
      operationId: logoutSession
      tags:
      - Auth
      summary: 현재 로그인 세션 종료
      description: 현재 refresh 쿠키 또는 Bearer 학생 access로 식별한 서비스 세션을 폐기한다. 다른 기기의 세션과 Google 계정 자체는 로그아웃하지 않는다. 인증 정보가 없어도 올바른
        요청 출처에서는 idempotent 204를 반환한다.
      security:
      - RefreshCookie: []
      - BearerAuth: []
      - {}
      parameters:
      - $ref: '#/components/parameters/WebOrigin'
      - $ref: '#/components/parameters/RequestedWith'
      responses:
        '204':
          description: 서비스 세션 폐기·refresh 쿠키 만료.
          headers:
            Cache-Control:
              description: 인증 응답은 저장하지 않는다.
              schema:
                type: string
                const: no-store
            Set-Cookie:
              description: HttpOnly 쿠키. 성공 콜백은 OAuth 상태 쿠키 삭제와 refresh 설정의 복수 Set-Cookie를 반환한다. 학생 전환·로그아웃은 refresh 쿠키를 만료시킨다.
              schema:
                type: string
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /auth/student-sessions:
    post:
      operationId: enterAccompaniedStudentSession
      tags:
      - Auth
      summary: 부모 동석 학생 진입
      description: '부모 Bearer와 같은 세션의 refresh로 연결·활성 자녀 및 현재 필수/법정대리인 동의를 확인한다. 학생 access만 발급하고 부모 refresh를 소비·삭제하며 기존 부모
        access를 거부한다. PIN 단독 진입은 #58 소유다.'
      security:
      - BearerAuth: []
        RefreshCookie: []
      parameters:
      - $ref: '#/components/parameters/WebOrigin'
      - $ref: '#/components/parameters/RequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentSessionRequest'
      responses:
        '200':
          description: 학생 access 전용 응답. refresh 쿠키는 만료되며 원문 refresh를 응답하지 않는다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentTokenResponse'
          headers:
            Cache-Control:
              description: 인증 응답은 저장하지 않는다.
              schema:
                type: string
                const: no-store
            Set-Cookie:
              description: HttpOnly 쿠키. 성공 콜백은 OAuth 상태 쿠키 삭제와 refresh 설정의 복수 Set-Cookie를 반환한다. 학생 전환·로그아웃은 refresh 쿠키를 만료시킨다.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /me:
    get:
      operationId: getCurrentIdentity
      tags:
      - Account
      summary: 본인 역할·시작 화면 조회
      description: '학생은 부모 개인정보·관리자 권한을 받지 않는다. 신규 부모는 필수 동의·자녀 등록 단계로 안내한다. 동의 저장·자녀 등록 API는 #37 소유다.'
      responses:
        '200':
          description: 현재 인증 상태에 따라 역할별 최소 정보 반환.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ParentMeResponse'
                - $ref: '#/components/schemas/StudentMeResponse'
          headers:
            Cache-Control:
              description: 인증 응답은 저장하지 않는다.
              schema:
                type: string
                const: no-store
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /admin/ai-usage:
    get:
      operationId: getAiUsage
      tags: [Admin]
      summary: SERVICE_OPS AI 사용량 조회
      description: KST 날짜 양 끝 포함. 성공·실패 전체 평균 지연과 저장된 소비 시점 비용을 집계한다. 미산정 비용이 포함되면 costUsd는 null이다.
      parameters:
      - {name: from, in: query, required: true, schema: {type: string, format: date}}
      - {name: to, in: query, required: true, schema: {type: string, format: date}}
      - name: callType
        in: query
        schema: {$ref: '#/components/schemas/CallType'}
      responses:
        '200':
          description: 기간 내 호출이 있는 종류별 집계. 빈 기간은 items 빈 배열.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AiUsageResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/model-versions:
    get:
      operationId: listModelVersions
      tags: [ModelRegistry]
      summary: SERVICE_OPS 버전 목록
      parameters:
      - {name: kind, in: query, schema: {$ref: '#/components/schemas/ModelKind'}}
      - {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}
      - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: SERVICE_OPS 버전 목록 결과
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModelVersionPage'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: registerModelVersion
      tags: [ModelRegistry]
      summary: SERVICE_OPS 평가 근거와 버전 등록
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterModelVersion'}
      responses:
        '201':
          description: SERVICE_OPS 평가 근거와 버전 등록 결과
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModelVersion'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/ModelNotFound'}
        '409': {$ref: '#/components/responses/ModelConflict'}
        '422': {$ref: '#/components/responses/ModelApprovalRejected'}
  /admin/model-versions/{versionId}/activate:
    post:
      operationId: activateModelVersion
      tags: [ModelRegistry]
      summary: SERVICE_OPS 최초 사람 승인·활성화
      parameters:
      - {name: versionId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ActivateModelVersion'}
      responses:
        '200':
          description: SERVICE_OPS 최초 사람 승인·활성화 결과
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModelVersion'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/ModelNotFound'}
        '409': {$ref: '#/components/responses/ModelConflict'}
        '422': {$ref: '#/components/responses/ModelApprovalRejected'}
  /admin/model-versions/{versionId}/rollback:
    post:
      operationId: rollbackModelVersion
      tags: [ModelRegistry]
      summary: SERVICE_OPS 이전 승인 범위 내 복귀
      parameters:
      - {name: versionId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RollbackModelVersion'}
      responses:
        '200':
          description: SERVICE_OPS 이전 승인 범위 내 복귀 결과
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModelVersion'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/ModelNotFound'}
        '409': {$ref: '#/components/responses/ModelConflict'}
        '422': {$ref: '#/components/responses/ModelApprovalRejected'}
  /internal/model-versions/active:
    get:
      operationId: activeModelVersions
      tags: [ModelRegistry]
      summary: 기동 시 활성 버전 조회
      servers: [{url: /}]
      security: [{InternalToken: []}]
      description: Pod별 큐 바인딩 후 조회한다. 초기 조회 중 이벤트를 보존·조정하고 그룹별 높은 revision만 적용하며 scopes 밖에 적용하지 않는다.
      responses:
        '200':
          description: 기동 시 활성 버전 조회 결과
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ActiveModelVersions'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/ModelStateUnavailable'}

components:
  securitySchemes:
    InternalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: core가 발급·검증하는 HS256 access JWT. sid·ver와 최신 서버 세션·권한을 확인한다.
    RefreshCookie:
      type: apiKey
      in: cookie
      name: sagomungchi_refresh
      description: 부모·관리자 전용 HttpOnly·Secure·SameSite=Strict, Path=/api/v1/auth. 원문은 서버 DB에 저장하지 않는다.
  parameters:
    WebOrigin:
      name: Origin
      in: header
      required: true
      description: AUTH_WEB_ORIGIN과 정확히 일치. 로컬 기본은 아래 예시. 배포에서는 HTTPS origin을 사용한다.
      schema:
        type: string
        format: uri
      example: http://localhost:5173
    RequestedWith:
      name: X-Requested-With
      in: header
      required: true
      schema:
        type: string
        const: XMLHttpRequest
  schemas:
    ModelKind:
      type: string
      enum:
      - RUBRIC
      - MODEL
      - PROMPT
      - GENERATION
    EvaluationEvidence:
      type: object
      additionalProperties: false
      required:
      - datasetId
      - datasetVersion
      - baselineVersion
      - comparisonReport
      - trainingEvaluationSeparation
      - quoteAccuracy
      - calculationAccuracy
      - humanReview
      - evaluatedScopes
      properties:
        datasetId: &id001
          type: string
          minLength: 1
        datasetVersion: *id001
        baselineVersion: *id001
        comparisonReport: *id001
        trainingEvaluationSeparation: *id001
        quoteAccuracy: *id001
        calculationAccuracy: *id001
        humanReview: *id001
        evaluatedScopes: &id002
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            pattern: ^[a-z0-9][a-z0-9._:/-]{0,199}$
    RegisterModelVersion:
      type: object
      additionalProperties: false
      required:
      - kind
      - name
      - version
      - evaluation
      properties:
        kind:
          $ref: '#/components/schemas/ModelKind'
        name:
          type: string
          minLength: 1
          maxLength: 100
        version:
          type: string
          minLength: 1
          maxLength: 100
        refId:
          type:
          - string
          - 'null'
          format: uuid
        artifactUri:
          type:
          - string
          - 'null'
          maxLength: 2048
        evaluation:
          $ref: '#/components/schemas/EvaluationEvidence'
    ActivateModelVersion:
      type: object
      additionalProperties: false
      required:
      - approved
      - scopes
      - reason
      - reanalysisPlanned
      properties:
        approved:
          type: boolean
          const: true
        scopes: *id002
        reason: *id001
        reanalysisPlanned:
          type: boolean
    RollbackModelVersion:
      type: object
      additionalProperties: false
      required:
      - scopes
      - reason
      - reanalysisPlanned
      properties:
        scopes: *id002
        reason: *id001
        reanalysisPlanned:
          type: boolean
    VersionApproval:
      type: object
      additionalProperties: false
      required:
      - scopes
      - reason
      - approvedBy
      - approvedAt
      properties:
        scopes: *id002
        reason: *id001
        approvedBy: &id003
          type: string
          format: uuid
        approvedAt: &id004
          type: string
          format: date-time
    EvaluationRecord:
      type: object
      additionalProperties: false
      required:
      - evidence
      - approval
      - activeScopes
      - revision
      properties:
        evidence:
          $ref: '#/components/schemas/EvaluationEvidence'
        approval:
          oneOf:
          - $ref: '#/components/schemas/VersionApproval'
          - type: 'null'
        activeScopes:
          type: array
          items:
            type: string
        revision:
          type: integer
          format: int64
          minimum: 0
    ModelVersion:
      type: object
      additionalProperties: false
      required:
      - id
      - kind
      - name
      - version
      - refId
      - artifactUri
      - evalResult
      - status
      - approvedBy
      - activatedAt
      - createdAt
      properties:
        id: *id003
        kind: &id005
          $ref: '#/components/schemas/ModelKind'
        name: *id001
        version: *id001
        refId: &id006
          type:
          - string
          - 'null'
          format: uuid
        artifactUri: &id007
          type:
          - string
          - 'null'
        evalResult:
          oneOf:
          - $ref: '#/components/schemas/EvaluationRecord'
          - type: 'null'
        status:
          type: string
          enum:
          - REGISTERED
          - ACTIVE
          - INACTIVE
        approvedBy:
          type:
          - string
          - 'null'
          format: uuid
        activatedAt:
          type:
          - string
          - 'null'
          format: date-time
        createdAt: *id004
    ModelVersionPage:
      type: object
      additionalProperties: false
      required:
      - items
      - page
      - size
      - totalElements
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ModelVersion'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          format: int64
          minimum: 0
    ActiveModelVersion:
      type: object
      additionalProperties: false
      required:
      - id
      - kind
      - name
      - version
      - refId
      - artifactUri
      - scopes
      - revision
      - activatedAt
      properties:
        id: *id003
        kind: *id005
        name: *id001
        version: *id001
        refId: *id006
        artifactUri: *id007
        scopes: *id002
        revision:
          type: integer
          format: int64
          minimum: 1
        activatedAt: *id004
    ActiveModelVersions:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ActiveModelVersion'
    CallType:
      type: string
      enum: [JUDGMENT, FOLLOWUP, ANALYSIS, REPORT_NARRATIVE, M2, M1, SPEECH]
    AiUsageResponse:
      type: object
      additionalProperties: false
      required: [period, items]
      properties:
        period:
          type: object
          additionalProperties: false
          required: [from, to]
          properties:
            from: {type: string, format: date}
            to: {type: string, format: date}
