openapi: 3.1.0
info:
  title: 사고뭉치 core-service 인증·동의·자녀·관리자 API
  version: 1.0.0
  description: '#39 피드백 SSE, #36 인증, #38 학생 미션 learning 프록시 및 #43 관리자 버전·사용량 API. 실제 learning API 연동 범위는 작업 보고서를 따른다. access는 메모리, refresh는
    보안 쿠키. POST 쿠키 API는 정확한 Origin과 X-Requested-With를 요구한다. #58의 POST /auth/student/devices, GET /auth/student/profiles, POST
    /auth/student/login은 Bearer만 제외하며 실제 기기/PIN 검증·신규 API 구현은 이 계약의 범위 밖이다. #37 현재 동의 문서·버전별 동의·철회·자녀 등록/목록을 포함한다.'
servers:
- url: /api/v1
  description: web과 동일 origin의 core 공개 API
tags:
- name: Auth
- name: Account
- name: Feedback
- name: Learning
- name: Consent
- name: Children
security:
- BearerAuth: []
paths:
  /missions:
    get:
      operationId: listMissions
      tags: [Learning]
      summary: 학생 공개 미션 목록
      description: STUDENT 전용. 검증된 본인 학생의 grade·demo를 core DB에서 결정해 /internal/missions에 전달한다. 클라이언트 grade·demo query는 사용하지 않는다. page·size만 전달하며 문항 노출 판단은 learning 소유다.
      parameters:
      - {name: page, in: query, schema: {type: integer, minimum: 0}}
      - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        '200': {$ref: '#/components/responses/LearningResult'}
        default: {$ref: '#/components/responses/LearningProblem'}
  /missions/{missionId}:
    parameters:
    - {$ref: '#/components/parameters/MissionId'}
    get:
      operationId: getMission
      tags: [Learning]
      summary: 학생 미션 상세
      description: STUDENT 전용. 검증된 본인 학생의 grade·demo를 core DB에서 결정해 전달하며 클라이언트 query는 사용하지 않는다. learning의 공개 전 정답·예시 답 비공개 계약을 유지한다.
      responses:
        '200': {$ref: '#/components/responses/LearningResult'}
        default: {$ref: '#/components/responses/LearningProblem'}
  /missions/{missionId}/attempts:
    parameters:
    - {$ref: '#/components/parameters/MissionId'}
    post:
      operationId: startAttempt
      tags: [Learning]
      summary: 학생 시도 시작·이어하기
      description: >-
        STUDENT 전용. 검증된 본인 학생의 grade·demo를 core DB에서 결정해 /internal/missions/{missionId}/attempts에 쿼리로 전달하며 클라이언트 query는 사용하지 않는다.
        learning은 신규 생성 201·기존 진행 시도 반환 200을 구분하며 core는 상태를 그대로 전달한다. 신규 시도 제공 범위 검사·기존 진행 시도 선택과 당시 버전 유지는 learning 소유다.
        일일 한도는 core Redis 책임이며 learning은 관여하지 않는다. 후속 한도 연계는 201만 집계하고 200은 집계하지 않는다.
        한도 도달 시에도 기존 이어하기는 허용하고 신규 생성만 차단해야 한다. 한도 검사·기존 시도 판별·신규 생성 차단의 처리 순서는 후속 구현에서 검증한다. Redis 한도 기능은 현재 프록시 구현 범위 밖이다.
      responses:
        '200':
          $ref: '#/components/responses/LearningResult'
          description: 기존 진행 시도 반환(이어하기). 후속 일일 한도 집계 대상 아님.
        '201':
          $ref: '#/components/responses/LearningResult'
          description: 신규 시도 생성. 후속 core Redis 일일 한도 집계 대상.
        default: {$ref: '#/components/responses/LearningProblem'}
  /attempts/{attemptId}:
    parameters:
    - {$ref: '#/components/parameters/AttemptId'}
    get:
      operationId: getAttempt
      tags: [Learning]
      summary: 학생 시도·타임라인·최신 초안
      description: STUDENT 전용. learning의 상태·응답·ETag를 보존한다. 대상 학생의 소유권은 learning이 X-Student-Scope와 대조한다.
      responses:
        '200': {$ref: '#/components/responses/LearningResult'}
        default: {$ref: '#/components/responses/LearningProblem'}
  /attempts/{attemptId}/draft:
    parameters:
    - {$ref: '#/components/parameters/AttemptId'}
    put:
      operationId: saveDraft
      tags: [Learning]
      summary: 학생 초안 저장
      description: STUDENT 전용. If-Match를 변경 없이 전달한다. 초안 충돌은 409와 최신 초안·ETag를 보존한다.
      parameters:
      - {name: If-Match, in: header, required: true, schema: {type: string}, example: '"7"'}
      requestBody: {$ref: '#/components/requestBodies/LearningJson'}
      responses:
        '200': {$ref: '#/components/responses/LearningResult'}
        '409': {$ref: '#/components/responses/LearningProblem'}
        default: {$ref: '#/components/responses/LearningProblem'}
  /attempts/{attemptId}/hints:
    parameters:
    - {$ref: '#/components/parameters/AttemptId'}
    post:
      operationId: openHints
      tags: [Learning]
      summary: 학생 생각 열기 질문 열람
      responses:
        '200': {$ref: '#/components/responses/LearningResult'}
        default: {$ref: '#/components/responses/LearningProblem'}
  /attempts/{attemptId}/answers:
    parameters:
    - {$ref: '#/components/parameters/AttemptId'}
    post:
      operationId: submitAnswer
      tags: [Learning]
      summary: 학생 최초·보완 답변 제출
      description: >-
        STUDENT 전용. Idempotency-Key UUID 필수. 같은 계정·키의 메서드·endpoint·검증된 학생·원문 본문을 대조한다.
        원문 공백·필드 순서 변경도 422 IDEMPOTENCY_KEY_REUSED다. 최초 2xx~4xx 상태·원문·헤더를 24시간 재사용한다.
        처리 중은 409 IDEMPOTENCY_IN_PROGRESS와 Retry-After 1. 5xx·시간 초과·core 저장 실패는 미확정이며 같은 키로 재요청한다.
        learning에 동일 키를 전달하며 learning은 답변 UK와 최초 결과 재구성을 보장해야 한다.
      parameters:
      - {name: Idempotency-Key, in: header, required: true, schema: {type: string, format: uuid}}
      requestBody: {$ref: '#/components/requestBodies/LearningJson'}
      responses:
        '201': {$ref: '#/components/responses/LearningResult'}
        '409': {$ref: '#/components/responses/LearningProblem'}
        '422': {$ref: '#/components/responses/LearningProblem'}
        '503': {$ref: '#/components/responses/LearningProblem'}
        '504': {$ref: '#/components/responses/LearningProblem'}
        default: {$ref: '#/components/responses/LearningProblem'}
  /attempts/{attemptId}/finish:
    parameters:
    - {$ref: '#/components/parameters/AttemptId'}
    post:
      operationId: finishAttempt
      tags: [Learning]
      summary: 학생 마무리·정답 공개
      description: STUDENT 전용. 판정 DONE 조건과 공개 응답은 learning 소유. 조건 미충족 409를 보존한다.
      responses:
        '200': {$ref: '#/components/responses/LearningResult'}
        default: {$ref: '#/components/responses/LearningProblem'}
  /attempts/{attemptId}/self-assessment:
    parameters:
    - {$ref: '#/components/parameters/AttemptId'}
    post:
      operationId: saveSelfAssessment
      tags: [Learning]
      summary: 학생 자기 평가
      requestBody: {$ref: '#/components/requestBodies/LearningJson'}
      responses:
        '200': {$ref: '#/components/responses/LearningResult'}
        default: {$ref: '#/components/responses/LearningProblem'}
  /attempts/{attemptId}/reflection:
    parameters:
    - {$ref: '#/components/parameters/AttemptId'}
    post:
      operationId: saveReflection
      tags: [Learning]
      summary: 학생 돌아보기·완료
      requestBody: {$ref: '#/components/requestBodies/LearningJson'}
      responses:
        '200': {$ref: '#/components/responses/LearningResult'}
        default: {$ref: '#/components/responses/LearningProblem'}
  /auth/google/authorize:
    get:
      operationId: startGoogleLogin
      tags:
      - Auth
      summary: Google 로그인·가입 시작
      description: core가 state·nonce·PKCE S256을 생성하고 Google로 이동한다. Google 키가 없으면 503이다.
      security: []
      responses:
        '302':
          description: Google 인가 페이지로 이동. OAuth 상태 쿠키는 HttpOnly·SameSite=Lax, 10분.
          headers:
            Cache-Control:
              description: 인증 응답은 저장하지 않는다.
              schema:
                type: string
                const: no-store
            Set-Cookie:
              description: HttpOnly 쿠키. 성공 콜백은 OAuth 상태 쿠키 삭제와 refresh 설정의 복수 Set-Cookie를 반환한다. 학생 전환·로그아웃은 refresh 쿠키를 만료시킨다.
              schema:
                type: string
            Location:
              description: Google 인가 URL. 서비스 access/refresh는 포함하지 않는다.
              schema:
                type: string
                format: uri
        '503':
          $ref: '#/components/responses/Unavailable'
  /auth/google/callback:
    get:
      operationId: completeGoogleLogin
      tags:
      - Auth
      summary: Google 인가 응답 처리
      description: state 쿠키·nonce·PKCE와 ID 토큰 JWKS 서명·iss·aud·exp를 검증한다. Google 계정은 provider+sub로 식별하며 이메일 자동 연결은 하지 않는다.
        성공하면 refresh 쿠키를 설정하고 /oauth/complete로 이동한다.
      security: []
      parameters:
      - name: code
        in: query
        required: false
        description: Google 일회용 인가 코드. 성공 흐름에 필수.
        schema:
          type: string
      - name: state
        in: query
        required: false
        description: 로그인 시작 시 생성한 state. 성공 흐름에 필수.
        schema:
          type: string
      - name: error
        in: query
        required: false
        description: Google이 반환한 오류(사용자 취소 포함).
        schema:
          type: string
      - name: sagomungchi_oauth
        in: cookie
        required: false
        description: 성공하려면 유효한 로그인 상태 쿠키가 있어야 한다. 없거나 만료되면 실패 화면으로 이동한다.
        schema:
          type: string
      responses:
        '302':
          description: '성공: /oauth/complete. 실패: /login?oauthError=CANCELLED|ACCOUNT_EXISTS|OAUTH_UNAVAILABLE|OAUTH_FAILED.
            상태 쿠키 삭제.'
          headers:
            Cache-Control:
              description: 인증 응답은 저장하지 않는다.
              schema:
                type: string
                const: no-store
            Set-Cookie:
              description: HttpOnly 쿠키. 성공 콜백은 OAuth 상태 쿠키 삭제와 refresh 설정의 복수 Set-Cookie를 반환한다. 학생 전환·로그아웃은 refresh 쿠키를 만료시킨다.
              schema:
                type: string
            Location:
              schema:
                type: string
                format: uri
              description: 설정된 web origin 안의 성공 또는 실패 경로.
  /auth/refresh:
    post:
      operationId: refreshAccessToken
      tags:
      - Auth
      summary: 부모·관리자 access 재발급
      description: 부모·관리자 refresh를 원자적으로 회전한다. 최초 로그인부터 기본 7일 만료는 연장하지 않는다. 재사용은 해당 세션을 폐기한다. 학생 세션은 refresh를 발급하지 않으며 이 경로를
        사용할 수 없다.
      security:
      - RefreshCookie: []
      parameters:
      - $ref: '#/components/parameters/WebOrigin'
      - $ref: '#/components/parameters/RequestedWith'
      responses:
        '200':
          description: 새 access와 회전한 refresh 쿠키.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParentTokenResponse'
          headers:
            Cache-Control:
              description: 인증 응답은 저장하지 않는다.
              schema:
                type: string
                const: no-store
            Set-Cookie:
              description: HttpOnly 쿠키. 성공 콜백은 OAuth 상태 쿠키 삭제와 refresh 설정의 복수 Set-Cookie를 반환한다. 학생 전환·로그아웃은 refresh 쿠키를 만료시킨다.
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /auth/logout:
    post:
      operationId: logoutSession
      tags:
      - Auth
      summary: 현재 로그인 세션 종료
      description: 현재 refresh 쿠키 또는 Bearer 학생 access로 식별한 서비스 세션을 폐기한다. 다른 기기의 세션과 Google 계정 자체는 로그아웃하지 않는다. 인증 정보가 없어도 올바른
        요청 출처에서는 idempotent 204를 반환한다.
      security:
      - RefreshCookie: []
      - BearerAuth: []
      - {}
      parameters:
      - $ref: '#/components/parameters/WebOrigin'
      - $ref: '#/components/parameters/RequestedWith'
      responses:
        '204':
          description: 서비스 세션 폐기·refresh 쿠키 만료.
          headers:
            Cache-Control:
              description: 인증 응답은 저장하지 않는다.
              schema:
                type: string
                const: no-store
            Set-Cookie:
              description: HttpOnly 쿠키. 성공 콜백은 OAuth 상태 쿠키 삭제와 refresh 설정의 복수 Set-Cookie를 반환한다. 학생 전환·로그아웃은 refresh 쿠키를 만료시킨다.
              schema:
                type: string
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /auth/student-sessions:
    post:
      operationId: enterAccompaniedStudentSession
      tags:
      - Auth
      summary: 부모 동석 학생 진입
      description: '부모 Bearer와 같은 세션의 refresh로 연결·활성 자녀 및 현재 필수/법정대리인 동의를 확인한다. 학생 access만 발급하고 부모 refresh를 소비·삭제하며 기존 부모
        access를 거부한다. PIN 단독 진입은 #58 소유다.'
      security:
      - BearerAuth: []
        RefreshCookie: []
      parameters:
      - $ref: '#/components/parameters/WebOrigin'
      - $ref: '#/components/parameters/RequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentSessionRequest'
      responses:
        '200':
          description: 학생 access 전용 응답. refresh 쿠키는 만료되며 원문 refresh를 응답하지 않는다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentTokenResponse'
          headers:
            Cache-Control:
              description: 인증 응답은 저장하지 않는다.
              schema:
                type: string
                const: no-store
            Set-Cookie:
              description: HttpOnly 쿠키. 성공 콜백은 OAuth 상태 쿠키 삭제와 refresh 설정의 복수 Set-Cookie를 반환한다. 학생 전환·로그아웃은 refresh 쿠키를 만료시킨다.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /me:
    get:
      operationId: getCurrentIdentity
      tags:
      - Account
      summary: 본인 역할·시작 화면 조회
      description: '학생은 부모 개인정보·관리자 권한을 받지 않는다. 신규 부모는 필수 동의·자녀 등록 단계로 안내한다. 동의 저장·자녀 등록 API는 #37 소유다.'
      responses:
        '200':
          description: 현재 인증 상태에 따라 역할별 최소 정보 반환.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ParentMeResponse'
                - $ref: '#/components/schemas/StudentMeResponse'
          headers:
            Cache-Control:
              description: 인증 응답은 저장하지 않는다.
              schema:
                type: string
                const: no-store
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /admin/ai-usage:
    get:
      operationId: getAiUsage
      tags: [Admin]
      summary: SERVICE_OPS AI 사용량 조회
      description: KST 날짜 양 끝 포함 최대 366일이며 연도는 0001~9999만 허용한다. 초과·역전 기간이나 허용 연도 밖의 날짜는 DB 조회 전 400 VALIDATION_FAILED로 거부한다. 성공·실패 전체 평균 지연과 저장된 소비 시점 비용을 집계한다. 미산정 비용이 포함되면 costUsd는 null이다.
      parameters:
      - {name: from, in: query, required: true, schema: {type: string, format: date}}
      - {name: to, in: query, required: true, schema: {type: string, format: date}}
      - name: callType
        in: query
        schema: {$ref: '#/components/schemas/CallType'}
      responses:
        '200':
          description: 기간 내 호출이 있는 종류별 집계. 빈 기간은 items 빈 배열.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AiUsageResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/model-versions:
    get:
      operationId: listModelVersions
      tags: [ModelRegistry]
      summary: SERVICE_OPS 버전 목록
      parameters:
      - {name: kind, in: query, schema: {$ref: '#/components/schemas/ModelKind'}}
      - {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}
      - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: SERVICE_OPS 버전 목록 결과
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModelVersionPage'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: registerModelVersion
      tags: [ModelRegistry]
      summary: SERVICE_OPS 평가 근거와 버전 등록
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterModelVersion'}
      responses:
        '201':
          description: SERVICE_OPS 평가 근거와 버전 등록 결과
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModelVersion'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/ModelNotFound'}
        '409': {$ref: '#/components/responses/ModelConflict'}
        '422': {$ref: '#/components/responses/ModelApprovalRejected'}
  /admin/model-versions/{versionId}/activate:
    post:
      operationId: activateModelVersion
      tags: [ModelRegistry]
      summary: SERVICE_OPS 최초 사람 승인·활성화
      parameters:
