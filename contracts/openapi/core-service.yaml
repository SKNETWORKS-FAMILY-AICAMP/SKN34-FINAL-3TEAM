  /answers/{answerId}/feedback:
    post:
      operationId: streamAnswerFeedback
      tags: [Feedback]
      summary: 학생 답변의 판정·되묻기 SSE
      description: |
        검증된 STUDENT 세션만 허용한다. core가 내부 토큰과 검증된 사용자·학생 범위를 learning에 전달한다.
        learning 동기 호출 제한은 80초이며 자동 재시도하지 않는다. 대기 중 15초마다 주석 ': ping'을 전송한다.
        status(RUNNING) → result(DONE, HELD 포함) → done({}) 순서다.
        이미 RUNNING이면 status → done, 처리 실패는 error(Problem Details + retryable) → done이다.
        스트림 시작 뒤 오류의 HTTP 응답 상태는 200이며 error 이벤트의 status/code를 사용한다.
        DONE·RUNNING·FAILED 재실행·리스·학생 소유권 판단과 저장은 learning 소유다.
        피드백은 Idempotency-Key를 요구하거나 core에서 캐시하지 않는다.
        연결은 90초 제한이며 클라이언트 종료·전송 실패에도 시작한 learning 처리는 취소하지 않는다.
        learning-feedback 서킷은 전송 오류와 계약된 Problem Details가 아닌 5xx를 집계한다.
        application/problem+json 및 문자열 code가 있는 업무 오류는 error로 전달하며 core 서킷을 열지 않는다.
      security:
      - BearerAuth: []
      parameters:
      - name: answerId
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: SSE. 정상·HELD·RUNNING·실패 모두 마지막 done 후 종료한다. 단절된 연결에는 전달을 보장하지 않는다.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
            X-Accel-Buffering:
              schema: {type: string, const: 'no'}
          content:
            text/event-stream:
              schema: {type: string}
              examples:
                running:
                  value: "event:status\ndata:{\"state\":\"RUNNING\",\"message\":\"생각을 살펴보는 중\"}\n\nevent:done\ndata:{}\n\n"
                failure:
                  value: "event:status\ndata:{\"state\":\"RUNNING\",\"message\":\"생각을 살펴보는 중\"}\n\nevent:error\ndata:{\"type\":\"about:blank\",\"title\":\"처리 실패\",\"status\":503,\"code\":\"AI_UNAVAILABLE\",\"retryable\":true}\n\nevent:done\ndata:{}\n\n"
        '400':
          description: answerId 형식 오류 (스트림 시작 전).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: 스트림 시작 전 인증 DB·세션 조회 장애(AUTH_UNAVAILABLE). learning 서킷·연결 장애는 HTTP 200 스트림의 error 이벤트로 전달한다.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /me/reauth:
    post:
      operationId: reauthenticateGoogle
      tags:
      - Account
      summary: Google 재인증 시작 또는 VERIFIED challenge의 1회 토큰 수령
      responses:
        '200':
          description: 정상 처리
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  required:
                  - challengeId
                  - authorizationUrl
                  - expiresAt
                  properties:
                    challengeId:
                      type: string
                      format: uuid
                    authorizationUrl:
                      type: string
                      format: uri
                    expiresAt:
                      type: string
                      format: date-time
                - type: object
                  required:
                  - reauthToken
                  - expiresAt
                  properties:
                    reauthToken:
                      type: string
                    expiresAt:
                      type: string
                      format: date-time
        '400':
          description: 유효하지 않은 입력
        '401':
          description: 인증 실패
        '403':
          description: 권한/재인증 실패
        '409':
          description: 정책/상태 충돌
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                properties:
                  purpose:
                    type: string
                    enum:
                    - PIN_CHANGE
                    - CHILD_UNLINK
                    - CHILD_DELETE
                    - WITHDRAWAL
                    - GUARDIAN_PASSWORD
                    - CHILD_TRANSFER
                    - TRANSFER_ACCEPT
                  childId:
                    type: string
                    format: uuid
                  scope:
                    type: string
                    enum:
                    - PROFILE
                    - RECORDS
                required:
                - purpose
                additionalProperties: false
              - type: object
                properties:
                  challengeId:
                    type: string
                    format: uuid
                required:
                - challengeId
                additionalProperties: false
      description: 시작 응답 challengeId/authorizationUrl/expiresAt. 별도 Google callback
        완료 뒤 같은 세션에서 challengeId를 POST하면 reauthToken/expiresAt. 완료 전 409 REAUTH_PENDING.
        두 단계 모두 Origin/X-Requested-With 필요. 상태 쿠키 HttpOnly/Secure/Lax. 토큰 메모리 보관. Google
        계정 확인은 비밀번호/MFA 재입력 보장이 아님.
      parameters:
      - $ref: '#/components/parameters/WebOrigin'
      - $ref: '#/components/parameters/RequestedWith'
  /me/reauth/password:
    post:
      operationId: reauthenticatePassword
      tags:
      - Account
      summary: ID·비밀번호 계정의 비밀번호 재확인 (#415)
      description: ID·비밀번호로 가입한 학부모가 로그인 비밀번호를 다시 입력하면 Google 재인증과 같은 1회 reauthToken을 바로 발급한다.
        목적·자녀·범위 규칙과 토큰 사용처(X-Reauth-Token)는 /me/reauth와 같다. Google 계정은 409 REAUTH_METHOD_MISMATCH.
        틀리면 403 REAUTH_PASSWORD_INVALID이고 로그인 실패 횟수와 함께 세어 5회째부터 15분간 423 LOGIN_LOCKED다.
        Origin/X-Requested-With 필요. 토큰은 메모리에만 둔다.
      parameters:
      - $ref: '#/components/parameters/WebOrigin'
      - $ref: '#/components/parameters/RequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - purpose
              - password
              properties:
                purpose:
                  type: string
                  enum:
                  - PIN_CHANGE
                  - CHILD_UNLINK
                  - CHILD_DELETE
                  - WITHDRAWAL
                  - GUARDIAN_PASSWORD
                  - CHILD_TRANSFER
                  - TRANSFER_ACCEPT
                childId:
                  type: string
                  format: uuid
                scope:
                  type: string
                  enum:
                  - PROFILE
                  - RECORDS
                password:
                  type: string
                  minLength: 1
                  maxLength: 128
      responses:
        '200':
          description: 1회 재인증 토큰.
          content:
            application/json:
              schema:
                type: object
                required:
                - reauthToken
                - expiresAt
                properties:
                  reauthToken:
                    type: string
                  expiresAt:
                    type: string
                    format: date-time
        '400':
          description: RFC 9457 오류. VALIDATION_FAILED(목적·자녀·범위 조합).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: 인증 실패
        '403':
          description: RFC 9457 오류. REAUTH_PASSWORD_INVALID 또는 출처 헤더·자녀 권한 실패.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: RFC 9457 오류. REAUTH_METHOD_MISMATCH(Google 계정).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '423':
          description: RFC 9457 오류. LOGIN_LOCKED.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/google/reauth/callback:
    get:
      operationId: completeGoogleReauthentication
      tags:
      - Account
      summary: 별도 Google 재인증 callback
      description: >-
        브라우저 새 탭이 받는 작은 HTML 안내 페이지를 돌려준다(#425). 성공하면 같은 출처
        BroadcastChannel `sagomungchi-reauth`로 `{type:"REAUTH_VERIFIED",challengeId}`만 알리고 창을
        닫는다. 닫히지 않으면 안내 문구를 보인다. 재인증 토큰은 싣지 않으며, 원래 탭이 `POST /me/reauth {challengeId}`로
        수령한다. 응답에는 `Content-Security-Policy`(script-src·style-src nonce), `Cache-Control: no-store`,
        `Referrer-Policy: no-referrer`, `X-Content-Type-Options: nosniff`가 붙는다. 실패도 JSON 대신 안내 HTML이며
        스크립트·알림이 없다.
      responses:
        '200':
          description: 재인증 확인 완료 안내 HTML(`data-reauth-status="VERIFIED"`, `data-challenge-id`), 재인증 상태 쿠키 삭제
          content:
            text/html:
              schema:
                type: string
        '403':
          description: 재인증 실패 안내 HTML(`data-reauth-status="FAILED"`, 스크립트 없음)
          content:
            text/html:
              schema:
                type: string
      security: []
      parameters:
      - in: query
        name: code
        required: false
        schema:
          type: string
      - in: query
        name: state
        required: false
        schema:
          type: string
      - in: query
        name: error
        required: false
        schema:
          type: string
