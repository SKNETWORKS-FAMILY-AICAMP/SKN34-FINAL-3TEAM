  /answers/{answerId}/feedback:
    post:
      operationId: streamAnswerFeedback
      tags: [Feedback]
      summary: 학생 답변의 판정·되묻기 SSE
      description: |
        검증된 STUDENT 세션만 허용한다. core가 내부 토큰과 검증된 사용자·학생 범위를 learning에 전달한다.
        learning 동기 호출 제한은 80초이며 자동 재시도하지 않는다. 대기 중 15초마다 주석 ': ping'을 전송한다.
        status(RUNNING) → result(DONE, HELD 포함) → done({}) 순서다.
        이미 RUNNING이면 status → done, 처리 실패는 error(Problem Details + retryable) → done이다.
        스트림 시작 뒤 오류의 HTTP 응답 상태는 200이며 error 이벤트의 status/code를 사용한다.
        DONE·RUNNING·FAILED 재실행·리스·학생 소유권 판단과 저장은 learning 소유다.
        피드백은 Idempotency-Key를 요구하거나 core에서 캐시하지 않는다.
        연결은 90초 제한이며 클라이언트 종료·전송 실패에도 시작한 learning 처리는 취소하지 않는다.
      security:
      - BearerAuth: []
      parameters:
      - name: answerId
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: SSE. 정상·HELD·RUNNING·실패 모두 마지막 done 후 종료한다. 단절된 연결에는 전달을 보장하지 않는다.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
            X-Accel-Buffering:
              schema: {type: string, const: 'no'}
          content:
            text/event-stream:
              schema: {type: string}
              examples:
                running:
                  value: "event:status\ndata:{\"state\":\"RUNNING\",\"message\":\"생각을 살펴보는 중\"}\n\nevent:done\ndata:{}\n\n"
                failure:
                  value: "event:status\ndata:{\"state\":\"RUNNING\",\"message\":\"생각을 살펴보는 중\"}\n\nevent:error\ndata:{\"type\":\"about:blank\",\"title\":\"처리 실패\",\"status\":503,\"code\":\"AI_UNAVAILABLE\",\"retryable\":true}\n\nevent:done\ndata:{}\n\n"
        '400':
          description: answerId 형식 오류 (스트림 시작 전).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    InternalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: core가 발급·검증하는 HS256 access JWT. sid·ver와 최신 서버 세션·권한을 확인한다.
    RefreshCookie:
      type: apiKey
      in: cookie
      name: sagomungchi_refresh
      description: 부모·관리자 전용 HttpOnly·Secure·SameSite=Strict, Path=/api/v1/auth. 원문은 서버 DB에 저장하지 않는다.
  parameters:
    MissionId:
      name: missionId
      in: path
      required: true
      schema: {type: string, format: uuid}
    AttemptId:
      name: attemptId
      in: path
      required: true
      schema: {type: string, format: uuid}
    WebOrigin:
      name: Origin
      in: header
      required: true
      description: AUTH_WEB_ORIGIN과 정확히 일치. 로컬 기본은 아래 예시. 배포에서는 HTTPS origin을 사용한다.
      schema:
        type: string
        format: uri
      example: http://localhost:5173
    RequestedWith:
      name: X-Requested-With
      in: header
      required: true
      schema:
        type: string
        const: XMLHttpRequest
  schemas:
    ModelKind:
      type: string
      enum:
      - RUBRIC
      - MODEL
      - PROMPT
      - GENERATION
    EvaluationEvidence:
      type: object
      additionalProperties: false
      required:
      - datasetId
      - datasetVersion
      - baselineVersion
      - comparisonReport
      - trainingEvaluationSeparation
      - quoteAccuracy
      - calculationAccuracy
      - humanReview
      - evaluatedScopes
      properties:
        datasetId: &id001
          type: string
          minLength: 1
        datasetVersion: *id001
        baselineVersion: *id001
        comparisonReport: *id001
        trainingEvaluationSeparation: *id001
        quoteAccuracy: *id001
        calculationAccuracy: *id001
        humanReview: *id001
        evaluatedScopes: &id002
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            pattern: ^[a-z0-9][a-z0-9._:/-]{0,199}$
    RegisterModelVersion:
      type: object
      additionalProperties: false
      required:
      - kind
      - name
      - version
      - evaluation
      properties:
        kind:
          $ref: '#/components/schemas/ModelKind'
        name:
          type: string
          minLength: 1
          maxLength: 100
        version:
          type: string
          minLength: 1
          maxLength: 100
        refId:
          type:
          - string
          - 'null'
          format: uuid
        artifactUri:
          type:
          - string
          - 'null'
          maxLength: 2048
        evaluation:
          $ref: '#/components/schemas/EvaluationEvidence'
    ActivateModelVersion:
      type: object
      additionalProperties: false
      required:
      - approved
      - scopes
      - reason
      - reanalysisPlanned
      properties:
        approved:
          type: boolean
          const: true
        scopes: *id002
        reason: *id001
        reanalysisPlanned:
          type: boolean
    RollbackModelVersion:
      type: object
      additionalProperties: false
      required:
      - scopes
      - reason
      - reanalysisPlanned
      properties:
        scopes: *id002
        reason: *id001
        reanalysisPlanned:
          type: boolean
    VersionApproval:
      type: object
      additionalProperties: false
      required:
      - scopes
      - reason
      - approvedBy
      - approvedAt
      properties:
        scopes: *id002
        reason: *id001
        approvedBy: &id003
          type: string
          format: uuid
        approvedAt: &id004
          type: string
          format: date-time
    EvaluationRecord:
      type: object
      additionalProperties: false
      required:
      - evidence
      - approval
      - activeScopes
      - revision
      properties:
        evidence:
          $ref: '#/components/schemas/EvaluationEvidence'
        approval:
          oneOf:
          - $ref: '#/components/schemas/VersionApproval'
          - type: 'null'
        activeScopes:
          type: array
          items:
            type: string
        revision:
          type: integer
          format: int64
          minimum: 0
    ModelVersion:
      type: object
      additionalProperties: false
      required:
      - id
      - kind
      - name
      - version
      - refId
      - artifactUri
      - evalResult
      - status
      - approvedBy
      - activatedAt
      - createdAt
      properties:
        id: *id003
        kind: &id005
          $ref: '#/components/schemas/ModelKind'
        name: *id001
        version: *id001
        refId: &id006
          type:
          - string
          - 'null'
          format: uuid
        artifactUri: &id007
          type:
          - string
          - 'null'
        evalResult:
          oneOf:
          - $ref: '#/components/schemas/EvaluationRecord'
          - type: 'null'
        status:
          type: string
          enum:
          - REGISTERED
          - ACTIVE
          - INACTIVE
        approvedBy:
          type:
          - string
          - 'null'
          format: uuid
        activatedAt:
          type:
          - string
          - 'null'
          format: date-time
        createdAt: *id004
    ModelVersionPage:
      type: object
      additionalProperties: false
      required:
      - items
      - page
      - size
      - totalElements
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ModelVersion'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          format: int64
          minimum: 0
    ActiveModelVersion:
      type: object
      additionalProperties: false
      required:
      - id
      - kind
      - name
      - version
      - refId
      - artifactUri
      - scopes
      - revision
      - activatedAt
      properties:
        id: *id003
        kind: *id005
        name: *id001
        version: *id001
        refId: *id006
        artifactUri: *id007
        scopes: *id002
        revision:
          type: integer
          format: int64
          minimum: 1
        activatedAt: *id004
    ActiveModelVersions:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ActiveModelVersion'
    CallType:
      type: string
      enum: [JUDGMENT, FOLLOWUP, ANALYSIS, REPORT_NARRATIVE, M2, M1, SPEECH]
    AiUsageResponse:
      type: object
      additionalProperties: false
      required: [period, items]
      properties:
        period:
          type: object
          additionalProperties: false
          required: [from, to]
          properties:
            from: {type: string, format: date}
            to: {type: string, format: date}
        items:
          type: array
          items: {$ref: '#/components/schemas/UsageSummary'}
    UsageSummary:
      type: object
      additionalProperties: false
      required: [callType, calls, failures, latencyMs, inputTokens, outputTokens, costUsd, unpricedCalls]
      properties:
        callType: {$ref: '#/components/schemas/CallType'}
        calls: {type: integer, format: int64, minimum: 1}
        failures: {type: integer, format: int64, minimum: 0}
        latencyMs: {type: number, minimum: 0, description: 성공·실패를 포함한 평균 지연 ms}
        inputTokens: {type: [integer, 'null'], format: int64, description: 미기록 호출이 있으면 null}
        outputTokens: {type: [integer, 'null'], format: int64, description: 미기록 호출이 있으면 null}
        costUsd: {type: [number, 'null'], description: 미산정 호출이 있으면 null}
        unpricedCalls: {type: integer, format: int64, minimum: 0}
    Child:
      type: object
      additionalProperties: false
      required:
      - id
      - nickname
      - grade
      - birthYear
      properties:
        id:
          type: string
          format: uuid
        nickname:
          type: string
        grade:
          type: integer
          enum:
          - 3
          - 4
          - 5
          - 6
        birthYear:
          type: integer
    ParentTokenResponse:
      type: object
      additionalProperties: false
      required:
      - accessToken
      - expiresIn
      - role
      - nextAction
      - startPath
      properties:
        accessToken:
          type: string
          description: HS256 access JWT. 메모리 보관하며 URL·영구 저장소에 넣지 않는다.
        expiresIn:
          type: integer
          minimum: 1
          description: 설정된 access TTL(초), 초기 기본 900초.
        role:
          type: string
          enum:
          - PARENT
          - ADMIN
        child:
          type: 'null'
        nextAction:
          type: string
          enum:
          - CONSENT_REQUIRED
          - CHILD_REGISTRATION_REQUIRED
          - READY
        startPath:
          type: string
          enum:
          - /parent/onboarding
          - /parent/children/new
          - /parent/journal
          - /admin/home
          - /student/home
    StudentTokenResponse:
      type: object
      additionalProperties: false
      required:
      - accessToken
      - expiresIn
      - role
      - child
      - nextAction
      - startPath
      properties:
        accessToken:
          type: string
          description: HS256 access JWT. 메모리 보관하며 URL·영구 저장소에 넣지 않는다.
        expiresIn:
          type: integer
          minimum: 1
          description: 설정된 access TTL(초), 초기 기본 900초.
        role:
          type: string
          const: STUDENT
        child:
          $ref: '#/components/schemas/Child'
        nextAction:
          type: string
          const: READY
        startPath:
          type: string
          const: /student/home
    ParentMeResponse:
      type: object
      additionalProperties: false
      required:
      - userId
      - name
      - email
      - role
      - permissions
      - nextAction
      - startPath
      properties:
        userId:
          type: string
          format: uuid
        name:
          type:
          - string
          - 'null'
        email:
          type: string
          format: email
        role:
          type: string
          enum:
          - PARENT
          - ADMIN
        permissions:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - CONTENT
            - PAYMENT_VIEW
            - PAYMENT_REFUND
            - SERVICE_OPS
        child:
          type: 'null'
        nextAction:
          type: string
          enum:
          - CONSENT_REQUIRED
          - CHILD_REGISTRATION_REQUIRED
          - READY
        startPath:
          type: string
          enum:
          - /parent/onboarding
          - /parent/children/new
          - /parent/journal
          - /admin/home
          - /student/home
    StudentMeResponse:
      type: object
      additionalProperties: false
      required:
      - role
      - child
      - nextAction
      - startPath
      properties:
        role:
          type: string
          const: STUDENT
        child:
          $ref: '#/components/schemas/Child'
        nextAction:
          type: string
          const: READY
        startPath:
          type: string
          const: /student/home
    StudentSessionRequest:
      type: object
      required:
      - childId
      properties:
        childId:
          type: string
          format: uuid
    Problem:
      type: object
      required:
      - type
      - title
      - status
      - code
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
        detail:
          type:
          - string
          - 'null'
        instance:
          type: string
          format: uri-reference
        traceId:
          type:
          - string
          - 'null'
    ConsentDocument:
      type: object
      additionalProperties: false
      required:
      - documentId
      - kind
      - version
      - title
      - content
      - required
      - effectiveFrom
      properties:
        documentId:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - TERMS
          - PRIVACY
          - GUARDIAN
        version:
          type: string
        title:
          type: string
        content:
          type: string
        required:
          type: boolean
        effectiveFrom:
          type: string
          format: date
    ConsentChoice:
      type: object
      additionalProperties: false
      required:
      - documentId
      - version
      - agreed
      properties:
        documentId:
          type: string
          format: uuid
        version:
          type: string
          minLength: 1
        agreed:
