      - baselineVersion
      - comparisonReport
      - trainingEvaluationSeparation
      - quoteAccuracy
      - calculationAccuracy
      - humanReview
      - evaluatedScopes
      properties:
        datasetId: &id001
          type: string
          minLength: 1
        datasetVersion: *id001
        baselineVersion: *id001
        comparisonReport: *id001
        trainingEvaluationSeparation: *id001
        quoteAccuracy: *id001
        calculationAccuracy: *id001
        humanReview: *id001
        evaluatedScopes: &id002
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            pattern: ^[a-z0-9][a-z0-9._:/-]{0,199}$
        limitations:
          type: array
          default: []
          maxItems: 100
          items: {type: string, minLength: 1, maxLength: 4000, pattern: '.*\S.*'}
    RegisterModelVersion:
      type: object
      additionalProperties: false
      required:
      - kind
      - name
      - version
      - evaluation
      allOf:
      - if:
          properties: {kind: {const: MODEL}}
          required: [kind]
        then:
          required: [artifactUri]
          properties:
            artifactUri: {type: string, minLength: 1, maxLength: 2048, pattern: '.*\S.*'}
      properties:
        kind:
          $ref: '#/components/schemas/ModelKind'
        name:
          type: string
          minLength: 1
          maxLength: 100
        version:
          type: string
          minLength: 1
          maxLength: 100
        refId:
          type:
          - string
          - 'null'
          format: uuid
        artifactUri:
          type:
          - string
          - 'null'
          maxLength: 2048
        evaluation:
          $ref: '#/components/schemas/EvaluationEvidence'
        registration:
          $ref: '#/components/schemas/ModelRegistrationMetadata'
    ModelRegistrationMetadata:
      type: object
      additionalProperties: false
      description: 클라이언트가 신고한 출처. 서버의 파일 검증·품질 승인을 의미하지 않음. 생략 시 MANUAL.
      properties:
        source:
          type: string
          enum:
          - MANUAL
          - JSON_IMPORT
          default: MANUAL
        jsonSha256:
          type:
          - string
          - 'null'
          pattern: ^[a-f0-9]{64}$
        manifestSha256:
          type:
          - string
          - 'null'
          pattern: ^[a-f0-9]{64}$
        modifiedFields:
          type: array
          default: []
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            enum:
            - kind
            - name
            - version
            - refId
            - artifactUri
            - evaluation.datasetId
            - evaluation.datasetVersion
            - evaluation.baselineVersion
            - evaluation.comparisonReport
            - evaluation.trainingEvaluationSeparation
            - evaluation.quoteAccuracy
            - evaluation.calculationAccuracy
            - evaluation.humanReview
            - evaluation.evaluatedScopes
            - evaluation.limitations
        artifactFiles:
          type: array
          default: []
          maxItems: 100
          items:
            $ref: '#/components/schemas/ModelRegistrationArtifact'
      allOf:
      - if:
          required:
          - source
          properties:
            source:
              const: JSON_IMPORT
        then:
          required:
          - jsonSha256
          properties:
            jsonSha256: &registrationSha256
              type: string
              pattern: ^[a-f0-9]{64}$
        else:
          properties:
            jsonSha256:
              type: 'null'
            manifestSha256:
              type: 'null'
            modifiedFields:
              maxItems: 0
            artifactFiles:
              maxItems: 0
      - if:
          required:
          - artifactFiles
          properties:
            artifactFiles:
              minItems: 1
        then:
          required:
          - manifestSha256
          properties:
            manifestSha256: *registrationSha256
