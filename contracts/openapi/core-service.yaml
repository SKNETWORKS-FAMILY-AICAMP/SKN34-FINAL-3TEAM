            - type: 'null'
            - type: object
              required: [state, items]
              properties:
                state: {type: string, enum: [INCLUDED, NOT_INCLUDED, NO_TARGET]}
                items:
                  type: array
                  maxItems: 3
                  items:
                    type: object
                    required: [attemptId, answerId, answerVersion, missionTitle, thinkingType, quote, text]
