          thinkingTypes:
            type: array
            items:
              type: object
          changes:
            type: array
            items:
              type: object
          reflections:
            type: array
            items:
              type: object
          quotes:
            type: array
            items:
              type: object
          eveningQuestion:
            type:
            - string
            - 'null'
          narrative:
            type:
            - object
            - 'null'
          verification:
            type: object
          versions:
            type: object
          problems:
            description: 'DAILY만(P24, FN-RPT-14). 이용권과 관계없이 전체 제공한다. 보호자 공개(#206)가 꺼지면 core가 followups·quotes를 비우고 finalAnswer·reflection을 null로 바꾼다. 일일은 eveningQuestion·narrative가 항상 null이다.'
            type: array
