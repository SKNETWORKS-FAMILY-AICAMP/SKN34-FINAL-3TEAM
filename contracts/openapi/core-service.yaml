        '409':
          description: TRANSFER_ALREADY_RESOLVED — 이미 다른 상태로 종료. TRANSFER_CHILD_UNAVAILABLE — 삭제 중·비활성 자녀. TRANSFER_ACTIVITY_IN_PROGRESS — 상담·관리자 재처리 중. TRANSFER_PAYMENT_BLOCKED — 자녀 결제·구독 정리 필요. CHILD_LIMIT_REACHED — 수신자 3명 한도. WITHDRAWAL_BLOCKED — 발신자 구독·환불 정리 필요. CONSENT_DOCUMENT_CHANGED — GUARDIAN 문서 버전 변경
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Reauth-Token
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
