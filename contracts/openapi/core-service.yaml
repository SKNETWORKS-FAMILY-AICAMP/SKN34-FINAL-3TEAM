          content:
            application/json:
              schema: {$ref: '#/components/schemas/WeeklyThemeDocument'}
        '400':
          description: kind 누락·INTRO/OUTRO 밖 값·다른 필드 VALIDATION_FAILED
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        default: {$ref: '#/components/responses/LearningProblem'}
  /students/me/weekly-theme/answer-picks:
    post:
      operationId: pickWeeklyThemeAnswer
      tags: [WeeklyTheme]
      summary: 큰 질문 정답 고르기 (#550)
      description: >-
        STUDENT 전용(FN-RET-07·08, 규칙 #483). 본문 {pick}이 비어 있지 않은 문자열 하나가 아니면 core가 400 VALIDATION_FAILED로 막고, 맞으면 {pick}만 다시 만들어
        learning POST /internal/students/{studentId}/weekly-theme/answer-picks?grade&date&sundayTheme로 넘긴다(story-views·review-views와 같은 학년·KST 날짜·일요일 허용 값).
        후보 안의 값인지, 고를 수 있는 때인지, 정답 판정과 엔딩 상태는 learning #484 판정이며 응답·오류 코드를 그대로 전달한다.
        고를 수 없을 때(금요일 문제 마무리 전, 이미 고름 등) 409 THEME_PICK_NOT_ALLOWED. 포인트 적립 없음. Cache-Control no-store.
        learning 경로가 생기기 전(#484 머지 전)에는 learning 404를 그대로 전달한다.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WeeklyThemeAnswerPickRequest'}
      responses:
        '200':
          description: 정답 판정 결과(learning 소유 모양)
          headers:
            Cache-Control: {schema: {type: string}, description: no-store}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WeeklyThemeAnswerPickResult'}
        '400':
          description: pick 누락·빈 값·문자열 아님·다른 필드 VALIDATION_FAILED
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '409':
          description: 지금 고를 수 없음 THEME_PICK_NOT_ALLOWED(learning #484 판정, core는 그대로 전달)
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        default: {$ref: '#/components/responses/LearningProblem'}
  /students/me/memories/search:
    post:
      operationId: searchMemories
      tags: [Memory]
      summary: 추억 검색 (#566, FN-RET-12)
      description: >-
        STUDENT 전용(P27, api-spec 2.12). 본문 {query}(1~200자, 공백만은 거부)가 아니면 core가 400 VALIDATION_FAILED로 막고 사용량을 남기지 않는다.
        맞으면 memory_daily_usage에 SEARCH 1행을 기록하고 KST 하루 건수가 product.limits.dailyMemorySearches(2026-11-12 확정 20, 무료·프리미엄 같음)를 넘으면
        롤백한 뒤 learning을 부르지 않고 429 USAGE_LIMIT_REACHED. 통과하면 {query}만 다시 만들어 learning POST /internal/students/{studentId}/memories/search로
        넘기고 응답·오류를 그대로 전달한다(서킷 learning-memory, 응답 30초). learning 5xx·시간 초과·연결 실패·서킷 차단이면 기록을 되돌린다.
        질문은 저장하지 않는다. Cache-Control no-store. learning 경로가 생기기 전(#563 머지 전)에는 learning 404를 그대로 전달한다.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MemorySearchRequest'}
      responses:
        '200':
          description: 검색 결과(learning 소유 모양)
          headers:
            Cache-Control: {schema: {type: string}, description: no-store}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MemorySearchResult'}
        '400':
          description: query 누락·빈 값·200자 초과·문자열 아님·다른 필드 VALIDATION_FAILED
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '429':
          description: 오늘 추억 검색 한도 도달 USAGE_LIMIT_REACHED(detail에 하루 횟수와 내일 0시(KST) 초기화 안내). learning 미호출
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '503':
          description: 질문 임베딩 장애 AI_UNAVAILABLE(learning 판정, 그대로 전달), LEARNING_UNAVAILABLE·LEARNING_CIRCUIT_OPEN(learning-memory 차단, Retry-After 30), 상품 한도 값 오류 PAYMENT_PRODUCT_UNAVAILABLE
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        default: {$ref: '#/components/responses/LearningProblem'}
  /students/me/memories/explanations:
    post:
      operationId: explainMemories
      tags: [Memory]
      summary: 추억 설명 (#566, FN-RET-13)
      description: >-
        STUDENT 전용(P27, api-spec 2.12). 본문 {query, attemptIds}(질문 1~200자, 검색 결과 카드의 시도 ID 1~3개·중복 없음)가 아니면 400 VALIDATION_FAILED.
        memory_daily_usage에 EXPLANATION 1행을 기록하고 KST 하루 건수가 product.limits.dailyMemoryExplanations(2026-11-12 확정 10, 무료·프리미엄 같음)를 넘으면
        learning을 부르지 않고 429 USAGE_LIMIT_REACHED. 통과하면 다시 만든 본문을 learning POST /internal/students/{studentId}/memories/explanations로 넘긴다
        (서킷 learning-memory, 응답 45초 > learning→ai 35초). 본인 검색 문서가 아닌 attemptId는 learning 422 VALIDATION_FAILED를 그대로 전달한다.
        생성 실패·근거 부족은 200 state FAILED·INSUFFICIENT라 사용량에 들어가고, learning 5xx·시간 초과·연결 실패·서킷 차단이면 기록을 되돌린다.
        ai 장애로 설명을 만들지 못하면 learning이 503 AI_UNAVAILABLE을 돌려주므로 사용량에 들어가지 않는다(#592).
        질문·설명은 저장하지 않는다. Cache-Control no-store. learning 경로가 생기기 전(#564 머지 전)에는 learning 404를 그대로 전달한다.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MemoryExplanationRequest'}
      responses:
        '200':
          description: 설명 결과(learning 소유 모양)
          headers:
            Cache-Control: {schema: {type: string}, description: no-store}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MemoryExplanationResult'}
        '400':
          description: query·attemptIds 형식 오류 VALIDATION_FAILED(빈 배열, 4개 이상, 중복, UUID 아님, 다른 필드)
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '422':
          description: 본인 검색 문서가 아닌 attemptId VALIDATION_FAILED(learning 판정, 그대로 전달)
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '429':
          description: 오늘 추억 설명 한도 도달 USAGE_LIMIT_REACHED(detail에 하루 횟수와 내일 0시(KST) 초기화 안내). learning 미호출
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '503':
          description: ai 장애로 설명 생성 불가 AI_UNAVAILABLE(learning 판정, 그대로 전달·사용량 미기록), LEARNING_UNAVAILABLE·LEARNING_CIRCUIT_OPEN(learning-memory 차단, Retry-After 30), 상품 한도 값 오류 PAYMENT_PRODUCT_UNAVAILABLE
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        default: {$ref: '#/components/responses/LearningProblem'}
