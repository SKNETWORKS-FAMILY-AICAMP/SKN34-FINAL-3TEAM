  /error-reports:
    post:
      tags:
      - Support
      operationId: postError-Reports
      responses:
        '201':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportReport'
        default:
          $ref: '#/components/responses/LearningProblem'
        '403':
          description: FORBIDDEN — core 권한 거부 또는 learning 지원 GET의 검증된 403 FORBIDDEN. 공급자 HTTP 상태·정수 status·문자열 code 일치 및 application/problem+json 객체 필수. 고정 문구 "지원 대상에 접근할 권한이 없습니다.".
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: NOT_FOUND — core 리소스 없음 또는 learning 지원 GET의 검증된 404 NOT_FOUND. 고정 문구 "지원 대상 기록을 찾을 수 없습니다.". 정정 POST에서는 사전 대상 GET에만 적용.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: SUPPORT_INVALID_RESPONSE — 잘못된 2xx 공급자 응답. 기존 성공 응답 allowlist·필수 필드·식별자 검증 유지.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: SUPPORT_DEPENDENCY_UNAVAILABLE — 불명확한 GET 403/404·내부 인증 401·나머지 비-2xx. 실제 learning 정정 POST의 403/404도 기존 503. 전송·서킷은 기존 LEARNING_UNAVAILABLE / LEARNING_CIRCUIT_OPEN. 공급자 본문 비공개.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '504':
          description: LEARNING_TIMEOUT — 기존 learning 호출 시간 초과.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupportReportSubmission'
      summary: 인증 POST /error-reports
    get:
      tags:
      - Support
      operationId: getError-Reports
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportReportPage'
        default:
          $ref: '#/components/responses/LearningProblem'
        '403':
          $ref: '#/components/responses/LearningProblem'
      parameters:
      - in: query
        name: page
        schema:
          type: integer
          minimum: 0
          default: 0
      - in: query
        name: size
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      summary: 인증 GET /error-reports
