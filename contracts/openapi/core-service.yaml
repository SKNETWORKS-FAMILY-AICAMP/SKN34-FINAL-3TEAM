      - source
      - metrics
      - evidence
      - verification
      - recordCount
      properties:
        messageId:
          type: string
          format: uuid
        answer:
          type: string
          minLength: 1
        scope:
          $ref: '#/components/schemas/AnalysisScope'
        source:
          enum:
          - LLM
          - LLM_RETRY
          - TEMPLATE
