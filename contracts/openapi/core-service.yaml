        childId:
          type: string
          format: uuid
    ConsentHistory:
      type: object
      additionalProperties: false
      required:
      - consentId
      - subjectUserId
      - studentId
      - document
      - agreed
      - status
      - agreedAt
      - withdrawnAt
      properties:
        consentId:
          type: string
          format: uuid
        subjectUserId:
          type: string
          format: uuid
        studentId:
          type:
          - string
          - 'null'
          format: uuid
        document:
          $ref: '#/components/schemas/ConsentDocument'
        agreed:
          type: boolean
        status:
          type: string
          enum:
          - AGREED
          - WITHDRAWN
