    get:
      operationId: getThemeDraft
      summary: 테마 초안 상세 (상태·시도·검사 실패·생성 결과·장면 미리보기·버전)
      parameters:
        - $ref: '#/components/parameters/AdminUserId'
        - $ref: '#/components/parameters/AdminRole'
        - $ref: '#/components/parameters/DraftId'
      responses:
        '200':
          description: 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThemeDraft'
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /admin/theme-drafts/{draftId}/adopt:
    post:
      operationId: adoptThemeDraft
      summary: 검사 통과(READY) 테마 초안 채택 → DRAFT 미션 5개(LLM_THEME) + DRAFT 테마
      description: >-
        초안 행을 잠그고 한 트랜잭션에 미션 5개(미션 초안 채택과 같은 규칙, 요소 배점 1, 학년 범위 = 테마 학년, 그날 장면 그림 키를
        sceneUri·staticSceneUri에, 움직임을 sceneMotion에)와 테마(요일 배치·단서·rulesOut·대화, 요일 영상은 ai가 만들지 않아 비움, 이야기·장면·움직임·큰 질문·후보·정답,
        answerClue는 결정적 단서, hintSpots는 비움)를 만든 뒤 ADOPTED. 자동 게시 없음(P19). 본문은 {}.
      parameters:
        - $ref: '#/components/parameters/AdminUserId'
        - $ref: '#/components/parameters/AdminRole'
        - $ref: '#/components/parameters/DraftId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyObject'
      responses:
        '201':
          description: 만든 테마
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminWeeklyTheme'
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409':
          description: CONFLICT(READY가 아님)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /admin/theme-drafts/{draftId}/discard:
    post:
      operationId: discardThemeDraft
      summary: 테마 초안 버리기 (READY·CHECK_FAILED·FAILED만)
      parameters:
        - $ref: '#/components/parameters/AdminUserId'
        - $ref: '#/components/parameters/AdminRole'
        - $ref: '#/components/parameters/DraftId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyObject'
      responses:
        '200':
          description: 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThemeDraft'
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409':
          description: CONFLICT(GENERATING·ADOPTED·DISCARDED)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /admin/theme-drafts/{draftId}/regenerate:
    post:
      operationId: regenerateThemeDraft
      summary: 같은 입력으로 새 테마 초안 → 202 GENERATING (원래 초안은 그대로)
      description: >-
        원래 초안이 READY·CHECK_FAILED·FAILED·DISCARDED일 때 같은 input·학년·주로 새 초안(source ADMIN, attempts 0, 요청자는 X-User-Id)을
        만들고 새 초안을 돌려줌(사용자 결정 2026-11-10). 본문은 {}.
      parameters:
        - $ref: '#/components/parameters/AdminUserId'
        - $ref: '#/components/parameters/AdminRole'
        - $ref: '#/components/parameters/DraftId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyObject'
      responses:
        '202':
          description: 새 초안
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThemeDraft'
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409':
          description: CONFLICT(GENERATING·ADOPTED)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /community/posts:
    post:
      operationId: shareCommunityPost
      summary: 학습 완료 시도 공유 (#386, P20)
      description: >-
        core가 돌아보기 저장 뒤 공개 판정이 참일 때 SYSTEM과 그 학생 scope로 부른다. 그 미션을 처음 학습 완료한 시도의 마지막 답변만
        학생·미션당 1개 공유한다. 이미 있으면 그 공유물을 200으로(다시 푼 시도로 요청해도 같음). 메모·판정·되묻기는 담지 않는다.
        core가 마지막으로 알린 공개 여부가 끔이면 HIDDEN_SETTING으로 저장한다. postId는 core 포인트 사건 키(#389).
      parameters:
        - $ref: '#/components/parameters/SystemRole'
        - $ref: '#/components/parameters/RecordScope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [studentId, attemptId]
              properties:
                studentId: {type: string, format: uuid}
                attemptId: {type: string, format: uuid}
      responses:
        '201':
          description: 새 공유물
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommunityShareResult'}
        '200':
          description: 이미 있는 공유물(학생·미션당 1개)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommunityShareResult'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404':
          description: NOT_FOUND(없거나 그 학생의 시도가 아님)
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '409':
          description: COMMUNITY_NOT_SHAREABLE(학습 완료 전, 다시 푼 시도, 답변 없음, 지금 표현 필터 #205에 걸림). core는 공유 안 함으로 본다
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /community/posts/{postId}:
    get:
      operationId: getCommunityPost
      summary: 신고 대상 확인·관리자 원문 열람 (core #388)
      parameters:
        - $ref: '#/components/parameters/SystemRole'
        - $ref: '#/components/parameters/PostId'
      responses:
        '200':
          description: 상태와 무관한 원문. 학생 ID 포함(core 안에서만 사용)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommunityPostDetail'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404':
          description: COMMUNITY_POST_NOT_FOUND(파기·없음)
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /community/missions/{missionId}/posts:
    get:
      operationId: listMissionCommunityPosts
      summary: 같은 미션 공유물 무작위 목록 (FN-RET-02)
      description: >-
        열람자가 그 미션을 학습 완료하지 않았으면 403 COMMUNITY_LOCKED, 정답 고르기 문제(큰 질문 테마의 금요일 문제)를 그 문제로 고른 주에 엔딩을 보지 않았으면
        403 COMMUNITY_LOCKED_UNTIL_ENDING(#484). VISIBLE만, 열람자 본인 공유물 제외, 반응 수 없음.
        같은 seed면 같은 순서(쪽 나누기도 그 순서를 이어 감). studentId는 core가 별명으로 바꾼 뒤 지운다.
      parameters:
        - $ref: '#/components/parameters/StudentRole'
        - $ref: '#/components/parameters/StudentScope'
        - $ref: '#/components/parameters/MissionId'
        - name: viewerStudentId
          in: query
          required: true
          description: X-Student-Scope 학생과 같아야 함
          schema: {type: string, format: uuid}
        - name: seed
          in: query
          required: true
          schema: {type: string, minLength: 1, maxLength: 100}
        - name: page
          in: query
          schema: {type: integer, minimum: 0, default: 0}
        - name: size
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          description: 무작위 목록
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommunityMissionPostPage'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403':
          description: COMMUNITY_LOCKED(미션 미완료), COMMUNITY_LOCKED_UNTIL_ENDING(정답 고르기 문제 엔딩 전, #484) 또는 FORBIDDEN
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /community/students/{studentId}/posts:
    get:
      operationId: listStudentCommunityPosts
      summary: 본인·자녀 공유물과 받은 반응 종류별 수 (FN-RET-03)
      description: STUDENT는 본인만, PARENT는 X-Student-Scope에 그 자녀가 있어야 한다. 모든 상태를 최근 공유 순으로.
      parameters:
        - name: X-User-Role
          in: header
          required: true
          schema: {type: string, enum: [STUDENT, PARENT]}
        - $ref: '#/components/parameters/RecordScope'
        - $ref: '#/components/parameters/StudentId'
      responses:
        '200':
          description: 공유물 목록
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommunityStudentPostList'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /community/posts/{postId}/reactions/{reaction}:
    put:
      operationId: addCommunityReaction
      summary: 반응 남기기 (멱등)
      description: >-
        VISIBLE 공유물에만. 같은 학생·공유물·반응의 reactionId는 취소 뒤 다시 남겨도 같다(core 포인트 사건 키, #389).
        created는 이번 요청으로 새로 남겼는지.
      parameters:
        - $ref: '#/components/parameters/StudentRole'
        - $ref: '#/components/parameters/StudentScope'
        - $ref: '#/components/parameters/PostId'
        - $ref: '#/components/parameters/Reaction'
        - $ref: '#/components/parameters/ReactingStudentId'
      responses:
        '200':
          description: 결과
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [postId, reaction, reactionId, created]
                properties:
                  postId: {type: string, format: uuid}
                  reaction: {$ref: '#/components/schemas/CommunityReaction'}
                  reactionId: {type: string, format: uuid}
                  created: {type: boolean}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403':
          description: COMMUNITY_LOCKED(미션 미완료), COMMUNITY_LOCKED_UNTIL_ENDING(정답 고르기 문제 엔딩 전, #484) 또는 FORBIDDEN
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '404':
          description: COMMUNITY_POST_NOT_FOUND(없음·VISIBLE 아님)
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '409':
          description: COMMUNITY_OWN_POST
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
    delete:
      operationId: removeCommunityReaction
      summary: 반응 취소 (멱등, 숨긴 공유물에서도 가능)
      parameters:
        - $ref: '#/components/parameters/StudentRole'
        - $ref: '#/components/parameters/StudentScope'
        - $ref: '#/components/parameters/PostId'
        - $ref: '#/components/parameters/Reaction'
        - $ref: '#/components/parameters/ReactingStudentId'
      responses:
        '200':
          description: 결과. deleted는 이번 요청으로 지웠는지
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [postId, reaction, reactionId, deleted]
                properties:
                  postId: {type: string, format: uuid}
                  reaction: {$ref: '#/components/schemas/CommunityReaction'}
                  reactionId: {type: string, format: uuid}
                  deleted: {type: boolean}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404':
          description: COMMUNITY_POST_NOT_FOUND
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /community/posts/{postId}/moderation:
    put:
      operationId: moderateCommunityPost
      summary: 신고 검토 반영 (core #388, 멱등)
      description: >-
        HIDDEN_REPORT는 REMOVED가 아니면 숨김, VISIBLE은 HIDDEN_REPORT에서만 되돌리며 core가 마지막으로 알린 공개 여부가 끔이면
        HIDDEN_SETTING으로, REMOVED는 끝 상태(되돌리지 않음). 같은 요청 반복은 그대로.
      parameters:
        - $ref: '#/components/parameters/SystemRole'
        - $ref: '#/components/parameters/PostId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status, errorReportId]
              properties:
                status: {type: string, enum: [HIDDEN_REPORT, VISIBLE, REMOVED]}
                errorReportId: {type: string, format: uuid}
      responses:
        '200':
          description: 반영 뒤 상태
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [postId, status]
                properties:
                  postId: {type: string, format: uuid}
                  status: {$ref: '#/components/schemas/CommunityPostStatus'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404':
          description: COMMUNITY_POST_NOT_FOUND
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /students/{studentId}/community-visibility:
    put:
      operationId: setCommunityVisibility
      summary: 학생 공유물 공개 전환 (설정·동의·이관)
      description: >-
        끄면 VISIBLE → HIDDEN_SETTING, 켜면 HIDDEN_SETTING만 VISIBLE로. HIDDEN_REPORT·REMOVED는 그대로. 같은 값 반복은 멱등(changed 0).
        마지막 값은 신고 숨김을 풀 때·새 공유 때 설정 비공개를 지키는 데 쓴다.
      parameters:
        - $ref: '#/components/parameters/SystemRole'
        - $ref: '#/components/parameters/RecordScope'
        - $ref: '#/components/parameters/StudentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [visible, reason]
              properties:
                visible: {type: boolean}
                reason: {type: string, enum: [SETTING, CONSENT, TRANSFER]}
      responses:
        '200':
          description: 바꾼 공유물 수
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [studentId, visible, changed]
                properties:
                  studentId: {type: string, format: uuid}
                  visible: {type: boolean}
                  changed: {type: integer, minimum: 0}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /admin/knowledge/datasets:
    get:
      operationId: listKnowledgeDatasets
      summary: '교육과정 지식 판 목록 (#466, api-spec 4.1.3)'
      description: >-
        운영 스크립트(scripts/knowledge/manage_datasets.py)가 포트 포워드로 직접 부른다. core 프록시·관리자 화면 없음.
        SYSTEM 역할, 학생 범위 없음. 최근 판부터.
      parameters:
        - $ref: '#/components/parameters/SystemRole'
      responses:
        '200':
          description: 판 목록
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KnowledgeDatasetList'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      operationId: loadKnowledgeDataset
      summary: '새 판 적재 (#466, C9 ①~⑦, 동기)'
      description: >-
        C1 레코드·C4 확인 행으로 새 판(kn-YYYYMMDD-NN)을 LOADING으로 만들고 조각·학기·관계를 넣는다.
        임베딩은 만들지 않는다(생성에 벡터 검색을 쓰지 않는 팀 결정, 에픽 #463 2026-11-11, learning V17).
        이전 활성 판의 사람 확인 관계는 양 끝이 있으면 옮기고, 없거나 본문이 바뀌면 recheck(C4 모양, decision 빈 칸)로 돌려준다.
        입력 오류(형식, 조각 ID 겹침, reviewer SAMPLE, 성취기준 문장 불일치, 관계 끝 없음)는 판을 만들기 전에 400.
        같은 입력은 같은 조각·관계 수(멱등). 활성화는 따로.
      parameters:
        - $ref: '#/components/parameters/SystemRole'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/KnowledgeLoadRequest'}
      responses:
        '201':
          description: 적재한 LOADING 판과 결과 숫자
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KnowledgeLoadResult'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /admin/knowledge/datasets/{version}:
    get:
      operationId: getKnowledgeDataset
      summary: '판 상태·수 (#466)'
      parameters:
        - $ref: '#/components/parameters/SystemRole'
        - $ref: '#/components/parameters/KnowledgeDatasetVersion'
      responses:
        '200':
          description: 판
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KnowledgeDatasetView'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    delete:
      operationId: deleteKnowledgeDataset
      summary: 'RETIRED 판 제거 (#466, C9)'
      description: 한 트랜잭션에서 관계 → 조각 → 판. ACTIVE·LOADING은 409 KNOWLEDGE_DATASET_STATE_CONFLICT.
      parameters:
        - $ref: '#/components/parameters/SystemRole'
        - $ref: '#/components/parameters/KnowledgeDatasetVersion'
      responses:
        '204': {description: 제거함}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /admin/knowledge/datasets/{version}/activate:
    post:
      operationId: activateKnowledgeDataset
      summary: 'LOADING 판 활성화 (#466, C9 ⑧)'
      description: >-
        한 트랜잭션에서 이전 ACTIVE → RETIRED, 이 판 → ACTIVE(activated_at). LOADING이 아니거나
        적재 뒤 활성 판이 바뀌었으면(source.previousVersion과 다름) 409 KNOWLEDGE_DATASET_STATE_CONFLICT. 본문은 {} 또는 없음.
      parameters:
        - $ref: '#/components/parameters/SystemRole'
        - $ref: '#/components/parameters/KnowledgeDatasetVersion'
      responses:
        '200':
          description: 활성 판
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KnowledgeDatasetView'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /knowledge/standards:
    get:
      operationId: getKnowledgeStandards
      summary: '성취기준 코드로 근거 묶음 조회 (#464 계약 C5, 구현 #469)'
      description: >-
        코드마다 성취기준 문장·해설(있으면), 고려 사항을 가진 영역(사회·과학은 단원, 내용 체계는 covers로),
        확인된 맞는 유형(knowledge_fits)·다루는 내용 요소(knowledge_covers)와 교과 지침을 돌려준다.
        thinkingType을 주면 그 유형 출제 지침도 함께. 유사도 검색 없음. 활성 판만 읽는다.
        확인된 관계가 없으면 fits·covers는 빈 배열이다. learning 내부는 같은 KnowledgeService를 직접 호출한다.
        활성 판이 없으면 200 reason NO_ACTIVE_DATASET, 코드가 하나도 없으면 200 reason CODE_NOT_FOUND(missingCodes).
        SYSTEM 역할, 학생 범위 없음(학생 정보 없음). 기준안: codes 1~10개.
      parameters:
        - $ref: '#/components/parameters/SystemRole'
        - name: codes
          in: query
          required: true
          description: 대괄호 없는 성취기준 코드를 쉼표로(1~10개, 기준안)
          schema: {type: string, minLength: 1}
        - name: grade
          in: query
          description: 주면 항목 gradeMatch(그 학년에 배우는 성취기준인지)를 채움
          schema: {type: integer, minimum: 3, maximum: 6}
        - name: thinkingType
          in: query
          schema: {$ref: '#/components/schemas/KnowledgeThinkingType'}
      responses:
        '200':
          description: 근거 묶음(미션 초안 요청 knowledge 칸에 그대로 넣음, C7)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KnowledgeBundle'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '500':
          description: 조회 실패 또는 질의 시간 예산 초과(INTERNAL_ERROR)
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /knowledge/thinking-types/{type}:
    get:
      operationId: getKnowledgeThinkingType
      summary: '생각 유형 출제 지침 (#464 계약 C5, 구현 #469)'
      description: >-
        팀이 우리 말로 쓴 출제 지침과 출처 표기만(블룸 원서·VALUE 루브릭 문장 없음).
        활성 판이 없으면 200 guide null, reason NO_ACTIVE_DATASET. SYSTEM 역할.
      parameters:
        - $ref: '#/components/parameters/SystemRole'
        - name: type
          in: path
          required: true
          schema: {$ref: '#/components/schemas/KnowledgeThinkingType'}
      responses:
        '200':
          description: 출제 지침
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KnowledgeThinkingTypeResponse'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '500':
          description: 조회 실패 또는 질의 시간 예산 초과(INTERNAL_ERROR)
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
components:
  securitySchemes:
    InternalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
  parameters:
    KnowledgeDatasetVersion:
      name: version
      in: path
      required: true
      schema: {type: string, pattern: '^kn-[0-9]{8}-[0-9]{2}$'}
    SystemRole:
      name: X-User-Role
      in: header
      required: true
      schema:
        type: string
        const: SYSTEM
    PostId:
      name: postId
      in: path
      required: true
      schema: {type: string, format: uuid}
    Reaction:
      name: reaction
      in: path
      required: true
      schema: {$ref: '#/components/schemas/CommunityReaction'}
    ReactingStudentId:
      name: studentId
      in: query
      required: true
      description: 반응한 학생. X-Student-Scope 학생과 같아야 함
      schema: {type: string, format: uuid}
    UserId:
      name: X-User-Id
      in: header
      description: core가 학생 ID를 전달. learning 권한 판단은 X-User-Role·X-Student-Scope만 사용
      schema: {type: string, format: uuid}
    StudentRole:
      name: X-User-Role
      in: header
      required: true
      schema:
        type: string
        const: STUDENT
    StudentScope:
      name: X-Student-Scope
      in: header
      required: true
      description: 학생 본인 UUID 1개
      schema: {type: string, format: uuid}
    Grade:
      name: grade
      in: query
      required: true
      description: core가 붙이는 학생 학년 (P03)
      schema: {type: integer, minimum: 3, maximum: 6}
    Demo:
      name: demo
      in: query
      description: 시연 학생 여부 (student.is_demo)
      schema: {type: boolean, default: false}
    DraftId:
      name: draftId
      in: path
      required: true
      schema: {type: string, format: uuid}
    MissionId:
      name: missionId
      in: path
      required: true
      schema: {type: string, format: uuid}
    AttemptId:
      name: attemptId
      in: path
      required: true
      schema: {type: string, format: uuid}
    StudentId:
      name: studentId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ThemeId:
      name: themeId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ThemeGradeQuery:
      name: grade
      in: query
      required: false
      description: core가 학생 학년으로 정한 테마 학년(#438, 중학생 G6). 없으면 gradeBand를 읽고 둘 다 없으면 400
      schema: {$ref: '#/components/schemas/ThemeGrade'}
    GradeBandQuery:
      name: gradeBand
      in: query
      required: false
      deprecated: true
      description: >-
        전환 기간 호환(#438 → core 반영 사이). grade가 없을 때만 읽고 G3_4는 G3, G5_6은 G5로 본다(V15가 학년군 테마를
        학년마다 같은 내용으로 복사). core 반영 뒤 지움
      schema: {$ref: '#/components/schemas/GradeBand'}
    ThemeDate:
      name: date
      in: query
      required: true
      description: core가 정한 KST 오늘 날짜. 그 날짜가 속한 월요일이 이번 주
      schema: {type: string, format: date}
    ThemeSunday:
      name: sundayTheme
      in: query
      required: false
      description: >-
        core #485가 항상 붙이는 일요일 허용 값(api-spec 2.11·core-gateway 18절). KST 일요일이고 상품이 일요일 테마를 허용할 때만 true.
        learning은 true일 때만 일요일을 토요일과 같이 연다(신규 시작·다시 풀기·되돌아보기·이야기 열람·정답 고르기, #484). 없으면 false.
      schema: {type: boolean}
    AdminUserId:
      name: X-User-Id
      in: header
      required: true
      description: core가 검증한 관리자 ID (judgment_correction.corrected_by, 관리자 미션 created_by·reviewer_id). 없거나 UUID가 아니면 400
      schema: {type: string, format: uuid}
    AdminRole:
      name: X-User-Role
      in: header
      required: true
      schema:
        type: string
        const: ADMIN
    CorrectionScope:
      name: X-Student-Scope
      in: header
      required: true
      description: 판정 학생 UUID 정확히 1개. 비었거나 여럿이거나 다른 학생이면 403
      schema: {type: string, format: uuid}
    MemoryRole:
      name: X-User-Role
      in: header
      required: true
      description: core 프록시는 학생 본인 STUDENT. learning은 X-Student-Scope로만 범위를 판단
      schema: {type: string}
    MemoryScope:
      name: X-Student-Scope
      in: header
      required: true
      description: 검증된 허용 학생 UUID의 쉼표 구분 목록, 경로 학생이 있어야 함(core 프록시는 학생 본인 1명)
      schema: {type: string}
    RoundWeekStart:
      name: weekStart
      in: path
      required: true
      description: 회차 주(KST 월요일)
      schema: {type: string, format: date}
    RecordRole:
      name: X-User-Role
      in: header
      required: true
      schema:
        type: string
        enum: [PARENT, STUDENT, SYSTEM]
    RecordScope:
      name: X-Student-Scope
      in: header
      required: true
      description: 검증된 허용 학생 UUID의 쉼표 구분 목록, 조회 대상 학생이 있어야 함
      schema: {type: string}
    From:
      name: from
      in: query
      description: KST 날짜(포함). to와 함께 주거나 함께 생략(생략하면 오늘 포함 최근 7일, P06), 한쪽만 주면 400
      schema: {type: string, format: date}
    To:
      name: to
      in: query
      description: KST 날짜(포함). from과 함께 주거나 함께 생략, 한쪽만 주거나 from보다 이르면 400
      schema: {type: string, format: date}
  headers:
    DraftETag:
      description: 초안 버전 (`"7"`)
      schema: {type: string}
  responses:
    Problem:
      description: Problem Details (api-spec 1.3)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    MemoryExplanationRequest:
      type: object
      additionalProperties: false
      required: [query, attemptIds]
      properties:
        query: {type: string, minLength: 1, maxLength: 200}
        attemptIds:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items: {type: string, format: uuid}
          description: 검색 결과 카드의 시도 ID
    MemoryExplanationResult:
      type: object
      additionalProperties: true
      required: [state]
      description: 'learning 소유 추억 설명 결과(api-spec 2.12·4.1.4, learning #564). core는 바꾸지 않고 전달한다.'
      properties:
        state: {type: string, enum: [GENERATED, INSUFFICIENT, FAILED], description: 'INSUFFICIENT 근거 부족(생성 안 함), FAILED 생성·검사 실패'}
        text: {type: [string, 'null']}
        citations:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              no: {type: integer, minimum: 1, maximum: 3}
              themeId: {type: string, format: uuid}
              weekStart: {type: string, format: date}
              attemptId: {type: string, format: uuid}
    MemorySearchRequest:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query: {type: string, minLength: 1, maxLength: 200, description: '자연어 질문. 공백만은 거부, 저장하지 않음 (#566)'}
    MemorySearchResult:
      type: object
      additionalProperties: true
      required: [state, cards]
      description: 'learning 소유 추억 검색 결과(api-spec 2.12·4.1.4, learning #563). core는 바꾸지 않고 전달한다.'
      properties:
        state: {type: string, enum: [RESULTS, NO_RESULTS, NO_RECORDS], description: 'NO_RESULTS 관련도 기준 미달, NO_RECORDS 보유 액자 없음'}
        cards:
          type: array
          maxItems: 3
          items:
            type: object
            additionalProperties: true
            properties:
              themeId: {type: string, format: uuid}
              weekStart: {type: string, format: date}
              title: {type: string}
              imageUrl: {type: [string, 'null']}
              missions:
                type: array
                items:
                  type: object
                  additionalProperties: true
                  properties:
                    missionId: {type: string, format: uuid}
                    title: {type: string}
                    attemptId: {type: string, format: uuid}
                    answerExcerpt: {type: string}
              score: {type: number}
    CommunityPostStatus:
      type: string
      enum: [VISIBLE, HIDDEN_SETTING, HIDDEN_REPORT, REMOVED]
    CommunityReaction:
      type: string
      enum: [NEW_IDEA, CLEAR_REASON, DIFFERENT_VIEW, WANT_MORE]
    CommunityShareResult:
      type: object
      additionalProperties: false
      required: [postId, created, status]
      properties:
        postId: {type: string, format: uuid}
        created: {type: boolean}
        status: {$ref: '#/components/schemas/CommunityPostStatus'}
    CommunitySharedAnswer:
      type: object
      additionalProperties: false
      required: [inputType, text, content]
      description: 공유한 마지막 답변. text는 입력 틀 칸 이름을 붙인 원문(answer.plain_text), content는 입력 방식별 제출 내용. 메모·판정·되묻기 없음
      properties:
        inputType: {type: string, enum: [CHOICE, ORDERING, CLASSIFICATION, NARRATIVE, SOLUTION_STEPS, ESSAY]}
        text: {type: string}
        content: {type: object}
    CommunityMissionPost:
      type: object
      additionalProperties: false
      required: [postId, studentId, answer, myReactions, createdAt]
      properties:
        postId: {type: string, format: uuid}
        studentId: {type: string, format: uuid}
        answer: {$ref: '#/components/schemas/CommunitySharedAnswer'}
        myReactions: {type: array, items: {$ref: '#/components/schemas/CommunityReaction'}}
        createdAt: {type: string, format: date-time}
    CommunityMissionPostPage:
      type: object
      additionalProperties: false
      required: [items, page, size]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/CommunityMissionPost'}}
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1, maximum: 100}
    CommunityStudentPost:
      type: object
      additionalProperties: false
      required: [postId, missionId, missionTitle, answer, status, reactions, createdAt]
      properties:
        postId: {type: string, format: uuid}
        missionId: {type: string, format: uuid}
        missionTitle: {type: string, description: 시도에 고정된 미션 버전 제목}
        answer: {$ref: '#/components/schemas/CommunitySharedAnswer'}
        status: {$ref: '#/components/schemas/CommunityPostStatus'}
        reactions:
          type: object
          additionalProperties: false
          required: [NEW_IDEA, CLEAR_REASON, DIFFERENT_VIEW, WANT_MORE]
          properties:
            NEW_IDEA: {type: integer, minimum: 0}
            CLEAR_REASON: {type: integer, minimum: 0}
            DIFFERENT_VIEW: {type: integer, minimum: 0}
            WANT_MORE: {type: integer, minimum: 0}
        createdAt: {type: string, format: date-time}
    CommunityStudentPostList:
      type: object
      additionalProperties: false
      required: [studentId, items]
      properties:
        studentId: {type: string, format: uuid}
        items: {type: array, items: {$ref: '#/components/schemas/CommunityStudentPost'}}
    CommunityPostDetail:
      type: object
      additionalProperties: false
      required: [postId, studentId, missionId, status, answer, createdAt]
      properties:
        postId: {type: string, format: uuid}
        studentId: {type: string, format: uuid}
        missionId: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/CommunityPostStatus'}
        answer: {$ref: '#/components/schemas/CommunitySharedAnswer'}
        createdAt: {type: string, format: date-time}
    AttemptComparison:
      type: object
      required: [attemptId, state, previous, current, elements]
      properties:
        attemptId: {type: string, format: uuid}
        state: {type: string, enum: [NO_PREVIOUS, COMPARABLE, CRITERIA_CHANGED]}
        previous:
          anyOf:
          - {$ref: '#/components/schemas/ComparisonSnapshot'}
          - {type: 'null'}
        current: {$ref: '#/components/schemas/ComparisonSnapshot'}
        elements:
          type: array
          items:
            type: object
            required: [elementId, label, previousSatisfied, currentSatisfied, change]
            properties:
              elementId: {type: string, format: uuid}
              label: {type: string}
              previousSatisfied: {type: boolean}
              currentSatisfied: {type: boolean}
              change: {type: string, enum: [ADDED, RETAINED, NOT_CONFIRMED, NOT_CONFIRMED_NOW]}
    ComparisonSnapshot:
      type: object
      required: [attemptId, finishedAt, answers, judgment, elements, mission]
      properties:
        attemptId: {type: string, format: uuid}
        finishedAt: {type: string, format: date-time}
        mission:
          type: object
          required: [title, question, inputType, choices, categories, answerUnit]
          properties:
            title: {type: string}
            question: {type: string}
            inputType: {type: string, enum: [CHOICE, ORDERING, CLASSIFICATION, NARRATIVE, SOLUTION_STEPS, ESSAY]}
            choices: {type: array, items: {type: object, required: [id, label], properties: {id: {type: string}, label: {type: string}}}}
            categories: {type: array, items: {type: object, required: [id, label], properties: {id: {type: string}, label: {type: string}}}}
            answerUnit: {type: [string, 'null']}
        judgment: {type: [string, 'null'], enum: [CORRECT, PARTIAL, RETHINK, HELD, null]}
        answers:
          type: array
          items:
            type: object
            required: [answerId, version, text, content]
            properties:
              answerId: {type: string, format: uuid}
              version: {type: integer, minimum: 1}
              text: {type: [string, 'null']}
              content: {type: object, additionalProperties: true}
        elements: {type: array, items: {type: object, additionalProperties: true}}
    MissionStatus:
      type: string
      enum: [DRAFT, REVIEW_REQUIRED, PUBLISHED, UNPUBLISHED]
    AnswerKey:
      type: object
      additionalProperties: false
      description: 입력 방식 모양 - 고르기 {choiceIds:[1개]}, 순서 {choiceIds:[정답 순서]}, 분류 {assignments}, 풀이 단계 {finalAnswer(수만)}
      properties:
        choiceIds: {type: array, items: {type: string}}
        finalAnswer: {type: string}
        assignments:
          type: array
          items:
            type: object
            required: [choiceId, categoryId]
            properties:
              choiceId: {type: string}
              categoryId: {type: string}
    AchievementStandard:
      type: object
      additionalProperties: false
      description: 성취기준 표 한 행 (ERD 4.1 achievement_standard, #353)
      required: [code, subject, gradeBand, area, statement, levelScale, levels, curriculumVersion, source, note]
      properties:
        code: {type: string, description: 대괄호 없는 성취기준 코드}
        subject: {type: string}
        gradeBand: {type: string, enum: ['초1~2', '초3~4', '초5~6', '중1~3']}
        area: {type: string}
        statement: {type: string}
        levelScale: {type: integer, enum: [3, 5]}
        levels: {type: ['object', 'null'], additionalProperties: {type: string}, description: 평가원 성취수준 문장, 이용 조건 확인 전 null}
        curriculumVersion: {type: string}
        source: {type: string}
        note: {type: [string, 'null'], description: 원문 대조 기록}
    AchievementStandardPage:
      type: object
      additionalProperties: false
      required: [items, page, size, totalElements]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AchievementStandard'}}
        page: {type: integer}
        size: {type: integer}
        totalElements: {type: integer}
    AchievementLevels:
      type: object
      description: 성취기준별 성취수준 단계 {성취기준 코드 → A~E}. 저장 때는 모양만, 키·단계 수는 게시(초안 요청) 때
      additionalProperties: {type: string, pattern: '^[A-E]$'}
    MissionDraftStatus:
      type: string
      enum: [GENERATING, READY, CHECK_FAILED, FAILED, ADOPTED, DISCARDED]
    MissionDraftRequest:
      type: object
      required: [standardCodes, thinkingType, gradeMin, gradeMax, inputType]
      properties:
        standardCodes: {type: array, minItems: 1, items: {type: string}}
        achievementLevels:
          oneOf:
            - $ref: '#/components/schemas/AchievementLevels'
            - type: 'null'
        thinkingType: {$ref: '#/components/schemas/ThinkingType'}
        gradeMin: {type: integer, minimum: 3, maximum: 6}
        gradeMax: {type: integer, minimum: 3, maximum: 6}
        inputType: {$ref: '#/components/schemas/InputType'}
    MissionDraftFailure:
      type: object
      additionalProperties: false
      required: [check, reason]
      properties:
        check: {type: string, description: 'ai REQUIRED·QUESTION_LENGTH·LEAK, learning STANDARD_CODE·ELEMENT_CODE·SHAPE, AI 호출 실패 AI_CALL'}
        reason: {type: string, description: 'AI_CALL이면 실패 코드(AI_TIMEOUT 등), learning 검사면 게시 누락 코드'}
    GeneratedDraft:
      type: object
      additionalProperties: false
      description: ai 초안 (ai api-spec 4.2 draft). sceneNote는 그림 제작 메모로 미션에 저장하지 않음
      required: [title, question, guide, sceneNote, choices, categories, answerKey, exampleAnswer, forbiddenTerms, hints, elements]
      properties:
        title: {type: string}
        question: {type: string}
        guide: {type: [string, 'null']}
        sceneNote: {type: [string, 'null']}
        choices: {type: [array, 'null'], items: {$ref: '#/components/schemas/Choice'}}
        categories: {type: [array, 'null'], items: {$ref: '#/components/schemas/Choice'}}
        answerKey:
          oneOf:
            - $ref: '#/components/schemas/AnswerKey'
            - type: 'null'
        exampleAnswer: {type: [string, 'null']}
        forbiddenTerms: {type: array, items: {type: string}}
        hints: {type: array, items: {type: string}}
        elements:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code, label, description, goodThought, standardCode]
            properties:
              code: {type: string}
              label: {type: string}
              description: {type: string}
              goodThought: {type: boolean}
              standardCode: {type: [string, 'null']}
    MissionDraft:
