          type: array
          items:
            type: object
            required: [day, missionId, title, thinkingType, state, attemptStatus, clue, rulesOut, completedOnDay]
            properties:
              day: {$ref: '#/components/schemas/ThemeDay'}
              missionId: {type: string, format: uuid}
              title: {type: string}
              thinkingType: {$ref: '#/components/schemas/ThinkingType'}
              state: {type: string, enum: [LOCKED, OPEN, CLOSED]}
              clue: {type: [string, 'null'], description: '그날 단서(#438). 그 문제를 그 주에 학습 완료한 뒤에만, 아니면 null(#484)'}
              rulesOut: {type: [array, 'null'], items: {type: string}, description: '그날 단서로 빠지는 후보(빈 배열 가능). clue와 같은 조건'}
              completedOnDay: {type: boolean, description: '그 요일 문제를 그 요일 KST 안에 학습 완료(당일 풀이, core THEME_ON_TIME 근거, #484)'}
              attemptStatus:
                type: string
                description: 이번 주 그 요일 문제(THEME_DAY) 최근 시도 상태
                enum: [NOT_STARTED, IN_PROGRESS, COMPLETED]
