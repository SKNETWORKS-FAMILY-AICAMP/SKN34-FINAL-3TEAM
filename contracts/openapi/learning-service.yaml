      required: [kind]
      properties:
        kind: {$ref: '#/components/schemas/ThemeStoryKind'}
    StoryViewResult:
      type: object
      required: [kind, firstViewThisWeek]
      properties:
        kind: {$ref: '#/components/schemas/ThemeStoryKind'}
        firstViewThisWeek: {type: boolean}
    DialogueLine:
      type: object
      required: [speaker, text]
      properties:
        speaker: {type: string, minLength: 1, maxLength: 40}
        text: {type: string, minLength: 1, maxLength: 200}
    HintSpot:
      type: object
      required: [seq, x, y]
      description: 그림 위 생각 열기 위치(#438). seq는 그날 미션 현재 기준표의 생각 열기 순번, x·y는 그림 기준 0~100%
      properties:
        seq: {type: integer, minimum: 1}
        x: {type: number, minimum: 0, maximum: 100}
        y: {type: number, minimum: 0, maximum: 100}
    ThemeReviewViewResult:
      type: object
      required: [firstViewThisWeek, completed]
      properties:
        firstViewThisWeek: {type: boolean}
        completed: {type: boolean}
    WeeklyThemeSummary:
      type: object
      required: [studentId, weekStart, state, themeId, title, days, completed, reviewRetries, finished, ending]
      properties:
        studentId: {type: string, format: uuid}
        weekStart: {type: string, format: date}
        state: {type: string, enum: [OK, NO_RECORD]}
        themeId: {type: [string, 'null'], format: uuid}
        title: {type: [string, 'null']}
        days:
          type: array
          items:
            type: object
            required: [day, missionId, title, completed, completedInWeek]
            properties:
              day: {$ref: '#/components/schemas/ThemeDay'}
              missionId: {type: string, format: uuid}
              title: {type: string}
              completed: {type: boolean, description: '그 요일(KST) 안에 학습 완료(= 주간 테마 조회 completedOnDay, 요약은 이름 유지 #507)'}
              completedInWeek: {type: boolean, description: '그 주 테마 시도 안에 학습 완료, 일요일 포함(report #486, #484)'}
        completed: {type: boolean, description: 개근}
        finished: {type: boolean, description: '주간 완주(토요일 23:59:59 KST까지 다섯 문제 학습 완료, 일요일 제외, #484)'}
        ending: {$ref: '#/components/schemas/ThemeEnding'}
        reviewRetries:
          type: array
          description: 토요일(프리미엄 일요일) 되돌아보기 다시 풀기(THEME_REVIEW) 시도
          items:
            type: object
            required: [missionId, title, attemptId]
            properties:
              missionId: {type: string, format: uuid}
              title: {type: string}
              attemptId: {type: string, format: uuid}
              comparison:
                description: 마무리 전 null. 같은 기준표일 때만 요소 비교. 답변 원문 제외.
                type: [object, 'null']
                required: [state, elements]
                properties:
                  state: {type: string, enum: [NO_PREVIOUS, COMPARABLE, CRITERIA_CHANGED]}
                  elements:
                    type: array
                    items:
                      type: object
                      required: [elementId, label, previousSatisfied, currentSatisfied, change]
                      properties:
                        elementId: {type: string, format: uuid}
                        label: {type: string}
                        previousSatisfied: {type: boolean}
                        currentSatisfied: {type: boolean}
                        change: {type: string, enum: [ADDED, RETAINED, NOT_CONFIRMED, NOT_CONFIRMED_NOW]}
    RoundKey:
      type: object
      required: [themeId, weekStart]
      description: 회차 키(P27). 학생은 경로로 정함
      properties:
        themeId: {type: string, format: uuid}
        weekStart: {type: string, format: date, description: KST 월요일}
    AlbumItem:
      type: object
      required: [themeId, weekStart, title, imageUrl, awardedAt, seen]
      properties:
        themeId: {type: string, format: uuid}
        weekStart: {type: string, format: date}
        title: {type: string, description: 액자를 받은 때 테마 버전의 제목}
        imageUrl:
          type: [string, 'null']
          description: 그 버전 시작 이야기 그림의 presigned URL(종료 그림은 엔딩 내용이라 쓰지 않음). 없으면 null(화면이 ThemeArt로 그림)
        awardedAt: {type: string, format: date-time, description: 5문제 중 마지막 학습 완료 시각}
        seen: {type: boolean, description: 새 액자 확인 여부(false면 새 액자)}
    AlbumPage:
      type: object
      required: [items, page, size, totalElements]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/AlbumItem'}
        page: {type: integer}
        size: {type: integer}
        totalElements: {type: integer, format: int64}
    AlbumRound:
      type: object
      required: [themeId, weekStart, title, imageUrl, awardedAt, missions, ending]
      properties:
        themeId: {type: string, format: uuid}
        weekStart: {type: string, format: date}
        title: {type: string}
        imageUrl: {type: [string, 'null']}
        awardedAt: {type: string, format: date-time}
        missions:
          type: array
          items:
            type: object
            required: [day, missionId, title, thinkingType, attemptId]
            properties:
              day: {$ref: '#/components/schemas/ThemeDay'}
              missionId: {type: string, format: uuid}
              title: {type: string}
              thinkingType: {$ref: '#/components/schemas/ThinkingType'}
              attemptId:
                type: [string, 'null']
                format: uuid
                description: 그 회차에서 그 문제를 마지막으로 학습 완료한 시도(다시 풀기 포함). 테마 재게시로 문제가 바뀌었으면 null
        ending:
          type: object
          required: [seen, outro, answer]
          description: 그 주 엔딩 상태(ending = ENDED, #484)일 때만 seen = true이고 outro·answer를 받음(P23)
          properties:
            seen: {type: boolean}
            outro: {type: [string, 'null']}
            answer: {type: [string, 'null']}
    ThemeDayMission:
      type: object
      required: [day, missionId]
      description: >-
        요일 문제(#438 요일 칸은 선택). 수정 때 없거나 null이면 그 요일의 이전 버전 값을 이어받음(생각 열기 위치는 미션이 같을 때만),
        dialogue·hintSpots·clue·videoUri는 빈 값이면 비움. rulesOut의 빈 배열은 "빠지는 후보 없음"
      properties:
        day: {$ref: '#/components/schemas/ThemeDay'}
        missionId: {type: string, format: uuid}
        clue: {type: [string, 'null'], maxLength: 200}
        rulesOut: {type: [array, 'null'], maxItems: 10, items: {type: string, maxLength: 100}}
        dialogue: {type: [array, 'null'], maxItems: 20, items: {$ref: '#/components/schemas/DialogueLine'}}
        hintSpots: {type: [array, 'null'], maxItems: 10, items: {$ref: '#/components/schemas/HintSpot'}}
        videoUri: {type: [string, 'null'], maxLength: 500, description: 문제 전 영상 S3 키. ai는 요일 영상을 만들지 않아 관리자가 직접 넣을 때만 씀}
    AdminThemeDay:
      type: object
      required: [day, missionId, clue, rulesOut, dialogue, hintSpots, videoUri, videoUrl, sceneImageUrl]
      properties:
        day: {$ref: '#/components/schemas/ThemeDay'}
        missionId: {type: string, format: uuid}
        clue: {type: [string, 'null']}
        rulesOut: {type: [array, 'null'], items: {type: string}}
        dialogue: {type: [array, 'null'], items: {$ref: '#/components/schemas/DialogueLine'}}
        hintSpots: {type: [array, 'null'], items: {$ref: '#/components/schemas/HintSpot'}}
        videoUri: {type: [string, 'null'], description: 저장된 S3 키}
        videoUrl: {type: [string, 'null'], description: 미리보기 presigned URL}
        sceneImageUrl: {type: [string, 'null'], description: '그날 미션 장면 미리보기 URL(게시본, 없으면 현재본)'}
    AdminWeeklyThemeRequest:
      type: object
      required: [grade, weekStart, title, intro, days]
      properties:
        grade: {$ref: '#/components/schemas/ThemeGrade'}
        weekStart: {type: string, format: date, description: KST 월요일(아니면 400)}
        title: {type: string, minLength: 1, maxLength: 100}
        intro: {type: string, maxLength: 2000}
        days:
          type: array
          maxItems: 5
          description: 요일·미션은 겹치지 않음
          items: {$ref: '#/components/schemas/ThemeDayMission'}
        outro:
          type: [string, 'null']
          maxLength: 2000
          description: >-
            #438 이야기·정답 구조 칸은 모두 선택. 수정 때 없거나 null이면 이전 버전 값을 이어받고, 빈 값(빈 문자열·빈 배열·빈 객체)이면 비움.
            저장 때 정답 논리와 생각 열기 위치를 검사(400)
        introImageUri: {type: [string, 'null'], maxLength: 500}
        outroImageUri: {type: [string, 'null'], maxLength: 500}
        introVideoUri: {type: [string, 'null'], maxLength: 500}
        outroVideoUri: {type: [string, 'null'], maxLength: 500}
        introMotion: {$ref: '#/components/schemas/ThemeMotion'}
        outroMotion: {$ref: '#/components/schemas/ThemeMotion'}
        bigQuestion: {type: [string, 'null'], maxLength: 200}
        candidates: {type: [array, 'null'], maxItems: 10, items: {type: string, maxLength: 100}}
        answer: {type: [string, 'null'], maxLength: 100}
        answerClue: {type: [string, 'null'], maxLength: 500}
    ThemeDraftStatus:
      type: string
      enum: [GENERATING, READY, CHECK_FAILED, FAILED, ADOPTED, DISCARDED]
    ThemeDraftSource:
      type: string
      enum: [AUTO, ADMIN]
      description: 주간 자동(수요일 03:00 KST, 그 학년·주 게시 테마가 있으면 건너뜀) AUTO, 관리자 요청·다시 생성 ADMIN
    ThemeDraftRequest:
      type: object
      required: [grade, weekStart]
      properties:
        grade: {$ref: '#/components/schemas/ThemeGrade'}
        weekStart: {type: string, format: date, description: 적용 주 KST 월요일, 이번 주 이후}
        topic: {type: [string, 'null'], maxLength: 100, description: '주제(앞뒤 공백 제거). 비우면 learning이 주제 씨앗(뭉치 역할: … / 장소: … / 찾는 대상: …)을 골라 input.topic에 넣음'}
        missions:
          type: [array, 'null']
          maxItems: 5
          description: 유형마다 최대 1개. 고르지 않은 유형은 learning이 자동 규칙으로 채움
          items:
            type: object
            required: [thinkingType, standardCodes, inputType]
            properties:
              thinkingType: {$ref: '#/components/schemas/ThinkingType'}
              standardCodes: {type: array, minItems: 1, items: {type: string}}
              inputType: {$ref: '#/components/schemas/InputType'}
    ThemeMissionInput:
      type: object
      additionalProperties: false
      required: [thinkingType, inputType, standardCodes]
      properties:
        thinkingType: {$ref: '#/components/schemas/ThinkingType'}
        inputType: {$ref: '#/components/schemas/InputType'}
        standardCodes: {type: array, items: {type: string}}
    ThemeDraftFailure:
      type: object
      additionalProperties: false
      required: [stage, reasons]
      properties:
        stage:
          type: string
          description: >-
            ai THEME·MISSION·REVIEW·IMAGE, learning 검사 LEARNING(사유는 `<요일> <검사 코드> <자세히>`면 미션 규칙,
            그 밖은 PLACEMENT·LOGIC·LENGTH·SHAPE로 시작), AI 호출 실패 AI_CALL(사유는 실패 코드)
        reasons: {type: array, items: {type: string}}
    GeneratedTheme:
      type: object
      additionalProperties: false
      description: ai 테마 틀 (api-spec 4.2 theme). 세계관·인물·그림 메모·장소는 그림 생성용이라 테마에 저장하지 않음
      required: [title, world, characters, styleNote, outfit, intro, outro, bigQuestion, candidates, answer, days]
      properties:
        title: {type: string}
        world: {type: string}
        characters:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, look]
            properties:
              name: {type: string}
              look: {type: string}
        styleNote: {type: string}
        outfit: {type: string}
        intro: {type: string}
        outro: {type: string}
        bigQuestion: {type: string}
        candidates: {type: array, items: {type: string}}
        answer: {type: string}
        days:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [day, thinkingType, place, sceneNote, clue, rulesOut]
            properties:
              day: {$ref: '#/components/schemas/ThemeDay'}
              thinkingType: {$ref: '#/components/schemas/ThinkingType'}
              place: {type: string}
              sceneNote: {type: string}
              clue: {type: string}
              rulesOut: {type: array, items: {type: string}}
    ThemeDraftScene:
      type: object
      additionalProperties: false
      required: [scene, imageUrl, videoUrl, motion]
      properties:
        scene: {type: string, enum: [INTRO, MON, TUE, WED, THU, FRI, OUTRO]}
        imageUrl: {type: [string, 'null'], description: 장면 그림 presigned URL (버킷 설정이 없거나 그림이 없으면 null)}
        videoUrl: {type: [string, 'null'], description: 장면 영상 presigned URL. INTRO·OUTRO만 값이 있고 요일은 null(ai 요일 영상 없음)}
        motion: {$ref: '#/components/schemas/ThemeMotion'}
    ThemeDraft:
      type: object
      additionalProperties: false
      description: 주간 테마 초안 (api-spec 4.1, state-diagram 3.5.1, #438)
      required: [draftId, status, source, grade, weekStart, attempts, maxAttempts, input, checkResults, draft, scenes, failureCode, versions,
                 themeId, requestedBy, createdAt, updatedAt]
      properties:
        draftId: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/ThemeDraftStatus'}
        source: {$ref: '#/components/schemas/ThemeDraftSource'}
        grade: {$ref: '#/components/schemas/ThemeGrade'}
        weekStart: {type: string, format: date}
        attempts: {type: integer, description: 생성 시도 횟수 (AI 호출 실패 포함)}
        maxAttempts: {type: integer}
        input:
          type: object
          additionalProperties: false
          required: [topic, missions]
          description: 유형 5개 입력(월~금 배치 순, 관리자가 고르지 않은 유형은 learning이 채운 값)
          properties:
            topic: {type: [string, 'null']}
            missions: {type: array, items: {$ref: '#/components/schemas/ThemeMissionInput'}}
        checkResults:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [attempt, failures]
            properties:
              attempt: {type: integer}
              failures: {type: array, items: {$ref: '#/components/schemas/ThemeDraftFailure'}}
        draft:
          description: 마지막 생성 결과 중 theme·missions·dialogues·warnings (없으면 null, 장면은 scenes)
          oneOf:
            - type: object
              additionalProperties: false
              required: [theme, missions, dialogues, warnings]
              properties:
                theme:
                  oneOf:
                    - $ref: '#/components/schemas/GeneratedTheme'
                    - type: 'null'
                missions:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [day, thinkingType, draft]
                    properties:
                      day: {$ref: '#/components/schemas/ThemeDay'}
                      thinkingType: {$ref: '#/components/schemas/ThinkingType'}
                      draft: {$ref: '#/components/schemas/GeneratedDraft'}
                dialogues:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [day, lines]
                    properties:
                      day: {$ref: '#/components/schemas/ThemeDay'}
                      lines: {type: array, items: {$ref: '#/components/schemas/DialogueLine'}}
                warnings:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [stage, item, reason]
                    properties:
                      stage: {type: string}
                      item: {type: string}
                      reason: {type: string}
            - type: 'null'
        scenes:
          type: array
          description: 생성 결과가 있으면 장면 7개(INTRO·MON~FRI·OUTRO) 순서, 없으면 빈 배열
          items: {$ref: '#/components/schemas/ThemeDraftScene'}
        failureCode: {type: [string, 'null'], description: '마지막 AI 호출 실패 (AI_TIMEOUT·AI_UNAVAILABLE·AI_BAD_RESPONSE·AI_CIRCUIT_OPEN)'}
        versions:
          type: object
          additionalProperties: false
          required: [prompt, model]
          properties:
            prompt: {type: [string, 'null']}
            model: {type: [string, 'null']}
        themeId: {type: [string, 'null'], format: uuid, description: 채택해 만든 테마}
        requestedBy: {type: [string, 'null'], format: uuid, description: 요청한 관리자, 주간 자동은 null}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ThemeDraftPage:
      type: object
      additionalProperties: false
      required: [items, page, size, totalElements]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ThemeDraft'}}
        page: {type: integer}
        size: {type: integer}
        totalElements: {type: integer}
    AdminWeeklyTheme:
      type: object
      required: [themeId, grade, weekStart, status, version, publishedVersion, reviewRequested, title, intro, days, publishedAt, createdAt, updatedAt]
      properties:
        themeId: {type: string, format: uuid}
        grade: {$ref: '#/components/schemas/ThemeGrade'}
        weekStart: {type: string, format: date}
        status: {$ref: '#/components/schemas/MissionStatus'}
        version: {type: integer, minimum: 1, description: 편집 중인 현재본}
        publishedVersion: {type: [integer, 'null'], description: 학생에게 제공 중인 게시본}
        reviewRequested: {type: boolean, description: 현재본을 검토 요청함(게시 가능)}
        title: {type: string}
        intro: {type: string}
        days: {type: array, items: {$ref: '#/components/schemas/AdminThemeDay'}}
        publishedAt: {type: [string, 'null'], format: date-time}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        outro: {type: [string, 'null']}
        introImageUri: {type: [string, 'null'], description: 저장된 S3 키}
        outroImageUri: {type: [string, 'null']}
        introVideoUri: {type: [string, 'null']}
        outroVideoUri: {type: [string, 'null']}
        introMotion: {$ref: '#/components/schemas/ThemeMotion'}
        outroMotion: {$ref: '#/components/schemas/ThemeMotion'}
        bigQuestion: {type: [string, 'null']}
        candidates: {type: [array, 'null'], items: {type: string}}
        answer: {type: [string, 'null']}
        answerClue: {type: [string, 'null'], description: 결정적 단서}
        introImageUrl: {type: [string, 'null'], description: 미리보기 presigned URL}
        outroImageUrl: {type: [string, 'null']}
        introVideoUrl: {type: [string, 'null']}
        outroVideoUrl: {type: [string, 'null']}
    AdminWeeklyThemePage:
      type: object
      required: [items, page, size, totalElements]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AdminWeeklyTheme'}}
        page: {type: integer}
        size: {type: integer}
        totalElements: {type: integer}
    ThemePublishError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [DAYS_INCOMPLETE, MISSION_NOT_PUBLISHED, MISSION_DEMO_ONLY, GRADE_MISMATCH, THINKING_TYPES, WEEK_ALREADY_PUBLISHED]
        message: {type: string}
    Problem:
      type: object
      required: [type, title, status, code, traceId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: [string, 'null']
        instance:
          type: string
        traceId:
          type: string
    KnowledgeLoadRequest:
      type: object
      required: [source, records]
      properties:
        source:
          type: object
          description: 원문 고시 번호·추출 판·확인 파일·학기 대응 자료 이름(dataset.sample.json source 모양). previousVersion은 learning이 채움
        records:
          type: array
          minItems: 1
          description: C1 레코드(scripts/knowledge/schema/curriculum-record.schema.json), JSONL 한 줄이 한 항목
          items: {type: object}
        reviews:
          type: array
          description: C4 확인 행(relation-review.schema.json), CSV 한 행이 한 항목. 없으면 이전 활성 판 관계만 옮김
          items: {$ref: '#/components/schemas/KnowledgeRelationReview'}
    KnowledgeRelationReview:
      type: object
      description: C4 한 행. 빈 칸은 빈 문자열. ACCEPT·MODIFY만 적재, reviewer SAMPLE은 400
      properties:
        relationType: {type: string, enum: [FITS, PREREQUISITE, COVERS]}
        standardCode: {type: string}
        standardStatement: {type: string}
        target: {type: string}
        targetText: {type: string}
        evidence: {type: string}
        similarity: {type: string}
        candidateSource: {type: string}
        decision: {type: string, enum: ['', ACCEPT, REJECT, MODIFY]}
        modifiedTarget: {type: string}
        reason: {type: string}
        reviewer: {type: string}
        reviewedAt: {type: string}
        datasetVersion: {type: string}
    KnowledgeDatasetView:
      type: object
      required: [version, status, source, chunkCount, relationCount, chunks, relations, createdAt]
      properties:
        version: {type: string}
        status: {type: string, enum: [LOADING, ACTIVE, RETIRED]}
        source: {type: object}
        chunkCount: {type: integer}
        relationCount: {type: integer, description: 학기·fits·prerequisite·covers 행 합}
        chunks:
          type: object
          description: 종류(STANDARD·DOMAIN·CONTENT·SUBJECT_GUIDE·THINKING_TYPE)별 조각 수
          additionalProperties: {type: integer}
        relations:
          type: object
          description: SEMESTER·FITS·PREREQUISITE·COVERS 행 수
          additionalProperties: {type: integer}
        createdAt: {type: string, format: date-time}
        activatedAt: {type: [string, 'null'], format: date-time}
    KnowledgeDatasetList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/KnowledgeDatasetView'}
    KnowledgeLoadResult:
      type: object
      required: [dataset, documents, carriedRelations, recheck]
      properties:
        dataset: {$ref: '#/components/schemas/KnowledgeDatasetView'}
        documents: {type: integer, description: 원문 고시 문서 수(생각 유형 제외)}
        previousVersion: {type: [string, 'null']}
        carriedRelations: {type: integer, description: 이전 활성 판에서 옮긴 사람 확인 관계 수}
        recheck:
          type: array
          description: 다시 확인할 관계(C4 모양, decision 빈 칸, evidence에 사유)
          items: {$ref: '#/components/schemas/KnowledgeRelationReview'}
    KnowledgeThinkingType:
      type: string
      enum: [ANALYZE, EVALUATE, CREATE, SOLVE, REFLECT]
    KnowledgeKind:
      type: string
      enum: [STANDARD, DOMAIN, CONTENT, SUBJECT_GUIDE, THINKING_TYPE]
    KnowledgeSubject:
      type: string
      enum: [국어, 도덕, 사회, 수학, 과학]
    KnowledgeFallbackReason:
      description: >-
        코드 조회의 근거 없음 사유(200 응답, #464 C5).
        NO_ACTIVE_DATASET 활성 판 없음, CODE_NOT_FOUND 요청한 성취기준 코드가 하나도 없거나 생각 유형 지침이 없음.
        확인된 관계가 없으면 fits와 covers는 빈 배열이며 별도 오류 사유를 만들지 않는다.
      type: string
      enum: [NO_ACTIVE_DATASET, CODE_NOT_FOUND]
    KnowledgeRef:
      description: 근거 조각 표시. C5 응답 조각마다 붙고 C7 미션 초안 응답 sources 항목이 된다
      type: object
      additionalProperties: false
      required: [kind, id, datasetVersion]
      properties:
        kind: {$ref: '#/components/schemas/KnowledgeKind'}
        id: {type: string, minLength: 1}
        datasetVersion: {type: string, minLength: 1}
    KnowledgeContentItem:
      type: object
      additionalProperties: false
      required: [group, text]
      properties:
        group: {type: [string, 'null']}
        text: {type: string}
    KnowledgeStandard:
      type: object
      additionalProperties: false
      required: [code, subject, grades, semesters, noticeGradeBand, area, statement, explanation, ref]
      properties:
        code: {type: string}
        subject: {$ref: '#/components/schemas/KnowledgeSubject'}
        grades: {type: array, items: {type: integer, minimum: 3, maximum: 6}}
        semesters: {type: array, items: {type: string, pattern: '^[3-6]-[12]$'}}
        noticeGradeBand: {type: string}
        area: {type: string}
        statement: {type: string}
        explanation: {type: [string, 'null']}
        ref: {$ref: '#/components/schemas/KnowledgeRef'}
    KnowledgeDomain:
      type: object
      additionalProperties: false
      required: [id, subject, area, scope, coreIdeas, knowledge, process, values, considerations, activities, ref]
      properties:
        id: {type: string}
        subject: {$ref: '#/components/schemas/KnowledgeSubject'}
        area: {type: string}
        scope: {type: string, enum: [BOTH, CONTENT_SYSTEM, STANDARD_GROUP]}
        coreIdeas: {type: array, items: {type: string}}
        knowledge: {type: array, items: {$ref: '#/components/schemas/KnowledgeContentItem'}}
        process: {type: array, items: {$ref: '#/components/schemas/KnowledgeContentItem'}}
        values: {type: array, items: {$ref: '#/components/schemas/KnowledgeContentItem'}}
        considerations: {type: array, items: {type: string}}
        activities: {type: array, items: {type: string}}
        ref: {$ref: '#/components/schemas/KnowledgeRef'}
    KnowledgeContent:
      type: object
      additionalProperties: false
      required: [id, domainId, category, group, text, ref]
      properties:
        id: {type: string}
        domainId: {type: string}
        category: {type: string, enum: [K, P, V]}
        group: {type: [string, 'null']}
        text: {type: string}
        ref: {$ref: '#/components/schemas/KnowledgeRef'}
    KnowledgeFit:
      type: object
      additionalProperties: false
      required: [thinkingType, reason]
      properties:
        thinkingType: {$ref: '#/components/schemas/KnowledgeThinkingType'}
        reason: {type: string}
    KnowledgeStandardBundle:
      type: object
      additionalProperties: false
      required: [standard, domain, covers, fits, gradeMatch]
      properties:
        standard: {$ref: '#/components/schemas/KnowledgeStandard'}
        domain:
          anyOf:
            - $ref: '#/components/schemas/KnowledgeDomain'
            - type: 'null'
        covers: {type: array, items: {$ref: '#/components/schemas/KnowledgeContent'}}
        fits: {type: array, items: {$ref: '#/components/schemas/KnowledgeFit'}}
        gradeMatch: {type: [boolean, 'null']}
    KnowledgeSubjectGuide:
      type: object
      additionalProperties: false
      required: [subject, teaching, assessment, ref]
      properties:
        subject: {$ref: '#/components/schemas/KnowledgeSubject'}
        teaching: {type: array, items: {type: string}}
        assessment: {type: array, items: {type: string}}
        ref: {$ref: '#/components/schemas/KnowledgeRef'}
    KnowledgeThinkingTypeGuide:
      description: 팀이 우리 말로 쓴 출제 지침과 출처 표기(블룸 원서·VALUE 루브릭 문장 없음)
      type: object
      additionalProperties: false
      required: [type, name, basis, elements, questionMust, questionMustNot, ref]
      properties:
        type: {$ref: '#/components/schemas/KnowledgeThinkingType'}
        name: {type: string}
        basis:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [framework, attribution]
            properties:
              framework: {type: string}
              attribution: {type: string}
        elements:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code, label, description]
            properties:
              code: {type: string}
              label: {type: string}
              description: {type: string}
        questionMust: {type: array, items: {type: string}}
        questionMustNot: {type: array, items: {type: string}}
        ref: {$ref: '#/components/schemas/KnowledgeRef'}
    KnowledgeBundle:
      description: GET /internal/knowledge/standards 응답. C7 미션 초안 요청 knowledge 칸에 그대로 담는다
      type: object
      additionalProperties: false
      required: [datasetVersion, items, missingCodes, subjectGuides, thinkingType, reason]
      properties:
        datasetVersion: {type: [string, 'null']}
        items: {type: array, items: {$ref: '#/components/schemas/KnowledgeStandardBundle'}}
        missingCodes: {type: array, items: {type: string}}
        subjectGuides: {type: array, items: {$ref: '#/components/schemas/KnowledgeSubjectGuide'}}
        thinkingType:
          anyOf:
            - $ref: '#/components/schemas/KnowledgeThinkingTypeGuide'
            - type: 'null'
        reason:
          anyOf:
            - $ref: '#/components/schemas/KnowledgeFallbackReason'
            - type: 'null'
    KnowledgeThinkingTypeResponse:
      type: object
      additionalProperties: false
      required: [datasetVersion, guide, reason]
      properties:
        datasetVersion: {type: [string, 'null']}
        guide:
          anyOf:
            - $ref: '#/components/schemas/KnowledgeThinkingTypeGuide'
            - type: 'null'
        reason:
          anyOf:
            - $ref: '#/components/schemas/KnowledgeFallbackReason'
            - type: 'null'
