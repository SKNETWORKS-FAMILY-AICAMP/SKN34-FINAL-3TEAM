        - $ref: '#/components/parameters/StudentId'
        - $ref: '#/components/parameters/StudentRole'
        - $ref: '#/components/parameters/StudentScope'
        - $ref: '#/components/parameters/ThemeGradeQuery'
        - $ref: '#/components/parameters/GradeBandQuery'
        - $ref: '#/components/parameters/ThemeDate'
        - $ref: '#/components/parameters/ThemeSunday'
      responses:
        '200':
          description: 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklyTheme'
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /students/{studentId}/weekly-theme/review-views:
    post:
      operationId: recordWeeklyThemeReviewView
