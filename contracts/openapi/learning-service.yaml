    post:
      operationId: checkFrameOwnership
      summary: 기념 액자 보유 확인 (P27, #559. core 추억의 벽 #555·검색 범위 #563)
      description: >-
        보낸 회차 중 보유한 것만 owned로 돌려준다(중복은 한 번, 진행 중인 주 회차는 미보유). 미보유가 있어도 200이고 판단은 부른 쪽이 한다.
