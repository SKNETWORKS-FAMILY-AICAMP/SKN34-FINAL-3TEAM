openapi: 3.1.0
info:
  title: learning 내부 API
  version: 1.4.0
  description: >-
    core가 호출하는 learning 내부 API (api-spec 4.1). 구현된 경로만 담는다. 단 x-implementation-status가 붙은 경로는 계약만 먼저 정한 구현 전 항목이다(지식 내부 API #464, 구현 #469). 지식 내부 API는 SYSTEM 컨텍스트만, 학생 범위 없음.
    학생 학습 API는 core가 검증한 STUDENT 컨텍스트(X-Student-Scope에 본인 1명)를 요구하고,
    미션 조회·시도 시작은 core가 학생 학년(grade)·시연 여부(demo)를 붙인다.
    기록 존재 확인(#37)과 기록 조회(#27)는 PARENT·STUDENT·SYSTEM 컨텍스트와 대상 학생 X-Student-Scope를(학생 홈은 학생 STUDENT 컨텍스트만),
    운영 집계(/stats, #27)는 ADMIN·SYSTEM 컨텍스트를 요구한다.
    마무리·돌아보기·자기 평가(#26)는 학생 STUDENT 컨텍스트로 추가됐다.
    판정 정정(#80)은 ADMIN 컨텍스트와 판정 학생 1명 X-Student-Scope, 관리자 X-User-Id를 요구한다.
    관리자 미션(#145)은 ADMIN 컨텍스트와 관리자 X-User-Id를 요구한다(CONTENT 권한은 core 프록시가 확인).
    신고 지원 조회(#146)는 대상 확인이 STUDENT·PARENT·ADMIN, 원문이 ADMIN과 학생 1명 X-Student-Scope, 둘 다 X-User-Id를 요구한다.
    커뮤니티(#386)는 공유·공개 전환·신고 검토·원문이 SYSTEM, 열람·반응이 학생 STUDENT, 본인·자녀 목록이 STUDENT·PARENT 컨텍스트를 요구한다.
    주간 테마(#385)는 학생 조회·되돌아보기 열람이 STUDENT 본인, 주간 요약이 PARENT·STUDENT·SYSTEM과 대상 학생 X-Student-Scope,
    관리자 테마가 ADMIN과 관리자 X-User-Id를 요구한다.
    기념 액자·추억 앨범(#559, api-spec 4.1.4)은 대상 학생이 든 X-Student-Scope를 요구한다(core 프록시는 학생 본인 STUDENT 세션).
servers:
  - url: /internal
security:
  - InternalToken: []
paths:
  /students/{studentId}/memories/explanations:
    post:
      operationId: explainMemories
      summary: 본인 지난 회차 근거로 추억 설명 생성
      description: '근거 답변 공백 제외 20자 이상, 최고 관련도 0.35 이상. 생성이 일어난 실패(ai 422·502, 인용 검사, 호출 뒤 시간 초과, 근거 변경)는 200 FAILED, 생성 전 실패와 ai 장애(503·시간 초과·연결 실패·서킷 열림)는 503 AI_UNAVAILABLE(#592). 질문·설명 미저장.'
      parameters:
        - name: studentId
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MemoryExplanationRequest'}
      responses:
        '200':
          description: GENERATED 또는 INSUFFICIENT 또는 FAILED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MemoryExplanationResult'}
        '400': {description: 잘못된 입력}
        '401': {description: 내부 인증 실패}
        '403': {description: 학생 범위 불일치}
        '422': {description: 선택한 시도가 본인 READY 검색 범위 밖}
        '503':
          description: 'AI_UNAVAILABLE 프로필·질의 임베딩 실패, 생성 전 처리 예산 소진, 설명 생성 ai 503·5xx(502 제외)·시간 초과·연결 실패·서킷 열림. core가 하루 사용량을 되돌림'
  /students/{studentId}/memories/search:
    post:
      operationId: searchMemories
      summary: 본인의 지난 보유 회차 추억 검색
      parameters:
        - name: studentId
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MemorySearchRequest'}
      responses:
        '200':
          description: 회차 상위 3개 또는 NO_RESULTS·NO_RECORDS. 질문은 저장하지 않음.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MemorySearchResult'}
        '400':
          description: 빈 질문 또는 200자 초과
        '403':
          description: 학생 scope 불일치
        '503':
          description: AI_UNAVAILABLE 임베딩 또는 프로필 조회 실패
  /payment-usage/students/{studentId}:
    get:
      operationId: getPaymentUsageEvidence
      summary: SYSTEM과 정확한 학생 scope의 결제 후 피드백 사용 증빙
      parameters:
      - name: studentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: since
        in: query
        required: true
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: DONE 또는 RUNNING 피드백 여부, 원문 미포함
          content:
            application/json:
              schema:
                type: object
                required:
                - studentId
                - since
                - used
                properties:
                  studentId:
                    type: string
                    format: uuid
                  since:
                    type: string
                    format: date-time
                  used:
                    type: boolean
                additionalProperties: false
        '403':
          description: SYSTEM/학생 범위 불일치
  /missions:
    get:
      operationId: listMissions
      summary: 학생 학년에 맞는 공개 미션 목록과 수행 상태
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/StudentRole'
        - $ref: '#/components/parameters/StudentScope'
        - $ref: '#/components/parameters/Grade'
        - $ref: '#/components/parameters/Demo'
        - name: page
          in: query
          schema: {type: integer, minimum: 0, default: 0}
        - name: size
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          description: 목록 봉투 (api-spec 1.1)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionPage'
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /missions/{missionId}:
    get:
      operationId: getMission
      summary: 공개 미션 상세
      parameters:
        - $ref: '#/components/parameters/MissionId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/StudentRole'
        - $ref: '#/components/parameters/StudentScope'
        - $ref: '#/components/parameters/Grade'
        - $ref: '#/components/parameters/Demo'
      responses:
        '200':
          description: 미션 상세. `scene`은 미제공, 분류 그룹 `categories`·수학 답 단위 `answerUnit` 포함 (api-spec 3.7·3.8, #79)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mission'
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409':
          description: MISSION_NOT_AVAILABLE (비공개·학년 범위 밖)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /missions/{missionId}/attempts:
    post:
      operationId: startAttempt
      summary: 학습 시도 시작 또는 진행 중 시도 이어하기
      parameters:
        - $ref: '#/components/parameters/MissionId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/StudentRole'
        - $ref: '#/components/parameters/StudentScope'
        - $ref: '#/components/parameters/Grade'
        - $ref: '#/components/parameters/Demo'
        - $ref: '#/components/parameters/ThemeSunday'
      description: >-
        본문 {context}(#385, api-spec 2.11): 생략·{}·null은 EXTRA, 정해진 값 밖은 400. 진행 중 시도가 있으면 검사 없이 원래 context 그대로 200.
        신규 시도만 테마 검사(누적 공개 #484, state-diagram 3.2.1): THEME_DAY는 이번 주 테마의 공개된(OPEN, 그 요일 00:00부터 토요일까지) 문제이고
        그 주에 그 문제를 아직 마무리하지 않았을 때만, THEME_REVIEW는 토요일에 이번 주 마무리한 테마 문제만. 일요일은 sundayTheme=true(프리미엄)일 때만 토요일과 같다.
        테마 학년은 grade로 정하고(7~9는 G6, #438) 그 주 테마·주 시작일을 시도에 저장한다.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttemptStartRequest'
      responses:
        '201':
          description: 새 시도
          headers:
            ETag: {$ref: '#/components/headers/DraftETag'}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attempt'
        '200':
          description: 같은 미션의 진행 중 시도 반환 (부분 UK, 동시 시작도 1건)
          headers:
            ETag: {$ref: '#/components/headers/DraftETag'}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attempt'
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409':
          description: MISSION_NOT_AVAILABLE, THEME_DAY_CLOSED(공개 전 문제·무료 일요일·그 주 이미 마무리한 문제 #506), THEME_REVIEW_NOT_ALLOWED(토요일·프리미엄 일요일 외·이번 주 마무리하지 않은 테마 문제)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /attempts/{attemptId}:
    get:
      operationId: getAttempt
      summary: 시도·답변 타임라인·최신 초안
      parameters:
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/StudentRole'
        - $ref: '#/components/parameters/StudentScope'
      responses:
        '200':
          description: 시도 상세
          headers:
            ETag: {$ref: '#/components/headers/DraftETag'}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attempt'
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /attempts/{attemptId}/comparison:
    get:
      operationId: getAttemptComparison
      summary: 학생 본인의 직전 마무리 시도와 현재 결과 비교
      parameters:
      - {$ref: '#/components/parameters/AttemptId'}
      - {$ref: '#/components/parameters/UserId'}
      - {$ref: '#/components/parameters/StudentRole'}
      - {$ref: '#/components/parameters/StudentScope'}
      responses:
        '200':
          description: 직전 결과 또는 NO_PREVIOUS; 기준표 변경이면 CRITERIA_CHANGED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AttemptComparison'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /attempts/{attemptId}/draft:
    put:
      operationId: saveDraft
      summary: 초안 저장 (버전 대조)
      parameters:
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/StudentRole'
        - $ref: '#/components/parameters/StudentScope'
        - name: If-Match
          in: header
          required: true
          description: 현재 초안 버전. `"7"`·`7`·`W/"7"` 허용, 0 이상 정수가 아니면 400
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  $ref: '#/components/schemas/DraftContent'
      responses:
        '200':
          description: 저장된 초안
          headers:
            ETag: {$ref: '#/components/headers/DraftETag'}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Draft'
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409':
          description: ATTEMPT_DRAFT_CONFLICT(최신 초안 `latest` 포함) 또는 ATTEMPT_CLOSED
          headers:
            ETag: {$ref: '#/components/headers/DraftETag'}
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problem'
                  - type: object
                    properties:
                      latest:
                        $ref: '#/components/schemas/Draft'
  /attempts/{attemptId}/hints:
    post:
      operationId: openHint
      summary: 생각 열기 질문 열람 (안 연 질문을 순서대로, 다 열면 마지막 질문)
      parameters:
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/StudentRole'
        - $ref: '#/components/parameters/StudentScope'
      responses:
        '200':
          description: 열람한 질문
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [question, seq, total]
                properties:
                  question: {type: string}
                  seq: {type: integer, minimum: 1}
                  total: {type: integer, minimum: 1}
        '403': {$ref: '#/components/responses/Problem'}
        '404':
          description: 시도 없음 또는 질문이 없는 미션
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409': {$ref: '#/components/responses/Problem'}
  /attempts/{attemptId}/answers:
    post:
      operationId: submitAnswer
      summary: 최초·보완 답변 제출 (버전 저장)
      description: >-
        같은 Idempotency-Key·같은 본문은 처음 답변을 201로 다시 반환하고, 다른 본문은 422 IDEMPOTENCY_KEY_REUSED.
        입력 방식에 쓰는 필드만 저장한다(api-spec 3.1·3.8). 메모는 받지 않는다(P05).
      parameters:
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/StudentRole'
        - $ref: '#/components/parameters/StudentScope'
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitAnswer'
      responses:
        '201':
          description: 저장 완료. 판정은 피드백 요청 전이라 PENDING
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerCreated'
        '400':
          description: VALIDATION_FAILED (Idempotency-Key 형식, 미션 입력 방식 불일치)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409':
          description: ATTEMPT_CLOSED (마무리·완료한 시도)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: ANSWER_INCOMPLETE, ANSWER_INAPPROPRIATE(욕설·비속어·성적·혐오·위협 표현이나 연락처, 저장하지 않음) 또는 IDEMPOTENCY_KEY_REUSED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /attempts/{attemptId}/finish:
    post:
      operationId: finishAttempt
      summary: 마무리 → 정답·예시 답·체크리스트 공개
      description: >-
        시도 안에 판정 DONE이 1회 이상(보류 포함, 되묻기 미응답 허용)이어야 함(P04). 다시 요청하면 기록하지 않고 같은 결과.
        checklist는 기준표 요소 전체이고, 이 시도의 처리 완료 판정 중 원문 구절과 함께 충족된 요소만 satisfied(가장 최근 구절).
      parameters:
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/StudentRole'
        - $ref: '#/components/parameters/StudentScope'
      responses:
        '200':
          description: 마무리 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinishResult'
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409':
          description: REVEAL_CONDITION_UNMET(판정 DONE 1회 미만)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /attempts/{attemptId}/reflection:
    post:
      operationId: saveReflection
      summary: 돌아보기 저장 → 학습 완료
      description: 같은 트랜잭션에 돌아보기 저장 + IN_PROGRESS → COMPLETED·completed_at (P04, FN-LRN-12·14)
      parameters:
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/StudentRole'
        - $ref: '#/components/parameters/StudentScope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [difficulty]
              properties:
                difficulty: {$ref: '#/components/schemas/Difficulty'}
                text: {type: [string, 'null'], description: 달라진 점(선택), 빈 글은 null로 저장}
      responses:
        '200':
          description: 학습 완료
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [attemptId, status, reflection]
                properties:
                  attemptId: {type: string, format: uuid}
                  status: {type: string, enum: [COMPLETED]}
                  reflection: {$ref: '#/components/schemas/Reflection'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409':
          description: REVEAL_CONDITION_UNMET(마무리 전) 또는 ATTEMPT_CLOSED(완료 뒤)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /attempts/{attemptId}/self-assessment:
    post:
      operationId: saveSelfAssessment
      summary: 자기 평가 저장 → AI 확인과 나란히
      description: >-
        마무리 뒤·완료 전. 기준표 요소별 자기 체크를 저장하고(다시 보내면 checked만 변경) 기준표 요소마다 자기 체크와 AI 확인을 반환.
        답변·판정은 바꾸지 않음 (FN-LRN-13)
      parameters:
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/StudentRole'
        - $ref: '#/components/parameters/StudentScope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [checks]
              properties:
                checks:
                  type: array
                  minItems: 1
                  description: 이 시도 기준표 요소를 한 번씩만
                  items:
                    type: object
                    required: [elementId, checked]
                    properties:
                      elementId: {type: string, format: uuid}
                      checked: {type: boolean}
      responses:
        '200':
          description: 기준표 요소마다 자기 체크와 AI 확인
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/SelfAssessmentItem'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409':
          description: REVEAL_CONDITION_UNMET(마무리 전) 또는 ATTEMPT_CLOSED(완료 뒤)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /answers/{answerId}/feedback:
    post:
      operationId: answerFeedback
      summary: 판정·되묻기 오케스트레이션 (동기)
      description: >-
        DONE이면 판정·되묻기·다음 행동·버전을 반환한다. 다른 요청이 처리 중이면
        200 `{status: RUNNING, judgment: null, followup: null, nextActions: [], versions: null}`.
        리스 90초 (P12, state-diagram 3.3).
      parameters:
        - name: answerId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/StudentRole'
        - $ref: '#/components/parameters/StudentScope'
      responses:
        '200':
          description: 피드백 결과 (api-spec 3.2 `result`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackResult'
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409':
          description: >-
            JUDGMENT_STATE_CONFLICT, 또는 core 사용 예약·확정 409의 code 전달
            (REFUND_IN_PROGRESS, PAYMENT_USAGE_RETRY_REQUIRES_NEW_SOURCE, PAYMENT_USAGE_STATE_CHANGED)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500': {$ref: '#/components/responses/Problem'}
        '503':
          description: AI_UNAVAILABLE (`retryable` 포함) 또는 PAYMENT_USAGE_UNAVAILABLE(core 사용 증빙 실패·목록 밖 409)
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problem'
                  - type: object
                    required: [retryable]
                    properties:
                      retryable: {type: boolean}
  /judgments/{judgmentId}/corrections:
    post:
      operationId: correctJudgment
      summary: 신고 정정 반영 (FN-SUP-03, #80)
      description: >-
        core #46 관리자 정정. 기존 판정·요소·답변은 그대로 두고 정정 이력을 추가한다.
        이후 피드백 결과·시도 상세·기록의 judgment.result는 최신 정정 결과(정정이 있으면 heldReason null),
        판정 요소·되묻기·nextActions는 원판정 그대로.
        같은 Idempotency-Key·같은 요청(판정·본문)은 처음 응답 전체를 다시 200으로, 다른 요청이면 422 IDEMPOTENCY_KEY_REUSED.
        core 소비 계약은 support-learning-required.yaml.
      parameters:
        - name: judgmentId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/AdminUserId'
        - $ref: '#/components/parameters/AdminRole'
        - $ref: '#/components/parameters/CorrectionScope'
        - name: Idempotency-Key
          in: header
          required: true
          description: core가 저장한 정정 ID. 응답 유실 뒤 같은 키로 다시 보냄
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrectionRequest'
      responses:
        '200':
          description: 저장한(같은 키 재요청이면 처음) 정정
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorrectionResult'
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409':
          description: JUDGMENT_STATE_CONFLICT(판정 DONE 전) 또는 CORRECTION_REPORT_CONFLICT(같은 reportId·다른 키)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: IDEMPOTENCY_KEY_REUSED (같은 키·다른 요청)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /support/targets/{targetType}/{targetId}:
    get:
      operationId: supportTarget
      summary: 신고·문의 대상 확인 (#146, core #46)
      description: >-
        판정·되묻기·시도 ID로 학생·시도를 찾음(원문 없음). 학생·보호자 신고 접수, 문의 시도 연결, 관리자 정정 전 확인에 씀.
        JUDGMENT는 judgmentId·previousResult(지금 보이는 결과, 최신 정정 반영, 판정 DONE 전이면 없음),
        FOLLOWUP은 되묻기를 만든 판정의 judgmentId, ATTEMPT는 둘 다 없음. 없는 칸은 생략.
        core 소비 계약은 support-learning-required.yaml.
      parameters:
        - name: targetType
          in: path
          required: true
          schema:
            type: string
            enum: [JUDGMENT, FOLLOWUP, ATTEMPT]
        - name: targetId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: X-User-Id
          in: header
          required: true
          description: core가 검증한 요청자 ID. 없거나 UUID가 아니면 400
          schema: {type: string, format: uuid}
        - name: X-User-Role
          in: header
          required: true
          schema:
            type: string
            enum: [STUDENT, PARENT, ADMIN]
        - name: X-Student-Scope
          in: header
          required: true
          description: core가 검증한 학생 UUID 쉼표 구분 목록. 대상 학생이 있어야 함(ADMIN은 정확히 1명)
          schema: {type: string}
      responses:
        '200':
          description: 대상의 학생·시도
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportTarget'
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /support/attempts/{attemptId}:
    get:
      operationId: supportOriginal
      summary: 관리자 신고·문의 원문 (#146, core #46)
      description: >-
        답변 버전 순 원문과 피드백 결과만. 초안·메모·학생 이름·돌아보기 없음. 학생 전용 /attempts/{attemptId}와 별도.
        SERVICE_OPS 검사는 core.
      parameters:
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/AdminUserId'
        - $ref: '#/components/parameters/AdminRole'
        - $ref: '#/components/parameters/CorrectionScope'
      responses:
        '200':
          description: 시도 원문
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportOriginal'
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /records/students/{studentId}/summary:
    get:
      operationId: recordSummary
      summary: 학습 현황 요약 (건수·상태 Metric[])
      description: >-
        지표: 학습한 활동(집계 대상 시도 수), 완료한 활동(완료 / 집계 대상), 도움 없이 시작한 활동(최초 답변 전 생각 열기 열람 없는 시도 / 집계 대상), 되묻기 후 생각을 더한 활동(보완 답변 제출 시도 / 되묻기 받은 시도). 분모 5 미만이면 value null (P08)
      parameters:
        - $ref: '#/components/parameters/StudentId'
        - $ref: '#/components/parameters/RecordRole'
        - $ref: '#/components/parameters/RecordScope'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: 조회 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordSummary'
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /records/students/{studentId}/thinking-types:
    get:
      operationId: recordThinkingTypes
      summary: 다섯 생각 유형별 미션·기록
      description: >-
        다섯 유형 모두, 기록이 없는 유형은 NO_RECORD(미관찰, FN-DSH-08)
      parameters:
        - $ref: '#/components/parameters/StudentId'
        - $ref: '#/components/parameters/RecordRole'
        - $ref: '#/components/parameters/RecordScope'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: 조회 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordThinkingTypes'
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /records/students/{studentId}/daily-attempts:
    get:
      operationId: dailyAttempts
      summary: 일일 리포트 완료일 기준 목록
      description: 같은 KST 날짜에 완료한 시도. 전날 답변·오늘 완료도 포함하며 제출일 기준 P08과 분리한다.
      parameters:
        - $ref: '#/components/parameters/StudentId'
        - $ref: '#/components/parameters/RecordRole'
        - $ref: '#/components/parameters/RecordScope'
        - name: from
          in: query
          required: true
          schema: {type: string, format: date}
        - name: to
          in: query
          required: true
          schema: {type: string, format: date}
        - name: page
          in: query
          schema: {type: integer, minimum: 0, default: 0}
        - name: size
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          description: 조회 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordAttemptPage'
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /records/students/{studentId}/attempts:
    get:
      operationId: recordAttempts
      summary: 학습 기록 목록 (최근 답변 순)
      description: >-
        items는 학생 시도 상세에서 초안(draft, 메모 포함)을 뺀 모양 (P05) + completedAt·hintUsages·reflection.createdAt.
        answers·hintUsages는 1번·처음부터 조회 종료일까지(시작일 이전 포함), reflection은 기간 안에 쓴 것만(아니면 null)
      parameters:
        - $ref: '#/components/parameters/StudentId'
        - $ref: '#/components/parameters/RecordRole'
        - $ref: '#/components/parameters/RecordScope'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: status
          in: query
          description: 지금 그 상태인 시도만. 생략하면 전체
          schema: {type: string, enum: [IN_PROGRESS, COMPLETED]}
        - name: page
          in: query
          schema: {type: integer, minimum: 0, default: 0}
        - name: size
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - name: includeModelScores
          in: query
          description: >-
            true면 answers[].feedback.judgment에 modelScores를 넣음(report 설명 대상 선정용, FN-RPT-09).
            report 주기 작업(X-User-Role SYSTEM)만 허용하고 그 밖 역할은 403 (#478, api-spec 4.1.1)
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: 조회 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordAttemptPage'
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /records/students/{studentId}/attempts/{attemptId}:
    get:
      operationId: recordAttempt
      summary: 학습 기록 상세 (학부모 api-spec 2.3)
      description: >-
        목록 items와 같은 모양 + state(OK)·period. 기간은 화면 유지용이라 검증·기본값만 적용하고 이력은 자르지 않음.
        다른 학생의 시도·처리 실패만 있는 시도는 404
      parameters:
        - $ref: '#/components/parameters/StudentId'
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/RecordRole'
        - $ref: '#/components/parameters/RecordScope'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: 기록 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordAttemptDetail'
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /records/students/{studentId}/changes:
    get:
      operationId: recordChanges
      summary: 되묻기 전후 답변 쌍
      description: >-
        보완 답변이 있는 시도의 최초 vs 조회 종료일 이전 마지막 답변(P08, FN-RPT-02), 1.1 페이지. text는 칸 이름을 붙인 원문, counts는 학생이 쓴 칸만 [최초, 마지막]
      parameters:
        - $ref: '#/components/parameters/StudentId'
        - $ref: '#/components/parameters/RecordRole'
        - $ref: '#/components/parameters/RecordScope'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: page
          in: query
          schema: {type: integer, minimum: 0, default: 0}
        - name: size
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          description: 조회 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordChanges'
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /records/students/{studentId}/home:
    get:
      operationId: recordHome
      summary: 학생 홈 (이어할 시도·시작할 수 있는 미션)
      description: >-
        학생 본인 요청만(미션 목록과 같은 기준, X-Student-Scope에 경로의 학생 1명).
        resume은 진행 중 시도 중 가장 최근에 손댄 것(시작·답변 제출·초안 저장 중 가장 늦은 시각) 하나로 기간과 무관하고 초안만 있는 시도도 포함,
        기록 목록 항목과 같은 모양(초안·메모 없음, 본인 초안은 core가 학생 시도 상세로 붙임).
        missions는 학생 미션 목록 항목 전체(같은 노출 범위). state는 기간 안 집계 대상(P08) 시도 수
      parameters:
        - $ref: '#/components/parameters/StudentId'
        - $ref: '#/components/parameters/StudentRole'
        - $ref: '#/components/parameters/StudentScope'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Grade'
        - $ref: '#/components/parameters/Demo'
      responses:
        '200':
          description: 조회 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordHome'
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /records/students/{studentId}/thinking-activities:
    get:
      operationId: recordThinkingActivities
      summary: 수행한 미션의 생각 유형과 본인 돌아보기
      description: >-
        집계 대상(P08) 시도를 최근 답변 순으로. reflection은 기간 안에 쓴 것만(아니면 null). 수치·등급·순위 없음 (FN-DSH-04)
      parameters:
        - $ref: '#/components/parameters/StudentId'
        - $ref: '#/components/parameters/RecordRole'
        - $ref: '#/components/parameters/RecordScope'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: 조회 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordThinkingActivities'
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /records/evidence:
    get:
      operationId: recordEvidence
      summary: 원문 근거 조회
      description: 요청한 순서대로. 없는 답변·삭제 학생은 available=false(원문 없음), 범위 밖 학생의 답변이면 403
      parameters:
        - name: answerIds
          in: query
          required: true
          description: 쉼표로 나눈 답변 UUID 1~100개
          schema: {type: string}
        - $ref: '#/components/parameters/RecordRole'
        - $ref: '#/components/parameters/RecordScope'
      responses:
        '200':
          description: 근거 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceList'
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /stats:
    get:
      operationId: stats
      summary: 운영 현황 집계 (학생 원문 없음, FN-ADM-02)
      parameters:
        - name: X-User-Role
          in: header
          required: true
          schema: {type: string, enum: [ADMIN, SYSTEM]}
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: 집계
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stats'
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /records/students/{studentId}/exists:
    get:
      operationId: recordExists
      summary: 전체 보존 기록의 존재 여부
      description: 제출 답변이 있는 시도를 확인한다. 모든 답변이 FAILED인 시도·초안만 있는 시도·삭제 표식 학생은 제외한다. 기간·건수·답변·메모는 반환하지 않는다.
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-User-Role
          in: header
          required: true
          schema:
            type: string
            enum: [PARENT, STUDENT, SYSTEM]
        - name: X-Student-Scope
          in: header
          required: true
          schema:
            type: string
            description: 검증된 허용 학생 UUID의 쉼표 구분 목록
      responses:
        '200':
          description: 정상 조회. 없으면 false, 있으면 true.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordExists'
        '400':
          description: VALIDATION_FAILED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: UNAUTHENTICATED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: FORBIDDEN
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: INTERNAL_ERROR. 조회 실패를 false로 바꾸지 않는다.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /students/{studentId}/weekly-theme:
    get:
      operationId: getWeeklyTheme
      summary: 이번 주 학년 테마·요일 상태·되돌아보기 목록 (#385, 학년별 #438)
      description: >-
        core #387이 학생 본인 세션으로 넘김(api-spec 2.11). grade·date는 core가 학생 학년·KST 오늘로 정한 값
        (grade가 없으면 전환 기간의 gradeBand를 낮은 학년으로 읽음, #438).
        이번 주(date가 속한 KST 월요일) 게시 테마, 없으면 그 주 이전 최근 게시 테마를 다시 쓴다(reused). 학생에게는 게시본만 보인다.
        요일 state는 날짜로 계산(누적 공개 #484: 그 요일 00:00 전 LOCKED, 공개 뒤 토요일까지 OPEN, 일요일 CLOSED, sundayTheme=true면 일요일도 OPEN, state-diagram 3.2.1).
        ending은 큰 질문 정답 고르기로 정하고(state-diagram 3.2.2), 엔딩 전에는 종료 이야기·정답을 비운다.
        그 학년에 게시 테마가 하나도 없으면 404.
