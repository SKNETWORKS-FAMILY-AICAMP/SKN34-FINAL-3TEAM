  /students/{studentId}/weekly-theme/story-views:
    post:
      operationId: recordWeeklyThemeStoryView
      summary: 시작·종료 이야기 열람 기록 (주 1회 멱등, #438)
      description: >-
        core #439가 학생 본인 세션으로 넘김(api-spec 2.11). 학생·주·종류당 1행(theme_story_view)이라 다시 보내도 200이고
        firstViewThisWeek만 false. INTRO는 월~토·프리미엄 일요일(그 주 첫 진입에 한 번), OUTRO는 엔딩 상태(ending = ENDED, state-diagram 3.2.2)이고
        무료 일요일이 아닐 때(요일 무관, #484). 그 밖은 409 THEME_STORY_NOT_ALLOWED, 게시 테마가 없으면 404.
      parameters:
