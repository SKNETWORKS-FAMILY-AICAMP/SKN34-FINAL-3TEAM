            aggregation NOT_APPLIED(변경 대상 없음), 대화·리포트는 learning이 확인할 수 없어 UNKNOWN
          properties:
            conversation: {type: string, const: UNKNOWN}
            aggregation: {type: string, const: NOT_APPLIED}
            report: {type: string, const: UNKNOWN}
