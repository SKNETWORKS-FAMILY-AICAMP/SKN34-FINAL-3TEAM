      type: object
      required: [themeId, weekStart, title, intro, reused, days, review, completed, bigQuestion, candidates, introImageUrl,
                 introVideoUrl, introMotion, introSeen, outroSeen, outro, outroImageUrl, outroVideoUrl, outroMotion, answer, answerClue,
                 finished, ending]
      properties:
        themeId: {type: string, format: uuid}
        weekStart: {type: string, format: date, description: 이번 주 KST 월요일(재사용 테마도 이번 주)}
        title: {type: string}
        intro: {type: [string, 'null'], description: 시작 이야기. 매일 채움(#438, 이전에는 월요일만)}
        bigQuestion: {type: [string, 'null'], description: 한 주 큰 질문(#438, 사람이 쓴 테마는 null일 수 있음)}
        candidates: {type: [array, 'null'], items: {type: string}, description: 큰 질문 후보}
        introImageUrl: {type: [string, 'null'], description: 시작 장면 그림 presigned URL}
        introVideoUrl: {type: [string, 'null'], description: 시작 장면 영상 presigned URL}
        introMotion: {$ref: '#/components/schemas/ThemeMotion'}
        introSeen: {type: boolean, description: 이번 주 시작 이야기를 봄}
        outroSeen: {type: boolean, description: 이번 주 종료 이야기를 봄}
        outro: {type: [string, 'null'], description: '종료 이야기. 엔딩 상태(ending = ENDED)일 때만(#484)'}
        outroImageUrl: {type: [string, 'null'], description: 종료 장면 그림. 엔딩 상태일 때만}
        outroVideoUrl: {type: [string, 'null'], description: 종료 장면 영상. 엔딩 상태일 때만}
        outroMotion: {$ref: '#/components/schemas/ThemeMotion'}
        answer: {type: [string, 'null'], description: 정답. 엔딩 상태일 때만}
        answerClue: {type: [string, 'null'], description: 결정적 단서. 엔딩 상태일 때만}
        reused: {type: boolean, description: 그 주 게시 테마가 없어 이전 게시 테마를 다시 씀}
