        문제별 기록은 기존 시도 상세·비교(`/attempts/{attemptId}`·`/comparison`)로 연다.
        엔딩은 그 주 엔딩 상태(ending = ENDED, #484 정답 고르기, state-diagram 3.2.2)일 때만 outro·answer를 채우고 아니면 null(P23).
        미보유·진행 중인 주 회차 404 THEME_FRAME_NOT_FOUND, weekStart가 월요일이 아니면 400.
