        '400':
          description: VALIDATION_FAILED(pick 없음·빈 값·후보 밖)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409':
          description: THEME_PICK_NOT_ALLOWED(큰 질문 없는 테마·금요일 문제 마무리 전·이번 주 이미 고름·무료 일요일)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /students/{studentId}/weekly-theme/summary:
