openapi: 3.1.0
info:
  title: learning 내부 API
  version: 1.1.0
  description: >-
    core가 호출하는 learning 내부 API (api-spec 4.1). 구현된 경로만 담는다.
    학생 학습 API는 core가 검증한 STUDENT 컨텍스트(X-Student-Scope에 본인 1명)를 요구하고,
    미션 조회·시도 시작은 core가 학생 학년(grade)·시연 여부(demo)를 붙인다.
    기록 존재 확인(#37)과 기록 조회(#27)는 PARENT·STUDENT·SYSTEM 컨텍스트와 대상 학생 X-Student-Scope를(학생 홈은 학생 STUDENT 컨텍스트만),
    운영 집계(/stats, #27)는 ADMIN·SYSTEM 컨텍스트를 요구한다.
    마무리·돌아보기·자기 평가(#26)는 학생 STUDENT 컨텍스트로 추가됐다. 판정 정정(#80)은 구현 시 추가한다.
servers:
  - url: /internal
security:
  - InternalToken: []
paths:
  /payment-usage/students/{studentId}:
    get:
      operationId: getPaymentUsageEvidence
      summary: SYSTEM과 정확한 학생 scope의 결제 후 피드백 사용 증빙
      parameters:
      - name: studentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: since
        in: query
        required: true
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: DONE 또는 RUNNING 피드백 여부, 원문 미포함
          content:
            application/json:
              schema:
                type: object
                required:
                - studentId
                - since
                - used
                properties:
                  studentId:
                    type: string
                    format: uuid
                  since:
                    type: string
                    format: date-time
                  used:
                    type: boolean
                additionalProperties: false
        '403':
          description: SYSTEM/학생 범위 불일치
  /missions:
    get:
      operationId: listMissions
      summary: 학생 학년에 맞는 공개 미션 목록과 수행 상태
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/StudentRole'
        - $ref: '#/components/parameters/StudentScope'
        - $ref: '#/components/parameters/Grade'
        - $ref: '#/components/parameters/Demo'
        - name: page
          in: query
          schema: {type: integer, minimum: 0, default: 0}
        - name: size
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          description: 목록 봉투 (api-spec 1.1)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionPage'
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /missions/{missionId}:
    get:
      operationId: getMission
      summary: 공개 미션 상세
      parameters:
        - $ref: '#/components/parameters/MissionId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/StudentRole'
        - $ref: '#/components/parameters/StudentScope'
        - $ref: '#/components/parameters/Grade'
        - $ref: '#/components/parameters/Demo'
      responses:
        '200':
          description: 미션 상세. `scene`·`categories`는 미제공 (api-spec 3.7·3.8)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mission'
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409':
          description: MISSION_NOT_AVAILABLE (비공개·학년 범위 밖)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /missions/{missionId}/attempts:
    post:
      operationId: startAttempt
      summary: 학습 시도 시작 또는 진행 중 시도 이어하기
      parameters:
        - $ref: '#/components/parameters/MissionId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/StudentRole'
        - $ref: '#/components/parameters/StudentScope'
        - $ref: '#/components/parameters/Grade'
        - $ref: '#/components/parameters/Demo'
      responses:
        '201':
          description: 새 시도
          headers:
            ETag: {$ref: '#/components/headers/DraftETag'}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attempt'
        '200':
          description: 같은 미션의 진행 중 시도 반환 (부분 UK, 동시 시작도 1건)
          headers:
            ETag: {$ref: '#/components/headers/DraftETag'}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attempt'
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409':
          description: MISSION_NOT_AVAILABLE
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /attempts/{attemptId}:
    get:
      operationId: getAttempt
      summary: 시도·답변 타임라인·최신 초안
      parameters:
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/StudentRole'
        - $ref: '#/components/parameters/StudentScope'
      responses:
        '200':
          description: 시도 상세
          headers:
            ETag: {$ref: '#/components/headers/DraftETag'}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attempt'
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /attempts/{attemptId}/draft:
    put:
      operationId: saveDraft
      summary: 초안 저장 (버전 대조)
      parameters:
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/StudentRole'
        - $ref: '#/components/parameters/StudentScope'
        - name: If-Match
          in: header
          required: true
          description: 현재 초안 버전. `"7"`·`7`·`W/"7"` 허용, 0 이상 정수가 아니면 400
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  $ref: '#/components/schemas/DraftContent'
      responses:
        '200':
          description: 저장된 초안
          headers:
            ETag: {$ref: '#/components/headers/DraftETag'}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Draft'
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409':
          description: ATTEMPT_DRAFT_CONFLICT(최신 초안 `latest` 포함) 또는 ATTEMPT_CLOSED
          headers:
            ETag: {$ref: '#/components/headers/DraftETag'}
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problem'
                  - type: object
                    properties:
                      latest:
                        $ref: '#/components/schemas/Draft'
  /attempts/{attemptId}/hints:
    post:
      operationId: openHint
      summary: 생각 열기 질문 열람 (안 연 질문을 순서대로, 다 열면 마지막 질문)
      parameters:
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/StudentRole'
        - $ref: '#/components/parameters/StudentScope'
      responses:
        '200':
          description: 열람한 질문
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [question, seq, total]
                properties:
                  question: {type: string}
                  seq: {type: integer, minimum: 1}
                  total: {type: integer, minimum: 1}
        '403': {$ref: '#/components/responses/Problem'}
        '404':
          description: 시도 없음 또는 질문이 없는 미션
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409': {$ref: '#/components/responses/Problem'}
  /attempts/{attemptId}/answers:
    post:
      operationId: submitAnswer
      summary: 최초·보완 답변 제출 (버전 저장)
      description: >-
        같은 Idempotency-Key·같은 본문은 처음 답변을 201로 다시 반환하고, 다른 본문은 422 IDEMPOTENCY_KEY_REUSED.
        입력 방식에 쓰는 필드만 저장한다(api-spec 3.1·3.8). 메모는 받지 않는다(P05).
      parameters:
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/StudentRole'
        - $ref: '#/components/parameters/StudentScope'
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitAnswer'
      responses:
        '201':
          description: 저장 완료. 판정은 피드백 요청 전이라 PENDING
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerCreated'
        '400':
          description: VALIDATION_FAILED (Idempotency-Key 형식, 미션 입력 방식 불일치)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409':
          description: ATTEMPT_CLOSED (마무리·완료한 시도)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: ANSWER_INCOMPLETE 또는 IDEMPOTENCY_KEY_REUSED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /attempts/{attemptId}/finish:
    post:
      operationId: finishAttempt
      summary: 마무리 → 정답·예시 답·체크리스트 공개
      description: >-
        시도 안에 판정 DONE이 1회 이상(보류 포함, 되묻기 미응답 허용)이어야 함(P04). 다시 요청하면 기록하지 않고 같은 결과.
        checklist는 기준표 요소 전체이고, 이 시도의 처리 완료 판정 중 원문 구절과 함께 충족된 요소만 satisfied(가장 최근 구절).
      parameters:
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/StudentRole'
        - $ref: '#/components/parameters/StudentScope'
      responses:
        '200':
          description: 마무리 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinishResult'
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409':
          description: REVEAL_CONDITION_UNMET(판정 DONE 1회 미만)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /attempts/{attemptId}/reflection:
    post:
      operationId: saveReflection
      summary: 돌아보기 저장 → 학습 완료
      description: 같은 트랜잭션에 돌아보기 저장 + IN_PROGRESS → COMPLETED·completed_at (P04, FN-LRN-12·14)
      parameters:
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/StudentRole'
        - $ref: '#/components/parameters/StudentScope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [difficulty]
              properties:
                difficulty: {$ref: '#/components/schemas/Difficulty'}
                text: {type: [string, 'null'], description: 달라진 점(선택), 빈 글은 null로 저장}
      responses:
        '200':
          description: 학습 완료
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [attemptId, status, reflection]
                properties:
                  attemptId: {type: string, format: uuid}
                  status: {type: string, enum: [COMPLETED]}
                  reflection: {$ref: '#/components/schemas/Reflection'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409':
          description: REVEAL_CONDITION_UNMET(마무리 전) 또는 ATTEMPT_CLOSED(완료 뒤)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /attempts/{attemptId}/self-assessment:
    post:
      operationId: saveSelfAssessment
      summary: 자기 평가 저장 → AI 확인과 나란히
      description: >-
        마무리 뒤·완료 전. 기준표 요소별 자기 체크를 저장하고(다시 보내면 checked만 변경) 기준표 요소마다 자기 체크와 AI 확인을 반환.
        답변·판정은 바꾸지 않음 (FN-LRN-13)
      parameters:
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/StudentRole'
        - $ref: '#/components/parameters/StudentScope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [checks]
              properties:
                checks:
                  type: array
                  minItems: 1
                  description: 이 시도 기준표 요소를 한 번씩만
                  items:
                    type: object
                    required: [elementId, checked]
                    properties:
                      elementId: {type: string, format: uuid}
                      checked: {type: boolean}
      responses:
        '200':
          description: 기준표 요소마다 자기 체크와 AI 확인
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/SelfAssessmentItem'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409':
          description: REVEAL_CONDITION_UNMET(마무리 전) 또는 ATTEMPT_CLOSED(완료 뒤)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /answers/{answerId}/feedback:
    post:
      operationId: answerFeedback
      summary: 판정·되묻기 오케스트레이션 (동기)
      description: >-
        DONE이면 판정·되묻기·다음 행동·버전을 반환한다. 다른 요청이 처리 중이면
        200 `{status: RUNNING, judgment: null, followup: null, nextActions: [], versions: null}`.
        리스 90초 (P12, state-diagram 3.3).
      parameters:
        - name: answerId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/StudentRole'
        - $ref: '#/components/parameters/StudentScope'
      responses:
        '200':
          description: 피드백 결과 (api-spec 3.2 `result`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackResult'
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409':
          description: JUDGMENT_STATE_CONFLICT
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500': {$ref: '#/components/responses/Problem'}
        '503':
          description: AI_UNAVAILABLE (`retryable` 포함)
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problem'
                  - type: object
                    required: [retryable]
                    properties:
                      retryable: {type: boolean}
  /records/students/{studentId}/summary:
    get:
      operationId: recordSummary
      summary: 학습 현황 요약 (건수·상태 Metric[])
      description: >-
        지표: 학습한 활동(집계 대상 시도 수), 완료한 활동(완료 / 집계 대상), 도움 없이 시작한 활동(최초 답변 전 생각 열기 열람 없는 시도 / 집계 대상), 되묻기 후 생각을 더한 활동(보완 답변 제출 시도 / 되묻기 받은 시도). 분모 5 미만이면 value null (P08)
      parameters:
        - $ref: '#/components/parameters/StudentId'
        - $ref: '#/components/parameters/RecordRole'
        - $ref: '#/components/parameters/RecordScope'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: 조회 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordSummary'
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /records/students/{studentId}/thinking-types:
    get:
      operationId: recordThinkingTypes
      summary: 다섯 생각 유형별 미션·기록
      description: >-
        다섯 유형 모두, 기록이 없는 유형은 NO_RECORD(미관찰, FN-DSH-08)
      parameters:
        - $ref: '#/components/parameters/StudentId'
        - $ref: '#/components/parameters/RecordRole'
        - $ref: '#/components/parameters/RecordScope'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: 조회 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordThinkingTypes'
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /records/students/{studentId}/attempts:
    get:
      operationId: recordAttempts
      summary: 학습 기록 목록 (최근 답변 순)
      description: >-
        items는 학생 시도 상세에서 초안(draft, 메모 포함)을 뺀 모양 (P05) + completedAt·hintUsages·reflection.createdAt.
        answers·hintUsages는 1번·처음부터 조회 종료일까지(시작일 이전 포함), reflection은 기간 안에 쓴 것만(아니면 null)
      parameters:
        - $ref: '#/components/parameters/StudentId'
        - $ref: '#/components/parameters/RecordRole'
        - $ref: '#/components/parameters/RecordScope'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: status
          in: query
          description: 지금 그 상태인 시도만. 생략하면 전체
          schema: {type: string, enum: [IN_PROGRESS, COMPLETED]}
        - name: page
          in: query
          schema: {type: integer, minimum: 0, default: 0}
        - name: size
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          description: 조회 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordAttemptPage'
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /records/students/{studentId}/attempts/{attemptId}:
    get:
      operationId: recordAttempt
      summary: 학습 기록 상세 (학부모 api-spec 2.3)
      description: >-
        목록 items와 같은 모양 + state(OK)·period. 기간은 화면 유지용이라 검증·기본값만 적용하고 이력은 자르지 않음.
        다른 학생의 시도·처리 실패만 있는 시도는 404
      parameters:
        - $ref: '#/components/parameters/StudentId'
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/RecordRole'
        - $ref: '#/components/parameters/RecordScope'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: 기록 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordAttemptDetail'
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /records/students/{studentId}/changes:
    get:
      operationId: recordChanges
      summary: 되묻기 전후 답변 쌍
      description: >-
        보완 답변이 있는 시도의 최초 vs 조회 종료일 이전 마지막 답변(P08, FN-RPT-02), 1.1 페이지. text는 칸 이름을 붙인 원문, counts는 학생이 쓴 칸만 [최초, 마지막]
      parameters:
        - $ref: '#/components/parameters/StudentId'
        - $ref: '#/components/parameters/RecordRole'
        - $ref: '#/components/parameters/RecordScope'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: page
          in: query
          schema: {type: integer, minimum: 0, default: 0}
        - name: size
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          description: 조회 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordChanges'
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /records/students/{studentId}/home:
    get:
      operationId: recordHome
      summary: 학생 홈 (이어할 시도·시작할 수 있는 미션)
      description: >-
        학생 본인 요청만(미션 목록과 같은 기준, X-Student-Scope에 경로의 학생 1명).
        resume은 진행 중 시도 중 가장 최근에 손댄 것(시작·답변 제출·초안 저장 중 가장 늦은 시각) 하나로 기간과 무관하고 초안만 있는 시도도 포함,
        기록 목록 항목과 같은 모양(초안·메모 없음, 본인 초안은 core가 학생 시도 상세로 붙임).
        missions는 학생 미션 목록 항목 전체(같은 노출 범위). state는 기간 안 집계 대상(P08) 시도 수
      parameters:
        - $ref: '#/components/parameters/StudentId'
        - $ref: '#/components/parameters/StudentRole'
        - $ref: '#/components/parameters/StudentScope'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Grade'
        - $ref: '#/components/parameters/Demo'
      responses:
        '200':
          description: 조회 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordHome'
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /records/students/{studentId}/thinking-activities:
    get:
      operationId: recordThinkingActivities
      summary: 수행한 미션의 생각 유형과 본인 돌아보기
      description: >-
        집계 대상(P08) 시도를 최근 답변 순으로. reflection은 기간 안에 쓴 것만(아니면 null). 수치·등급·순위 없음 (FN-DSH-04)
      parameters:
        - $ref: '#/components/parameters/StudentId'
        - $ref: '#/components/parameters/RecordRole'
        - $ref: '#/components/parameters/RecordScope'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: 조회 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordThinkingActivities'
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /records/evidence:
    get:
      operationId: recordEvidence
      summary: 원문 근거 조회
      description: 요청한 순서대로. 없는 답변·삭제 학생은 available=false(원문 없음), 범위 밖 학생의 답변이면 403
      parameters:
        - name: answerIds
          in: query
          required: true
          description: 쉼표로 나눈 답변 UUID 1~100개
          schema: {type: string}
        - $ref: '#/components/parameters/RecordRole'
        - $ref: '#/components/parameters/RecordScope'
      responses:
        '200':
          description: 근거 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceList'
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /stats:
    get:
      operationId: stats
      summary: 운영 현황 집계 (학생 원문 없음, FN-ADM-02)
      parameters:
        - name: X-User-Role
          in: header
          required: true
          schema: {type: string, enum: [ADMIN, SYSTEM]}
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: 집계
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stats'
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /records/students/{studentId}/exists:
    get:
      operationId: recordExists
      summary: 전체 보존 기록의 존재 여부
      description: 제출 답변이 있는 시도를 확인한다. 모든 답변이 FAILED인 시도·초안만 있는 시도·삭제 표식 학생은 제외한다. 기간·건수·답변·메모는 반환하지 않는다.
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-User-Role
          in: header
          required: true
          schema:
            type: string
            enum: [PARENT, STUDENT, SYSTEM]
        - name: X-Student-Scope
          in: header
          required: true
          schema:
            type: string
            description: 검증된 허용 학생 UUID의 쉼표 구분 목록
      responses:
        '200':
          description: 정상 조회. 없으면 false, 있으면 true.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordExists'
        '400':
          description: VALIDATION_FAILED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: UNAUTHENTICATED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: FORBIDDEN
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: INTERNAL_ERROR. 조회 실패를 false로 바꾸지 않는다.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    InternalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
  parameters:
    UserId:
      name: X-User-Id
      in: header
      description: core가 학생 ID를 전달. learning 권한 판단은 X-User-Role·X-Student-Scope만 사용
      schema: {type: string, format: uuid}
    StudentRole:
      name: X-User-Role
      in: header
      required: true
      schema:
        type: string
        const: STUDENT
    StudentScope:
      name: X-Student-Scope
      in: header
      required: true
      description: 학생 본인 UUID 1개
      schema: {type: string, format: uuid}
    Grade:
      name: grade
      in: query
      required: true
      description: core가 붙이는 학생 학년 (P03)
      schema: {type: integer, minimum: 3, maximum: 6}
    Demo:
      name: demo
      in: query
      description: 시연 학생 여부 (student.is_demo)
      schema: {type: boolean, default: false}
    MissionId:
      name: missionId
      in: path
      required: true
      schema: {type: string, format: uuid}
    AttemptId:
      name: attemptId
      in: path
      required: true
      schema: {type: string, format: uuid}
    StudentId:
      name: studentId
      in: path
      required: true
      schema: {type: string, format: uuid}
    RecordRole:
      name: X-User-Role
      in: header
      required: true
      schema:
        type: string
        enum: [PARENT, STUDENT, SYSTEM]
    RecordScope:
      name: X-Student-Scope
      in: header
      required: true
      description: 검증된 허용 학생 UUID의 쉼표 구분 목록, 조회 대상 학생이 있어야 함
      schema: {type: string}
    From:
      name: from
      in: query
      description: KST 날짜(포함). to와 함께 주거나 함께 생략(생략하면 오늘 포함 최근 7일, P06), 한쪽만 주면 400
      schema: {type: string, format: date}
    To:
      name: to
      in: query
      description: KST 날짜(포함). from과 함께 주거나 함께 생략, 한쪽만 주거나 from보다 이르면 400
      schema: {type: string, format: date}
  headers:
    DraftETag:
      description: 초안 버전 (`"7"`)
      schema: {type: string}
  responses:
    Problem:
      description: Problem Details (api-spec 1.3)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    ThinkingType:
      type: string
      enum: [ANALYZE, EVALUATE, CREATE, SOLVE, REFLECT]
    InputType:
      type: string
      enum: [CHOICE, ORDERING, CLASSIFICATION, NARRATIVE, SOLUTION_STEPS, ESSAY]
    Choice:
      type: object
      additionalProperties: false
      required: [id, label]
      properties:
        id: {type: string}
        label: {type: string}
    Mission:
      type: object
      required: [id, title, subject, grade, gradeMax, thinkingType, inputType, question, hint, sceneUri, staticSceneUri, choices, inputTemplate]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        subject: {type: string}
        grade: {type: integer, description: 최소 학년}
        gradeMax: {type: integer}
        thinkingType: {$ref: '#/components/schemas/ThinkingType'}
        inputType: {$ref: '#/components/schemas/InputType'}
        question: {type: string}
        hint: {type: [string, 'null'], description: 미션 안내 (mission_version.guide)}
        sceneUri: {type: [string, 'null']}
        staticSceneUri: {type: [string, 'null']}
        choices:
          type: array
          items: {$ref: '#/components/schemas/Choice'}
        inputTemplate:
          type: array
          items: {type: string}
    MissionListItem:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/Mission'
        - type: object
          required: [status, attemptId, position, total]
          properties:
            status:
              type: string
              enum: [NOT_STARTED, IN_PROGRESS, COMPLETED]
            attemptId: {type: [string, 'null'], format: uuid}
            position: {type: integer}
            total: {type: integer}
    MissionPage:
      type: object
      additionalProperties: false
      required: [items, page, size, totalElements]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/MissionListItem'}
        page: {type: integer}
        size: {type: integer}
        totalElements: {type: integer}
    DraftContent:
      type: object
      required: [answer, memo]
      properties:
        answer:
          type: object
          description: 입력 방식별 작성 중인 답 (자유 형식)
        memo: {type: string, description: 생각 메모 (P05)}
    Draft:
      type: object
      additionalProperties: false
      required: [version, content, savedAt]
      properties:
        version: {type: integer, minimum: 0}
        content: {$ref: '#/components/schemas/DraftContent'}
        savedAt: {type: [string, 'null'], format: date-time, description: 한 번도 저장하지 않았으면 null}
    Attempt:
      type: object
      additionalProperties: false
      required: [attemptId, studentId, mission, status, finishedAt, answers, helped, draft, nextActions, reveal, revealKind, checklist, reflection]
      properties:
        attemptId: {type: string, format: uuid}
        studentId: {type: string, format: uuid}
        mission: {$ref: '#/components/schemas/Mission'}
        status:
          type: string
          enum: [IN_PROGRESS, COMPLETED]
        finishedAt: {type: [string, 'null'], format: date-time, description: 마무리(정답·예시 답 공개) 시각, 그 뒤 답변 제출 불가. 마무리 전 null}
        answers:
          type: array
          items: {$ref: '#/components/schemas/AnswerItem'}
        helped: {type: boolean, description: 생각 열기 사용 여부}
        draft: {$ref: '#/components/schemas/Draft'}
        nextActions:
          type: array
          description: 마지막 답변의 다음 행동
          items: {$ref: '#/components/schemas/NextAction'}
        reveal: {type: [string, 'null'], description: 마무리 뒤에만. 시도 기준표 버전의 예시 답(닫힌 문제는 정답과 해설)}
        revealKind:
          type: [string, 'null']
          enum: [ANSWER, EXAMPLE, null]
          description: 마무리 뒤에만. 고르기·순서·분류·풀이 단계 ANSWER, 서술·논술 EXAMPLE
        checklist:
          type: [array, 'null']
          description: 마무리 뒤에만
          items: {$ref: '#/components/schemas/Element'}
        reflection:
          description: 돌아보기 뒤에만
          oneOf:
            - $ref: '#/components/schemas/Reflection'
            - type: 'null'
    AnswerItem:
      type: object
      additionalProperties: false
      required: [answerId, version, submittedAt, inputType, text, followupId, content, feedback]
      properties:
        answerId: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        submittedAt: {type: string, format: date-time}
        inputType: {$ref: '#/components/schemas/InputType'}
        text: {type: string, description: 입력 틀 칸 이름을 붙인 원문}
        followupId: {type: [string, 'null'], format: uuid}
        content: {type: object, description: 입력 방식에 쓰는 필드만}
        feedback: {$ref: '#/components/schemas/FeedbackResult'}
    Essay:
      type: object
      additionalProperties: false
      required: [claim, reasons, rebuttal]
      properties:
        claim: {type: string}
        reasons:
          type: array
          minItems: 2
          maxItems: 2
          items: {type: string}
        rebuttal: {type: string}
    Assignment:
      type: object
      additionalProperties: false
      required: [choiceId, categoryId]
      properties:
        choiceId: {type: string}
        categoryId: {type: string}
    SubmitAnswer:
      type: object
      required: [inputType]
      description: >-
        NARRATIVE는 text, SOLUTION_STEPS는 finalAnswer·steps, ESSAY는 essay,
        CHOICE·ORDERING은 choiceIds, CLASSIFICATION은 assignments를 쓴다. 그 외 필드는 저장하지 않는다.
        누락·미완성은 422 ANSWER_INCOMPLETE.
      properties:
        inputType: {$ref: '#/components/schemas/InputType'}
        text: {type: [string, 'null']}
        finalAnswer: {type: [string, 'null']}
        steps:
          type: [array, 'null']
          items: {type: string}
        essay:
          oneOf:
            - $ref: '#/components/schemas/Essay'
            - type: 'null'
        choiceIds:
          type: [array, 'null']
          items: {type: string}
        assignments:
          type: [array, 'null']
          items: {$ref: '#/components/schemas/Assignment'}
        dictatedByGuardian: {type: boolean, default: false}
        followupId: {type: [string, 'null'], format: uuid, description: 보완 답변이 답하는 되묻기}
    AnswerCreated:
      type: object
      additionalProperties: false
      required: [answerId, attemptId, version, followupId, submittedAt, feedback]
      properties:
        answerId: {type: string, format: uuid}
        attemptId: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        followupId: {type: [string, 'null'], format: uuid}
        submittedAt: {type: string, format: date-time}
        feedback:
          type: object
          additionalProperties: false
          required: [status]
          properties:
            status: {type: string, const: PENDING}
    NextAction:
      type: string
      enum: [ANSWER_FOLLOWUP, FINISH]
    FeedbackResult:
      type: object
      additionalProperties: false
      required: [status, judgment, followup, nextActions, versions]
      properties:
        status:
          type: string
          enum: [PENDING, RUNNING, DONE, FAILED]
        judgment:
          oneOf:
            - $ref: '#/components/schemas/Judgment'
            - type: 'null'
        followup:
          oneOf:
            - $ref: '#/components/schemas/Followup'
            - type: 'null'
        nextActions:
          type: array
          items: {$ref: '#/components/schemas/NextAction'}
        versions:
          oneOf:
            - $ref: '#/components/schemas/Versions'
            - type: 'null'
    Judgment:
      type: object
      additionalProperties: false
      required: [result, trial, elements, heldReason]
      properties:
        result:
          type: string
          enum: [CORRECT, PARTIAL, RETHINK, HELD]
        trial: {type: boolean}
        elements:
          type: array
          items: {$ref: '#/components/schemas/Element'}
        heldReason: {type: [string, 'null']}
    Element:
      type: object
      additionalProperties: false
      required: [elementId, label, satisfied, quote, sourceType]
      properties:
        elementId: {type: string, format: uuid, description: rubric_element.id}
        label: {type: string}
        satisfied: {type: boolean}
        quote: {type: [string, 'null'], description: 학생 답 원문 구절 또는 고른 답}
        sourceType:
          type: [string, 'null']
          enum: [RECORD, RULE, ANSWER_KEY, AI_OBSERVATION, null]
    FinishResult:
      type: object
      additionalProperties: false
      required: [attemptId, finishedAt, reveal, revealKind, checklist]
      properties:
        attemptId: {type: string, format: uuid}
        finishedAt: {type: string, format: date-time}
        reveal: {type: [string, 'null'], description: 시도 기준표 버전의 예시 답(닫힌 문제는 정답과 해설), 없으면 null}
        revealKind: {type: string, enum: [ANSWER, EXAMPLE]}
        checklist:
          type: array
          items: {$ref: '#/components/schemas/Element'}
    Difficulty:
      type: string
      enum: [EASY, NORMAL, HARD]
      description: 돌아보기 난이도 (api-spec 1.5) EASY 쉬웠어 · NORMAL 보통 · HARD 어려웠어
    Reflection:
      type: object
      additionalProperties: false
      required: [difficulty, text]
      properties:
        difficulty: {$ref: '#/components/schemas/Difficulty'}
        text: {type: [string, 'null'], description: 달라진 점}
    SelfAssessmentItem:
      type: object
      additionalProperties: false
      required: [elementId, label, selfChecked, aiChecked, quote]
      properties:
        elementId: {type: string, format: uuid}
        label: {type: string}
        selfChecked: {type: [boolean, 'null'], description: 학생이 체크하지 않은 요소면 null}
        aiChecked: {type: boolean, description: 체크리스트의 체크}
        quote: {type: [string, 'null']}
    Followup:
      type: object
      additionalProperties: false
      required: [followupId, type, question, source]
      properties:
        followupId: {type: string, format: uuid}
        type:
          type: string
          enum: [ONE_STEP_MORE, TELL_MORE, LOOK_AGAIN]
        question: {type: string}
        source:
          type: string
          enum: [LLM, LLM_RETRY, BANK]
    Versions:
      type: object
      additionalProperties: false
      required: [mission, rubric, model, prompt]
      properties:
        mission: {type: string, description: 미션 code@버전}
        rubric: {type: string}
        model: {type: [string, 'null'], description: 규칙 판정이면 null}
        prompt: {type: [string, 'null']}
    RecordPeriod:
      type: object
      additionalProperties: false
      required: [from, to]
      properties:
        from: {type: string, format: date}
        to: {type: string, format: date}
    QueryState:
      type: string
      enum: [OK, NO_RECORD, INSUFFICIENT_SAMPLE]
      description: 집계 대상(비율은 분모) 0건 NO_RECORD, 1~4건 INSUFFICIENT_SAMPLE, 5건 이상 OK (P08)
    Metric:
      type: object
      additionalProperties: false
      required: [label, value, count, numerator, denominator, formula, period, sourceType, state]
      properties:
        label: {type: string}
        value: {type: [number, 'null'], description: 비율. 분모 5 미만이거나 건수 지표면 null}
        count: {type: integer}
        numerator: {type: integer}
        denominator: {type: integer}
        formula: {type: string}
        period: {$ref: '#/components/schemas/RecordPeriod'}
        sourceType: {type: string, enum: [RECORD]}
        state: {$ref: '#/components/schemas/QueryState'}
    RecordSummary:
      type: object
      additionalProperties: false
      required: [studentId, state, period, inclusionRule, metrics]
      properties:
        studentId: {type: string, format: uuid}
        state: {$ref: '#/components/schemas/QueryState'}
        period: {$ref: '#/components/schemas/RecordPeriod'}
        inclusionRule: {type: string}
        metrics:
          type: array
          items: {$ref: '#/components/schemas/Metric'}
    RecordThinkingTypes:
      type: object
      additionalProperties: false
      required: [studentId, state, period, items]
      properties:
        studentId: {type: string, format: uuid}
        state: {$ref: '#/components/schemas/QueryState'}
        period: {$ref: '#/components/schemas/RecordPeriod'}
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [type, state, missions]
            properties:
              type: {$ref: '#/components/schemas/ThinkingType'}
              state: {type: string, enum: [OK, NO_RECORD]}
              missions:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [attemptId, title]
                  properties:
                    attemptId: {type: string, format: uuid}
                    title: {type: string}
    RecordAttempt:
      type: object
      additionalProperties: false
      description: 시도 상세(Attempt)에서 draft를 뺀 모양 + completedAt·hintUsages·reflection.createdAt
