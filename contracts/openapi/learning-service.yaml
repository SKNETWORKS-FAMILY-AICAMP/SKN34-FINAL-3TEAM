        completed는 월~금 다섯 문제를 각 요일(KST) 안에 학습 완료(돌아보기 저장)했는지(개근, 2026-11-10 개정 전 이름 완주. core 개근 THEME_COMPLETED 근거).
        date가 토요일이 아니면(일요일은 sundayTheme=true일 때만 허용, #484) 409 THEME_REVIEW_NOT_ALLOWED, 게시 테마가 없으면 404.
      parameters:
        - $ref: '#/components/parameters/StudentId'
        - $ref: '#/components/parameters/StudentRole'
        - $ref: '#/components/parameters/StudentScope'
        - $ref: '#/components/parameters/ThemeGradeQuery'
        - $ref: '#/components/parameters/GradeBandQuery'
        - $ref: '#/components/parameters/ThemeDate'
        - $ref: '#/components/parameters/ThemeSunday'
      responses:
        '200':
          description: 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThemeReviewViewResult'
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409':
          description: THEME_REVIEW_NOT_ALLOWED(토요일·프리미엄 일요일이 아님)
