                $ref: '#/components/schemas/Problem'
  /students/{studentId}/weekly-theme/answer-picks:
    post:
      operationId: pickWeeklyThemeAnswer
      summary: 큰 질문 정답 고르기 (한 주 한 번, #484)
      description: >-
        core #550이 학생 본인 세션으로 넘김(api-spec 2.11, 공개 경로 /api/v1/students/me/weekly-theme/answer-picks). 그 주 금요일 문제(THEME_DAY)를
        마무리한 뒤 후보 중 하나를 고른다. 학생·주당 1행(theme_answer_pick). 맞히면 바로 ending ENDED, 틀리면 NOT_ENDED이고
        토요일(프리미엄 일요일)에 금요일 문제 다시 풀기(THEME_REVIEW)를 마무리하면 ENDED(다시 고르지 않음, state-diagram 3.2.2).
        answer는 ENDED일 때만. 게시 테마가 없으면 404.
