name: ci-report-service

on:
  push:
    branches: [develop, main]
    paths:
      - "backend/report-service/**"
      - ".github/workflows/ci-report-service.yml"
      - ".github/workflows/_python.yml"
  pull_request:
    paths:
      - "backend/report-service/**"
      - ".github/workflows/ci-report-service.yml"
      - ".github/workflows/_python.yml"

jobs:
  build:
    uses: ./.github/workflows/_python.yml
    with:
      service-path: backend/report-service
