name: ci-ai-service

on:
  push:
    branches: [develop, main]
    paths:
      - "backend/ai-service/**"
      - "contracts/**"
      - ".github/workflows/ci-ai-service.yml"
      - ".github/workflows/_python.yml"
  pull_request:
    paths:
      - "backend/ai-service/**"
      - "contracts/**"
      - ".github/workflows/ci-ai-service.yml"
      - ".github/workflows/_python.yml"

jobs:
  build:
    uses: ./.github/workflows/_python.yml
    with:
      service-path: backend/ai-service
