name: ci-gitops

on:
  pull_request:
    paths:
      - "infrastructure/gitops/**"
      # migration 이미지가 복사하는 SQL
      - "backend/core-service/src/main/resources/db/migration/**"
      - "backend/learning-service/src/main/resources/db/migration/**"
      - ".github/workflows/ci-gitops.yml"
  push:
    branches: [develop, main]
    paths:
      - "infrastructure/gitops/**"
      - "backend/core-service/src/main/resources/db/migration/**"
      - "backend/learning-service/src/main/resources/db/migration/**"
      - ".github/workflows/ci-gitops.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitops-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HELM_VERSION: "4.3.1"
  HELM_SHA256: 0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b
  KUBECONFORM_VERSION: "0.8.0"
  KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
  # kind 노드 이미지(docs/report/local-platform.md)와 같은 버전
  KUBERNETES_VERSION: "1.35.8"
  # yannh/kubernetes-json-schema, datreeio/CRDs-catalog(KEDA 2.21.0 CRD 포함) 고정 커밋
  K8S_SCHEMA_REF: e0c72a1bc5f409d1685c0e1323460c8a98cd7459
  CRD_CATALOG_REF: 27233a506de0085e71c7f9702597806a7f95eb24

jobs:
  charts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infrastructure/gitops
    steps:
      - uses: actions/checkout@v7
      - name: Helm·kubeconform 설치(SHA256 검증)
        run: |
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          curl -fsSLo "$RUNNER_TEMP/helm.tar.gz" "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  $RUNNER_TEMP/helm.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C "$bin" --strip-components=1 linux-amd64/helm
          curl -fsSLo "$RUNNER_TEMP/kubeconform.tar.gz" "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  $RUNNER_TEMP/kubeconform.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/kubeconform.tar.gz" -C "$bin" kubeconform
          echo "$bin" >> "$GITHUB_PATH"
      # app-service 기본 values는 image.repository가 비어 있어 환경 values 없이는 스키마를 통과하지 않는다.
      # 그래서 chart lint는 실제 배포 조합(환경 values)으로 하고, 어떤 환경도 쓰지 않는 chart만 기본 values로 한다.
      # Argo CD 정의와 같은 조합: 환경 파일과 이름이 같은 chart(observability·platform-data)는
      # 그 chart로, 나머지는 ApplicationSet처럼 파일 이름을 릴리스로 app-service chart에 넘긴다.
      - name: chart·환경별 helm lint·template 렌더링
        run: |
          for chart in charts/*/; do
            if grep -q '^dependencies:' "${chart}Chart.yaml"; then
              helm dependency build "$chart"
            fi
          done
          out="$RUNNER_TEMP/rendered"
          used=" "
          for env_dir in environments/*/; do
            env="$(basename "$env_dir")"
            mkdir -p "$out/$env"
            for values in "$env_dir"*.yaml; do
              release="$(basename "$values" .yaml)"
              if [ -d "charts/$release" ]; then chart="$release"; else chart=app-service; fi
              case "$chart" in
                app-service) namespace=app ;;
                observability) namespace=observability ;;
                platform-data) namespace=platform ;;
                *) echo "::error file=infrastructure/gitops/$values::$chart chart의 namespace가 정의되지 않음"; exit 1 ;;
              esac
              used="$used$chart "
              echo "::group::$env/$release ($chart → $namespace)"
              helm lint --strict "charts/$chart" --namespace "$namespace" -f "$values"
              helm template "$release" "charts/$chart" --namespace "$namespace" \
                --kube-version "$KUBERNETES_VERSION" -f "$values" > "$out/$env/$release.yaml"
              echo "::endgroup::"
            done
          done
          for chart in charts/*/; do
            chart="$(basename "$chart")"
            case "$used" in
              *" $chart "*) ;;
              *) helm lint --strict "charts/$chart" ;;
            esac
          done
      # 카탈로그에 없는 CRD만 건너뛰고, 건너뛴 종류를 로그로 남긴다.
      - name: kubeconform 스키마 검사
        run: |
          k8s_schema="https://raw.githubusercontent.com/yannh/kubernetes-json-schema/${K8S_SCHEMA_REF}/{{.NormalizedKubernetesVersion}}-standalone{{.StrictSuffix}}/{{.ResourceKind}}{{.KindSuffix}}.json"
          crd_schema="https://raw.githubusercontent.com/datreeio/CRDs-catalog/${CRD_CATALOG_REF}/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json"
          status=0
          kubeconform -strict -summary -verbose -kubernetes-version "$KUBERNETES_VERSION" \
            -schema-location "$k8s_schema" -schema-location "$crd_schema" -ignore-missing-schemas \
            "$RUNNER_TEMP/rendered" argocd policies | tee "$RUNNER_TEMP/kubeconform.log" || status=$?
          # 건너뛴 줄 형식: "<파일> - <이름> <Kind> skipped"
          skipped="$(awk '/ skipped$/ {print $(NF-1) "/" $(NF-2) " (" $1 ")"}' "$RUNNER_TEMP/kubeconform.log")"
          if [ -n "$skipped" ]; then
            echo "스키마가 없어 건너뛴 리소스:"
            echo "$skipped"
            echo "::warning::스키마가 없어 건너뛴 리소스 $(echo "$skipped" | wc -l)개(로그 참고)"
          fi
          exit "$status"

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: migration 이미지 빌드 확인(push 없음)
        run: |
          for dockerfile in infrastructure/gitops/migrations/*.Dockerfile; do
            name="$(basename "$dockerfile" .Dockerfile)"
            docker build -f "$dockerfile" -t "sagomungchi/${name}-migrate:${GITHUB_SHA}" .
          done
