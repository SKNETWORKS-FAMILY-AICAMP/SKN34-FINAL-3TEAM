# 재사용 워크플로: Python 서비스 린트·테스트와 이미지 빌드를 병렬 실행
# 레지스트리 푸시·gitops 태그 갱신은 인프라 구성 시 추가
name: _python

on:
  workflow_call:
    inputs:
      service-path:
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.service-path }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --frozen
      # apt 미러 지연 시 무한 대기 방지
      - name: Prepare report PDF runtime
        if: inputs.service-path == 'backend/report-service'
        timeout-minutes: 5
        run: |
          uv run playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  # 이미지 빌드 검증만 수행(배포 이미지는 cd-release). 테스트와 독립이라 별도 러너에서 병렬 실행
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - id: image
        run: echo "name=$(basename ${{ inputs.service-path }})" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      # GHA 캐시로 playwright·의존성 레이어 재사용
      - uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.service-path }}
          push: false
          tags: sagomungchi/${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ steps.image.outputs.name }}
          cache-to: type=gha,mode=max,scope=${{ steps.image.outputs.name }}
