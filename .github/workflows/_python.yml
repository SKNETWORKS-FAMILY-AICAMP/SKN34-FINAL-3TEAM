# 재사용 워크플로: Python 서비스 린트·테스트와 이미지 빌드를 병렬 실행
# 레지스트리 푸시·gitops 태그 갱신은 인프라 구성 시 추가
name: _python

on:
  workflow_call:
    inputs:
      service-path:
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.service-path }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --frozen
      # report PDF 런타임 캐시: Chromium은 playwright 버전, apt .deb는 러너 이미지 기준으로 재사용
      - name: Resolve report PDF cache keys
        id: pdf-keys
        if: inputs.service-path == 'backend/report-service'
        run: |
          version=$(awk '/^name = "playwright"$/{getline; gsub(/"/,"",$3); print $3}' uv.lock)
          {
            echo "playwright=${version:-unknown}"
            echo "image=${ImageOS:-unknown}"
            echo "debs-dir=$HOME/.cache/report-pdf-debs"
          } >> "$GITHUB_OUTPUT"
      - name: Restore Playwright Chromium cache
        id: pw-cache
        if: inputs.service-path == 'backend/report-service'
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: report-playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.pdf-keys.outputs.playwright }}
      - name: Restore report apt .deb cache
        id: deb-cache
        if: inputs.service-path == 'backend/report-service'
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.pdf-keys.outputs.debs-dir }}
          key: report-pdf-debs-${{ runner.os }}-${{ steps.pdf-keys.outputs.image }}-${{ steps.pdf-keys.outputs.playwright }}
          restore-keys: |
            report-pdf-debs-${{ runner.os }}-${{ steps.pdf-keys.outputs.image }}-
      # 캐시한 .deb를 apt 보관함에 미리 넣고, dpkg 실행 뒤 새로 받은 .deb를 캐시 폴더로 복사.
      # 스크립트 끝의 apt-get clean이 보관함을 비워도 캐시 폴더는 남는다. 캐시가 없거나 낡으면 apt가 미러에서 받는다.
      - name: Seed apt archives from cache
        if: inputs.service-path == 'backend/report-service'
        env:
          DEBS_DIR: ${{ steps.pdf-keys.outputs.debs-dir }}
        run: |
          mkdir -p "$DEBS_DIR"
          for deb in "$DEBS_DIR"/*.deb; do
            [ -e "$deb" ] || continue
            if dpkg-deb --fsys-tarfile "$deb" >/dev/null 2>&1; then
              sudo cp "$deb" /var/cache/apt/archives/
            else
              echo "skip broken cached deb: $deb"
              rm -f "$deb"
            fi
          done
          printf 'DPkg::Post-Invoke { "cp -n /var/cache/apt/archives/*.deb %s/ 2>/dev/null || true"; };\n' "$DEBS_DIR" \
            | sudo tee /etc/apt/apt.conf.d/81report-pdf-deb-cache >/dev/null
      # apt 미러가 느릴 때 캐시 없는 첫 실행도 끝나도록 여유를 둠(무한 대기 방지는 유지)
      - name: Prepare report PDF runtime
        if: inputs.service-path == 'backend/report-service'
        timeout-minutes: 10
        run: |
          sh scripts/install_pdf_runtime.sh uv run playwright
      # 뒤 단계(pytest) 성패와 무관하게 설치가 끝나면 바로 저장
      - name: Save Playwright Chromium cache
        if: inputs.service-path == 'backend/report-service' && steps.pw-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.pw-cache.outputs.cache-primary-key }}
      - name: Save report apt .deb cache
        if: inputs.service-path == 'backend/report-service' && steps.deb-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.pdf-keys.outputs.debs-dir }}
          key: ${{ steps.deb-cache.outputs.cache-primary-key }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  # 이미지 빌드 검증만 수행(배포 이미지는 cd-release). 테스트와 독립이라 별도 러너에서 병렬 실행
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - id: image
        run: echo "name=$(basename ${{ inputs.service-path }})" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      # GHA 캐시로 playwright·의존성 레이어 재사용
      - uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.service-path }}
          push: false
          tags: sagomungchi/${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ steps.image.outputs.name }}
          cache-to: type=gha,mode=max,scope=${{ steps.image.outputs.name }}
