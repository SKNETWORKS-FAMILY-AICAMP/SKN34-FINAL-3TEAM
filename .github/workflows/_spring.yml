# 재사용 워크플로: Spring 서비스 테스트 → 빌드 → 이미지 빌드
# 레지스트리 푸시·gitops 태그 갱신은 인프라 구성 시 추가
name: _spring

on:
  workflow_call:
    inputs:
      service-path:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.service-path }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew && ./gradlew test bootJar --no-daemon
      - id: image
        run: echo "name=$(basename ${{ inputs.service-path }})" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      # 이미지 빌드 검증만 수행. GHA 캐시로 의존성 레이어 재사용
      - uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.service-path }}
          push: false
          tags: sagomungchi/${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ steps.image.outputs.name }}
          cache-to: type=gha,mode=max,scope=${{ steps.image.outputs.name }}
