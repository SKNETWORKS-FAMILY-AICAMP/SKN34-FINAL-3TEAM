# 재사용 워크플로: Spring 서비스 테스트 → 빌드 → 이미지 빌드
# 레지스트리 푸시·gitops 태그 갱신은 인프라 구성 시 추가
name: _spring

on:
  workflow_call:
    inputs:
      service-path:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.service-path }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew && ./gradlew test bootJar --no-daemon
      - run: docker build -t sagomungchi/$(basename ${{ inputs.service-path }}):${{ github.sha }} .
