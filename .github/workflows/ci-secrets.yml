name: ci-secrets

# NFR-SEC-04 저장소 비밀 정보 스캔(#810). 경로 필터 없이 모든 PR·push를 검사한다.
on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # infrastructure/aws/scan-repository-secrets.py와 같은 버전. gitleaks-action은 조직 저장소에 유료 라이선스가 필요해 쓰지 않는다.
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # PR은 병합 커밋 대신 PR 머리 커밋을 받고, 범위 계산을 위해 전체 이력을 받는다.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Gitleaks 설치(SHA256 검증)
        run: |
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          curl -fsSLo "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$bin" gitleaks
          test "$("$bin/gitleaks" version)" = "$GITLEAKS_VERSION"
          echo "$bin" >> "$GITHUB_PATH"
      # PR은 PR 커밋만(base..head), push는 push된 커밋만(before..after), 수동 실행은 선택한 ref의 전체 이력.
      # 보고서·로그는 --redact=100으로 값을 가리고 파일·줄·커밋·규칙 이름만 남긴다.
      - name: 비밀 정보 스캔
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          case "$EVENT" in
            pull_request) range="$PR_BASE..$PR_HEAD" ;;
            push)
              if [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ] \
                || ! git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
                # 새 브랜치·이력 재작성으로 이전 커밋이 없으면 push된 머리 커밋까지의 전체 이력을 검사한다.
                range="$PUSH_AFTER"
              else
                range="$PUSH_BEFORE..$PUSH_AFTER"
              fi ;;
            *) range="HEAD" ;;
          esac
          echo "검사 범위: $range ($(git rev-list --count $range) 커밋)" | tee -a "$GITHUB_STEP_SUMMARY"
          gitleaks git . --log-opts="$range" --config .gitleaks.toml --redact=100 --no-banner --verbose \
            --report-format json --report-path "$RUNNER_TEMP/gitleaks.json" || {
            echo "::error::비밀 정보 후보 발견. 대응 절차는 docs/report/infra.md 비밀 스캔 절 참고"
            echo "비밀 정보 후보 발견: 값을 확인하지 말고 docs/report/infra.md 비밀 스캔 절 절차를 따른다." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          echo "발견 없음" >> "$GITHUB_STEP_SUMMARY"
