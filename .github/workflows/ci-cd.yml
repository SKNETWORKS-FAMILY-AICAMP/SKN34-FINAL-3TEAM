name: ci-cd
on:
  pull_request:
    paths: &cd-paths
      - '.github/workflows/cd-release.yml'
      - '.github/workflows/ci-cd.yml'
      - '.github/workflows/_python.yml'
      - '.github/workflows/_spring.yml'
      - '.github/workflows/_web.yml'
      - 'scripts/cd_release.py'
      - 'scripts/verify_cd_deployment.py'
      - 'scripts/tests/test_cd_*.py'
      - 'infrastructure/gitops/**'
  push:
    branches: [develop]
    paths: *cd-paths
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - run: python -m unittest discover -s scripts/tests -p 'test_cd_*.py' -v
      - name: Validate workflow expressions and shell steps
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
