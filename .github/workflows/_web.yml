# 재사용 워크플로: 웹 린트·빌드
name: _web

on:
  workflow_call:
    inputs:
      app-path:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.app-path }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ inputs.app-path }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
