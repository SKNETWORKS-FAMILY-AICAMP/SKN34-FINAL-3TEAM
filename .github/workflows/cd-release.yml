# #186 운영 배포·롤백, #858 digest PR 전환(2026-11-20).
# 기본(pull-request): main 릴리스 SHA → 계획 검증 → ECR 앱·migration 이미지 게시
# → main 대상 digest 갱신 PR 생성(environments/prod/images/**만 수정). PR 승인·병합이 배포 승인이고
# 병합되면 Argo CD가 자동 동기화한다(migration은 PreSync Job). 되돌리기는 그 PR의 revert다.
# 비상용(helm-emergency, 12/7 시연까지 유지): 예전 흐름 그대로 prod 승인 → 작업자 PC self-hosted runner(cd-prod)
# 에서 migration Job 완료 → Helm 적용 → 경로 확인 → 이력 기록. 쓰기 전에 해당 Argo CD Application 자동 동기화를 끈다.
# 실패해도 자동 롤백하지 않는다. migration 실패면 앱을 적용하지 않고, DB는 되돌리지 않는다.
# 작업 이미지(#985, 표현 분류 재학습 tox-retrain)는 계획의 jobs에 있을 때만 같은 태그 규칙으로 게시하고 digest PR로만 고정한다.
# 빈 클러스터 첫 배포(#760)의 계획 currentRelease "none"은 비상용 Helm 경로에서만 의미가 있다.
name: cd-release

on:
  workflow_dispatch:
    inputs:
      plan:
        description: "배포 계획 JSON 본문 (infrastructure/cd/release.example.json 형식, 한 줄)"
        required: true
        type: string
      delivery:
        description: "배포 방식: pull-request(digest PR, 기본) / helm-emergency(비상용 Helm, prod 승인 후 작업자 PC)"
        required: true
        default: pull-request
        type: choice
        options:
          - pull-request
          - helm-emergency
      allowRepositoryChange:
        description: "digest PR에서 images 파일 저장소 주소도 바꿈(계정 전환 첫 배포만, 서비스 5개와 jobs 전부)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: cd-prod
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      operation: ${{ steps.plan.outputs.operation }}
      services: ${{ steps.plan.outputs.services }}
      jobs: ${{ steps.plan.outputs.jobs }}
      delivery: ${{ inputs.delivery }}
    steps:
      - name: main에서만 실행
        if: github.ref != 'refs/heads/main'
        run: |
          echo "운영 배포는 main 릴리스 SHA에서만 실행합니다: $GITHUB_REF" >&2
          exit 1
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: 계획 검증 (이미지 빌드 전)
        env:
          PLAN_JSON: ${{ inputs.plan }}
          DELIVERY: ${{ inputs.delivery }}
        run: |
          # 계획은 커밋하지 않고 실행 입력으로 받는다(계획 안의 SHA가 자기 커밋을 가리키는 순환 방지)
          printf '%s' "$PLAN_JSON" > "$RUNNER_TEMP/plan.json"
          # digest PR은 deploy만 받고, images 파일(#857) 구조가 맞는지 이미지 빌드 전에 본다
          check=()
          if [ "$DELIVERY" = "pull-request" ]; then check=(--check-images); fi
          python scripts/cd_release.py --plan "$RUNNER_TEMP/plan.json" --policy infrastructure/cd/policy.json \
            --output "$RUNNER_TEMP/plan-record.json" --expect-commit "$GITHUB_SHA" \
            --require-ancestor-of origin/main --pending-images "${check[@]}"
      - name: 이미지 빌드 전에 다른 차단 사유가 없어야 함 (실행 스위치·근거·승인자)
        run: |
          python - <<'EOF'
          import json, os, sys
          record = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "plan-record.json"), encoding="utf-8"))
          blocks = [b for b in record["blocks"] if b != "배포 이미지 빌드 전"]
          if blocks:
              sys.exit("실행 차단: " + "; ".join(blocks))
          EOF
      - id: plan
        name: 실행 범위
        run: |
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          plan = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "plan.json"), encoding="utf-8"))
          print("operation=" + plan["operation"])
          print("services=" + json.dumps(plan["services"], separators=(",", ":")))
          # 작업 이미지(#985)는 선택값이다. 약 1.89GB라 매 릴리스가 아니라 계획에 넣은 릴리스만 빌드한다
          print("jobs=" + json.dumps(plan.get("jobs", []), separators=(",", ":")))
          EOF

  publish:
    needs: validate
    if: needs.validate.outputs.operation == 'deploy'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      images: ${{ steps.images.outputs.images }}
      migrations: ${{ steps.images.outputs.migrations }}
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.CD_AWS_ROLE_ARN }}
          aws-region: ${{ vars.CD_AWS_REGION }}
      - uses: docker/setup-buildx-action@v4
      - id: images
        name: main SHA 앱·migration·작업 이미지 게시 (ECR 태그 불변, 이미 있으면 재사용)
        env:
          REGISTRY: ${{ vars.CD_ECR_REGISTRY }}
          SERVICES: ${{ needs.validate.outputs.services }}
          JOBS: ${{ needs.validate.outputs.jobs }}
        run: |
          set -euo pipefail
          shopt -s inherit_errexit
          aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
          tag="main-${GITHUB_SHA::12}"
          # 저장소에 그 태그가 있으면 digest만 읽고, 없을 때만 빌드한다. 출력은 <저장소>@<digest>
          publish() {
            local repository="$1" digest
            shift
            if ! digest=$(aws ecr describe-images --repository-name "$repository" --image-ids "imageTag=$tag" \
                  --query 'imageDetails[0].imageDigest' --output text 2>/dev/null); then
              docker buildx build --platform linux/amd64 -t "$REGISTRY/$repository:$tag" --push "$@" >&2
              digest=$(aws ecr describe-images --repository-name "$repository" --image-ids "imageTag=$tag" \
                --query 'imageDetails[0].imageDigest' --output text)
            fi
            echo "$REGISTRY/$repository@$digest"
          }
          images='{}'
          migrations='{}'
          for service in $(echo "$SERVICES" | jq -r '.[]'); do
            image=$(publish "sagomungchi/$service" "backend/$service")
            images=$(jq -c --arg s "$service" --arg i "$image" '. + {($s): $i}' <<<"$images")
            # DB를 가진 서비스는 같은 SHA의 migration도 게시한다. report Alembic은 앱 이미지 안에 있다
            case "$service" in
              core-service|learning-service)
                name="${service%-service}"
                migration=$(publish "sagomungchi/$name-migrate" -f "infrastructure/gitops/migrations/$name.Dockerfile" .) ;;
              report-service) migration="$image" ;;
              *) continue ;;
            esac
            migrations=$(jq -c --arg s "$service" --arg i "$migration" '. + {($s): $i}' <<<"$migrations")
          done
          # 작업 이미지(#985). 같은 main-<SHA> 불변 태그, 이미 있으면 재사용. migration 없음
          for job in $(echo "$JOBS" | jq -r '.[]'); do
            case "$job" in
              tox-retrain) image=$(publish "sagomungchi/tox-retrain" -f ml/tox/Dockerfile .) ;;
              *) echo "지원하지 않는 작업 이미지: $job" >&2; exit 1 ;;
            esac
            images=$(jq -c --arg s "$job" --arg i "$image" '. + {($s): $i}' <<<"$images")
          done
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "migrations=$migrations" >> "$GITHUB_OUTPUT"

  digest-pr:
    needs: [validate, publish]
    if: needs.validate.outputs.delivery == 'pull-request' && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    # 브랜치 push까지만 한다. 조직 정책상 Actions는 PR을 만들 수 없어(#986) PR은 사람이 실행 요약 링크로 열고,
    # 승인은 그 PR에서 받는다(main 보호 규칙·CODEOWNERS, infrastructure/cd/README.md)
    permissions:
      contents: write        # digest 브랜치 push
    env:
      PLAN_JSON: ${{ inputs.plan }}
      IMAGES: ${{ needs.publish.outputs.images }}
      MIGRATIONS: ${{ needs.publish.outputs.migrations }}
    steps:
      # images 파일은 지금 main HEAD 기준으로 고친다(다른 digest PR이 먼저 병합됐을 수 있음).
      # 전체 이력은 PR 본문 revert 판단 자료가 이전 migration revision 커밋과 비교하는 데도 쓴다(#1013)
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: 최종 게이트와 images 파일 갱신
        id: gate
        env:
          ALLOW_REPOSITORY_CHANGE: ${{ inputs.allowRepositoryChange }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/cd"
          mkdir -p "$work"
          printf '%s' "$PLAN_JSON" > "$work/plan.json"
          printf '%s' "$IMAGES" > "$work/images.json"
          printf '%s' "$MIGRATIONS" > "$work/migration-images.json"
          base=$(git rev-parse HEAD)
          move=()
          if [ "$ALLOW_REPOSITORY_CHANGE" = "true" ]; then move=(--allow-repository-change); fi
          python scripts/cd_release.py --plan "$work/plan.json" --policy infrastructure/cd/policy.json \
            --output "$work/plan-record.json" --expect-commit "$GITHUB_SHA" --require-ancestor-of origin/main \
            --images "$work/images.json" --migrations "$work/migration-images.json" \
            --require-executable --write-images --pr-body "$work/pr-body.md" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --base-sha "$base" "${move[@]}"
          # images/** 밖이 바뀌었으면 브랜치를 push하지 않는다(브랜치 규칙 예외는 이 경로만)
          images_dir=$(jq -r '.delivery.imagesDir' infrastructure/cd/policy.json)
          outside=$(git status --porcelain --untracked-files=all | cut -c4- | grep -v "^$images_dir/" || true)
          if [ -n "$outside" ]; then
            echo "images 밖 파일이 바뀌었습니다: $outside" >&2
            exit 1
          fi
          echo "work=$work" >> "$GITHUB_OUTPUT"
          echo "images_dir=$images_dir" >> "$GITHUB_OUTPUT"
      - name: digest 브랜치 push와 PR 열기 링크
        env:
          WORK: ${{ steps.gate.outputs.work }}
          IMAGES_DIR: ${{ steps.gate.outputs.images_dir }}
        run: |
          set -euo pipefail
          tag="main-${GITHUB_SHA::12}"
          branch="cd/prod-images-$tag-$GITHUB_RUN_ID"
          releases=$(jq -r '[.imageFileChanges[].release] | join(", ")' "$WORK/plan-record.json")
          title="chore: prod 이미지 digest $tag ($releases)"
          # 커밋 1개짜리 compare 화면은 커밋 제목·본문으로 PR 제목·본문을 채운다.
          # 본문의 '#' 제목 줄이 지워지지 않게 verbatim으로 남긴다
          { printf '%s\n\n' "$title"; cat "$WORK/pr-body.md"; } > "$WORK/commit-message.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A -- "$IMAGES_DIR"
          git commit --cleanup=verbatim -F "$WORK/commit-message.txt"
          git push origin "$branch"
          compare="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$branch?expand=1"
          {
            echo "### digest PR 열기"
            echo ""
            echo "- 브랜치: \`$branch\`"
            echo "- [PR 만들기]($compare): 링크를 열고 채워진 제목·본문 그대로 **Create pull request**를 누른다"
            echo "- 열린 digest PR은 하나만 둔다. 이전 digest PR이 열려 있으면 닫는다(브랜치도 삭제)"
            echo "- 승인은 PR을 연 사람과 다른 code owner(김동섭 ↔ 김태윤)가 한다. ci-gitops는 PR을 열면 자동으로 돈다"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cd-digest-pr-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/cd/plan.json
            ${{ runner.temp }}/cd/plan-record.json
            ${{ runner.temp }}/cd/pr-body.md
          retention-days: 90
          if-no-files-found: warn

  deploy:
    needs: [validate, publish]
    # 비상용(helm-emergency)만. 12/7 시연까지 유지하고 그 뒤 정리한다(#858)
    if: always() && needs.validate.result == 'success' && needs.validate.outputs.delivery == 'helm-emergency' && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: [self-hosted, cd-prod]
    # Required reviewers(김동섭·김태윤) 중 한 명이 승인하기 전에는 이 job이 시작되지 않는다(GitHub는 목록 중 1명 승인)
    environment: prod
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: pwsh
    env:
      PLAN_JSON: ${{ inputs.plan }}
      IMAGES: ${{ needs.publish.outputs.images }}
      MIGRATIONS: ${{ needs.publish.outputs.migrations }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: 작업 폴더
        # job env에서는 runner 컨텍스트를 쓸 수 없어 step에서 정한다
        run: Add-Content -LiteralPath $env:GITHUB_ENV -Value "WORK=$env:RUNNER_TEMP/cd-$env:GITHUB_RUN_ID" -Encoding utf8
      - name: 최종 실행 게이트 (실제 이미지·정책 실행 스위치)
        run: |
          New-Item -ItemType Directory -Force $env:WORK | Out-Null
          Set-Content -LiteralPath "$env:WORK/plan.json" -Value $env:PLAN_JSON -Encoding utf8NoBOM
          $imagesArg = @()
          if ($env:IMAGES) {
            Set-Content -LiteralPath "$env:WORK/images.json" -Value $env:IMAGES -Encoding utf8NoBOM
            $imagesArg = @('--images', "$env:WORK/images.json")
          }
          if ($env:MIGRATIONS) {
            Set-Content -LiteralPath "$env:WORK/migration-images.json" -Value $env:MIGRATIONS -Encoding utf8NoBOM
            $imagesArg += @('--migrations', "$env:WORK/migration-images.json")
          }
          python scripts/cd_release.py --plan "$env:WORK/plan.json" --policy infrastructure/cd/policy.json `
            --output "$env:WORK/plan-record.json" --expect-commit $env:GITHUB_SHA `
            --require-ancestor-of origin/main --require-executable @imagesArg
          if ($LASTEXITCODE -ne 0) { throw "실행 게이트를 통과하지 못했습니다 (종료 코드 $LASTEXITCODE)" }
      - name: migration 미리보기 (server dry-run)
        # deploy만. core → learning → report 순서, 각자 자기 DB. Job 이름은 <release>-migrate-main-<SHA 12자리>
        run: |
          $record = Get-Content -LiteralPath "$env:WORK/plan-record.json" -Raw | ConvertFrom-Json
          $order = [ordered]@{ 'core-service' = 'core-service'; 'learning-service' = 'learning-service'; 'report-service' = 'report-api' }
          $targets = @(foreach ($service in $order.Keys) {
            $image = $record.migrations.$service
            if ($record.operation -eq 'deploy' -and $image) {
              [pscustomobject]@{ release = $order[$service]; digest = ($image -split '@')[1]; revision = "main-$($env:GITHUB_SHA.Substring(0, 12))" }
            }
          })
          ConvertTo-Json -InputObject @($targets) | Set-Content -LiteralPath "$env:WORK/migration-targets.json" -Encoding utf8
          '[]' | Set-Content -LiteralPath "$env:WORK/migrations.json" -Encoding utf8
          foreach ($target in $targets) {
            pwsh -File infrastructure/gitops/environments/prod/redeploy-app.ps1 -Service $target.release -Migration `
              -Kubeconfig $env:CD_KUBECONFIG -Helm ($env:CD_HELM ?? 'helm') -Profile ($env:CD_AWS_PROFILE ?? 'sagomungchi-provided') `
              -ImageDigest $target.digest -Revision $target.revision
            if ($LASTEXITCODE -ne 0) { throw "migration dry-run 실패: $($target.release)" }
          }
      - name: 적용 미리보기 (server dry-run)
        run: |
          $record = Get-Content -LiteralPath "$env:WORK/plan-record.json" -Raw | ConvertFrom-Json
          $releases = foreach ($service in $record.services) {
            $digest = ($record.images.$service -split '@')[1]
            foreach ($release in $(if ($service -eq 'report-service') { 'report-api', 'report-worker' } else { $service })) {
              [pscustomobject]@{ release = $release; digest = $digest }
            }
          }
          $releases | ConvertTo-Json -AsArray | Set-Content -LiteralPath "$env:WORK/targets.json" -Encoding utf8
          # 첫 배포(currentRelease "none")만 release가 없는 앱을 install로 미리 본다. 아니면 기존 release가 있어야 한다
          $install = @(if ($record.firstInstall) { '-AllowInstall' })
          $previews = foreach ($target in $releases) {
            $out = "$env:WORK/preview-$($target.release).json"
            pwsh -File infrastructure/gitops/environments/prod/redeploy-app.ps1 -Service $target.release `
              -Kubeconfig $env:CD_KUBECONFIG -Helm ($env:CD_HELM ?? 'helm') -Profile ($env:CD_AWS_PROFILE ?? 'sagomungchi-provided') `
              -ImageDigest $target.digest -ResultPath $out @install | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "dry-run 실패: $($target.release)" }
            Get-Content -LiteralPath $out -Raw | ConvertFrom-Json
          }
          "- 적용 미리보기: $(($previews | ForEach-Object { "$($_.release) $($_.action)" }) -join ', ')" |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
      - name: migration 적용·완료 확인
        # 하나라도 완료되지 않으면 여기서 멈추고 앱은 적용하지 않는다. DB는 되돌리지 않는다
        run: |
          $results = [System.Collections.Generic.List[object]]::new()
          try {
            foreach ($target in (Get-Content -LiteralPath "$env:WORK/migration-targets.json" -Raw | ConvertFrom-Json)) {
              $out = "$env:WORK/migration-$($target.release).json"
              pwsh -File infrastructure/gitops/environments/prod/redeploy-app.ps1 -Service $target.release -Migration `
                -Kubeconfig $env:CD_KUBECONFIG -Helm ($env:CD_HELM ?? 'helm') -Profile ($env:CD_AWS_PROFILE ?? 'sagomungchi-provided') `
                -ImageDigest $target.digest -Revision $target.revision -ResultPath $out -Apply
              $ok = $LASTEXITCODE -eq 0
              if (Test-Path -LiteralPath $out) { $results.Add((Get-Content -LiteralPath $out -Raw | ConvertFrom-Json)) }
              else { $results.Add([pscustomobject]@{ release = $target.release; revision = $target.revision; status = 'failed' }) }
              if (-not $ok) { throw "migration 실패: $($target.release). 다음 migration과 앱 적용은 하지 않았습니다" }
            }
          } finally {
            ConvertTo-Json -InputObject @($results) | Set-Content -LiteralPath "$env:WORK/migrations.json" -Encoding utf8
          }
      - name: 적용
        run: |
          $record = Get-Content -LiteralPath "$env:WORK/plan-record.json" -Raw | ConvertFrom-Json
          $install = @(if ($record.firstInstall) { '-AllowInstall' })
          $results = [System.Collections.Generic.List[object]]::new()
          try {
            foreach ($target in (Get-Content -LiteralPath "$env:WORK/targets.json" -Raw | ConvertFrom-Json)) {
              # 결과(install/upgrade·전후 revision·상태)는 스크립트가 남긴다. 첫 설치는 previousRevision이 null
              $out = "$env:WORK/release-$($target.release).json"
              pwsh -File infrastructure/gitops/environments/prod/redeploy-app.ps1 -Service $target.release `
                -Kubeconfig $env:CD_KUBECONFIG -Helm ($env:CD_HELM ?? 'helm') -Profile ($env:CD_AWS_PROFILE ?? 'sagomungchi-provided') `
                -ImageDigest $target.digest -ResultPath $out -Apply @install
              $ok = $LASTEXITCODE -eq 0
              if (Test-Path -LiteralPath $out) { $result = Get-Content -LiteralPath $out -Raw | ConvertFrom-Json }
              else { $result = [pscustomobject]@{ release = $target.release; digest = $target.digest; status = 'failed' } }
              if (-not $ok) { $result.status = 'failed' }
              $results.Add($result)
              if (-not $ok) { throw "적용 실패: $($target.release). 다음 release는 적용하지 않았습니다" }
            }
          } finally {
            $results | ConvertTo-Json -AsArray | Set-Content -LiteralPath "$env:WORK/releases.json" -Encoding utf8
          }
      - name: 배포 후 경로 확인 (로그인·학습 제출·리포트 조회)
        env:
          CD_BASE_URL: ${{ vars.CD_BASE_URL }}
        run: |
          python scripts/verify_cd_deployment.py --base-url $env:CD_BASE_URL `
            --fixture $env:CD_SMOKE_FIXTURE_FILE --output "$env:WORK/smoke.json"
          if ($LASTEXITCODE -ne 0) { throw '배포 후 경로 확인 실패' }
      - name: 배포 이력 기록
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/cd_record.py --plan-record "$env:WORK/plan-record.json" `
            --releases "$env:WORK/releases.json" --migration-jobs "$env:WORK/migrations.json" `
            --smoke "$env:WORK/smoke.json" --output "$env:WORK/history.json"
          $history = Get-Content -LiteralPath "$env:WORK/history.json" -Raw | ConvertFrom-Json
          @(
            '## #186 배포 이력'
            "- 결과: $($history.result), 작업: $($history.operation), 소스: $($history.sourceCommit)"
            "- migration: $(($history.migrationJobs | ForEach-Object { "$($_.job ?? $_.release) $($_.status)" }) -join ', ')"
            "- 승인: $(($history.approvals | ForEach-Object { $_.user + '(' + $_.state + ')' }) -join ', ')"
            "- release: $(($history.releases | ForEach-Object { "$($_.release) $(if ($null -eq $_.previousRevision) { '첫 설치' } else { "r$($_.previousRevision)" })→r$($_.revision) $($_.status)" }) -join ', ')"
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cd-history-${{ github.run_id }}
          path: |
            ${{ env.WORK }}/history.json
            ${{ env.WORK }}/plan.json
            ${{ env.WORK }}/plan-record.json
            ${{ env.WORK }}/releases.json
            ${{ env.WORK }}/migrations.json
            ${{ env.WORK }}/smoke.json
          retention-days: 90
          if-no-files-found: warn
