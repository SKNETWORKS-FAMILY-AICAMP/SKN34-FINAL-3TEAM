# #186 운영 배포·롤백: main 릴리스 SHA → 계획 검증 → (배포) ECR 게시 → prod 승인 → Helm 적용 → 경로 확인 → 이력 기록.
# EKS API는 작업자 공인 IP로만 열려 있어 적용 단계는 그 PC의 전용 self-hosted runner(cd-prod)에서 실행한다.
# 실패해도 자동 롤백하지 않는다. 복구는 rollback 계획으로 다시 승인받는다.
name: cd-release

on:
  workflow_dispatch:
    inputs:
      plan:
        description: "배포 계획 JSON 본문 (infrastructure/cd/release.example.json 형식, 한 줄)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cd-prod
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      operation: ${{ steps.plan.outputs.operation }}
      services: ${{ steps.plan.outputs.services }}
    steps:
      - name: main에서만 실행
        if: github.ref != 'refs/heads/main'
        run: |
          echo "운영 배포는 main 릴리스 SHA에서만 실행합니다: $GITHUB_REF" >&2
          exit 1
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: 계획 검증 (이미지 빌드 전)
        env:
          PLAN_JSON: ${{ inputs.plan }}
        run: |
          # 계획은 커밋하지 않고 실행 입력으로 받는다(계획 안의 SHA가 자기 커밋을 가리키는 순환 방지)
          printf '%s' "$PLAN_JSON" > "$RUNNER_TEMP/plan.json"
          python scripts/cd_release.py --plan "$RUNNER_TEMP/plan.json" --policy infrastructure/cd/policy.json \
            --output "$RUNNER_TEMP/plan-record.json" --expect-commit "$GITHUB_SHA" \
            --require-ancestor-of origin/main --pending-images
      - name: 이미지 빌드 전에 다른 차단 사유가 없어야 함 (실행 스위치·근거·승인자)
        run: |
          python - <<'EOF'
          import json, os, sys
          record = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "plan-record.json"), encoding="utf-8"))
          blocks = [b for b in record["blocks"] if b != "배포 이미지 빌드 전"]
          if blocks:
              sys.exit("실행 차단: " + "; ".join(blocks))
          EOF
      - id: plan
        name: 실행 범위
        run: |
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          plan = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "plan.json"), encoding="utf-8"))
          print("operation=" + plan["operation"])
          print("services=" + json.dumps(plan["services"], separators=(",", ":")))
          EOF

  publish:
    needs: validate
    if: needs.validate.outputs.operation == 'deploy'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      images: ${{ steps.images.outputs.images }}
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.CD_AWS_ROLE_ARN }}
          aws-region: ${{ vars.CD_AWS_REGION }}
      - uses: docker/setup-buildx-action@v4
      - id: images
        name: main SHA 이미지 게시 (ECR 태그 불변, 이미 있으면 재사용)
        env:
          REGISTRY: ${{ vars.CD_ECR_REGISTRY }}
          SERVICES: ${{ needs.validate.outputs.services }}
        run: |
          set -euo pipefail
          aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
          tag="main-${GITHUB_SHA::12}"
          echo '{}' > "$RUNNER_TEMP/images.json"
          for service in $(echo "$SERVICES" | jq -r '.[]'); do
            repository="sagomungchi/$service"
            if ! digest=$(aws ecr describe-images --repository-name "$repository" --image-ids "imageTag=$tag" \
                  --query 'imageDetails[0].imageDigest' --output text 2>/dev/null); then
              docker buildx build --platform linux/amd64 -t "$REGISTRY/$repository:$tag" --push "backend/$service"
              digest=$(aws ecr describe-images --repository-name "$repository" --image-ids "imageTag=$tag" \
                --query 'imageDetails[0].imageDigest' --output text)
            fi
            jq --arg s "$service" --arg i "$REGISTRY/$repository@$digest" '. + {($s): $i}' \
              "$RUNNER_TEMP/images.json" > "$RUNNER_TEMP/next.json"
            mv "$RUNNER_TEMP/next.json" "$RUNNER_TEMP/images.json"
          done
          echo "images=$(jq -c . "$RUNNER_TEMP/images.json")" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [validate, publish]
    if: always() && needs.validate.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: [self-hosted, cd-prod]
    # 필수 승인자(김동섭·김태윤) 승인 전에는 이 job이 시작되지 않는다
    environment: prod
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: pwsh
    env:
      PLAN_JSON: ${{ inputs.plan }}
      IMAGES: ${{ needs.publish.outputs.images }}
      WORK: ${{ runner.temp }}/cd-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: 최종 실행 게이트 (실제 이미지·정책 실행 스위치)
        run: |
          New-Item -ItemType Directory -Force $env:WORK | Out-Null
          Set-Content -LiteralPath "$env:WORK/plan.json" -Value $env:PLAN_JSON -Encoding utf8NoBOM
          $imagesArg = @()
          if ($env:IMAGES) {
            Set-Content -LiteralPath "$env:WORK/images.json" -Value $env:IMAGES -Encoding utf8NoBOM
            $imagesArg = @('--images', "$env:WORK/images.json")
          }
          python scripts/cd_release.py --plan "$env:WORK/plan.json" --policy infrastructure/cd/policy.json `
            --output "$env:WORK/plan-record.json" --expect-commit $env:GITHUB_SHA `
            --require-ancestor-of origin/main --require-executable @imagesArg
          if ($LASTEXITCODE -ne 0) { throw "실행 게이트를 통과하지 못했습니다 (종료 코드 $LASTEXITCODE)" }
      - name: 적용 미리보기 (server dry-run)
        run: |
          $record = Get-Content -LiteralPath "$env:WORK/plan-record.json" -Raw | ConvertFrom-Json
          $releases = foreach ($service in $record.services) {
            $digest = ($record.images.$service -split '@')[1]
            foreach ($release in $(if ($service -eq 'report-service') { 'report-api', 'report-worker' } else { $service })) {
              [pscustomobject]@{ release = $release; digest = $digest }
            }
          }
          $releases | ConvertTo-Json -AsArray | Set-Content -LiteralPath "$env:WORK/targets.json" -Encoding utf8
          foreach ($target in $releases) {
            pwsh -File infrastructure/gitops/environments/prod/redeploy-app.ps1 -Service $target.release `
              -Kubeconfig $env:CD_KUBECONFIG -Helm ($env:CD_HELM ?? 'helm') -Profile ($env:CD_AWS_PROFILE ?? 'sagomungchi-provided') `
              -ImageDigest $target.digest
            if ($LASTEXITCODE -ne 0) { throw "dry-run 실패: $($target.release)" }
          }
      - name: 적용
        run: |
          $helm = $env:CD_HELM ?? 'helm'
          $results = [System.Collections.Generic.List[object]]::new()
          try {
            foreach ($target in (Get-Content -LiteralPath "$env:WORK/targets.json" -Raw | ConvertFrom-Json)) {
              $before = (& $helm status $target.release -n app --kubeconfig $env:CD_KUBECONFIG -o json | ConvertFrom-Json).version
              pwsh -File infrastructure/gitops/environments/prod/redeploy-app.ps1 -Service $target.release `
                -Kubeconfig $env:CD_KUBECONFIG -Helm $helm -Profile ($env:CD_AWS_PROFILE ?? 'sagomungchi-provided') `
                -ImageDigest $target.digest -Apply
              $ok = $LASTEXITCODE -eq 0
              $after = (& $helm status $target.release -n app --kubeconfig $env:CD_KUBECONFIG -o json | ConvertFrom-Json)
              $results.Add([pscustomobject]@{
                release = $target.release; digest = $target.digest
                previousRevision = $before; revision = $after.version
                status = $(if ($ok) { $after.info.status } else { 'failed' })
              })
              if (-not $ok) { throw "적용 실패: $($target.release). 다음 release는 적용하지 않았습니다" }
            }
          } finally {
            $results | ConvertTo-Json -AsArray | Set-Content -LiteralPath "$env:WORK/releases.json" -Encoding utf8
          }
      - name: 배포 후 경로 확인 (로그인·학습 제출·리포트 조회)
        env:
          CD_BASE_URL: ${{ vars.CD_BASE_URL }}
        run: |
          python scripts/verify_cd_deployment.py --base-url $env:CD_BASE_URL `
            --fixture $env:CD_SMOKE_FIXTURE_FILE --output "$env:WORK/smoke.json"
          if ($LASTEXITCODE -ne 0) { throw '배포 후 경로 확인 실패' }
      - name: 배포 이력 기록
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/cd_record.py --plan-record "$env:WORK/plan-record.json" `
            --releases "$env:WORK/releases.json" --smoke "$env:WORK/smoke.json" --output "$env:WORK/history.json"
          $history = Get-Content -LiteralPath "$env:WORK/history.json" -Raw | ConvertFrom-Json
          @(
            '## #186 배포 이력'
            "- 결과: $($history.result), 작업: $($history.operation), 소스: $($history.sourceCommit)"
            "- 승인: $(($history.approvals | ForEach-Object { $_.user + '(' + $_.state + ')' }) -join ', ')"
            "- release: $(($history.releases | ForEach-Object { "$($_.release) r$($_.previousRevision)→r$($_.revision) $($_.status)" }) -join ', ')"
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cd-history-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/cd-${{ github.run_id }}/history.json
            ${{ runner.temp }}/cd-${{ github.run_id }}/plan.json
            ${{ runner.temp }}/cd-${{ github.run_id }}/plan-record.json
            ${{ runner.temp }}/cd-${{ github.run_id }}/releases.json
            ${{ runner.temp }}/cd-${{ github.run_id }}/smoke.json
          retention-days: 90
          if-no-files-found: warn
