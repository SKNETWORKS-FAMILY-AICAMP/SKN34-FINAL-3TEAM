name: ci-contracts

on:
  pull_request:
    paths:
      - "contracts/**"
      - "backend/**"
      - "frontend/web/**"
      - "scripts/**"
      - "docs/design/**"
      - "compose.yaml"
      - "compose.*.yaml"
      - ".env.example"
      - "infrastructure/gitops/environments/local/*.yaml"
      - "infrastructure/gitops/charts/platform-data/files/rabbitmq/definitions.json"
      - ".github/workflows/ci-contracts.yml"
  push:
    branches: [develop, main]
    paths:
      - "contracts/**"
      - "backend/**"
      - "frontend/web/**"
      - "scripts/**"
      - "docs/design/**"
      - "compose.yaml"
      - "compose.*.yaml"
      - ".env.example"
      - "infrastructure/gitops/environments/local/*.yaml"
      - "infrastructure/gitops/charts/platform-data/files/rabbitmq/definitions.json"
      - ".github/workflows/ci-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # PR에서 바뀐 경로로 Gradle 계약 산출물 생성 필요 여부 판정. push·수동 실행은 항상 전체 실행
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      core: ${{ steps.filter.outputs.core }}
      learning: ${{ steps.filter.outputs.learning }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "core=true" >> "$GITHUB_OUTPUT"; echo "learning=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # PR 체크아웃은 병합 커밋이라 첫 부모(base) 대비 차이가 곧 PR 변경분
          files=$(git diff --name-only HEAD^1 HEAD)
          common='^(contracts/|scripts/validate_|\.github/workflows/ci-contracts\.yml$)'
          match() { if echo "$files" | grep -qE "$1"; then echo true; else echo false; fi; }
          core=$(match "$common|^backend/core-service/|^infrastructure/gitops/charts/platform-data/files/rabbitmq/definitions\.json$")
          learning=$(match "$common|^backend/learning-service/|^scripts/knowledge/")
          echo "core=$core" >> "$GITHUB_OUTPUT"; echo "learning=$learning" >> "$GITHUB_OUTPUT"
          echo "core 계약 산출물: $core / learning 계약 산출물: $learning" >> "$GITHUB_STEP_SUMMARY"

  repo-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - name: 계약 검증 환경 준비
        run: |
          uv venv .venv-contracts --python 3.12
          uv pip install --python .venv-contracts/bin/python "PyYAML==6.0.3" "jsonschema==4.26.0"
      - name: 저장소 계약 및 검증기 회귀 검사
        run: .venv-contracts/bin/python -O -m unittest discover -s scripts/tests -v

  core-contracts:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - name: 계약 검증 환경 준비
        run: |
          uv venv .venv-contracts --python 3.12
          uv pip install --python .venv-contracts/bin/python "PyYAML==6.0.3" "jsonschema==4.26.0"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      # 합성 JSON을 복사하지 않고 실제 PostgreSQL·RabbitMQ 테스트에서 응답을 생성한다.
      - name: core 여덟 기능 계약 산출물 생성
        working-directory: backend/core-service
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon \
            --tests 'com.sagomungchi.core.report.ReportMessagingTest' \
            --tests 'com.sagomungchi.core.report.ReportHttpTest' \
            --tests 'com.sagomungchi.core.notification.NotificationIntegrationTest' \
            --tests 'com.sagomungchi.core.support.SupportIntegrationTest' \
            --tests 'com.sagomungchi.core.payment.PaymentIntegrationTest' \
            --tests 'com.sagomungchi.core.report.AdminReportRetryIntegrationTest' \
            --tests 'com.sagomungchi.core.conversation.ConversationIntegrationTest' \
            --tests 'com.sagomungchi.core.admin.AdminOperationsIntegrationTest' \
            --tests 'com.sagomungchi.core.community.CommunityIntegrationTest' \
            --tests 'com.sagomungchi.core.reward.RewardIntegrationTest'
      - name: 실제 리포트 이벤트·응답 계약 검사
        run: .venv-contracts/bin/python scripts/validate_report_contracts.py
      - name: 실제 알림 응답 계약 검사
        run: .venv-contracts/bin/python scripts/validate_notification_contracts.py
      - name: 실제 문의 응답 계약 검사
        run: .venv-contracts/bin/python scripts/validate_support_contracts.py
      - name: 실제 결제 응답 계약 검사
        run: .venv-contracts/bin/python scripts/validate_payment_contracts.py
      - name: 실제 관리자 리포트 재처리 계약 검사
        run: .venv-contracts/bin/python scripts/validate_admin_report_retry_contracts.py
      - name: 실제 분석 대화 SSE 계약 검사
        run: .venv-contracts/bin/python scripts/validate_analysis_contracts.py backend/core-service/build/generated-contracts/analysis.json
      - name: 실제 관리자 운영 응답 계약 검사
        run: .venv-contracts/bin/python scripts/validate_admin_operations_contracts.py backend/core-service/build/generated-contracts/admin-operations.json
      - name: 실제 커뮤니티 응답 계약 검사
        run: .venv-contracts/bin/python scripts/validate_community_contracts.py
      - name: 실제 포인트·꾸미기 응답 계약 검사
        run: .venv-contracts/bin/python scripts/validate_reward_contracts.py

  learning-contracts:
    needs: changes
    if: needs.changes.outputs.learning == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - name: 계약 검증 환경 준비
        run: |
          uv venv .venv-contracts --python 3.12
          uv pip install --python .venv-contracts/bin/python "PyYAML==6.0.3" "jsonschema==4.26.0"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      # core가 부르는 learning 커뮤니티 내부 응답(#386)도 실제 PostgreSQL 테스트에서 만든다.
      - name: learning 커뮤니티·지식 코드 조회 계약 산출물 생성
        working-directory: backend/learning-service
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon --tests 'com.sagomungchi.learning.community.CommunityTest' --tests 'com.sagomungchi.learning.attempt.service.AttemptComparisonIntegrationTest' --tests 'com.sagomungchi.learning.knowledge.KnowledgeApiIntegrationTest'
      - name: 실제 learning 커뮤니티 응답 계약 검사
        run: .venv-contracts/bin/python scripts/validate_learning_community_contracts.py

      - name: 실제 learning 테마 요약과 report 소비 계약 검사
        run: .venv-contracts/bin/python scripts/validate_theme_summary_contracts.py

      - name: 실제 PostgreSQL 지식 코드 조회 응답 계약 검사
        run: .venv-contracts/bin/python scripts/validate_knowledge_contracts.py
