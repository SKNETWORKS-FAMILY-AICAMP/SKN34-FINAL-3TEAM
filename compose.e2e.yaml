# 실서버 E2E 전용 오버레이 (#246): 외부 의존(Google·LLM·토스)을 infrastructure/stubs 대역으로 교체, 합성 시드 적용
# #625: M2 점수(scoring, S3 모델 필요)도 scoring-stub으로, 리포트 설명 sLLM은 llm-stub으로 교체
# 실행: docker compose -p sagomungchi-e2e --env-file infrastructure/stubs/e2e.env \
#         -f compose.yaml -f compose.minio.yaml -f compose.e2e.yaml \
#         up -d --build --wait core-service learning-service ai-service report-api report-worker
# 종료: 같은 옵션으로 down -v. 인프라 포트가 고정이라 기본 compose 스택과 동시 실행 불가
services:
  google-stub:
    build: ./infrastructure/stubs/google-stub
    environment:
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?e2e.env 필요}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?e2e.env 필요}

  llm-stub:
    build: ./infrastructure/stubs/llm-stub
    environment:
      # #884: 설정하면 컨테이너 안 이 경로에 받은 요청 본문을 JSONL로 남김(기본 꺼짐)
      LLM_STUB_RECORD_FILE: ${LLM_STUB_RECORD_FILE:-}

  scoring-stub:
    build: ./infrastructure/stubs/scoring-stub

  toss-stub:
    build: ./infrastructure/stubs/toss-stub
    environment:
      TOSS_TEST_MID: ${TOSS_TEST_MID:?e2e.env 필요}
      TOSS_TEST_BILLING_MID: ${TOSS_TEST_BILLING_MID:?e2e.env 필요}
      TOSS_TEST_BILLING_SECRET_KEY: ${TOSS_TEST_BILLING_SECRET_KEY:?e2e.env 필요}

  # 동의 문서·상품·관리자·꾸미기 아이템(core_db)과 기존 데모 미션·E2E 기준표 핵심어(learning_db) 적용
  e2e-seed:
    image: pgvector/pgvector:0.8.7-pg17-trixie
    depends_on:
      core-migrate:
        condition: service_completed_successfully
      learning-migrate:
        condition: service_completed_successfully
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      FREE_PRODUCT_ID: ${PAYMENT_FREE_PRODUCT_ID:?e2e.env 필요}
    volumes:
      - ./frontend/web/tests/e2e/seed/core.sql:/seed/core.sql:ro
      - ./backend/learning-service/db/seed/demo_missions.sql:/seed/demo_missions.sql:ro
      - ./frontend/web/tests/e2e/seed/learning.sql:/seed/learning.sql:ro
    entrypoint:
      - /bin/sh
      - -ec
      - >-
        psql -v ON_ERROR_STOP=1 -v free_product_id="$$FREE_PRODUCT_ID" -d core_db -f /seed/core.sql &&
        psql -v ON_ERROR_STOP=1 -d learning_db -f /seed/demo_missions.sql &&
        psql -v ON_ERROR_STOP=1 -d learning_db -f /seed/learning.sql

  core-service:
    depends_on:
      e2e-seed:
        condition: service_completed_successfully
      google-stub:
        condition: service_healthy
      toss-stub:
        condition: service_healthy
    environment:
      APP_AUTH_GOOGLETOKENURL: http://google-stub:8080/token
      APP_AUTH_GOOGLEJWKURL: http://google-stub:8080/jwks
      TOSS_API_BASE_URL: http://toss-stub:8080

  # 실제 LLM 키가 셸 환경에 있어도 쓰이지 않도록 고정
  ai-service:
    depends_on:
      llm-stub:
        condition: service_healthy
      scoring-stub:
        condition: service_healthy
    environment:
      # #747: 리포트 서술·설명은 운영과 같은 SageMaker 클라이언트(boto3 InvokeEndpoint)를 llm-stub으로 돌린다.
      # 서명용 가상 자격 증명만 두고 AWS로는 나가지 않는다.
      REPORT_LLM_ENDPOINT: e2e-explanation
      REPORT_LLM_COMPONENT: e2e-explanation-explain
      REPORT_LLM_ENDPOINT_URL: http://llm-stub:8080
      AWS_ACCESS_KEY_ID: e2e-synthetic
      AWS_SECRET_ACCESS_KEY: e2e-synthetic
      LLM_PROVIDER: openai
      OPENAI_BASE_URL: http://llm-stub:8080/v1
      OPENAI_API_KEY: ""
      OPENAI_MODEL: e2e-stub
      OPENAI_JSON_MODE: json_schema
      ANTHROPIC_API_KEY: ""
      # 주간 리포트 대표 답변 설명(FN-RPT-09)은 M2 점수가 있는 답변만 대상이라 교차 확인을 켠다
      SCORING_URL: http://scoring-stub:8080
      M2_CROSS_CHECK_ENABLED: "true"

  # 추억 그림책(#975, docs/proposals/memory-book.md 14.6): learning이 테마 그림 키(theme-drafts/…)를 MinIO 공개 주소로 서명한다.
  # 브라우저와 Playwright(호스트)가 여는 주소라 127.0.0.1. 자격 증명은 MinIO 루트(합성 값, e2e.env)
  learning-service:
    depends_on:
      e2e-seed:
        condition: service_completed_successfully
    environment:
      ASSET_S3_BUCKET: sagomungchi-local-missions
      S3_PUBLIC_ENDPOINT_URL: http://127.0.0.1:${MINIO_HOST_PORT:-9000}
      S3_REGION: ap-northeast-2
      AWS_REGION: ap-northeast-2
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?e2e.env 필요}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?e2e.env 필요}

  report-api:
    depends_on:
      minio-init:
        condition: service_completed_successfully
  # 그림책 그림 받기: learning이 서명한 127.0.0.1 주소만 허용하고, 연결은 compose 안 MinIO로 하되 Host는 원래 값(서명 유지)
  report-worker:
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      MEMORY_BOOK_ASSET_ORIGINS: http://127.0.0.1:${MINIO_HOST_PORT:-9000}
      MEMORY_BOOK_ASSET_INTERNAL_ORIGINS: http://127.0.0.1:${MINIO_HOST_PORT:-9000}=http://minio:9000
